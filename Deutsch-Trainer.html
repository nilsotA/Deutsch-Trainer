const SATZ = [

{id:"sa01",t:"Das Verb steht an zweiter Stelle",short:"Position 2 ist reserviert",b:`
<p>Im deutschen <b>Aussagesatz</b> steht das gebeugte Verb <b>an zweiter Position</b> — egal, was davor steht. Position 1 kann alles Mögliche sein, aber es passt nur <b>ein</b> Satzglied hinein.</p>
<div class="satz"><span class="pos">1</span> Ich <span class="pos v">2</span> gehe <span class="rest">morgen ins Training.</span></div>
<div class="satz"><span class="pos">1</span> Morgen <span class="pos v">2</span> gehe <span class="rest">ich ins Training.</span></div>
<div class="satz"><span class="pos">1</span> Ins Training <span class="pos v">2</span> gehe <span class="rest">ich morgen.</span></div>
<p>Sobald etwas anderes als das Subjekt auf Position 1 steht, rutscht das Subjekt <b>hinter</b> das Verb. Das nennt man Inversion — sie passiert automatisch, wenn man Position 2 einhält.</p>
<p><b>Wo das Verb stattdessen vorn steht:</b> in der Ja/Nein-Frage („<b>Kommst</b> du morgen?“), im Imperativ („<b>Ruf</b> mich an!“) und im uneingeleiteten Bedingungssatz („<b>Kommt</b> er, dann gehen wir“). Die W-Frage folgt dagegen der Zweitstellung: „Wann <b>kommst</b> du?“</p>
<div class="ex"><span class="nope">Morgen ich gehe ins Training.</span> — typischer Fehler, wenn man aus dem Englischen denkt</div>
<p><b>Selbsttest beim Sprechen:</b> Zähl im Aussagesatz die Satzglieder vor dem Verb. Es darf nur eines sein.</p>`},

{id:"sa02",t:"Im Nebensatz wandert das Verb ans Ende",short:"Konjunktion → Verb hinten",b:`
<p>Nach einer unterordnenden Konjunktion steht das gebeugte Verb <b>ganz am Schluss</b>.</p>
<div class="satz"><span class="rest">Ich gehe früher,</span> <span class="pos">weil</span> <span class="rest">ich morgen einen Termin</span> <span class="pos v">habe</span></div>
<p><b>Diese Wörter lösen die Endstellung aus:</b></p>
<div class="ex">weil · dass · ob · wenn · als · damit · obwohl · während · bevor · nachdem · sobald · solange · sofern · falls · indem · sodass · seit · bis · da · wie (indirekt) · alle W-Wörter in indirekten Fragen</div>
<p><b>Nicht</b> ausgelöst wird sie von den Verbindern <code>und, oder, aber, denn, sondern</code> — nach denen bleibt es beim normalen Hauptsatz.</p>
<div class="ex"><span class="ok">Ich bleibe zu Hause, denn ich bin müde.</span> (Verb an 2)<br>
<span class="ok">Ich bleibe zu Hause, weil ich müde bin.</span> (Verb am Ende)</div>
<p><b>Merkhilfe:</b> „denn“ und „weil“ bedeuten dasselbe, verlangen aber gegensätzliche Stellung. Wer unsicher ist, nimmt „denn“ — da passiert nichts.</p>`},

{id:"sa03",t:"Die Satzklammer",short:"Verb vorn, Rest hinten",b:`
<p>Deutsche Sätze werden <b>eingerahmt</b>: Der gebeugte Teil des Verbs steht auf Position 2, der Rest ganz hinten. Dazwischen liegt das Mittelfeld.</p>
<div class="satz"><span class="rest">Ich</span> <span class="pos v">habe</span> <span class="rest">gestern nach dem Training noch zwei Stunden</span> <span class="pos v">gelernt.</span></div>
<div class="satz"><span class="rest">Wir</span> <span class="pos v">müssen</span> <span class="rest">die Halle bis achtzehn Uhr</span> <span class="pos v">räumen.</span></div>
<div class="satz"><span class="rest">Sie</span> <span class="pos v">macht</span> <span class="rest">die Tür leise</span> <span class="pos v">zu.</span></div>
<p><b>Was hinten landet:</b> Partizip (Perfekt), Infinitiv (Modalverben, Futur), abgetrennte Vorsilbe (aufstehen, mitkommen, zumachen).</p>
<p><b>Praktische Folge fürs Sprechen:</b> Wer die Klammer weit aufmacht, verliert sie. Faustregel — <b>maximal sieben bis acht Wörter</b> zwischen den beiden Teilen. Sonst hat der Zuhörer den Anfang vergessen, bevor der Schluss kommt.</p>
<div class="ex"><span class="nope">Ich habe gestern nach dem Training, das wegen des Regens verlegt wurde, mit Lena noch zwei Stunden für die Klausur gelernt.</span><br>
<span class="ok">Das Training wurde wegen des Regens verlegt. Danach habe ich mit Lena noch zwei Stunden gelernt.</span></div>`},

{id:"sa04",t:"Nebensatz vorn — dann kommt sofort das Verb",short:"Nebensatz zählt als Position 1",b:`
<p>Steht der Nebensatz am Anfang, füllt er <b>Position 1 komplett aus</b>. Direkt danach folgt das Verb des Hauptsatzes.</p>
<div class="satz"><span class="pos">1</span> Weil ich müde war, <span class="pos v">2</span> bin <span class="rest">ich früher gegangen.</span></div>
<div class="ex"><span class="nope">Weil ich müde war, ich bin früher gegangen.</span></div>
<p>Man hört das Muster oft als „Komma, Verb, Verb“:</p>
<div class="ex">Als das Training zu Ende <b>war</b>, <b>gingen</b> alle nach Hause.<br>
Wenn du Zeit <b>hast</b>, <b>ruf</b> mich an.</div>
<p><b>Beim Sprechen:</b> Wenn du einen Satz mit „Weil …“ oder „Wenn …“ beginnst, ist der Rest schon festgelegt. Wer sich unsicher fühlt, dreht um — „Ich bin früher gegangen, weil …“ ist immer leichter zu bauen.</p>`},

{id:"sa05",t:"Reihenfolge im Mittelfeld: Te-Ka-Mo-Lo",short:"temporal – kausal – modal – lokal",b:`
<p>Wenn mehrere Angaben zusammenkommen, ist die neutrale Reihenfolge:</p>
<div class="ex"><b>Te</b>mporal (wann?) → <b>Ka</b>usal (warum?) → <b>Mo</b>dal (wie?) → <b>Lo</b>kal (wo/wohin?)</div>
<div class="satz"><span class="rest">Ich fahre</span> <span class="tag2">morgen</span> <span class="tag2">wegen des Wettkampfs</span> <span class="tag2">mit dem Zug</span> <span class="tag2">nach Berlin.</span></div>
<p>Das ist keine harte Regel, sondern die unmarkierte Grundstellung. <b>Abweichen ist erlaubt</b> — es setzt dann eine Betonung:</p>
<div class="ex">Ich fahre <b>mit dem Zug</b> morgen nach Berlin. → Betonung auf dem Verkehrsmittel</div>
<p><b>Nützlich vor allem,</b> wenn du beim Sprechen ins Stocken gerätst: Te-Ka-Mo-Lo gibt dir eine Reihenfolge, über die du nicht nachdenken musst.</p>`},

{id:"sa06",t:"Dativ vor Akkusativ — außer bei Pronomen",short:"Substantive: Dativ zuerst · Pronomen: Akkusativ zuerst",b:`
<p><b>Zwei Substantive → Dativ zuerst:</b></p>
<div class="ex">Ich gebe <b>dem Trainer</b> (Dat) <b>den Ball</b> (Akk).</div>
<p><b>Ein Pronomen → das Pronomen zuerst:</b></p>
<div class="ex">Ich gebe <b>ihm</b> den Ball. · Ich gebe <b>ihn</b> dem Trainer.</div>
<p><b>Zwei Pronomen → Akkusativ zuerst:</b></p>
<div class="ex">Ich gebe <b>ihn ihm</b>. (nicht: ihm ihn)</div>
<p><b>Die Merkregel in einem Satz:</b> Pronomen drängeln nach vorn — und wenn beide Pronomen sind, geht der Akkusativ zuerst.</p>
<p><b>Selbsttest:</b> „Ich habe es dir gesagt“ klingt richtig, „Ich habe dir es gesagt“ nicht. Genau das ist die Regel.</p>`},

{id:"sa07",t:"Wo steht „nicht“?",short:"Vor dem, was verneint wird",b:`
<p><b>Ganzer Satz verneint → „nicht“ steht möglichst weit hinten</b>, aber vor dem zweiten Verbteil:</p>
<div class="ex">Ich habe gestern <b>nicht</b> trainiert.<br>Ich kann heute <b>nicht</b> kommen.</div>
<p><b>Nur ein Teil verneint → „nicht“ steht direkt davor:</b></p>
<div class="ex">Ich habe <b>nicht</b> gestern trainiert, sondern vorgestern.<br>
<b>Nicht</b> ich habe das gesagt.</div>
<p><b>Vor diesen Elementen steht „nicht“ immer:</b></p>
<ul>
<li>Adjektiv/Adverb als Ergänzung: „Das ist <b>nicht</b> gut.“</li>
<li>Ortsangabe als Ergänzung: „Ich fahre <b>nicht</b> nach Köln.“</li>
<li>Präpositionalobjekt: „Ich warte <b>nicht</b> auf ihn.“</li>
</ul>
<hr class="sep">
<p><b>„nicht“ oder „kein“?</b> Sehr einfache Regel:</p>
<div class="ex"><b>kein</b> bei Substantiven mit unbestimmtem Artikel oder ohne Artikel:<br>
„Ich habe <b>keine</b> Zeit.“ · „Das ist <b>kein</b> Problem.“<br><br>
<b>nicht</b> in allen anderen Fällen:<br>
„Ich habe <b>nicht</b> die Zeit dafür.“ (bestimmter Artikel) · „Ich komme <b>nicht</b>.“</div>`},

{id:"sa08",t:"Trennbare Verben",short:"Vorsilbe fliegt ans Satzende",b:`
<p>Im einfachen Hauptsatz wird die Vorsilbe abgetrennt und ans Ende gestellt:</p>
<div class="ex">aufstehen → Ich <b>stehe</b> um sechs <b>auf</b>.<br>
mitkommen → <b>Kommst</b> du <b>mit</b>?<br>
zumachen → <b>Mach</b> bitte die Tür <b>zu</b>.</div>
<p><b>Zusammen bleibt sie</b> im Nebensatz, im Infinitiv und im Partizip:</p>
<div class="ex">…, weil ich um sechs <b>aufstehe</b>.<br>Ich muss um sechs <b>aufstehen</b>.<br>Ich bin um sechs <b>aufgestanden</b>. (das „ge“ rutscht in die Mitte)</div>
<p><b>Trennbar oder nicht?</b> Entscheidend ist die Betonung. Liegt sie auf der Vorsilbe, ist sie trennbar:</p>
<div class="ex"><b>ÜBER</b>setzen (mit dem Boot) → Ich setze über. · über<b>SETZ</b>en (in eine Sprache) → Ich übersetze den Text.<br>
<b>UM</b>fahren (umwerfen) → Ich fahre ihn um. · um<b>FAHR</b>en (herumfahren) → Ich umfahre die Stadt.</div>
<p><b>Nie trennbar:</b> be-, ge-, er-, ver-, zer-, ent-, emp-, miss-.</p>`},

{id:"sa09",t:"Der Kasus im Relativsatz",short:"Das Verb im Relativsatz entscheidet",b:`
<p>Das Relativpronomen richtet sich in <b>Geschlecht und Zahl</b> nach dem Bezugswort — aber im <b>Kasus</b> nach seiner Rolle im Relativsatz.</p>
<div class="ex">Der Mann, <b>der</b> dort steht. → Subjekt → Nominativ<br>
Der Mann, <b>den</b> ich kenne. → Objekt von „kennen“ → Akkusativ<br>
Der Mann, <b>dem</b> ich geholfen habe. → „helfen“ verlangt Dativ<br>
Der Mann, <b>dessen</b> Auto dort steht. → Besitz → Genitiv</div>
<p><b>Praktischer Trick:</b> Bau den Relativsatz kurz als eigenen Satz. „Ich habe <i>ihm</i> geholfen“ → also „dem“. „Ich kenne <i>ihn</i>“ → also „den“.</p>
<p><b>Mit Präposition:</b> Die Präposition steht vorn und bestimmt den Kasus mit:</p>
<div class="ex">die Halle, <b>in der</b> wir trainieren · der Kollege, <b>mit dem</b> ich spreche · das Thema, <b>über das</b> wir reden</div>
<p><b>Umgangssprachlich verbreitet, aber nicht standardsprachlich:</b> „der Mann, <span class="nope">wo</span> das gesagt hat“. In Süddeutschland und Teilen des Westens sehr üblich — im formellen Sprechen besser vermeiden.</p>
<p class="tiny muted">Belegt: Das relative „wo“ ist alemannisch, schwäbisch, fränkisch, mittelhessisch und teils bairisch verbreitet — grob von der Schweiz bis Frankfurt (grammis, IDS Mannheim). Standardsprachlich ist es nicht.</p>`},

{id:"sa10",t:"Modalverben und der doppelte Infinitiv",short:"Zwei Infinitive statt Partizip",b:`
<p>Im Perfekt bilden Modalverben <b>kein Partizip</b>, wenn ein zweites Verb dabeisteht — es entsteht ein doppelter Infinitiv:</p>
<div class="ex"><span class="ok">Ich habe nicht kommen <b>können</b>.</span> · <span class="nope">Ich habe nicht kommen gekonnt.</span></div>
<p>Steht das Modalverb allein, gibt es doch ein Partizip:</p>
<div class="ex">Ich habe das nicht <b>gekonnt</b>. · Ich habe nicht <b>gewollt</b>.</div>
<p><b>Sonderfall Nebensatz:</b> Beim doppelten Infinitiv rutscht das gebeugte Verb ausnahmsweise <b>nach vorn</b>:</p>
<div class="ex"><span class="ok">…, weil ich nicht <b>habe</b> kommen können.</span><br>
<span class="nope">…, weil ich nicht kommen können habe.</span></div>
<p>Das gilt genauso für <code>sehen, hören, lassen</code>: „Ich habe ihn kommen <b>sehen</b>.“ — Alltagssprachlich hört man auch „gesehen“; standardsprachlich ist der Infinitiv.</p>
<p><b>Fürs Sprechen:</b> Die Nebensatz-Variante klingt für viele fremd. Bau den Satz lieber um: „Ich konnte nicht kommen, deshalb …“</p>`},

{id:"sa11",t:"Perfekt mit haben oder sein?",short:"Ortswechsel und Zustandswechsel → sein",b:`
<p><b>Mit „sein“</b> stehen:</p>
<ul>
<li>Verben der <b>Ortsveränderung</b>: gehen, fahren, laufen, fliegen, kommen, reisen, springen</li>
<li>Verben der <b>Zustandsveränderung</b>: aufwachen, einschlafen, wachsen, sterben, aufstehen, werden</li>
<li>Die Sonderfälle <b>sein</b> und <b>bleiben</b>: „Ich bin da gewesen.“ · „Er ist geblieben.“</li>
</ul>
<p><b>Mit „haben“</b> stehen alle anderen — vor allem alle Verben mit Akkusativobjekt und alle reflexiven Verben.</p>
<div class="ex">Ich <b>bin</b> nach Köln gefahren. (Ortswechsel)<br>
Ich <b>habe</b> das Auto gefahren. (Akkusativobjekt!)<br>
Ich <b>habe</b> mich beeilt. (reflexiv)</div>
<p><b>Regional unterschiedlich — beides gilt:</b> <code>stehen, sitzen, liegen</code>. Im Norden „ich <b>habe</b> gestanden“, im Süden und in Österreich „ich <b>bin</b> gestanden“. Beides ist korrekt.</p>
<p class="tiny muted">Belegt: Duden — bei <i>stehen, sitzen, liegen</i> sind beide Perfektbildungen standardsprachlich. Im Norden gilt „haben“, im Süden, in Österreich und in der Schweiz „sein“. Beide Formen sind korrekt.</p>`},

{id:"sa12",t:"Konjunktiv II — die Formen, die man wirklich braucht",short:"hätte, wäre, könnte, würde",b:`
<p>Für den Alltag reichen ein Dutzend Formen. Sie sind kürzer als die „würde“-Umschreibung und wirken weniger umständlich:</p>
<div class="ex">haben → <b>hätte</b> · sein → <b>wäre</b> · werden → <b>würde</b><br>
können → <b>könnte</b> · müssen → <b>müsste</b> · dürfen → <b>dürfte</b> · sollen → <b>sollte</b> · mögen → <b>möchte</b><br>
wissen → <b>wüsste</b> · gehen → <b>ginge</b> · kommen → <b>käme</b> · tun → <b>täte</b> · brauchen → <b>bräuchte</b></div>
<p><b>Empfehlung:</b> Wo die eigene Form existiert und gebräuchlich ist, nimm sie. Die „würde“-Umschreibung ist nicht falsch — nur oft länger. Unentbehrlich bleibt sie, wo die eigene Form altertümlich klingt („würde helfen“ statt „hülfe“).</p>
<div class="ex"><span class="ok">Wenn ich Zeit hätte, käme ich.</span><br>
<span class="nope">Wenn ich Zeit haben würde, würde ich kommen.</span></div>
<p><b>Zweimal „würde“ in einem Satzgefüge</b> gilt als unschön — grammatisch falsch ist es nicht. Der Duden rät zum Ausweichen: „Wenn er mich fragen <b>sollte</b>, würde ich sofort zusagen.“</p>
<p><b>Höflichkeit:</b> „Könnten Sie …“, „Ich hätte gern …“, „Dürfte ich …“ — der Konjunktiv ist im Deutschen die wichtigste Höflichkeitsform überhaupt.</p>`},

{id:"sa13",t:"Adjektivendungen — die Ein-Blick-Regel",short:"Signal einmal, dann nur noch -e oder -en",b:`
<p>Das <b>Kasussignal</b> (die Endung, die den Fall zeigt) muss <b>genau einmal</b> im Ausdruck vorkommen — entweder am Artikel oder am Adjektiv.</p>
<p><b>Der Artikel zeigt es schon</b> → das Adjektiv bekommt nur noch <b>-e</b> oder <b>-en</b>:</p>
<div class="ex"><b>der</b> gut<b>e</b> Trainer · <b>dem</b> gut<b>en</b> Trainer · <b>die</b> gut<b>en</b> Trainer</div>
<p><b>Kein Artikel da</b> → das Adjektiv übernimmt die volle Artikelendung:</p>
<div class="ex">gut<b>er</b> Kaffee · mit gut<b>em</b> Kaffee · gut<b>e</b> Laune</div>
<p><b>Unbestimmter Artikel</b> → gemischt, weil „ein“ in drei Formen kein Signal trägt:</p>
<div class="ex"><b>ein</b> gut<b>er</b> Trainer (ein zeigt nichts → Adjektiv trägt -er)<br>
<b>einen</b> gut<b>en</b> Trainer (einen zeigt schon Akkusativ → nur -en)</div>
<p><b>Faustregel fürs Sprechen:</b> Steht ein voll markierter Artikel davor (der, dem, den, die, das), endet das Adjektiv fast immer auf <b>-en</b>. Nur im Nominativ Singular und im Akkusativ Neutrum/Femininum steht <b>-e</b>.</p>`},

{id:"sa14",t:"Die n-Deklination",short:"Der Junge, dem Jungen",b:`
<p>Eine Gruppe männlicher Substantive bekommt in <b>allen Fällen außer dem Nominativ Singular</b> ein <b>-en</b>. Das fällt beim Sprechen sofort auf, wenn es fehlt.</p>
<div class="ex">der Kollege → mit dem Kolleg<b>en</b><br>der Mensch → für den Mensch<b>en</b><br>der Praktikant → dem Praktikant<b>en</b></div>
<p><b>Dazu gehören:</b></p>
<ul>
<li>Endungen <code>-ant, -ent, -ist, -at, -oge, -graf, -soph, -arch, -nom</code>: Praktikant, Student, Journalist, Kandidat, Pädagoge, Fotograf, Philosoph, Ökonom</li>
<li>Alte einsilbige Wörter: <code>Mensch, Herr, Held, Fürst, Graf, Bär, Prinz, Hirt</code></li>
<li><b>Schwankend:</b> <code>Nachbar</code> darf auch stark gebeugt werden — „des Nachbarn“ und „des Nachbars“, „dem Nachbarn“ und „dem Nachbar“ sind beide korrekt.</li>
<li>Wörter auf <code>-e</code> für Personen und Tiere: <code>Kollege, Junge, Kunde, Zeuge, Experte, Athlet, Neffe, Löwe, Affe</code></li>
</ul>
<p><b>Sonderfall „Herr“:</b> Singular <code>-n</code>, Plural <code>-en</code>: „Sehr geehrter Herr Weber“ → „an Herr<b>n</b> Weber“ → „an die Herr<b>en</b>“.</p>
<p><b>Sonderfall „Name“, „Gedanke“, „Wille“, „Friede“:</b> Genitiv auf <code>-ns</code>: „des Namens“, „des Gedankens“.</p>`},

{id:"sa15",t:"Zwei Objekte richtig verteilen",short:"Wem gebe ich was?",b:`
<p>Bei Verben des Gebens und Sagens ist die Zuordnung in aller Regel gleich: <b>Person im Dativ, Sache im Akkusativ</b>. Zwei Ausnahmen stehen unten.</p>
<div class="ex">Ich gebe <b>dir</b> (wem?) <b>das Buch</b> (was?).<br>
Ich erkläre <b>ihm</b> <b>die Regel</b>.<br>
Ich schicke <b>Ihnen</b> <b>die Unterlagen</b>.</div>
<p><b>Diese Verben folgen dem Muster:</b> geben, schenken, leihen, bringen, schicken, senden, zeigen, erklären, erzählen, sagen, mitteilen, empfehlen, versprechen, anbieten, beweisen, verbieten, erlauben, wünschen, kaufen, kochen, backen, beibringen.</p>
<p><b>Ausnahmen, die man kennen muss:</b></p>
<ul>
<li><b>fragen</b> und <b>lehren</b> nehmen zwei Akkusative: „Ich frage <b>dich etwas</b>.“ · „Er lehrt <b>mich das Schwimmen</b>.“</li>
<li><b>beibringen</b> ist das Dativ-Gegenstück zu „lehren“: „Er bringt <b>mir</b> das Schwimmen bei.“</li>
</ul>`},

{id:"sa16",t:"Wechselpräpositionen: wo oder wohin?",short:"Bewegung → Akkusativ, Ort → Dativ",b:`
<p>Neun Präpositionen können beides: <code>an, auf, hinter, in, neben, über, unter, vor, zwischen</code>.</p>
<div class="ex"><b>Wohin?</b> Richtung, Bewegung mit Ziel → <b>Akkusativ</b><br>
Ich stelle das Glas <b>auf den</b> Tisch. · Ich gehe <b>in die</b> Halle.<br><br>
<b>Wo?</b> Ort, kein Zielwechsel → <b>Dativ</b><br>
Das Glas steht <b>auf dem</b> Tisch. · Ich trainiere <b>in der</b> Halle.</div>
<p><b>Der Verbtest ist zuverlässiger als der Bewegungstest:</b></p>
<div class="ex">legen, stellen, setzen, hängen (etwas irgendwohin) → <b>Akkusativ</b><br>
liegen, stehen, sitzen, hängen (irgendwo sein) → <b>Dativ</b></div>
<p><b>Achtung — Bewegung ohne Zielwechsel bleibt Dativ:</b></p>
<div class="ex">Ich laufe <b>in der</b> Halle. (drinnen hin und her)<br>
Ich laufe <b>in die</b> Halle. (von draußen hinein)</div>
<p><b>Feste Ausnahmen:</b> Bei Themen immer Akkusativ („über <b>den</b> Trainer sprechen“), bei Zeitangaben immer Dativ („vor <b>einem</b> Jahr“).</p>`},

{id:"sa17",t:"Genitiv im Alltag — wo er wirklich hingehört",short:"Besitz, Genitivpräpositionen, feste Verben",b:`
<p>Der Genitiv verschwindet in der gesprochenen Sprache — an drei Stellen lohnt er sich trotzdem, weil sein Fehlen auffällt:</p>
<p><b>1. Besitz und Zugehörigkeit</b></p>
<div class="ex"><span class="ok">das Auto meines Bruders</span> · <span class="ugs">das Auto von meinem Bruder</span> (umgangssprachlich, in geschriebenen Texten vermeiden)</div>
<p><b>2. Nach Genitivpräpositionen</b> — wegen, während, trotz, statt, innerhalb, aufgrund, mithilfe, anhand, angesichts, hinsichtlich, infolge</p>
<div class="ex"><span class="ok">wegen des Wetters</span> · <span class="ugs">wegen dem Wetter</span></div>
<p><b>3. Nach festen Verben</b> — gedenken, bedürfen, sich bedienen, sich enthalten, sich rühmen, beschuldigen</p>
<hr class="sep">
<p><b>Wo der Genitiv nicht hingehört:</b></p>
<ul>
<li>Bei Eigennamen ohne Artikel: „<b>Lenas</b> Rad“, nicht „das Rad Lenas“</li>
<li>Wenn er nicht markiert werden kann: „der Preis <b>von</b> Öl“, „die Wirkung <b>von</b> Koffein“</li>
<li>Bei Pronomen: „<b>meinetwegen</b>“, nicht „wegen mir“</li>
</ul>
<p class="tiny muted">Belegt: Duden — „wegen“ verlangt standardsprachlich den Genitiv. Der Dativ ist umgangssprachlich und landschaftlich gekennzeichnet, gilt aber nicht als falsch; im gesprochenen Standard ist er etabliert. Für geschriebene Texte also der Genitiv.</p>`},

{id:"sa18",t:"Was beim Sprechen wirklich auffällt",short:"Umgangssprache vs. echter Fehler",b:`
<p>Vieles, was als „falsch“ gilt, ist im Gespräch völlig unauffällig. Dreh die Energie auf das, was wirklich bemerkt wird.</p>
<p><b>Im Gespräch unauffällig — nicht drüber nachdenken:</b></p>
<ul>
<li>„wegen dem Wetter“ statt Genitiv</li>
<li>Perfekt statt Präteritum („Ich hab gesagt“ statt „Ich sagte“)</li>
<li>„weil“ mit Hauptsatzstellung („weil ich hab keine Zeit“) — sehr verbreitet, im formellen Rahmen aber vermeiden</li>
<li>Ausgelassene Endungen („ich hab“, „ich geh“)</li>
<li>Regionale Perfektformen („ich bin gestanden“)</li>
<li><b>brauchen</b> ohne „zu“ („du brauchst nicht kommen“) — gesprochen sehr verbreitet; geschrieben mit „zu“: „du brauchst nicht <b>zu</b> kommen“</li>
<li>Doppeltes Perfekt („das hatte ich schon gemacht gehabt“) — landschaftlich üblich, im Text besser Plusquamperfekt</li>
</ul>
<p><b>Fällt dagegen auf — hier lohnt die Aufmerksamkeit:</b></p>
<ul>
<li><span class="ugs">„Ich rufe dir an“</span> statt „dich“ — überregional sofort hörbar (im Südwesten und in der Schweiz verbreitet)</li>
<li><span class="ugs">„größer wie“</span> statt „größer als“</li>
<li>Fehlende n-Deklination: <span class="nope">„mit dem Kollege“</span></li>
<li>Doppeltes „würde“: <span class="ugs">„wenn ich Zeit haben würde, würde ich …“</span></li>
<li>Falsches Relativpronomen: <span class="nope">„der Mann, den ich geholfen habe“</span></li>
<li>Satzabbruch mitten im Gedanken (siehe eigene Karte)</li>
<li>Verlorene Satzklammer bei langen Sätzen</li>
</ul>
<p><b>Merke:</b> Die Liste unten rechts ist kurz. Wer diese sieben Dinge sichert, spricht sicher — der Rest ist Feinschliff.</p>
<p class="tiny muted">Belegt: Duden und DWDS zu den Einordnungen: „wegen dem Wetter“ umgangssprachlich und landschaftlich, „Ich rufe dir an“ südwestdeutsch und schweizerisch, „brauchen“ ohne „zu“ gesprochen verbreitet, doppeltes Perfekt landschaftlich. Was hier <span class="ugs">orange</span> steht, ist verbreitet, aber nicht für geschriebene Texte — und kein Fehler.</p>`},

{id:"sa19",t:"Den Satz zu Ende bauen",short:"Anakoluth vermeiden",b:`
<p>Der häufigste Fehler beim freien Sprechen ist kein Grammatikfehler, sondern ein <b>Satzabbruch</b>: Man startet eine Konstruktion und beendet eine andere.</p>
<div class="ex"><span class="nope">„Der Punkt, den ich sagen wollte, also es geht ja darum, dass wir …“</span></div>
<p><b>Drei Gegenmittel:</b></p>
<ul>
<li><b>Kurz anfangen.</b> Wer mit einem einfachen Hauptsatz beginnt, kann ihn immer beenden. Nebensätze kommen danach.</li>
<li><b>Pause statt Füllwort.</b> Eine Sekunde Stille wirkt souveräner als „ähm, also, ja“. Zuhörer hören die Pause kaum, den Füllstapel schon.</li>
<li><b>Wenn du dich verlaufen hast: neu ansetzen.</b> „Ich fange nochmal an:“ ist unauffälliger als ein Satz, der ins Leere läuft.</li>
</ul>
<p><b>Der Klammer-Test beim Reden:</b> Sobald du ein Verb auf Position 2 gesetzt hast, ist der Schlussteil schon festgelegt. Halt ihn im Kopf, bevor du das Mittelfeld füllst — oder mach das Mittelfeld kurz.</p>`},

{id:"sa20",t:"Vergleichen: als, wie, je … desto",short:"Ungleich → als · Gleich → wie",b:`
<p><b>als</b> bei Ungleichheit (Komparativ):</p>
<div class="ex">größer <b>als</b> ich · mehr <b>als</b> erwartet · anders <b>als</b> gedacht</div>
<p><b>wie</b> bei Gleichheit:</p>
<div class="ex">so groß <b>wie</b> ich · genauso gut <b>wie</b> gestern · doppelt so schnell <b>wie</b> vorher</div>
<p><span class="ugs">„größer wie“</span> ist regional weit verbreitet, gilt aber nicht als standardsprachlich — und wird von vielen sofort gehört. <span class="ugs">„als wie“</span> ebenfalls nicht.</p>
<hr class="sep">
<p><b>Steigerungsfallen:</b></p>
<ul>
<li>Kein doppelter Komparativ: <span class="nope">„mehr besser“</span></li>
<li>Absolutadjektive nicht steigern: <span class="nope">„optimalste“, „einzigste“</span></li>
<li>Superlativ mit „am“: „am schnellsten“ — aber „der schnellste Läufer“</li>
</ul>
<p><b>je … desto</b> verbindet zwei Steigerungen, Komma dazwischen:</p>
<div class="ex"><b>Je</b> länger er trainierte, <b>desto</b> ruhiger wurde sein Puls.</div>`},

{id:"sa21",t:"Reflexivpronomen: mich oder mir?",short:"Kommt ein Objekt dazu, wird es Dativ",b:`
<p>Viele reflexive Verben können beides — der Kasus entscheidet die Bedeutung.</p>
<div class="ex">Ich wasche <b>mich</b>. (kein weiteres Objekt → Akkusativ)<br>
Ich wasche <b>mir</b> die Hände. (Akkusativobjekt da → Reflexiv wird Dativ)</div>
<p><b>Gleiches Muster:</b> sich kämmen, sich putzen, sich anziehen, sich verletzen.</p>
<p><b>Nur Dativ</b> — hier steht immer ein Akkusativobjekt dabei:</p>
<div class="ex">sich etwas merken · sich etwas überlegen · sich etwas vorstellen · sich etwas ansehen · sich etwas leisten · sich etwas einbilden · sich wehtun</div>
<p><b>Nur Akkusativ:</b> sich beeilen, sich irren, sich erholen, sich freuen, sich schämen, sich ärgern, sich erinnern, sich setzen.</p>
<p><b>Bedeutungsunterschied merken:</b><br>
„Ich stelle <b>mich</b> vor.“ = Ich sage meinen Namen.<br>
„Ich stelle <b>mir</b> das vor.“ = Ich male es mir im Kopf aus.</p>
<p><b>Achtung bei „sich“ in der 3. Person:</b> Da fallen Dativ und Akkusativ zusammen — kein Problem. Nur in der 1. und 2. Person Singular musst du entscheiden.</p>`},

{id:"sa22",t:"Fragen bauen",short:"W-Frage: Verb an 2 · Ja/Nein: Verb an 1",b:`
<p><b>W-Frage</b> — das Fragewort besetzt Position 1, das Verb bleibt auf 2:</p>
<div class="satz"><span class="pos">1</span> Wann <span class="pos v">2</span> kommst <span class="rest">du?</span></div>
<p><b>Ja/Nein-Frage</b> — das Verb rückt ganz nach vorn:</p>
<div class="satz"><span class="pos v">1</span> Kommst <span class="rest">du morgen?</span></div>
<p><b>Indirekte Frage</b> — wird zum Nebensatz, Verb ans Ende:</p>
<div class="ex">Ich weiß nicht, <b>wann</b> er <b>kommt</b>.<br>
Sie hat gefragt, <b>ob</b> du Zeit <b>hast</b>. (ohne Fragewort → „ob“)</div>
<p><b>Der Kasus beim Fragewort:</b> <code>wer</code> (Nom.) – <code>wessen</code> (Gen.) – <code>wem</code> (Dat.) – <code>wen</code> (Akk.)</p>
<div class="ex"><b>Wem</b> hast du geholfen? (helfen + Dativ)<br>
<b>Wen</b> hast du gefragt? (fragen + Akkusativ)<br>
<b>Wen</b> rufst du an? (anrufen + Akkusativ)</div>
<p>Auch hier gilt: Das <b>Verb</b> bestimmt den Kasus — nicht das Gefühl.</p>`},

{id:"sa23",c:"satz",t:"wenn oder als?",short:"als = einmal in der Vergangenheit · wenn = wiederholt oder ab jetzt · wann = Frage",b:`
<p>Beide leiten einen Nebensatz ein, aber sie teilen sich die Zeit anders auf.</p>
<p><b>als</b> — ein einzelnes, abgeschlossenes Ereignis in der <b>Vergangenheit</b>:</p>
<div class="ex"><b>Als</b> ich in Köln ankam, regnete es.<br>
<b>Als</b> ich klein war, habe ich Handball gespielt.</div>
<p><b>wenn</b> — Wiederholtes in der Vergangenheit („immer wenn“) und alles in <b>Gegenwart und Zukunft</b>:</p>
<div class="ex">Immer <b>wenn</b> ich in Köln war, hat es geregnet. (mehrmals)<br>
<b>Wenn</b> ich morgen Zeit habe, komme ich vorbei. (Zukunft)<br>
<b>Wenn</b> du willst, fangen wir früher an. (Bedingung)</div>
<p><b>Der Test:</b> Lässt sich <b>„damals, dieses eine Mal“</b> einsetzen? Dann <b>als</b>. Passt <b>„jedes Mal“</b> oder <b>„falls“</b>? Dann <b>wenn</b>.</p>
<p><b>wann</b> ist das dritte Wort — es fragt nach dem Zeitpunkt und steht nur in direkten und indirekten <b>Fragen</b>:</p>
<div class="ex"><b>Wann</b> fängt das Training an?<br>
Ich weiß nicht, <b>wann</b> das Training anfängt.<br>
<span style="opacity:.75">Nicht:</span> <s>Wann ich klein war …</s></div>`},

{id:"sa24",c:"gram",t:"Verbformen, bei denen viele schwanken",short:"Ohne Objekt stark (hing, erschrak), mit Objekt schwach (hängte, erschreckte)",b:`
<p>Einige Verben haben zwei Formen, die im Sprachgebrauch durcheinandergeraten. Hier ist beides gebräuchlich — aber nicht beides gilt gleich.</p>
<div class="ex"><b>winken</b> → hat ge<b>wink</b>t<br>
<span style="opacity:.85">„Gewunken“ ist umgangssprachlich weit verbreitet und laut DWDS zunehmend auch schriftlich. Im Prüfungstext bleibt „gewinkt“ die sichere Form.</span></div>
<div class="ex"><b>senden</b> → hat gesendet <i>oder</i> gesandt<br>
<span style="opacity:.85">Beim Ausstrahlen nur „gesendet“. Beim Schicken sind beide üblich; „gesandt“ klingt gehobener.</span></div>
<div class="ex"><b>erschrecken</b> → ich erschrak, ich bin erschrocken<br>
<span style="opacity:.85">Ohne Objekt stark. Mit Objekt schwach: „Der Knall hat mich erschreckt.“</span></div>
<div class="ex"><b>hängen</b> → hing, hat gehangen<br>
<span style="opacity:.85">Ohne Objekt stark. Mit Objekt schwach: „Ich habe das Bild aufgehängt.“</span></div>
<div class="ex"><b>schleifen</b> → schliff, hat geschliffen (= schärfen)<br>
<span style="opacity:.85">Im Sinne von „ziehen“ schwach: „Er hat den Sack geschleift.“</span></div>
<div class="ex"><b>bewegen</b> → bewog, hat bewogen (= veranlassen)<br>
<span style="opacity:.85">Im Sinne von „die Lage ändern“ schwach: „Ich habe den Schrank bewegt.“</span></div>
<p><b>Das Muster dahinter:</b> Wo dasselbe Verb zwei Formen hat, ist die <b>starke</b> Form fast immer die ohne Objekt („etwas geschieht“) und die <b>schwache</b> die mit Objekt („jemand tut etwas mit etwas“).</p>
<p class="tiny muted">Geprüft: DWDS-Eintrag zu „winken“ (Formgeschichte), Duden zur Perfektbildung.</p>`}

];

</tbody></table>
<p class="tiny muted">Alles außer dem Nominativ Singular endet auf <b>-en</b>. Betroffen: Mensch, Herr, Junge, Kunde, Zeuge, Experte, Athlet, Praktikant, Student, Journalist, Kandidat, Pädagoge, Fotograf, Bauer, Prinz, Held, Bär, Löwe, Affe. Bei „Nachbar“ sind beide Beugungen zulässig.</p>`},

{id:"tb10",t:"Konjunktiv II der wichtigsten Verben",b:`
<table class="dt"><thead><tr><th>Verb</th><th>Konjunktiv II</th><th>Beispiel</th></tr></thead><tbody>
<tr><td>sein</td><td>wäre</td><td>Das wäre gut.</td></tr>
<tr><td>haben</td><td>hätte</td><td>Ich hätte gern einen Kaffee.</td></tr>
<tr><td>werden</td><td>würde</td><td>Ich würde mitkommen.</td></tr>
<tr><td>können</td><td>könnte</td><td>Könnten Sie mir helfen?</td></tr>
<tr><td>müssen</td><td>müsste</td><td>Ich müsste eigentlich gehen.</td></tr>
<tr><td>dürfen</td><td>dürfte</td><td>Dürfte ich kurz stören?</td></tr>
<tr><td>sollen</td><td>sollte</td><td>Du solltest das lesen.</td></tr>
<tr><td>mögen</td><td>möchte</td><td>Ich möchte bestellen.</td></tr>
<tr><td>wissen</td><td>wüsste</td><td>Ich wüsste da etwas.</td></tr>
<tr><td>gehen</td><td>ginge</td><td>Das ginge auch morgen.</td></tr>
<tr><td>kommen</td><td>käme</td><td>Ich käme gern mit.</td></tr>
<tr><td>brauchen</td><td class="hl">bräuchte / brauchte</td><td>Ich bräuchte noch zwei Tage.</td></tr>
<tr><td>tun</td><td>täte</td><td>Das täte ich nicht.</td></tr>
<tr><td>lassen</td><td>ließe</td><td>Das ließe sich machen.</td></tr>
</tbody></table>
<p class="tiny muted">Diese vierzehn Formen decken fast alles ab, was man im Alltag braucht. Wo sie existieren, ist die „würde“-Umschreibung entbehrlich.</p><p class="tiny muted"><b>Umstritten:</b> „brauchen“ ist ein schwaches Verb, regelgerecht wäre <b>brauchte</b>. Die Umlautform <b>bräuchte</b> hat sich durchgesetzt, weil sie den Konjunktiv vom gleichlautenden Präteritum unterscheidet; der Duden führt sie inzwischen als standardsprachlich, die Gesellschaft für deutsche Sprache sieht das enger. Beide Formen sind vertretbar.</p>`}

];

const EX_D = [

/* ---------- KASUS: PRÄPOSITIONEN ---------- */
{id:"n01",c:"gram",q:"Ergänze: „Ich fahre mit ___ Rad zur Uni.“",t:"fill",a:["dem"],
 e:"<b>mit</b> steht immer mit Dativ. Die Dativ-Präpositionen als Reihe: <b>aus, außer, bei, gegenüber, mit, nach, seit, von, zu</b> — plus ab, entgegen, gemäß.",r:"gram-praepdat"},

{id:"n02",c:"gram",q:"Ergänze: „Das Geschenk ist für ___ Trainer.“ (maskulin)",t:"fill",a:["den"],
 e:"<b>für</b> verlangt den Akkusativ. Die Akkusativ-Präpositionen: <b>durch, für, gegen, ohne, um, bis, entlang, wider</b>.",r:"gram-praepakk"},

{id:"n03",c:"gram",q:"Wohin oder wo? „Ich stelle die Tasche auf ___ Tisch.“",t:"fill",a:["den"],
 e:"<b>stellen</b> = etwas irgendwohin → Frage „wohin?“ → <b>Akkusativ</b>. Bei „Die Tasche steht auf dem Tisch“ wäre es Dativ.",r:"gram-wechsel"},

{id:"n04",c:"gram",q:"Wohin oder wo? „Die Tasche liegt unter ___ Bank.“ (feminin)",t:"fill",a:["der"],
 e:"<b>liegen</b> = irgendwo sein → Frage „wo?“ → <b>Dativ</b>. Der Verbtest ist zuverlässiger als das Bauchgefühl: legen/stellen/setzen/hängen → Akkusativ, liegen/stehen/sitzen/hängen → Dativ.",r:"gram-wechsel"},

{id:"n05",c:"gram",q:"Welche Variante ist standardsprachlich?",o:[
 "Wegen des Wetters fällt das Training aus.",
 "Wegen dem Wetter fällt das Training aus."],a:0,
 e:"<b>wegen</b> + Genitiv. Der Dativ ist umgangssprachlich sehr verbreitet und im Gespräch unauffällig — in geschriebenen Texten und formellen Situationen aber vermeiden.",r:"gram-genitiv"},

{id:"n06",c:"gram",q:"Ergänze: „Ich laufe in ___ Halle hin und her.“",t:"fill",a:["der"],
 e:"Trickfrage: Bewegung ja — aber <b>ohne Zielwechsel</b>. Man bleibt in der Halle → „wo?“ → <b>Dativ</b>. „Ich laufe in die Halle“ hieße: von draußen hinein.",r:"gram-wechsel"},

{id:"n07",c:"gram",q:"Ergänze: „Wir sprechen über ___ neuen Trainingsplan.“",t:"fill",a:["den"],
 e:"Bei <b>Themen</b> steht „über“ immer mit Akkusativ — unabhängig von jeder Bewegung. Ebenso: „nachdenken über“, „diskutieren über“, „sich ärgern über“.",r:"gram-wechsel"},

{id:"n08",c:"gram",q:"Ergänze: „Das war vor ___ Jahr.“",t:"fill",a:["einem"],
 e:"Bei <b>Zeitangaben</b> steht „vor“ immer mit Dativ. Nur räumlich wechselt es: „Ich stelle mich vor die Tür“ (Akk) vs. „Ich stehe vor der Tür“ (Dat).",r:"gram-wechsel"},

{id:"n09",c:"gram",q:"Was ist richtig?",o:["Ich gehe zum Arzt.","Ich gehe nach dem Arzt.","Ich gehe in den Arzt."],a:0,
 e:"<b>zu</b> bei Personen und Einrichtungen, <b>nach</b> bei Städten und artikellosen Ländern („nach Köln“), <b>in</b> wenn man hineingeht („in die Halle“).",r:"gram-richtung"},

{id:"n10",c:"gram",q:"Ergänze: „Wir fliegen ___ die Schweiz.“",t:"fill",a:["in"],
 e:"Länder <b>mit Artikel</b> bekommen „in“ + Akkusativ: in die Schweiz, in die Türkei, in die USA, in den Iran. Ohne Artikel steht „nach“: nach Italien, nach Spanien.",r:"gram-richtung"},

/* ---------- KASUS: VERBEN ---------- */
{id:"n11",c:"gram",q:"Ergänze: „Ich rufe ___ morgen an.“",t:"fill",a:["dich"],
 e:"<b>anrufen</b> verlangt den Akkusativ. „Ich rufe dir an“ ist einer der häufigsten Fehler im gesprochenen Deutsch. Merke: Man ruft jemanden an, wie man jemanden fragt.",r:"gram-akkverben"},

{id:"n12",c:"gram",q:"Ergänze: „Kannst du ___ kurz helfen?“",t:"fill",a:["mir"],
 e:"<b>helfen</b> steht mit Dativ — im Gegensatz zu <b>unterstützen</b> (Akkusativ): „Kannst du mich unterstützen?“",r:"gram-kasus"},

{id:"n13",c:"gram",q:"Welche Form ist richtig?",o:[
 "Ich habe ihm geantwortet.","Ich habe ihn geantwortet."],a:0,
 e:"<b>antworten</b> + Dativ. Aber <b>beantworten</b> + Akkusativ: „Ich habe die Frage beantwortet.“ Dasselbe Paar: raten (Dat) / beraten (Akk).",r:"gram-kasus"},

{id:"n14",c:"gram",q:"Ergänze: „Das interessiert ___ sehr.“",t:"fill",a:["mich"],
 e:"<b>interessieren</b> verlangt den Akkusativ. „Das interessiert mir“ hört man, ist aber nicht standardsprachlich. Gleiche Gruppe: stören, treffen, anrufen.",r:"gram-akkverben"},

{id:"n15",c:"gram",q:"Ergänze: „Ich gebe ___ Kollegen die Unterlagen.“ (maskulin, Dativ)",t:"fill",a:["dem"],
 e:"Zwei Dinge stecken drin: <b>geben</b> = Person im Dativ, Sache im Akkusativ. Und „Kollege“ folgt der <b>n-Deklination</b> — deshalb „dem Kollegen“ mit -n.",r:"gram-ndekl"},

{id:"n16",c:"gram",q:"Was ist richtig?",o:[
 "Ich habe mit dem Praktikanten gesprochen.",
 "Ich habe mit dem Praktikant gesprochen."],a:0,
 e:"<b>n-Deklination:</b> Alles außer dem Nominativ Singular endet auf -en. Betroffen sind Wörter auf -ant, -ent, -ist, -at, -oge sowie Mensch, Herr, Junge, Kollege, Kunde, Zeuge, Experte, Athlet.",r:"gram-ndekl"},

{id:"n17",c:"gram",q:"Ergänze: „Kennst du den Kund___?“",t:"fill",a:["en","kunden","den kunden"],
 e:"„Kunde“ gehört zur n-Deklination: den Kund<b>en</b>, dem Kund<b>en</b>, des Kund<b>en</b>. (Bei „Nachbar“ wären beide Beugungen zulässig — deshalb taugt der als Übung nicht.)",r:"gram-ndekl"},

{id:"n18",c:"gram",q:"Ergänze: „Ich nehme ___ Wettkampf teil.“ (zwei Wörter)",t:"fill",a:["an dem","am"],
 e:"<b>teilnehmen an</b> + Dativ. Feste Verb-Präposition-Verbindungen muss man mitlernen — sie sind nicht ableitbar.",r:"gram-praep"},

{id:"n19",c:"gram",q:"Ergänze: „Ich freue mich ___ das Wochenende.“",t:"fill",a:["auf"],
 e:"<b>sich freuen auf</b> = Zukunft. <b>sich freuen über</b> = etwas, das schon da ist: „Ich freue mich über dein Geschenk.“ Beide mit Akkusativ.",r:"gram-praep"},

{id:"n20",c:"gram",q:"Welche Präposition passt? „Er leidet ___ starkem Druck.“",t:"fill",a:["unter"],
 e:"Als Faustregel steht <b>unter</b> bei Umständen und <b>an</b> bei Krankheiten — beide mit Dativ. Die Grenze ist durchlässig: Für seelisches Leiden führt das DWDS beide Präpositionen („an unglücklicher Liebe leiden“). „Unter Druck leiden“ ist die feste Wendung.",r:"gram-praep"},

{id:"n21",c:"gram",q:"Was bedeutet was?",o:[
 "„halten von“ = eine Meinung haben · „halten für“ = einschätzen als",
 "Beides bedeutet dasselbe",
 "„halten von“ = einschätzen als · „halten für“ = eine Meinung haben"],a:0,
 e:"„Was hältst du <b>von</b> der Idee?“ (Dativ) — „Ich halte das <b>für</b> richtig.“ (Akkusativ)",r:"gram-praep"},

{id:"n22",c:"gram",q:"Ergänze: „Das Buch besteht ___ drei Kapiteln.“",t:"fill",a:["aus"],
 e:"<b>bestehen aus</b> = Bestandteile. <b>bestehen in</b> = worin etwas besteht („Die Aufgabe besteht in der Auswertung“). <b>bestehen auf</b> = beharren.",r:"gram-praep"},

/* ---------- REFLEXIVPRONOMEN ---------- */
{id:"n23",c:"gram",q:"Ergänze: „Ich wasche ___ die Hände.“",t:"fill",a:["mir"],
 e:"Kommt ein Akkusativobjekt dazu („die Hände“), wird das Reflexivpronomen zum <b>Dativ</b>. Ohne Objekt: „Ich wasche mich.“",r:"gram-reflexiv"},

{id:"n24",c:"gram",q:"Was bedeutet „Ich stelle mir das vor“?",o:[
 "Ich male es mir im Kopf aus",
 "Ich nenne meinen Namen"],a:0,
 e:"Der Kasus entscheidet die Bedeutung: „Ich stelle <b>mich</b> vor“ = Name nennen. „Ich stelle <b>mir</b> das vor“ = im Kopf ausmalen.",r:"gram-reflexiv"},

{id:"n25",c:"gram",q:"Ergänze: „Ich kann ___ die Nummer nicht merken.“",t:"fill",a:["mir"],
 e:"<b>sich etwas merken</b> steht immer im Dativ — es ist ja ein Akkusativobjekt dabei. Gleiche Gruppe: sich etwas überlegen, ansehen, leisten, einbilden.",r:"gram-reflexiv"},

/* ---------- ADJEKTIVENDUNGEN ---------- */
{id:"n26",c:"gram",q:"Ergänze: „Das ist ein gut___ Trainer.“",t:"fill",a:["er","guter","ein guter"],
 e:"„ein“ trägt im Nominativ maskulin <b>kein</b> Kasussignal — also muss das Adjektiv einspringen: <b>ein guter Trainer</b> (wie „der“).",r:"gram-adjektiv"},

{id:"n27",c:"gram",q:"Ergänze: „Ich kenne einen gut___ Trainer.“",t:"fill",a:["en","guten","einen guten"],
 e:"Hier zeigt „einen“ den Akkusativ bereits an — das Adjektiv bekommt nur noch <b>-en</b>.",r:"gram-adjektiv"},

{id:"n28",c:"gram",q:"Ergänze: „Bei gut___ Wetter trainieren wir draußen.“",t:"fill",a:["em","gutem"],
 e:"Kein Artikel da → das Adjektiv trägt die <b>volle Artikelendung</b>. „bei“ verlangt Dativ, Wetter ist neutral → wie „dem“ → <b>gutem</b>.",r:"gram-adjektiv"},

{id:"n29",c:"gram",q:"Ergänze: „Mit dem neu___ Plan läuft es besser.“",t:"fill",a:["en","neuen"],
 e:"Nach einem voll markierten Artikel (dem) steht fast immer <b>-en</b>. Nur im Nominativ Singular und im Akkusativ Neutrum/Femininum steht -e.",r:"gram-adjektiv"},

{id:"n30",c:"gram",q:"Was ist richtig?",o:[
 "Ich trinke gern schwarzen Kaffee.",
 "Ich trinke gern schwarzem Kaffee.",
 "Ich trinke gern schwarzer Kaffee."],a:0,
 e:"Kein Artikel → volle Endung. „trinken“ verlangt Akkusativ, Kaffee ist maskulin → wie „den“ → <b>schwarzen</b>.",r:"gram-adjektiv"},

/* ---------- RELATIVSÄTZE ---------- */
{id:"n31",c:"gram",q:"Ergänze: „Der Kollege, ___ ich geholfen habe, ist krank.“",t:"fill",a:["dem"],
 e:"<b>helfen</b> verlangt den Dativ — also „dem“. Der Trick: Bau den Relativsatz als eigenen Satz. „Ich habe <i>ihm</i> geholfen“ → dem.",r:"gram-relkasus"},

{id:"n32",c:"gram",q:"Ergänze: „Der Kollege, ___ ich gestern getroffen habe, kommt mit.“",t:"fill",a:["den"],
 e:"„treffen“ verlangt Akkusativ. Probe: „Ich habe <i>ihn</i> getroffen“ → <b>den</b>.",r:"gram-relkasus"},

{id:"n33",c:"gram",q:"Ergänze: „Die Leute, ___ wir geschrieben haben, antworten nicht.“",t:"fill",a:["denen"],
 e:"„schreiben“ + Person = Dativ, und im Plural heißt das Relativpronomen <b>denen</b> — die einzige Form, die vom bestimmten Artikel abweicht.",r:"gram-relkasus"},

{id:"n34",c:"gram",q:"Ergänze: „Die Trainerin, ___ Methoden umstritten sind, hat gekündigt.“",t:"fill",a:["deren"],
 e:"Femininum Singular Genitiv → <b>deren</b>. Maskulin und Neutrum → <b>dessen</b>. Merke: deren für die Frau und für alle im Plural.",r:"gram-relativ"},

{id:"n35",c:"gram",q:"Was ist standardsprachlich?",o:[
 "der Mann, der das gesagt hat",
 "der Mann, wo das gesagt hat"],a:0,
 e:"„wo“ als Relativpronomen ist in Süddeutschland und Teilen des Westens sehr verbreitet, gilt aber nicht als standardsprachlich. Im formellen Sprechen besser vermeiden.",r:"gram-relkasus"},

/* ---------- SATZBAU ---------- */
{id:"z01",c:"satz",q:"Welcher Satz ist richtig?",o:[
 "Morgen gehe ich ins Training.",
 "Morgen ich gehe ins Training."],a:0,
 e:"Im <b>Aussagesatz</b> steht das gebeugte Verb an zweiter Position. Steht etwas anderes als das Subjekt auf Position 1, rutscht das Subjekt automatisch hinter das Verb. (Vorn steht das Verb nur in der Ja/Nein-Frage und im Imperativ.)",r:"satz-v2"},

{id:"z02",c:"satz",q:"Welche Fassung stimmt?",o:[
 "Ich bleibe zu Hause, weil ich müde bin.",
 "Ich bleibe zu Hause, weil ich bin müde."],a:0,
 e:"Nach <b>weil</b> wandert das gebeugte Verb ans Satzende. Die Fassung „weil ich bin müde“ ist gesprochen sehr verbreitet — im formellen Rahmen aber auffällig.",r:"satz-nebensatz"},

{id:"z03",c:"satz",q:"Welches Wort verlangt KEINE Endstellung des Verbs?",o:["denn","weil","obwohl","damit"],a:0,
 e:"<b>denn</b> ist ein nebenordnender Verbinder — danach bleibt es beim normalen Hauptsatz mit Verb an zweiter Stelle. Genauso: und, oder, aber, sondern.",r:"satz-nebensatz"},

{id:"z04",c:"satz",q:"Welche Fassung stimmt?",o:[
 "Weil ich müde war, bin ich früher gegangen.",
 "Weil ich müde war, ich bin früher gegangen."],a:0,
 e:"Der Nebensatz füllt <b>Position 1 komplett</b> aus. Direkt danach folgt das Verb des Hauptsatzes — man hört das Muster als „Komma, Verb, Verb“.",r:"satz-nebensatz"},

{id:"z05",c:"satz",q:"Wo steht die Vorsilbe? „aufstehen“ im Satz „Ich ___ um sechs ___.“",t:"fill",a:["stehe auf","stehe, auf"],
 e:"Trennbare Verben werden im einfachen Hauptsatz gespalten: der gebeugte Teil auf Position 2, die Vorsilbe ans Ende. Im Nebensatz bleiben sie zusammen: „…, weil ich um sechs aufstehe.“",r:"satz-klammer"},

{id:"z06",c:"satz",q:"Welche Reihenfolge ist die neutrale Grundstellung?",o:[
 "Ich fahre morgen wegen des Wettkampfs mit dem Zug nach Berlin.",
 "Ich fahre mit dem Zug nach Berlin morgen wegen des Wettkampfs."],a:0,
 e:"<b>Te-Ka-Mo-Lo:</b> temporal (wann) — kausal (warum) — modal (wie) — lokal (wohin). Abweichen ist erlaubt, setzt dann aber eine Betonung.",r:"satz-tekamolo"},

{id:"z07",c:"satz",q:"Welche Stellung ist richtig?",o:[
 "Ich gebe dem Trainer den Ball.",
 "Ich gebe den Ball dem Trainer."],a:0,
 e:"Zwei Substantive → <b>Dativ vor Akkusativ</b>. „Ich gebe den Ball dem Trainer“ ist nicht falsch, betont aber den Ball besonders.",r:"satz-dativakk"},

{id:"z08",c:"satz",q:"Welche Stellung ist richtig?",o:[
 "Ich gebe ihn ihm.","Ich gebe ihm ihn."],a:0,
 e:"Zwei Pronomen → <b>Akkusativ zuerst</b>. Selbsttest: „Ich habe es dir gesagt“ klingt richtig, „Ich habe dir es gesagt“ nicht.",r:"satz-dativakk"},

{id:"z09",c:"satz",q:"Ergänze: „Ich gebe ___ den Ball.“ (Pronomen für „dem Trainer“)",t:"fill",a:["ihm"],
 e:"Ein Pronomen und ein Substantiv → das <b>Pronomen zuerst</b>. Merkregel: Pronomen drängeln nach vorn.",r:"satz-dativakk"},

{id:"z10",c:"satz",q:"Welche Fassung ist richtig?",o:[
 "Ich habe nicht kommen können.",
 "Ich habe nicht kommen gekonnt."],a:0,
 e:"<b>Doppelter Infinitiv:</b> Steht ein zweites Verb dabei, bildet das Modalverb kein Partizip. Allein stehend schon: „Ich habe das nicht gekonnt.“",r:"satz-modal"},

{id:"z11",c:"satz",q:"Wie lautet der Nebensatz mit doppeltem Infinitiv?",o:[
 "…, weil ich nicht habe kommen können.",
 "…, weil ich nicht kommen können habe."],a:0,
 e:"Ausnahme von der Endstellung: Beim doppelten Infinitiv rutscht das gebeugte Verb <b>nach vorn</b>. Wem das fremd klingt: Bau um — „Ich konnte nicht kommen, deshalb …“",r:"satz-modal"},

{id:"z12",c:"satz",q:"haben oder sein? „Ich ___ nach Köln gefahren.“",t:"fill",a:["bin"],
 e:"Verben der <b>Ortsveränderung</b> bilden das Perfekt mit „sein“. Aber Achtung: „Ich <b>habe</b> das Auto gefahren“ — sobald ein Akkusativobjekt dabeisteht, gilt „haben“.",r:"satz-perfekt"},

{id:"z13",c:"satz",q:"haben oder sein? „Ich ___ mich beeilt.“",t:"fill",a:["habe","hab"],
 e:"<b>Reflexive Verben</b> bilden das Perfekt immer mit „haben“ — ohne Ausnahme.",r:"satz-perfekt"},

{id:"z14",c:"satz",q:"Welche Aussage stimmt zu „Ich bin gestanden“?",o:[
 "Regional korrekt",
 "Immer falsch",
 "Immer richtig"],a:0,
 e:"Bei <b>stehen, sitzen, liegen</b> gilt beides. Süddeutschland und Österreich nehmen „sein“, der Norden „haben“. Kein Fehler, nur Region.",r:"satz-perfekt"},

{id:"z15",c:"satz",q:"Welche Fassung ist besser?",o:[
 "Wenn ich Zeit hätte, käme ich.",
 "Wenn ich Zeit haben würde, würde ich kommen."],a:0,
 e:"Wo die eigene Konjunktiv-II-Form existiert, ist sie kürzer und wirkt weniger umständlich. Zweimal „würde“ in einem Satzgefüge gilt als unschön — <b>ein Fehler ist es aber nicht</b>. Der Duden behandelt es als Stilfrage.",r:"satz-konjunktiv"},

{id:"z16",c:"satz",q:"Ergänze den Konjunktiv II von „brauchen“: „Ich ___ noch zwei Tage.“",t:"fill",a:["bräuchte","brauchte"],
 e:"Beide Formen gelten hier. Regelgerecht wäre <b>brauchte</b> — „brauchen“ ist ein schwaches Verb. Durchgesetzt hat sich <b>bräuchte</b>, weil die Umlautform den Konjunktiv vom Präteritum unterscheidet; der Duden führt sie als standardsprachlich, andere Sprachpflegestellen sehen das enger.",r:"satz-konjunktiv"},

{id:"z17",c:"satz",q:"nicht oder kein? „Ich habe ___ Zeit.“",t:"fill",a:["keine"],
 e:"<b>kein</b> bei Substantiven mit unbestimmtem Artikel oder ganz ohne Artikel. <b>nicht</b> in allen anderen Fällen: „Ich habe nicht die Zeit dafür.“",r:"satz-negation"},

{id:"z18",c:"satz",q:"Wo steht „nicht“, wenn der ganze Satz verneint wird?",o:[
 "Möglichst weit hinten, aber vor dem zweiten Verbteil",
 "Direkt nach dem Subjekt",
 "Immer am Satzanfang"],a:0,
 e:"„Ich habe gestern <b>nicht</b> trainiert.“ Wird nur ein Teil verneint, steht „nicht“ direkt davor: „Ich habe <b>nicht</b> gestern trainiert, sondern vorgestern.“",r:"satz-negation"},

{id:"z19",c:"satz",q:"Welche indirekte Frage ist richtig?",o:[
 "Ich weiß nicht, wann er kommt.",
 "Ich weiß nicht, wann kommt er."],a:0,
 e:"Die indirekte Frage ist ein <b>Nebensatz</b> — das Verb wandert ans Ende. Ohne Fragewort steht „ob“: „Sie hat gefragt, ob du Zeit hast.“",r:"satz-frage"},

{id:"z20",c:"satz",q:"Welches Fragewort passt? „___ hast du geholfen?“",t:"fill",a:["wem"],
 e:"<b>helfen</b> verlangt Dativ → <b>wem</b>. Bei „anrufen“ wäre es „wen“, weil das Verb den Akkusativ regiert. Das Verb entscheidet, nicht das Gefühl.",r:"satz-frage"},

{id:"z21",c:"satz",q:"Was ist das Problem an diesem Satz? „Ich habe gestern nach dem Training, das wegen des Regens verlegt wurde, mit Lena noch zwei Stunden für die Klausur gelernt.“",o:[
 "Die Satzklammer ist zu weit offen",
 "Falscher Kasus","Fehlende Kommas"],a:0,
 e:"Grammatisch korrekt, aber beim Hören verliert man den Anfang. Faustregel: <b>höchstens sieben bis acht Wörter</b> zwischen den beiden Verbteilen.",r:"satz-klammer"},

{id:"z22",c:"satz",q:"Trennbar oder nicht? „Ich ___ den Text.“ (übersetzen, in eine andere Sprache)",t:"fill",a:["übersetze"],
 e:"Die Betonung entscheidet: über<b>SETZ</b>en (Sprache) ist untrennbar, <b>ÜBER</b>setzen (mit dem Boot) ist trennbar → „Ich setze über“. Gleiches Paar: umfahren.",r:"satz-klammer"},

{id:"z23",c:"satz",q:"Welcher Satz enthält einen Satzabbruch?",o:[
 "Der Punkt, den ich sagen wollte, also es geht ja darum, dass wir …",
 "Ich wollte auf einen Punkt hinaus: Wir brauchen mehr Zeit."],a:0,
 e:"Ein <b>Anakoluth</b> — begonnene Konstruktion, andere beendet. Häufigster Stolperstein beim freien Sprechen. Gegenmittel: kurz anfangen, Nebensätze erst danach.",r:"satz-reden"},

{id:"z24",c:"satz",q:"Was fällt beim Sprechen am ehesten auf?",o:[
 "„Ich rufe dir an“ statt „dich“",
 "„wegen dem Wetter“ statt Genitiv",
 "„Ich hab gesagt“ statt „Ich sagte“"],a:0,
 e:"Der Kasusfehler bei „anrufen“ wird sofort gehört. Genitiv-Ersatz und Perfekt statt Präteritum sind in der gesprochenen Sprache dagegen völlig normal.",r:"satz-sprechen"},

{id:"z25",c:"satz",q:"Welche Ersetzung ist im Gespräch sinnvoller als ein Füllwort?",o:[
 "Eine Sekunde Pause",
 "„ähm“","„also ja genau“"],a:0,
 e:"Zuhörer nehmen kurze Pausen kaum wahr, gestapelte Füllwörter dagegen sehr. Die Pause gibt dir außerdem die Zeit, den Satz zu Ende zu denken.",r:"satz-reden"},

/* ---------- WECHSELVERBEN, WENN/ALS, SCHWANKENDE VERBFORMEN ---------- */
{id:"x01",c:"gram",q:"Was ist richtig?",o:[
 "Ich lege das Handy auf den Tisch.",
 "Ich lege das Handy auf dem Tisch."],a:0,
 e:"<b>legen</b> beantwortet die Frage <b>wohin?</b> — danach steht der Akkusativ: auf <b>den</b> Tisch. Das Gegenstück ist „liegen“ (wo?) mit Dativ.",r:"gram-wechsel"},

{id:"x02",c:"gram",q:"Was ist richtig?",o:[
 "Das Handy liegt auf dem Tisch.",
 "Das Handy liegt auf den Tisch."],a:0,
 e:"<b>liegen</b> beantwortet die Frage <b>wo?</b> — danach steht der Dativ: auf <b>dem</b> Tisch.",r:"gram-wechsel"},

{id:"x03",c:"gram",q:"Welches Verb passt?",o:[
 "Ich setze mich auf die Bank.",
 "Ich sitze mich auf die Bank."],a:0,
 e:"<b>setzen</b> ist das Verb der Bewegung (wohin?) und braucht ein Objekt — hier „mich“. <b>sitzen</b> beschreibt den Zustand: „Ich sitze auf der Bank.“",r:"gram-wechsel"},

{id:"x04",c:"gram",q:"Welche Form passt zu „Ich habe die Jacke an den Haken ___“?",o:[
 "gehängt","gehangen"],a:0,
 e:"Mit Objekt („die Jacke“) ist es das schwache Verb: hängte, hat <b>gehängt</b>. Ohne Objekt das starke: „Die Jacke hat am Haken <b>gehangen</b>.“",r:"gram-verbformen"},

{id:"x05",c:"gram",q:"Welche Form ist standardsprachlich?",o:[
 "Er hat zum Abschied gewinkt.",
 "Er hat zum Abschied gewunken."],a:0,
 e:"Standardsprachlich ist <b>gewinkt</b>. „Gewunken“ ist umgangssprachlich weit verbreitet und laut DWDS zunehmend auch schriftlich — im Prüfungstext bleibt „gewinkt“ die sichere Wahl.",r:"gram-verbformen"},

{id:"x06",c:"gram",q:"Welcher Satz ist korrekt?",o:[
 "Ich bin heute Morgen erschrocken.",
 "Ich habe heute Morgen erschrocken."],a:0,
 e:"Ohne Objekt ist „erschrecken“ stark und bildet das Perfekt mit <b>sein</b>: ich erschrak, ich bin erschrocken. Mit Objekt schwach und mit haben: „Der Knall hat mich erschreckt.“",r:"gram-verbformen"},

{id:"x07",c:"satz",q:"Was ist richtig?",o:[
 "Als ich klein war, habe ich Handball gespielt.",
 "Wenn ich klein war, habe ich Handball gespielt."],a:0,
 e:"Ein einzelner, abgeschlossener Zeitraum in der Vergangenheit → <b>als</b>. „Wenn“ passt nur bei Wiederholung („immer wenn“) oder in Gegenwart und Zukunft.",r:"satz-wennals"},

{id:"x08",c:"satz",q:"Was ist richtig?",o:[
 "Immer wenn ich in Köln war, hat es geregnet.",
 "Immer als ich in Köln war, hat es geregnet."],a:0,
 e:"Wiederholtes in der Vergangenheit → <b>wenn</b>. Der Test: Passt „jedes Mal“? Dann „wenn“. Passt „damals, dieses eine Mal“? Dann „als“.",r:"satz-wennals"},

{id:"x09",c:"satz",q:"Was ist richtig?",o:[
 "Ich weiß nicht, wann das Training anfängt.",
 "Ich weiß nicht, wenn das Training anfängt."],a:0,
 e:"In der indirekten Frage steht das Fragewort <b>wann</b>. „Wenn“ leitet Bedingungen und Zeitpunkte ein, aber keine Fragen.",r:"satz-wennals"},

{id:"x10",c:"gram",q:"Welchen Fall verlangt „stellen“ (wohin)?",o:[
 "Akkusativ","Dativ","Genitiv"],a:0,
 e:"<b>stellen</b> ist ein Wohin-Verb: „Ich stelle die Flasche in <b>den</b> Kühlschrank.“ Das Gegenstück „stehen“ (wo?) verlangt den Dativ.",r:"gram-wechsel"},

{id:"x11",c:"gram",q:"Welche Aussage stimmt zu „Ich bin gestanden“?",o:[
 "Süddeutsch und österreichisch korrekt, im Norden sagt man „ich habe gestanden“",
 "Immer falsch — richtig ist nur „ich habe gestanden“",
 "Immer richtig, „ich habe gestanden“ ist umgangssprachlich"],a:0,
 e:"Bei <b>stehen, sitzen, liegen</b> bildet der Süden samt Österreich und Schweiz das Perfekt mit <b>sein</b>, der Norden mit <b>haben</b>. Beides gilt — es ist eine regionale Variante, kein Fehler.",r:"satz-perfekt"},

{id:"x12",c:"gram",q:"Welche Form passt in „Der Sender hat den ganzen Tag ___“?",o:[
 "gesendet","gesandt"],a:0,
 e:"Beim Ausstrahlen gilt nur <b>gesendet</b>. Nur beim Schicken sind beide Formen üblich: „Ich habe ihm die Unterlagen gesendet / gesandt.“",r:"gram-verbformen"},

{id:"x13",c:"gram",q:"Welcher Satz ist korrekt?",o:[
 "Der Schlüssel steckt im Schloss.",
 "Der Schlüssel steckt ins Schloss."],a:0,
 e:"Ohne Bewegung (wo?) steht der Dativ: <b>im</b> Schloss. Mit Bewegung: „Ich stecke den Schlüssel <b>ins</b> Schloss.“",r:"gram-wechsel"},

{id:"x14",c:"gram",q:"Welche Regel führt sicherer zum richtigen Fall?",o:[
 "Das Verb prüfen: legen, stellen, setzen, hängen → Akkusativ; liegen, stehen, sitzen, hängen → Dativ",
 "Prüfen, ob im Satz Bewegung vorkommt"],a:0,
 e:"Der Bewegungstest führt in die Irre: „Ich laufe <b>in der</b> Halle“ ist Bewegung — aber ohne Ortswechsel, also Dativ. Das Verbpaar ist der zuverlässigere Test.",r:"gram-wechsel"},

/* ---------- FORM STATT ETIKETT: den Satz richtig sprechen ---------- */
{id:"d01",c:"gram",q:"Ich habe ___ Trainer nach dem Plan gefragt.",o:["den","dem"],a:0,
 e:"<b>fragen</b> steht mit dem Akkusativ: „Ich habe <b>den</b> Trainer gefragt.“ Die Dativform hört man oft, sie ist aber nicht standardsprachlich.",r:"gram-akkverben"},

{id:"d02",c:"gram",q:"Ich habe ___ Trainer beim Aufbau geholfen.",o:["dem","den"],a:0,
 e:"<b>helfen</b> steht mit dem Dativ: „Ich habe <b>dem</b> Trainer geholfen.“ Probe mit dem Pronomen: „Ich habe <b>ihm</b> geholfen.“",r:"gram-kasus"},

{id:"d03",c:"gram",q:"Kannst du ___ nachher kurz anrufen?",o:["mich","mir"],a:0,
 e:"<b>anrufen</b> steht mit dem Akkusativ: „Ruf <b>mich</b> an.“ Der Dativ („ruf mir an“) ist südwestdeutsch und schweizerisch verbreitet, überregional gilt der Akkusativ.",r:"gram-akkverben"},

{id:"d04",c:"gram",q:"Ich danke ___ für die schnelle Rückmeldung.",o:["dir","dich"],a:0,
 e:"<b>danken</b> steht mit dem Dativ. Probe: „Ich danke <b>ihm</b>“ — nicht „ihn“.",r:"gram-kasus"},

{id:"d05",c:"gram",q:"Ich habe ___ gestern nach dem Training getroffen.",o:["ihn","ihm"],a:0,
 e:"<b>treffen</b> steht mit dem Akkusativ: „Ich treffe <b>ihn</b>.“ Mit Dativ nur in der Wendung „Das trifft sich gut“.",r:"gram-akkverben"},

{id:"d06",c:"gram",q:"Nach ___ Training gehen wir noch essen.",o:["dem","das"],a:0,
 e:"<b>nach</b> steht immer mit dem Dativ — auch zeitlich: nach <b>dem</b> Training, nach <b>der</b> Pause.",r:"gram-praepdat"},

{id:"d07",c:"gram",q:"Wir fahren mit ___ Bahn nach Köln.",o:["der","die"],a:0,
 e:"<b>mit</b> verlangt den Dativ. „Bahn“ ist feminin, im Dativ steht <b>der</b>.",r:"gram-praepdat"},

{id:"d08",c:"gram",q:"Das Material ist für ___ Kurs am Freitag.",o:["den","dem"],a:0,
 e:"<b>für</b> verlangt den Akkusativ: für <b>den</b> Kurs, für <b>die</b> Gruppe, für <b>das</b> Projekt.",r:"gram-praepakk"},

{id:"d09",c:"gram",q:"Ohne ___ Ausweis kommst du nicht rein.",o:["den","dem"],a:0,
 e:"<b>ohne</b> verlangt den Akkusativ. Oft steht danach gar kein Artikel: „ohne Ausweis“.",r:"gram-praepakk"},

{id:"d10",c:"gram",q:"Ich gehe gleich in ___ Halle.",o:["die","der"],a:0,
 e:"Bewegung mit Zielwechsel — <b>wohin?</b> → Akkusativ: in <b>die</b> Halle. Wer schon drin ist, sagt: „Ich trainiere in <b>der</b> Halle.“",r:"gram-wechsel"},

{id:"d11",c:"gram",q:"Ich trainiere dienstags in ___ Halle.",o:["der","die"],a:0,
 e:"Kein Ortswechsel — <b>wo?</b> → Dativ: in <b>der</b> Halle. Bewegung allein reicht nicht für den Akkusativ.",r:"gram-wechsel"},

{id:"d12",c:"gram",q:"Ich freue mich auf ___ Wochenende.",o:["das","dem"],a:0,
 e:"<b>sich freuen auf</b> steht fest mit dem Akkusativ: auf <b>das</b> Wochenende, auf <b>den</b> Urlaub.",r:"gram-praep"},

{id:"d13",c:"gram",q:"Ich erinnere mich gut an ___ Tag.",o:["den","dem"],a:0,
 e:"<b>sich erinnern an</b> steht fest mit dem Akkusativ: an <b>den</b> Tag, an <b>die</b> Stunde.",r:"gram-praep"},

{id:"d14",c:"gram",q:"Sie hat sich bei ___ Trainerin bedankt.",o:["der","die"],a:0,
 e:"<b>sich bedanken bei</b> — „bei“ steht immer mit dem Dativ: bei <b>der</b> Trainerin, bei <b>dem</b> Kollegen.",r:"gram-praep"},

{id:"d15",c:"gram",q:"Ich habe mit ___ Kindern gesprochen.",o:["den","die"],a:0,
 e:"Dativ Plural: <b>den</b> Kindern. Merke: Im Dativ Plural endet auch das Substantiv auf <b>-n</b> — den Kinder<b>n</b>, den Freunde<b>n</b>.",r:"gram-praepdat"},

{id:"d16",c:"gram",q:"Ich habe ___ Kollegen gefragt.",o:["den","dem"],a:0,
 e:"„fragen“ verlangt den Akkusativ, und „Kollege“ folgt der n-Deklination: <b>den Kollegen</b>. Im Nominativ heißt es „der Kollege“.",r:"gram-ndekl"},

{id:"d17",c:"gram",q:"Trotz ___ Regens haben wir draußen trainiert.",o:["des","dem"],a:0,
 e:"<b>trotz</b> steht standardsprachlich mit dem Genitiv: trotz <b>des</b> Regens. Der Dativ ist landschaftlich und in der Schweiz üblich.",r:"gram-genitiv"},

{id:"d18",c:"gram",q:"Während ___ Sitzung habe ich mitgeschrieben.",o:["der","die"],a:0,
 e:"<b>während</b> steht mit dem Genitiv. „Sitzung“ ist feminin, der Genitiv lautet <b>der</b> Sitzung.",r:"gram-genitiv"},

{id:"d19",c:"gram",q:"Das sehe ich ___ heute Abend in Ruhe an.",o:["mir","mich"],a:0,
 e:"<b>sich etwas ansehen</b> — wenn ein Objekt dabei ist („das“), steht das Reflexivpronomen im Dativ: <b>mir</b>.",r:"gram-reflexiv"},

{id:"d20",c:"gram",q:"Ich muss ___ beeilen, sonst komme ich zu spät.",o:["mich","mir"],a:0,
 e:"<b>sich beeilen</b> hat kein weiteres Objekt — dann steht das Reflexivpronomen im Akkusativ: <b>mich</b>.",r:"gram-reflexiv"},

{id:"d21",c:"gram",q:"Das war ein ___ Training.",o:["gutes","guter","gute"],a:0,
 e:"Nach <b>ein</b> im Neutrum trägt das Adjektiv die Endung <b>-es</b>: ein gut<b>es</b> Training. Nach „das“ dagegen: das gut<b>e</b> Training.",r:"gram-adjektiv"},

{id:"d22",c:"gram",q:"Nach dem ___ Training war ich platt.",o:["langen","lange","langem"],a:0,
 e:"Nach dem bestimmten Artikel im Dativ endet das Adjektiv auf <b>-en</b>: nach dem lang<b>en</b> Training. Ohne Artikel hieße es „nach lang<b>em</b> Training“.",r:"gram-adjektiv"},

{id:"d23",c:"gram",q:"Ich gratuliere ___ zum Abschluss.",o:["dir","dich"],a:0,
 e:"<b>gratulieren</b> steht mit dem Dativ: „Ich gratuliere <b>ihm</b>.“ Verwandt: danken, helfen, antworten, gehören — alle mit Dativ.",r:"gram-kasus"},

{id:"d24",c:"gram",q:"Ich habe ___ Studierenden das Material geschickt.",o:["den","die"],a:0,
 e:"Zwei Objekte: Dativ vor Akkusativ. Die Person steht im Dativ Plural — <b>den</b> Studierenden — die Sache im Akkusativ.",r:"satz-dativakk"},

/* ---------- GESPROCHEN GEGEN GESCHRIEBEN ---------- */
{id:"d25",c:"satz",q:"Welche Fassung gehört in einen geschriebenen Text?",o:[
 "Du brauchst nicht zu kommen.",
 "Du brauchst nicht kommen."],a:0,
 e:"Standardsprachlich steht nach „brauchen“ der Infinitiv <b>mit „zu“</b>. Ohne „zu“ ist im Gespräch sehr verbreitet — die Duden-Grammatik hält fest, dass „brauchen“ zunehmend zu den Modalverben rückt. Geschrieben bleibt „zu“ die sichere Wahl.",r:"satz-sprechen"},

{id:"d26",c:"satz",q:"Was gehört in einen geschriebenen Text?",o:[
 "Das hatte ich schon gemacht.",
 "Das hatte ich schon gemacht gehabt."],a:0,
 e:"Das <b>doppelte Perfekt</b> („gemacht gehabt“) ist landschaftlich weit verbreitet, im geschriebenen Standard genügt das Plusquamperfekt: „Das <b>hatte</b> ich schon gemacht.“",r:"satz-sprechen"},

{id:"d27",c:"satz",q:"Welche Frage klingt standardsprachlich?",o:[
 "Womit hast du das gemacht?",
 "Mit was hast du das gemacht?"],a:0,
 e:"Bei Sachen bildet man das Fragewort mit <b>wo(r)-</b>: womit, worauf, wovon, worüber. „Mit was“ ist umgangssprachlich geläufig, im Text besser „womit“.",r:"satz-frage"},

{id:"d28",c:"satz",q:"Was ist überregional die sichere Form?",o:[
 "Ruf mich später an.",
 "Ruf mir später an."],a:0,
 e:"Überregional steht „anrufen“ mit dem Akkusativ. Der Dativ ist südwestdeutsch und schweizerisch verbreitet — außerhalb dieser Räume fällt er sofort auf.",r:"gram-akkverben"}

{id:"gram-praepakk",c:"gram",t:"Präpositionen mit Akkusativ",b:`
<p>Diese Präpositionen verlangen <b>immer</b> den Akkusativ — ohne Ausnahme, ohne Nachdenken:</p>
<div class="ex"><b>durch · für · gegen · ohne · um · bis · entlang · wider</b></div>
<p><b>Merkspruch:</b> „durch für gegen ohne um“ — fünf Wörter im Rhythmus, der Rest ist selten.</p>
<div class="ex">durch <b>den</b> Wald · für <b>dich</b> · gegen <b>die</b> Wand · ohne <b>mich</b> · um <b>den</b> Platz</div>
<p><b>Sonderfälle:</b></p>
<ul>
<li><b>bis</b> steht meist ohne Artikel („bis Montag“). Kommt ein Artikel dazu, folgt oft eine zweite Präposition, die dann regiert: „bis <b>zum</b> Montag“ (Dativ).</li>
<li><b>entlang</b> nachgestellt mit Akkusativ („den Fluss entlang“); vorangestellt verlangt der Duden den Genitiv („entlang des Flusses“), seltener den Dativ.</li>
<li><b>wider</b> = gegen, gehoben: „wider Erwarten“. Nicht mit „wieder“ verwechseln.</li>
</ul>`},

{id:"gram-praepdat",c:"gram",t:"Präpositionen mit Dativ",b:`
<p>Diese Präpositionen verlangen <b>immer</b> den Dativ:</p>
<div class="ex"><b>aus · außer · bei · gegenüber · mit · nach · seit · von · zu</b><br>
dazu: entgegen · gemäß · zufolge · samt · nebst · nahe · mitsamt</div>
<p><b>Merkspruch:</b> „aus außer bei gegenüber mit nach seit von zu“ — als Reihe auswendig gelernt, spart es beim Sprechen jede Überlegung.</p>
<div class="ex">aus <b>dem</b> Haus · bei <b>meiner</b> Schwester · mit <b>dem</b> Rad · nach <b>dem</b> Training · seit <b>einem</b> Jahr · von <b>meinem</b> Bruder · zu <b>dir</b></div>
<p><b>Schwankende Fälle</b> — hier gehen zwei Fälle, mit unterschiedlicher Neigung:</p>
<ul>
<li><code>dank</code>: Dativ und Genitiv, im Plural meist Genitiv. <span class="ex">dank deinem Einsatz · dank des Einsatzes</span></li>
<li><code>laut</code>: früher überwiegend Genitiv, heute meist Dativ. Steht ein bloßer Plural ohne Zwischenwort, muss der Dativ stehen. <span class="ex">laut Berichten</span>, nicht <span class="nope">laut Berichte</span></li>
<li><code>binnen</code>: Dativ ist üblich, der Genitiv gilt als gehoben. <span class="ex">binnen einem Jahr · binnen eines Jahres</span></li>
<li><code>ab</code>: <b>kein reiner Dativfall.</b> Mit Artikelwort steht der Dativ — <span class="ex">ab dem nächsten Montag</span>. Ohne Artikel gehen beide: <span class="ex">ab nächstem Montag</span> (Dativ) und <span class="ex">ab nächsten Montag</span> (Akkusativ). In Deutschland ist dort der Akkusativ üblich, in der Schweiz der Dativ.</li>
</ul>
<p class="tiny muted">Belegt: Duden — <i>dank</i> mit Genitiv und Dativ, im Plural meist Genitiv; <i>binnen</i> mit Dativ, seltener Genitiv, dieser gehoben; <i>ab</i> mit Artikel Dativ, artikellos daneben auch Akkusativ („ab kommendem/auch kommenden Montag“). Die regionale Verteilung bei <i>ab</i> nach der Variantengrammatik des Standarddeutschen (IDS Mannheim).</p>
<p><b>Verschmelzungen</b>, die im Sprechen selbstverständlich sind: bei dem → <b>beim</b>, von dem → <b>vom</b>, zu dem → <b>zum</b>, zu der → <b>zur</b>.</p>`},

{id:"gram-akkverben",c:"gram",t:"Verben, die oft fälschlich mit Dativ stehen",b:`
<p>Diese Verben verlangen den <b>Akkusativ</b>, obwohl viele Sprecher intuitiv zum Dativ greifen:</p>
<div class="ex"><b>anrufen</b> — Ich rufe <b>dich</b> an. <span class="nope">(nicht: dir)</span><br>
<b>fragen</b> — Ich frage <b>dich</b>. <span class="nope">(nicht: dir)</span><br>
<b>interessieren</b> — Das interessiert <b>mich</b>. <span class="nope">(nicht: mir)</span><br>
<b>stören</b> — Das stört <b>mich</b>.<br>
<b>kosten</b> — Das kostet <b>mich</b> viel Zeit. <span class="tiny muted">(Bei „jemanden um etwas bringen“ ist der Dativ zulässig: „Das kostete ihm das Leben.“)</span><br>
<b>treffen</b> — Ich treffe <b>dich</b> morgen.</div>
<p><b>Die Verwechslungspaare</b> — gleiche Bedeutung, verschiedener Kasus:</p>
<table class="dt"><thead><tr><th>Dativ</th><th>Akkusativ</th></tr></thead><tbody>
<tr><td>helfen (ihm)</td><td>unterstützen (ihn)</td></tr>
<tr><td>antworten (ihm)</td><td>beantworten (die Frage)</td></tr>
<tr><td>raten (ihm)</td><td>beraten (ihn)</td></tr>
<tr><td>folgen (ihm)</td><td>verfolgen (ihn)</td></tr>
<tr><td>beibringen (ihm etwas)</td><td>lehren (ihn etwas)</td></tr>
<tr><td>glauben (ihm)</td><td>glauben an (ihn)</td></tr>
</tbody></table>
<p><b>Faustregel:</b> Die Vorsilbe <code>be-</code> macht aus einem Dativverb fast immer ein Akkusativverb.</p>`},

{id:"gram-richtung",c:"gram",t:"nach, zu, in oder auf?",b:`
<p>Die vier Richtungsangaben sind klar verteilt — man muss sie nur einmal sortieren:</p>
<ul>
<li><b>nach</b> + Dativ — Städte, Länder ohne Artikel, Himmelsrichtungen, „nach Hause“<br>
<span class="ex">nach Köln · nach Italien · nach Norden · nach Hause</span></li>
<li><b>zu</b> + Dativ — Personen, Einrichtungen, konkrete Ziele<br>
<span class="ex">zum Arzt · zur Schule · zu meiner Schwester · zum Bahnhof</span></li>
<li><b>in</b> + Akkusativ — wenn man hineingeht, und bei Ländern <b>mit</b> Artikel<br>
<span class="ex">in die Halle · in den Wald · in die Schweiz · in die Türkei · in die USA</span></li>
<li><b>auf</b> + Akkusativ — Ämter, Plätze, offene Flächen<br>
<span class="ex">auf die Post · auf den Markt · aufs Land · auf die Bank</span></li>
</ul>
<p><b>Feiner Unterschied:</b> „Ich gehe <b>in die</b> Schule“ = ins Gebäude hinein. „Ich gehe <b>zur</b> Schule“ = in Richtung Schule oder: Ich bin Schüler.</p>
<p><b>Für „wo?“ statt „wohin?“</b> gilt: <code>bei</code> bei Personen („beim Arzt“), <code>in</code> + Dativ bei Räumen („in der Halle“), <code>auf</code> + Dativ bei Flächen („auf dem Markt“).</p>`},

{id:"gram-kasusfinden",c:"gram",t:"Den Fall in drei Sekunden bestimmen",b:`
<p>Statt Regeln abzurufen, frag den Satz ab. Das geht beim Sprechen schnell genug:</p>
<table class="dt"><thead><tr><th>Fall</th><th>Frage</th><th>Probe</th></tr></thead><tbody>
<tr><th>Nominativ</th><td>wer oder was?</td><td>„<b>Wer</b> kommt?“ → er, sie, das</td></tr>
<tr><th>Akkusativ</th><td>wen oder was?</td><td>„Ich rufe <b>wen</b> an?“ → ihn, sie, das</td></tr>
<tr><th>Dativ</th><td>wem?</td><td>„Ich helfe <b>wem</b>?“ → ihm, ihr, denen</td></tr>
<tr><th>Genitiv</th><td>wessen?</td><td>„<b>Wessen</b> Rad?“ → seines, ihres</td></tr>
</tbody></table>
<p><b>Der Pronomen-Trick:</b> Setz testweise <i>er / ihn / ihm</i> ein. Welche Form passt, verrät den Fall — und zwar zuverlässiger als jedes Sprachgefühl bei Substantiven.</p>
<div class="ex">„Ich habe dem Kollegen geholfen.“ → „Ich habe <b>ihm</b> geholfen.“ → Dativ ✓<br>
„Ich habe den Kollegen getroffen.“ → „Ich habe <b>ihn</b> getroffen.“ → Akkusativ ✓</div>
<p><b>Die Reihenfolge der Entscheidung</b> beim Sprechen:</p>
<ol>
<li>Steht eine <b>Präposition</b> davor? Dann entscheidet sie — Verb egal.</li>
<li>Sonst entscheidet das <b>Verb</b>.</li>
<li>Bei Wechselpräpositionen: „wohin?“ → Akkusativ, „wo?“ → Dativ.</li>
</ol>`}
]);
