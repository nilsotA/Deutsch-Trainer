/* ---------- Korrekturtraining ---------- */
function korrTokens(t){ return t.txt.split(/\s+/); }
function korrErrIdx(t){
  const toks = korrTokens(t), map = {};
  t.errs.forEach(e=>{
    const nth = e.nth || 1; let c = 0;
    for(let i=0;i<toks.length;i++){
      if(toks[i] === e.w){ c++; if(c === nth){ map[i] = e; break; } }
    }
  });
  return map;
}

function renderKorrList(){
  S.korr = S.korr || {};
  const lvlCls = {leicht:"kb-dat", mittel:"kb-mix", schwer:"kb-gen"};
  $("#wSub").innerHTML =
    '<div class="card flat">'+
      '<div class="eyebrow">Fehlersuche</div>'+
      '<p class="small muted" style="margin-top:6px">Klick im Text alles an, was du für falsch hältst — Wörter, Satzzeichen, Formulierungen. '+
      "Danach siehst du, was du gefunden und was du übersehen hast. Genau das brauchst du, wenn du eigene Texte gegenliest.</p>"+
    "</div>"+
    KORREKTUR.map(t=>{
      const r = S.korr[t.id];
      return '<div class="acc"><button data-kt="'+t.id+'">'+
        '<span class="tag '+(lvlCls[t.lvl]||"kb-dat")+'" style="border-radius:6px">'+t.lvl+"</span>"+
        "<span>"+esc(t.t)+"</span>"+
        '<span class="tiny muted" style="font-weight:500">'+esc(t.ctx)+"</span>"+
        (r ? '<span class="tiny" style="color:var(--acc)">'+r.best+" %</span>" : "")+
        '<span class="ar">›</span></button></div>';
    }).join("");
  $$("[data-kt]").forEach(b => b.onclick = ()=>openKorr(b.dataset.kt));
}

function openKorr(id){
  const t = KORREKTUR.find(x=>x.id===id);
  KO = {t, marked:new Set(), done:false, map:korrErrIdx(t)};
  drawKorr();
  window.scrollTo({top:0,behavior:"smooth"});
}

function drawKorr(){
  const {t, marked, done, map} = KO;
  const toks = korrTokens(t);
  const total = t.errs.length;
  let hits = 0, wrong = 0;
  if(done) marked.forEach(i => map[i] ? hits++ : wrong++);

  const body = toks.map((tk,i)=>{
    let cls = "tok";
    if(done){
      if(map[i] && marked.has(i)) cls += " hit";
      else if(map[i]) cls += " miss";
      else if(marked.has(i)) cls += " fp";
    } else if(marked.has(i)) cls += " sel";
    return '<span class="'+cls+'" data-i="'+i+'">'+esc(tk)+"</span>";
  }).join(" ");

  $("#wSub").innerHTML =
    '<div class="card">'+
      '<button class="btn ghost sm" id="backK" style="margin-bottom:14px">‹ Zurück</button>'+
      '<div class="spread" style="margin-bottom:8px">'+
        '<div class="eyebrow" style="margin:0">'+esc(t.ctx)+"</div>"+
        '<span class="tiny muted">'+t.lvl+"</span>"+
      "</div>"+
      "<h2>"+esc(t.t)+"</h2>"+
      '<p class="small muted" style="margin-top:6px">Dieser Text enthält <b>'+total+" Fehler</b>. Klick sie an."+
        (done?"":" Ein zweiter Klick nimmt die Markierung zurück.")+"</p>"+
      '<div class="korrtext" id="ktText">'+body+"</div>"+
      (done ? "" :
        '<div class="row" style="margin-top:16px">'+
          '<button class="btn" id="ktGo">Auswerten</button>'+
          '<span class="tiny muted" id="ktCount">'+marked.size+" von "+total+" markiert</span>"+
        "</div>")+
    "</div>"+
    (done ?
      '<div class="card">'+
        '<div class="spread"><h3>'+hits+" von "+total+" gefunden</h3>"+
        '<span class="pill '+(hits===total&&!wrong?"xp":"flame")+'">'+Math.round(hits/total*100)+" %</span></div>"+
        (wrong ? '<p class="small muted" style="margin-top:6px">'+wrong+
          (wrong===1?" Markierung war unnötig":" Markierungen waren unnötig")+" — orange hinterlegt.</p>" : "")+
        '<hr class="sep">'+
        '<div class="eyebrow">Alle Fehler im Detail</div>'+
        '<div style="margin-top:10px">'+ t.errs.map((e,n)=>{
          const idx = Object.keys(map).find(k=>map[k]===e);
          const found = idx !== undefined && marked.has(+idx);
          const rl = ruleById(e.r);
          return '<div class="kerr'+(found?" ok":"")+'">'+
            '<div class="kerr-h">'+(found?"✓":"✗")+" <b>"+esc(e.w)+"</b> → <b>"+esc(e.ok)+"</b>"+
            (CATS[e.c]?'<span class="tag '+CATS[e.c].cls+'" style="margin-left:auto">'+CATS[e.c].n+"</span>":"")+"</div>"+
            '<div class="kerr-b">'+e.k+
            (rl ? ' <a href="#" data-krule="'+e.r+'">→ '+esc(rl.t)+"</a>" : "")+"</div></div>";
        }).join("") + "</div>"+
        '<div class="row" style="margin-top:18px">'+
          '<button class="btn" id="ktNext">Nächster Text</button>'+
          '<button class="btn ghost sm" id="ktAgain">Nochmal</button>'+
        "</div>"+
      "</div>" : "");

  $("#backK").onclick = ()=>{ KO = null; renderKorrList(); };
  if(!done){
    $$("#ktText .tok").forEach(sp => sp.onclick = ()=>{
      const i = +sp.dataset.i;
      marked.has(i) ? marked.delete(i) : marked.add(i);
      sp.classList.toggle("sel");
      $("#ktCount").textContent = marked.size + " von " + total + " markiert";
    });
    $("#ktGo").onclick = ()=>{
      KO.done = true;
      // Auswertung in Statistik und Journal übernehmen
      let h = 0;
      t.errs.forEach(e=>{
        const idx = Object.keys(map).find(k=>map[k]===e);
        const found = idx !== undefined && marked.has(+idx);
        if(found) h++;
        const k = S.cat[e.c] || {c:0,w:0};
        found ? k.c++ : k.w++;
        S.cat[e.c] = k;
        if(!found) logError("kt:"+t.id+":"+e.w, e.c, e.r, "Übersehen in „"+t.t+"“: "+e.w+" → "+e.ok);
      });
      const pct = Math.round(h/total*100);
      S.korr = S.korr || {};
      const prev = S.korr[t.id];
      S.korr[t.id] = {best: Math.max(pct, prev?prev.best:0), runs:(prev?prev.runs:0)+1};
      S.xp += h * 8;
      save(); updHud(); drawKorr();
    };
  } else {
    $("#ktAgain").onclick = ()=>openKorr(t.id);
    $("#ktNext").onclick = ()=>{
      const i = KORREKTUR.findIndex(x=>x.id===t.id);
      openKorr(KORREKTUR[(i+1)%KORREKTUR.length].id);
    };
    $$("[data-krule]").forEach(a => a.onclick = e=>{ e.preventDefault(); openRule(a.dataset.krule); });
  }
}

/* ---------- Fehlerjournal ---------- */
function logError(id, cat, rule, label){
  S.log = S.log || [];
  S.log.push({i:id, c:cat, r:rule||null, l:label||null, t:Date.now()});
  if(S.log.length > 500) S.log = S.log.slice(-500);
}

/* Schlüssel → Frage. Eine Stelle für alle Kartenarten, damit beim Auflösen
   nichts mehr verloren geht. */
function frageZuSchluessel(k, r){
  r = r || rng(Date.now());
  if(k.startsWith("w:")){ const wd = WORDS.find(x=>"w:"+x.w===k); return wd ? wordQuestion(wd,r) : null; }
  if(k.startsWith("c:")){ const e = (typeof drillPool==="function") ? drillPool().find(x=>"c:"+x.w===k) : null;
                          return e ? caseQuestion(e) : null; }
  const it = ALL.find(x=>x.id===k);
  return it ? exQuestion(it) : null;
}

function labelFor(entry){
  if(entry.l) return entry.l;
  const it = ALL.find(x=>x.id===entry.i);
  if(it) return it.q.replace(/<[^>]+>/g,"");
  if(entry.i.startsWith("w:")) return "Wortschatz: " + entry.i.slice(2);
  if(entry.i.startsWith("c:")) return "Fall-Drill: " + entry.i.slice(2);
  return entry.i;
}

function renderJournal(){
  S.log = S.log || [];
  const log = S.log;
  if(!log.length){
    $("#pSub").innerHTML =
      '<div class="card center" style="padding:40px 22px">'+
        '<div style="font-size:38px;line-height:1;margin-bottom:10px">◇</div>'+
        "<h3>Noch keine Einträge</h3>"+
        '<p class="muted small" style="margin-top:8px;max-width:420px;margin-left:auto;margin-right:auto">'+
        "Sobald du eine Frage falsch beantwortest oder in der Fehlersuche etwas übersiehst, landet es hier — "+
        "mit Muster, Häufigkeit und einer Übungsrunde, die genau darauf zielt.</p>"+
      "</div>";
    return;
  }
  const weekAgo = Date.now() - 7*864e5;
  const recent = log.filter(e=>e.t > weekAgo);

  // nach Regel gruppieren
  const byRule = {};
  log.forEach(e=>{ if(e.r){ (byRule[e.r] = byRule[e.r] || []).push(e); } });
  const rules = Object.keys(byRule).map(r=>({r, n:byRule[r].length,
      last:Math.max.apply(null, byRule[r].map(x=>x.t))}))
    .sort((a,b)=>b.n-a.n || b.last-a.last);

  const byCat = {};
  log.forEach(e=>{ byCat[e.c] = (byCat[e.c]||0)+1; });
  const topCat = Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a])[0];

  // Karten mit mindestens einem Fehler
  const shaky = Object.keys(S.cards).filter(k=>S.cards[k].w > 0)
    .sort((a,b)=>S.cards[b].w - S.cards[a].w);

  $("#pSub").innerHTML =
    '<div class="card">'+
      '<div class="eyebrow">Fehlerjournal</div>'+
      '<div class="grid2" style="margin-top:10px">'+
        '<div class="stat"><b>'+log.length+"</b><span>Einträge gesamt</span></div>"+
        '<div class="stat"><b>'+recent.length+"</b><span>in den letzten 7 Tagen</span></div>"+
        '<div class="stat"><b>'+shaky.length+"</b><span>wacklige Karten</span></div>"+
        (topCat&&CATS[topCat] ? '<div class="stat"><b style="font-size:18px;padding-top:5px">'+CATS[topCat].n+
          "</b><span>häufigster Bereich</span></div>" : "")+
      "</div>"+
      (shaky.length ? '<div class="row" style="margin-top:16px">'+
        '<button class="btn" id="jDrill">Nur meine Fehler üben ('+Math.min(shaky.length,15)+")</button>"+
        '<button class="btn ghost sm" id="jClear">Journal leeren</button></div>' : "")+
    "</div>"+
    (rules.length ?
    '<div class="card">'+
      '<div class="eyebrow">Deine häufigsten Stolpersteine</div>'+
      '<p class="tiny muted" style="margin:6px 0 12px">Sortiert nach Häufigkeit. Ab drei Treffern lohnt sich die Regel wirklich.</p>'+
      rules.slice(0,12).map(x=>{
        const rl = ruleById(x.r);
        const nm = rl ? rl.t : x.r;
        const cat = rl && CATS[rl.c] ? CATS[rl.c] : null;
        return '<div class="jrow'+(x.n>=3?" hot":"")+'">'+
          '<div class="jrow-h"><b>'+esc(nm)+"</b>"+
            '<span class="jn">'+x.n+"×</span></div>"+
          '<div class="jrow-a">'+
            (cat ? '<span class="tag '+cat.cls+'">'+cat.n+"</span>" : "")+
            '<button class="btn ghost sm" data-jr="'+x.r+'">Regel</button>'+
            '<button class="btn ghost sm" data-jp="'+x.r+'">Üben</button>'+
          "</div></div>";
      }).join("")+
    "</div>" : "")+
    '<div class="card">'+
      '<div class="eyebrow">Zuletzt danebengegriffen</div>'+
      '<div style="margin-top:10px">'+ log.slice(-14).reverse().map(e=>
        '<div class="jlast">'+
          (CATS[e.c] ? '<span class="tag '+CATS[e.c].cls+'">'+CATS[e.c].n+"</span>" : "")+
          "<span>"+esc(labelFor(e).slice(0,110))+"</span>"+
          '<span class="tiny muted">'+new Date(e.t).toLocaleDateString("de-DE",{day:"numeric",month:"short"})+"</span>"+
        "</div>").join("")+"</div>"+
    "</div>";

  const dr = $("#jDrill");
  if(dr) dr.onclick = ()=>{
    const r = rng(Date.now());
    const list = shaky.slice(0,15).map(k=>frageZuSchluessel(k, r)).filter(Boolean);
    if(!list.length){ toast("Keine übbaren Karten gefunden"); return; }
    startQuiz(shuffle(list,r), $("#pSub"), {title:"Meine Fehler"});
    window.scrollTo({top:0,behavior:"smooth"});
  };
  const cl = $("#jClear");
  if(cl) cl.onclick = ()=>{
    if(!confirm("Journal leeren? Die Lernkarten bleiben erhalten.")) return;
    S.log = []; save(); renderJournal(); toast("Journal geleert");
  };
  $$("[data-jr]").forEach(b => b.onclick = ()=>openRule(b.dataset.jr));
  $$("[data-jp]").forEach(b => b.onclick = ()=>{
    const items = ALL.filter(i=>i.r===b.dataset.jp);
    if(!items.length){ toast("Zu dieser Regel gibt es keine Aufgaben"); return; }
    const r = rng(Date.now());
    startQuiz(shuffle(items,r).map(exQuestion), $("#pSub"), {title:"Gezieltes Üben"});
    window.scrollTo({top:0,behavior:"smooth"});
  });
}

/* ---------- Einstufungstest ---------- */
const TESTCATS = ["komma","zeichen","gross","getrennt","recht","gram","satz","zahlen","stil","form"];
function testQuestions(){
  const out = [];
  TESTCATS.forEach(c=>{
    const pool = ALL.filter(i=>i.c===c);
    const step = Math.max(1, Math.floor(pool.length/3));
    for(let k=0;k<3 && k*step < pool.length;k++) out.push(pool[k*step]);
  });
  return out.map(exQuestion);
}

function startTest(host){
  const before = JSON.parse(JSON.stringify(S.cat || {}));
  const qs = testQuestions();
  startQuiz(qs, host, {title:"Einstufung", onDone:()=>{
    const lvl = {};
    TESTCATS.forEach(c=>{
      const a = before[c] || {c:0,w:0}, b = S.cat[c] || {c:0,w:0};
      const dc = b.c - a.c, dw = b.w - a.w, t = dc + dw;
      lvl[c] = t ? Math.round(dc/t*100) : 0;
    });
    S.level = lvl; S.levelDate = today(); save();
    PT.tab = "plan"; renderFortschritt();
  }});
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- Lernplan ---------- */
function planWeek(){
  if(!S.plan) return -1;
  const w = Math.floor(daysBetween(S.plan.start, today())/7) + (S.plan.shift||0);
  return Math.max(0, Math.min(w, S.plan.order.length));
}
function planFocus(){
  if(!S.plan) return null;
  const w = planWeek();
  return w < S.plan.order.length ? S.plan.order[w] : null;   // letzte Woche = gemischt
}
function makePlan(){
  const lvl = S.level || {};
  const order = TESTCATS.slice().sort((a,b)=>(lvl[a]??50)-(lvl[b]??50));
  S.plan = {start:today(), order, shift:0};
  save();
}

function renderPlan(){
  const host = $("#pSub");
  if(!S.level){
    host.innerHTML =
      '<div class="card">'+
        '<div class="eyebrow">Einstufung</div>'+
        "<h2>Wo stehst du gerade?</h2>"+
        '<p class="muted" style="margin-top:8px">30 Fragen quer durch alle zehn Bereiche, etwa zwölf Minuten. '+
        "Danach weißt du, wo du sicher bist und wo nicht — und die App baut daraus einen Wochenplan, "+
        "der die Tagesaufgabe auf dein jeweiliges Schwerpunktthema ausrichtet.</p>"+
        '<p class="tiny muted" style="margin-top:10px">Die Fragen zählen ganz normal in die Wiederholung ein — kein verlorener Aufwand.</p>'+
        '<div class="row" style="margin-top:16px"><button class="btn" id="tStart">Einstufung starten</button></div>'+
      "</div>";
    $("#tStart").onclick = ()=>startTest(host);
    return;
  }

  const lvl = S.level;
  const sorted = TESTCATS.slice().sort((a,b)=>lvl[a]-lvl[b]);
  const avg = Math.round(TESTCATS.reduce((s,c)=>s+lvl[c],0)/TESTCATS.length);
  let html =
    '<div class="card">'+
      '<div class="spread"><div class="eyebrow" style="margin:0">Einstufung vom '+
        new Date(S.levelDate+"T12:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"long"})+"</div>"+
        '<span class="pill xp">'+avg+" % im Schnitt</span></div>"+
      '<div style="margin-top:14px">'+ sorted.map(c=>{
        const p = lvl[c];
        const col = p>=80?"var(--acc)":p>=55?"var(--gold)":"var(--warn)";
        return '<div class="catrow"><div class="spread"><span>'+CATS[c].n+"</span>"+
          '<span class="tiny muted">'+p+" %</span></div>"+
          '<div class="bar"><i style="width:'+p+'%;background:'+col+'"></i></div></div>';
      }).join("")+"</div>"+
      '<div class="row" style="margin-top:14px"><button class="btn ghost sm" id="tRedo">Neu einstufen</button></div>'+
    "</div>";

  if(!S.plan){
    html +=
      '<div class="card">'+
        '<div class="eyebrow">Lernplan</div>'+
        "<h3>Ein Schwerpunkt pro Woche</h3>"+
        '<p class="muted small" style="margin-top:8px">Der Plan beginnt bei deinem schwächsten Bereich. '+
        "Solange er läuft, kommt die Hälfte der Tagesaufgabe aus dem Schwerpunkt der Woche — der Rest bleibt gemischt, damit nichts einrostet. Auch unterwegs wird neuer Stoff bevorzugt aus dem Schwerpunkt gezogen; Wiederholungen richten sich weiter nach ihrem Termin.</p>"+
        '<div class="row" style="margin-top:14px"><button class="btn" id="pMake">Plan erstellen</button></div>'+
      "</div>";
  } else {
    const w = planWeek(), foc = planFocus();
    html +=
      '<div class="card">'+
        '<div class="spread"><div class="eyebrow" style="margin:0">Lernplan</div>'+
        '<span class="tiny muted">gestartet am '+new Date(S.plan.start+"T12:00:00").toLocaleDateString("de-DE")+"</span></div>"+
        '<h3 style="margin-top:6px">'+(foc ? "Woche "+(w+1)+" von "+(S.plan.order.length+1)+" · "+CATS[foc].n
                                            : "Abschlusswoche · alles gemischt")+"</h3>"+
        '<div style="margin-top:14px">'+ S.plan.order.map((c,i)=>
          '<div class="pweek'+(i===w?" now":i<w?" past":"")+'">'+
            '<span class="pw-n">'+(i+1)+"</span>"+
            "<span>"+CATS[c].n+"</span>"+
            '<span class="tiny muted" style="margin-left:auto">'+(S.level[c])+" %</span>"+
          "</div>").join("")+
          '<div class="pweek'+(w>=S.plan.order.length?" now":"")+'">'+
            '<span class="pw-n">'+(S.plan.order.length+1)+"</span><span>Alles gemischt</span></div>"+
        "</div>"+
        '<div class="row" style="margin-top:16px">'+
          '<button class="btn" id="pTrain">Schwerpunkt üben</button>'+
          '<button class="btn ghost sm" id="pFwd">Woche weiter</button>'+
          '<button class="btn ghost sm" id="pBack">Woche zurück</button>'+
          '<button class="btn ghost sm" id="pDel">Plan beenden</button>'+
        "</div>"+
      "</div>";
  }
  host.innerHTML = html;

  $("#tRedo").onclick = ()=>{ if(confirm("Neu einstufen? Der bisherige Stand wird überschrieben.")){ S.level=null; save(); startTest(host); } };
  const mk = $("#pMake"); if(mk) mk.onclick = ()=>{ makePlan(); renderPlan(); renderHeute(); toast("Plan erstellt"); };
  const tr = $("#pTrain");
  if(tr) tr.onclick = ()=>{
    const foc = planFocus(); const r = rng(Date.now());
    const pool = foc ? ALL.filter(i=>i.c===foc) : ALL;
    startQuiz(shuffle(pool,r).slice(0,12).map(exQuestion), host, {title: foc?CATS[foc].n:"Gemischt"});
    window.scrollTo({top:0,behavior:"smooth"});
  };
  const fw = $("#pFwd"); if(fw) fw.onclick = ()=>{ S.plan.shift=(S.plan.shift||0)+1; save(); renderPlan(); renderHeute(); };
  const bw = $("#pBack"); if(bw) bw.onclick = ()=>{ S.plan.shift=(S.plan.shift||0)-1; save(); renderPlan(); renderHeute(); };
  const dl = $("#pDel"); if(dl) dl.onclick = ()=>{ if(confirm("Lernplan beenden?")){ S.plan=null; save(); renderPlan(); renderHeute(); } };
}

/* ---------- Fortschritt: Rahmen ---------- */
function renderFortschritt(){
  const host = $("#statHost");
  host.innerHTML =
    '<div class="subnav">'+
      '<button class="sub'+(PT.tab==="ueber"?" on":"")+'" data-t="ueber">Übersicht</button>'+
      '<button class="sub'+(PT.tab==="journal"?" on":"")+'" data-t="journal">Fehlerjournal</button>'+
      '<button class="sub'+(PT.tab==="plan"?" on":"")+'" data-t="plan">Einstufung &amp; Plan</button>'+
    "</div><div id='pSub'></div>";
  $$("#statHost .sub").forEach(b => b.onclick = ()=>{ PT.tab = b.dataset.t; renderFortschritt(); });
  if(PT.tab==="ueber") renderStats("#pSub");
  else if(PT.tab==="journal") renderJournal();
  else renderPlan();
}

/* ---------- Auswertung ---------- */
const FUELL = ["eigentlich","irgendwie","quasi","sozusagen","letztendlich","schlussendlich","halt",
  "durchaus","gewissermaßen","praktisch","natürlich","ja","doch","eben","wohl","relativ","ziemlich"];

function analyse(txt){
  const finds = [];
  CHECKS_ALL.forEach(c=>{
    for(const m of txt.matchAll(c.re)){
      if(m.index === undefined) continue;
      finds.push({c, s:m.index, e:m.index+m[0].length, txt:m[0]});
    }
  });
  finds.sort((a,b)=>a.s-b.s);

  const words = txt.trim() ? txt.trim().split(/\s+/) : [];
  const sents = txt.split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(x=>x.length>1);
  const sl = sents.map(s=>s.split(/\s+/).length);
  const lang = sl.filter(n=>n>25).length;
  const avg = sl.length ? Math.round(sl.reduce((a,b)=>a+b,0)/sl.length) : 0;
  const fuell = words.filter(x=>FUELL.includes(x.toLowerCase().replace(/[.,;:!?]/g,""))).length;
  const nom = (txt.match(/[a-zäöü]{3,}(ung|heit|keit|nis|ion)\b/gi)||[]).length;
  const pas = sents.filter(s=>/\b(wurde|wurden|wird|werden)\b[^.!?]*\b(ge[a-zäöüß]+t|ge[a-zäöüß]+en|[a-zäöüß]+iert)\b/i.test(s)).length;

  return {finds, m:{words:words.length, sents:sents.length, avg, lang, fuell, nom, pas,
    fuellQ: words.length ? Math.round(fuell/words.length*1000)/10 : 0,
    nomQ: words.length ? Math.round(nom/words.length*1000)/10 : 0,
    pasQ: sents.length ? Math.round(pas/sents.length*100) : 0}};
}

const SEVN = {hart:"Klarer Fehler", pruef:"Bitte prüfen", stil:"Stil", form:"Wirkung und Ton"};
let TC = {text:"", res:null, filter:""};

function renderCheck(){
  const host = $("#wSub");
  host.innerHTML =
    '<div class="card flat">'+
      '<div class="eyebrow">Textcheck</div>'+
      '<p class="small muted" style="margin-top:6px">Füg deinen Text ein — Mail, Hausarbeit, Nachricht. '+
      "Die Prüfung läuft komplett in deinem Browser: nichts wird hochgeladen.</p>"+
      '<p class="tiny muted" style="margin-top:8px"><b>Was sie kann und was nicht:</b> 78 Muster suchen nach bekannten Stolperstellen. An den eigenen Übungstexten dieser App erkennt sie rund <b>drei von vier</b> eingebauten Fehlern. Sie sieht keine Bedeutung: Ob ein Relativpronomen im richtigen Fall steht, ob ein Komma vor einem falsch geschriebenen Wort fehlt oder ob dein Argument trägt, kann sie nicht beurteilen. Sie ersetzt kein Gegenlesen — sie fängt die Muster ab, die man selbst überliest.</p>'+
    "</div>"+
    '<div class="card">'+
      '<div class="spread" style="margin-bottom:10px"><div class="eyebrow" style="margin:0">Dein Text</div>'+
      '<span class="tiny muted" id="tcw">0 Wörter</span></div>'+
      '<textarea class="write" id="tcArea" style="min-height:200px;font-family:inherit;font-size:15px;line-height:1.7" '+
        'placeholder="Text hier einfügen …"></textarea>'+
      '<div class="row" style="margin-top:12px">'+
        '<button class="btn" id="tcGo">Prüfen</button>'+
        '<button class="btn ghost sm" id="tcDemo">Beispieltext einsetzen</button>'+
        '<button class="btn ghost sm" id="tcClear">Leeren</button>'+
      "</div>"+
    "</div>"+
    '<div id="tcRes"></div>';

  const ta = $("#tcArea");
  ta.value = TC.text || "";
  const cnt = ()=>{ const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    $("#tcw").textContent = n + (n===1?" Wort":" Wörter"); };
  cnt();
  ta.addEventListener("input", ()=>{ cnt(); TC.text = ta.value; });
  $("#tcGo").onclick = ()=>{ TC.text = ta.value; TC.res = analyse(ta.value); TC.filter=""; drawCheck(); };
  $("#tcClear").onclick = ()=>{ ta.value=""; TC.text=""; TC.res=null; cnt(); $("#tcRes").innerHTML=""; };
  $("#tcDemo").onclick = ()=>{
    ta.value = "Sehr geehrte Frau Weber, Vielen Dank für Ihre Nachricht. Ich wollte fragen ob ich die Arbeit "+
      "später abgeben darf. Wegen dem Zeitplan wäre mir das eigentlich sehr wichtig. Es gibt da nämlich eine "+
      "Verzögerung, die ich leider nicht beeinflussen konnte, weil ich hab die Daten erst später bekommen. "+
      "Ich habe mit dem Kollege gesprochen und er meinte, das die Auswertung Ende August vorliegt. "+
      "Das würde bedeuten, dass ich schneller wie geplant arbeiten würde müssen. "+
      "Danke im Voraus für Ihre Mühe. Mit freundlichen Grüssen, Nils";
    TC.text = ta.value; cnt(); TC.res = analyse(ta.value); TC.filter=""; drawCheck();
  };
  if(TC.res) drawCheck();
}

function drawCheck(){
  const {finds, m} = TC.res;
  const byS = {hart:[],pruef:[],stil:[],form:[]};
  finds.forEach(f=>byS[f.c.sev].push(f));
  const shown = TC.filter ? finds.filter(f=>f.c.sev===TC.filter) : finds;

  // Text mit Markierungen — überlappende Treffer werden zusammengefasst
  const marks = shown.slice().sort((a,b)=>a.s-b.s);
  let out = "", pos = 0;
  marks.forEach((f,i)=>{
    if(f.s < pos) return;
    out += esc(TC.text.slice(pos, f.s));
    out += '<mark class="mk mk-'+f.c.sev+'" data-f="'+i+'">'+esc(TC.text.slice(f.s, f.e))+"</mark>";
    pos = f.e;
  });
  out += esc(TC.text.slice(pos));

  // Journalabgleich
  const log = S.log || [];
  const known = {};
  log.forEach(e=>{ if(e.r) known[e.r] = (known[e.r]||0)+1; });

  const card = (sev)=>{
    const list = byS[sev];
    if(!list.length) return "";
    const seen = {};
    return '<div class="card">'+
      '<div class="spread"><div class="eyebrow" style="margin:0">'+SEVN[sev]+"</div>"+
      '<span class="kb '+(sev==="hart"?"kb-gen":sev==="pruef"?"kb-mix":"kb-dat")+'">'+list.length+"</span></div>"+
      '<div style="margin-top:10px">'+ list.map(f=>{
        const k = f.c.id + "|" + f.txt;
        if(seen[k]) return "";
        seen[k] = 1;
        const n = list.filter(x=>x.c.id===f.c.id && x.txt===f.txt).length;
        const rl = ruleById(f.c.r);
        const kn = known[f.c.r];
        return '<div class="fnd f-'+sev+'">'+
          '<div class="fnd-h"><b>'+esc(f.c.t)+"</b>"+
            (n>1?'<span class="jn">'+n+"×</span>":"")+
            (kn?'<span class="jn hot" title="Steht schon in deinem Fehlerjournal">Journal '+kn+"×</span>":"")+
          "</div>"+
          '<div class="fnd-q">„'+esc(f.txt.length>70?f.txt.slice(0,70)+"…":f.txt)+"“</div>"+
          '<div class="fnd-b">'+f.c.k+
            (rl?' <a href="#" data-crule="'+f.c.r+'">→ '+esc(rl.t)+"</a>":"")+"</div>"+
        "</div>";
      }).join("")+"</div></div>";
  };

  const q = (v,g,w)=> v<=g ? "kb-dat" : v<=w ? "kb-mix" : "kb-gen";
  $("#tcRes").innerHTML =
    '<div class="card">'+
      '<div class="spread"><div class="eyebrow" style="margin:0">Ergebnis</div>'+
        '<span class="pill '+(byS.hart.length?"flame":"xp")+'">'+finds.length+
        (finds.length===1?" Fundstelle":" Fundstellen")+"</span></div>"+
      '<div class="grid2" style="margin-top:12px">'+
        '<div class="stat"><b>'+m.words+"</b><span>Wörter, "+m.sents+" Sätze</span></div>"+
        '<div class="stat"><b>'+m.avg+"</b><span>Wörter je Satz</span></div>"+
        '<div class="stat"><b>'+m.lang+"</b><span>Sätze über 25 Wörter</span></div>"+
        '<div class="stat"><b>'+m.fuellQ+" %</b><span>Füllwörter</span></div>"+
        '<div class="stat"><b>'+m.nomQ+" %</b><span>Wörter auf -ung/-heit/-keit</span></div>"+
        '<div class="stat"><b>'+m.pasQ+" %</b><span>Sätze im Passiv</span></div>"+
      "</div>"+
      '<p class="tiny muted" style="margin-top:10px">Orientierung: Ø-Satzlänge 12–18 Wörter · Füllwörter unter 1,5 % · Passiv unter 25 %. '+
      "Das sind Richtwerte, keine Grenzen — Fachtexte liegen naturgemäß höher.</p>"+
      '<div class="row" style="margin-top:14px" id="tcFilter">'+
        '<button class="chip'+(TC.filter===""?" on":"")+'" data-s="">Alle ('+finds.length+")</button>"+
        ["hart","pruef","stil","form"].filter(s=>byS[s].length).map(s=>
          '<button class="chip'+(TC.filter===s?" on":"")+'" data-s="'+s+'">'+SEVN[s]+" ("+byS[s].length+")</button>").join("")+
      "</div>"+
    "</div>"+
    (TC.text.trim() ? '<div class="card"><div class="eyebrow">Dein Text mit Markierungen</div>'+
      '<div class="tctext">'+out.replace(/\n/g,"<br>")+"</div></div>" : "")+
    (finds.length ? ["hart","pruef","stil","form"].filter(s=>!TC.filter||TC.filter===s).map(card).join("")
      : '<div class="card center" style="padding:34px"><div style="font-size:34px;line-height:1">◆</div>'+
        '<h3 style="margin-top:8px">Keine Muster gefunden</h3>'+
        '<p class="muted small" style="margin-top:6px">Die Prüfung erkennt bekannte Muster — sie ersetzt kein Gegenlesen.</p></div>');

  $$("#tcFilter .chip").forEach(b => b.onclick = ()=>{ TC.filter = b.dataset.s; drawCheck(); });
  $$("[data-crule]").forEach(a => a.onclick = e=>{ e.preventDefault(); openRule(a.dataset.crule); });
}

    go:()=>openRule(r.id)}));
  CASEREF.forEach(e=>ix.push({k:"Fall", t:e.w, sub:e.k, s:e.k+" "+e.ex+" "+(e.n||""), c:"gram",
    go:()=>{ ST.tab="faelle"; ST.typ=""; ST.kas=""; ST.nurFallen=false; go("saetze");
      const si=$("#crSearch"); if(si){ si.value=e.w; si.dispatchEvent(new Event("input")); } }}));
  SATZ.forEach(x=>ix.push({k:"Satzbau", t:x.t, sub:x.short, s:strip(x.b), c:"satz",
    go:()=>{ ST.tab="bau"; go("saetze");
      const el=$("#sa-"+x.id); if(el){ el.classList.add("open"); el.scrollIntoView({behavior:"smooth",block:"center"}); } }}));
  TABLES.forEach(x=>ix.push({k:"Tabelle", t:x.t, s:strip(x.b), c:"gram",
    go:()=>{ ST.tab="tab"; go("saetze"); }}));
  PHRASES.forEach(p=>ix.push({k:"Baustein", t:p.f, sub:p.g, c:"form",
    s:p.g+" "+p.tip+" "+["f","n","l"].map(k=>p.lv[k].join(" ")).join(" ")+" "+(p.no||[]).join(" "),
    go:()=>{ FT.tab="bausteine"; FT.grp=""; FT.ctx=""; go("formulieren");
      openPhraseAcc(p.id); }}));
  WORDS.forEach(w=>ix.push({k:"Wort", t:w.w, sub:w.p, s:w.d+" "+w.ex+" "+(w.s||""), c:"wort",
    go:()=>{ go("karten"); const si=$("#wSearch"); if(si){ si.value=w.w; si.dispatchEvent(new Event("input")); } }}));
  ALL.forEach(i=>ix.push({k:"Übung", t:strip(i.q).slice(0,80), s:strip(i.e), c:i.c,
    go:()=>{ go("heute"); startQuiz([exQuestion(i)], $("#dailyHost"), {title:CATS[i.c].n}); }}));
  KORREKTUR.forEach(t=>ix.push({k:"Korrekturtext", t:t.t, sub:t.ctx, s:t.txt, c:"komma",
    go:()=>{ WT.tab="korrektur"; go("schreiben"); renderSchreiben(); openKorr(t.id); }}));
  PROMPTS.forEach(p=>ix.push({k:"Schreibimpuls", t:p.t, sub:p.k, s:strip(p.p)+" "+p.tip, c:"stil",
    go:()=>{ WT.tab="impulse"; go("schreiben"); renderSchreiben(); openPrompt(p.id); }}));
  SCENES.forEach(x=>ix.push({k:"Situation", t:x.t, sub:CTXN[x.ctx], s:x.s+" "+x.ask, c:"form",
    go:()=>{ FT.tab="szenen"; go("formulieren"); openScene(x.id); }}));
  PAIRS.forEach(p=>ix.push({k:"Vorher/Nachher", t:p.bad.slice(0,70), s:p.why+" "+p.good, c:"form",
    go:()=>{ FT.tab="paare"; FT.pairs=null; go("formulieren");
      FT.pairs = PAIRS.slice(); FT.pi = PAIRS.indexOf(p); FT.shown=false; renderPaare(); }}));
  ix.forEach(e=>{ e.tn = norm(e.t); e.sn = norm(e.s||""); e.subn = norm(e.sub||""); });
  return ix;
}

/* ---------- Suchfenster ---------- */
function openSearch(){
  if(!INDEX) INDEX = buildIndex();
  let box = $("#srchWrap");
  if(!box){
    box = document.createElement("div");
    box.id = "srchWrap";
    box.innerHTML =
      '<div class="srch-bd" id="srchBd"></div>'+
      '<div class="srch">'+
        '<input id="srchIn" placeholder="Alles durchsuchen — Regeln, Fälle, Bausteine, Wörter, Übungen …" autocomplete="off">'+
        '<div id="srchOut" class="srch-out"></div>'+
        '<div class="srch-ft kbd">Enter öffnet den ersten Treffer · Esc schließt</div>'+
      "</div>";
    document.body.appendChild(box);
    $("#srchBd").onclick = closeSearch;
    $("#srchIn").addEventListener("input", deb(drawSearch, 90));
    $("#srchIn").addEventListener("keydown", e=>{
      if(e.key === "Escape") closeSearch();
      if(e.key === "Enter"){ const f = $("#srchOut .sres"); if(f) f.click(); }
    });
  }
  box.classList.add("on");
  $("#srchIn").value = "";
  drawSearch();
  setTimeout(()=>$("#srchIn").focus(), 30);
}
function closeSearch(){ const b = $("#srchWrap"); if(b) b.classList.remove("on"); }

function drawSearch(){
  const q = norm($("#srchIn").value);
  const out = $("#srchOut");
  if(q.length < 2){
    out.innerHTML = '<div class="srch-hint">Mindestens zwei Zeichen. Durchsucht werden '+
      INDEX.length+" Einträge aus allen Bereichen.</div>";
    return;
  }
  const scored = [];
  INDEX.forEach(e=>{
    let sc = 0;
    if(e.tn === q) sc = 100;
    else if(e.tn.startsWith(q)) sc = 80;
    else if(e.tn.includes(q)) sc = 60;
    else if(e.subn.includes(q)) sc = 40;
    else if(e.sn.includes(q)) sc = 20;
    if(sc) scored.push({e, sc});
  });
  scored.sort((a,b)=>b.sc-a.sc);
  if(!scored.length){
    out.innerHTML = '<div class="srch-hint">Kein Treffer für „'+esc($("#srchIn").value)+"“.</div>";
    return;
  }
  const top = scored.slice(0,40);
  out.innerHTML = top.map((x,i)=>{
    const e = x.e;
    return '<button class="sres" data-i="'+i+'">'+
      '<span class="sres-k">'+e.k+"</span>"+
      '<span class="sres-t">'+esc(e.t)+"</span>"+
      (e.sub ? '<span class="sres-s">'+esc(e.sub)+"</span>" : "")+
    "</button>";
  }).join("") + (scored.length>40 ? '<div class="srch-hint">… und '+(scored.length-40)+" weitere.</div>" : "");
  $$("#srchOut .sres").forEach(b => b.onclick = ()=>{
    closeSearch();
    try{ top[+b.dataset.i].e.go(); }catch(err){ toast("Konnte nicht springen"); }
  });
}

function renderRegelnNav(){
  const nav = $("#rNav");
  nav.innerHTML =
    '<button class="sub'+(RT.tab==="regeln"?" on":"")+'" data-t="regeln">Regelwerk</button>'+
    '<button class="sub'+(RT.tab==="cheat"?" on":"")+'" data-t="cheat">Spickzettel</button>';
  $$("#rNav .sub").forEach(b => b.onclick = ()=>{ RT.tab = b.dataset.t; renderRegelnNav(); });
  const cheat = RT.tab === "cheat";
  $("#rRules").classList.toggle("hidden", cheat);
  $("#cheatHost").classList.toggle("hidden", !cheat);
  document.body.classList.toggle("cheat-on", cheat);
  if(cheat && !$("#cheatHost").dataset.done){
    $("#cheatHost").innerHTML =
      '<div class="card noprint" style="margin-bottom:16px">'+
        '<div class="eyebrow">Spickzettel</div>'+
        '<p class="small muted" style="margin-top:6px">Alles Wichtige auf wenigen Seiten. '+
        "Über „Drucken“ kannst du ihn auch als PDF sichern — im Druckdialog „Als PDF sichern“ wählen.</p>"+
        '<div class="row" style="margin-top:12px"><button class="btn" id="chPrint">Drucken / als PDF sichern</button></div>'+
      "</div>" + cheatHTML();
    $("#cheatHost").dataset.done = "1";
    $("#chPrint").onclick = ()=>window.print();
  }
}

/* ============================================================
   RAHMEN
   ============================================================ */
function go(v){
  $$(".tab").forEach(t=>t.classList.toggle("on", t.dataset.v===v));
  $$(".view").forEach(s=>s.classList.toggle("on", s.id==="v-"+v));
  const busy = Q && !Q.done && Q.host === $("#dailyHost");
  if(v==="heute" && !busy) renderHeute();
  if(v==="regeln") ensureRules();
  if(v==="karten") renderCards();
  if(v==="formulieren") renderForm();
  if(v==="saetze") renderSatz();
  if(v==="schreiben" && !$("#wArea") && !$("#ktText")) renderSchreiben();
  if(v==="fortschritt") renderFortschritt();
  window.scrollTo({top:0,behavior:"instant"});
}
function updHud(){
  $("#hudStreak").textContent = "🔥 " + S.streak;
  $("#hudXp").textContent = S.xp + " XP";
}
function renderAll(){
  renderHeute(); renderSchreiben(); renderRegelnNav(); updHud();
}

/* ---------- Web-App-Auszeichnung ----------
   Die App ist eine einzelne Datei ohne Server. Ein Manifest als eigene Datei würde das
   brechen, und ein data:-Manifest kann start_url nicht auflösen. Deshalb wird es zur
   Laufzeit als Blob gebaut: Dessen URL hat denselben Ursprung wie die Seite, also lässt
   sich start_url relativ auflösen. Vom Dateisystem aus (file:) ist nichts installierbar,
   dort passiert bewusst nichts. Die Auszeichnung ist Beiwerk — sie darf die App unter
   keinen Umständen aufhalten, deshalb steht alles in einem try. */
const APP_FARBE = {light:"#f7f5f1", dark:"#14171a"};
function themeFarbe(){
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", APP_FARBE[S.theme === "dark" ? "dark" : "light"]);
}
function webApp(){
  try{
    const icon = document.querySelector('link[rel="apple-touch-icon"]');
    if(!icon) return;
    /* Das Symbol für den Browser-Tab aus demselben Bild, statt es zweimal einzubetten. */
    if(!document.querySelector('link[rel="icon"]')){
      const f = document.createElement("link");
      f.rel = "icon"; f.type = "image/png"; f.href = icon.href;
      document.head.appendChild(f);
    }
    if(!/^https?:$/.test(location.protocol)) return;
    const manifest = {
      name:"Deutsch-Trainer", short_name:"Deutsch", lang:"de", dir:"ltr",
      description:"Persönlicher Deutsch-Trainer: Rechtschreibung, Zeichensetzung, Kasus, Satzbau, Stil.",
      start_url:location.pathname, scope:location.pathname,
      display:"standalone", orientation:"portrait-primary",
      background_color:APP_FARBE.light,
      theme_color:APP_FARBE[S.theme === "dark" ? "dark" : "light"],
      icons:[{src:icon.href, sizes:"512x512", type:"image/png", purpose:"any maskable"}]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"}));
    const l = document.createElement("link");
    l.rel = "manifest"; l.href = url;
    document.head.appendChild(l);
  }catch(e){}
}

/* Start */
document.documentElement.setAttribute("data-theme", S.theme || "light");
themeFarbe();
webApp();
$("#themeBtn").onclick = ()=>{
  S.theme = (S.theme === "dark") ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", S.theme);
  themeFarbe();
  save();
};
$("#dateLbl").textContent = new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
$$(".tab").forEach(t => t.onclick = ()=>go(t.dataset.v));
$("#searchBtn").onclick = openSearch;
document.addEventListener("keydown", e=>{
  const ae = document.activeElement;
  const typing = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA");
  if(e.key === "Escape"){ closeSearch(); return; }
  if(!typing && (e.key === "/" || ((e.metaKey||e.ctrlKey) && e.key === "k"))){
    e.preventDefault(); openSearch(); return;
  }
  if(!Q || !$("#fbHost")) return;
  const act = document.activeElement;
  if(act && act.tagName === "TEXTAREA") return;
  if(e.key === "Enter" && $("#nextBtn")){ e.preventDefault(); next(); return; }
  if(act && act.tagName === "INPUT") return;
  const n = "1234".indexOf(e.key);
  if(n >= 0){ const b = $$(".opt")[n]; if(b && !b.disabled) b.click(); }
});
renderAll();

/* Eine unterbrochene Runde nicht verlieren */
(function(){ if(sitzungOffen()){ go("karten"); } })();

/* Serie zurücksetzen, wenn ein Tag ausgelassen wurde */
(function(){
  if(S.last && daysBetween(S.last, today()) > 1 && S.streak > 0){
    S.streak = 0; save(); updHud(); renderHeute();
  }
})();
</script>
