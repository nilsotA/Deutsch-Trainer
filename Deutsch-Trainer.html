<style>
:root{
  --bg:#f7f5f1; --bg2:#fffefb; --card:#ffffff; --ink:#1c1f1d; --ink2:#5a615c;
  --ink3:#8b918c; --line:#e4e0d8; --line2:#f0ede6;
  --acc:#2f6b52; --acc-soft:#e6f0ea; --acc-ink:#1f4a39;
  --warn:#b4501e; --warn-soft:#fbeee7;
  --bad:#a8362f; --bad-soft:#fbeceb;
  --gold:#a97b1e; --gold-soft:#fbf3e2;
  --blue:#2f5578; --blue-soft:#e8eef5;
  --pur:#5b4a80; --pur-soft:#ece8f3;
  --teal:#1f6b6b; --teal-soft:#e2f0ef;
  --r:14px; --shadow:0 1px 2px rgba(28,31,29,.05),0 4px 16px rgba(28,31,29,.05);
}
[data-theme="dark"]{
  --bg:#14171a; --bg2:#1a1e22; --card:#1e2328; --ink:#e9ecea; --ink2:#a3aba6;
  --ink3:#767e79; --line:#2c3339; --line2:#242a2f;
  --acc:#63b18c; --acc-soft:#1c2f26; --acc-ink:#9ad6b6;
  --warn:#d98b52; --warn-soft:#2e2219;
  --bad:#e0827a; --bad-soft:#2e1d1c;
  --gold:#d6ac5c; --gold-soft:#2c2519;
  --blue:#7ba7d4; --blue-soft:#1b242e;
  --pur:#a894d6; --pur-soft:#231e30;
  --teal:#6fc0bd; --teal-soft:#152826;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:650;letter-spacing:-.01em}
p{margin:0 0 .8em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;
  /* In Querlage schneidet die Notch seitlich ins Bild. */
  padding:0 calc(18px + env(safe-area-inset-right)) 80px calc(18px + env(safe-area-inset-left))}

/* ---------- Kopf ---------- */
.head{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);
  /* Im installierten Zustand liegt die Statusleiste über der Seite. */
  padding-top:env(safe-area-inset-top)}
.head-in{max-width:820px;margin:0 auto;padding:14px 18px 0;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto;min-width:0}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:flex;gap:7px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.pill.flame{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.pill.xp{background:var(--acc-soft);border-color:transparent;color:var(--acc-ink)}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;font-size:15px}
.iconbtn:hover{border-color:var(--ink3)}

.tabs{max-width:820px;margin:0 auto;padding:10px 18px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 13px 11px;font-size:14.5px;font-weight:550;color:var(--ink2);border-bottom:2.5px solid transparent;
  white-space:nowrap;border-radius:8px 8px 0 0}
.tab:hover{color:var(--ink);background:var(--line2)}
.tab.on{color:var(--acc-ink);border-bottom-color:var(--acc);background:none}

/* ---------- Bausteine ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
.card.flat{box-shadow:none}
.view{display:none;padding-top:22px;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.tiny{font-size:12.5px}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
hr.sep{border:0;border-top:1px solid var(--line2);margin:18px 0}

.btn{padding:11px 20px;border-radius:11px;background:var(--acc);color:#fff;font-weight:620;font-size:15px;
  transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink3);filter:none}
.btn.sm{padding:7px 14px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}

.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:13.5px;font-weight:550;color:var(--ink2)}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}

.bar{height:7px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.bar.stapel{display:flex}
.bar.stapel>i{border-radius:0}

.tag{display:inline-block;padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:650;letter-spacing:.02em}
.t-komma{background:var(--blue-soft);color:var(--blue)}
.t-gross{background:var(--gold-soft);color:var(--gold)}
.t-getrennt{background:var(--warn-soft);color:var(--warn)}
.t-recht{background:var(--bad-soft);color:var(--bad)}
.t-gram{background:var(--acc-soft);color:var(--acc-ink)}
.t-stil{background:var(--line2);color:var(--ink2)}
.t-wort{background:var(--blue-soft);color:var(--blue)}
.t-zeichen{background:var(--pur-soft);color:var(--pur)}
.t-zahlen{background:var(--teal-soft);color:var(--teal)}

/* ---------- Quiz ---------- */
.qtext{font-size:20px;line-height:1.5;font-weight:500;margin:14px 0 20px;letter-spacing:-.005em}
.qtext em{font-style:normal;background:var(--gold-soft);color:var(--gold);padding:1px 5px;border-radius:5px;font-weight:650}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg2);font-size:16px;line-height:1.45;transition:border-color .12s,background .12s;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--acc-soft)}
.opt .k{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:var(--line2);color:var(--ink2);
  font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
.opt.right{border-color:var(--acc);background:var(--acc-soft)}
.opt.right .k{background:var(--acc);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;opacity:1}
.opt.dim{opacity:.5}

.fillbox{display:flex;gap:9px;flex-wrap:wrap}
.fillbox input{flex:1;min-width:200px;padding:13px 15px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--bg2);font-size:16px}
.fillbox input:focus{outline:none;border-color:var(--acc)}

.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:3.5px solid var(--acc);background:var(--acc-soft);font-size:14.5px;line-height:1.6}
.fb.no{border-left-color:var(--bad);background:var(--bad-soft)}
.fb b.hd{display:block;font-size:13px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:5px}
.fb .lnk{margin-top:9px;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:inherit;display:inline-block}

/* ---------- Regeln ---------- */
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:9px;background:var(--card)}
.acc>button{width:100%;text-align:left;padding:14px 17px;display:flex;align-items:center;gap:11px;font-weight:600;font-size:15.5px}
.acc>button:hover{background:var(--line2)}
.acc>button .ar{margin-left:auto;color:var(--ink3);font-size:13px;transition:transform .18s}
.acc.open>button .ar{transform:rotate(90deg)}
.acc .body{display:none;padding:2px 17px 18px;font-size:14.5px;line-height:1.65;color:var(--ink2)}
.acc.open .body{display:block}
.acc .body ul{margin:.5em 0;padding-left:1.15em}
.acc .body li{margin:.3em 0}
.acc .body code{background:var(--line2);padding:2px 6px;border-radius:5px;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
.acc .body .ex{background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:11px 13px;margin:.6em 0;color:var(--ink)}
.ok{color:var(--acc-ink);font-weight:650}
.nope{color:var(--bad);font-weight:650}
/* Dritte Stufe neben ok und nope: nicht standardsprachlich, aber auch nicht falsch.
   Grundsatz 4 verlangt, Regionales und Umgangssprachliches einzuordnen statt abzustempeln —
   dafür fehlte bis dahin die Auszeichnung, also stand beides in Rot. */
.ugs{color:var(--warn);font-weight:650}
.search{width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px;margin-bottom:16px}
.search:focus{outline:none;border-color:var(--acc)}

/* ---------- Schreiben ---------- */
textarea.write{width:100%;min-height:290px;padding:18px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg2);font-size:16px;line-height:1.75;resize:vertical;font-family:Georgia,"Iowan Old Style",serif}
textarea.write:focus{outline:none;border-color:var(--acc)}
.crit{list-style:none;padding:0;margin:0}
.crit li{padding:9px 0 9px 30px;position:relative;border-bottom:1px solid var(--line2);font-size:14.5px;cursor:pointer}
.crit li:last-child{border:0}
.crit li::before{content:"";position:absolute;left:0;top:11px;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line)}
.crit li.tick::before{content:"✓";background:var(--acc);border-color:var(--acc);color:#fff;font-size:12px;
  display:grid;place-items:center;line-height:1}
.model{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:18px;
  font-family:Georgia,"Iowan Old Style",serif;font-size:15.5px;line-height:1.8}
.hidden{display:none}

/* ---------- Statistik ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px}
.stat{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:12.5px;color:var(--ink3);font-weight:550}
.catrow{margin:13px 0}
.catrow .spread{margin-bottom:6px;font-size:14px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.dot{width:13px;height:13px;border-radius:4px;background:var(--line2)}
.dot.f1{background:#cfe3d8}.dot.f2{background:#a8ceb9}.dot.f3{background:#7bb595}.dot.f4{background:#4f9772}.dot.f5{background:var(--acc)}
[data-theme="dark"] .dot.f1{background:#24382d}[data-theme="dark"] .dot.f2{background:#2f5342}
[data-theme="dark"] .dot.f3{background:#3d7357}[data-theme="dark"] .dot.f4{background:#4f9772}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);z-index:99;
  background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:11px;font-size:14.5px;font-weight:600;
  box-shadow:0 8px 30px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.2,1.2,.4,1);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ---------- Formulieren ---------- */
.t-form{background:var(--acc-soft);color:var(--acc-ink)}
.subnav{display:flex;gap:4px;background:var(--line2);padding:4px;border-radius:12px;margin-bottom:18px}
.sub{flex:1;padding:9px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.sub:hover{color:var(--ink)}
.sub.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(28,31,29,.09)}
[data-theme="dark"] .sub.on{box-shadow:0 1px 3px rgba(0,0,0,.35)}
.reg{display:inline-flex;gap:3px;background:var(--line2);padding:3px;border-radius:9px;margin:4px 0 14px}
.regbtn{padding:5px 13px;border-radius:7px;font-size:12.5px;font-weight:650;color:var(--ink3)}
.regbtn:hover{color:var(--ink)}
.regbtn.on{background:var(--card);color:var(--acc-ink)}
.phlist{display:flex;flex-direction:column;gap:8px}
.phr{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;
  background:var(--bg2);border:1px solid var(--line2);font-size:15px;line-height:1.55;color:var(--ink)}
.phr>span{flex:1}
.cp{flex:0 0 auto;font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:7px;
  border:1px solid var(--line);color:var(--ink3);background:var(--card);white-space:nowrap}
.cp:hover{border-color:var(--acc);color:var(--acc-ink)}
.cp.done{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-ink)}
.nono{margin-top:16px;padding:14px 16px;border-radius:11px;background:var(--bad-soft);
  border-left:3px solid var(--bad);font-size:14px;line-height:1.6}
.nono b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--bad);margin-bottom:5px}
.nono ul{margin:0;padding-left:1.1em}
.nono li{margin:.35em 0}
.quote{position:relative;padding:16px 18px;border-radius:12px;font-size:16.5px;line-height:1.6;
  font-family:Georgia,"Iowan Old Style",serif}
.quote.bad{background:var(--bad-soft);border-left:3px solid var(--bad)}
.quote.good{background:var(--acc-soft);border-left:3px solid var(--acc)}
.quote .cp{position:absolute;right:10px;bottom:10px;font-family:inherit}
@media(max-width:600px){.sub{font-size:12.5px;padding:8px 6px}.phr{flex-direction:column;gap:8px}.cp{align-self:flex-start}}

/* ---------- Sätze ---------- */
.t-satz{background:var(--warn-soft);color:var(--warn)}
.satz{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:13px 15px;
  margin:.6em 0;font-size:15.5px;line-height:2.1;color:var(--ink)}
.satz .pos{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;
  background:var(--line2);color:var(--ink3);font-size:10.5px;font-weight:700;vertical-align:middle;margin-right:3px}
.satz .pos.v{background:var(--acc);color:#fff}
.satz .rest{color:var(--ink2)}
.satz .tag2{display:inline-block;padding:2px 8px;margin:0 2px;border-radius:6px;
  background:var(--acc-soft);color:var(--acc-ink);font-size:14px;font-weight:600}
table.dt{width:100%;border-collapse:collapse;margin:.7em 0;font-size:13.5px}
table.dt th,table.dt td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line2)}
table.dt thead th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);
  border-bottom:1.5px solid var(--line);font-weight:700}
table.dt tbody th{color:var(--ink3);font-weight:650;font-size:12.5px;white-space:nowrap}
table.dt td{color:var(--ink)}
table.dt td.hl{background:var(--gold-soft);color:var(--gold);font-weight:650;border-radius:4px}
.crow{padding:12px 18px;border-bottom:1px solid var(--line2)}
.crow:last-child{border-bottom:0}
.crow.warn{background:var(--warn-soft)}
.crow-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.crow-h b{font-size:15.5px}
.crow-e{font-size:14px;color:var(--ink2);margin-top:4px;font-family:Georgia,"Iowan Old Style",serif}
.crow-n{font-size:12.8px;color:var(--ink3);margin-top:5px;line-height:1.5}
.crow.warn .crow-n{color:var(--warn)}
.kb{padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap;max-width:100%;overflow-wrap:anywhere}
.kb-akk{background:var(--blue-soft);color:var(--blue)}
.kb-dat{background:var(--acc-soft);color:var(--acc-ink)}
.kb-gen{background:var(--gold-soft);color:var(--gold)}
.kb-mix{background:var(--warn-soft);color:var(--warn)}
.rotd{font-size:14.5px;line-height:1.6;color:var(--ink2)}
.rotd p:first-child{margin-top:8px}
.rotd .ex,.rotd .satz{font-size:14px}
@media(max-width:600px){table.dt{font-size:12px}table.dt th,table.dt td{padding:6px 5px}
  .crow{padding:11px 14px}.satz{font-size:14.5px;line-height:2}}

/* ---------- Fehlersuche ---------- */
.korrtext{margin-top:16px;padding:20px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);
  font-family:Georgia,"Iowan Old Style",serif;font-size:17px;line-height:2.15;color:var(--ink)}
.tok{padding:2px 3px;border-radius:5px;cursor:pointer;transition:background .1s,box-shadow .1s}
.tok:hover{background:var(--line2)}
.tok.sel{background:var(--gold-soft);box-shadow:inset 0 -2px 0 var(--gold);color:var(--gold);font-weight:600}
.tok.hit{background:var(--acc-soft);box-shadow:inset 0 -2px 0 var(--acc);color:var(--acc-ink);font-weight:600;cursor:default}
.tok.miss{background:var(--bad-soft);box-shadow:inset 0 -2px 0 var(--bad);color:var(--bad);font-weight:600;cursor:default}
.tok.fp{background:var(--warn-soft);box-shadow:inset 0 -2px 0 var(--warn);color:var(--warn);cursor:default}
.kerr{padding:12px 0;border-bottom:1px solid var(--line2)}
.kerr:last-child{border-bottom:0}
.kerr-h{display:flex;align-items:center;gap:7px;font-size:15px;color:var(--bad);flex-wrap:wrap}
.kerr.ok .kerr-h{color:var(--acc-ink)}
.kerr-b{font-size:13.8px;color:var(--ink2);line-height:1.6;margin-top:5px}
.kerr-b a{color:var(--acc-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
/* ---------- Journal ---------- */
.jrow{padding:12px 0;border-bottom:1px solid var(--line2)}
.jrow:last-child{border-bottom:0}
.jrow-h{display:flex;align-items:center;gap:10px;font-size:15px}
.jrow-h b{flex:1}
.jn{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--line2);color:var(--ink2)}
.jrow.hot .jn{background:var(--bad-soft);color:var(--bad)}
.jrow-a{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
.jlast{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px;color:var(--ink2)}
.jlast:last-child{border-bottom:0}
.jlast>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- Lernplan ---------- */
.pweek{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;margin-bottom:5px;
  font-size:14.5px;background:var(--bg2);border:1px solid var(--line2);color:var(--ink2)}
.pweek.past{opacity:.5}
.pweek.now{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-ink);font-weight:650}
.pw-n{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--line2);
  font-size:11.5px;font-weight:700;color:var(--ink3);flex:0 0 auto}
.pweek.now .pw-n{background:var(--acc);color:#fff}
/* ---------- Unterwegs-Modus ---------- */
body.walk .head{position:static}
body.walk .tabs{display:none}
body.walk .wrap{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
body.walk .card{padding:20px 16px;border-radius:14px}
body.walk .qtext{font-size:26px;line-height:1.45;font-weight:550;margin:16px 0 22px}
body.walk .opt{padding:22px 18px;font-size:20px;line-height:1.4;border-width:2px;border-radius:14px;min-height:76px;align-items:center}
body.walk .opt .k{width:30px;height:30px;font-size:14px;margin-top:0}
body.walk .opts{gap:12px}
body.walk .fb{font-size:16.5px;line-height:1.65;padding:18px 20px}
body.walk .btn{padding:18px 26px;font-size:18px;border-radius:14px}
body.walk .kbd{display:none}
body.walk .tiny{font-size:15px}
body.walk .bar{height:9px}
body.walk .tag{font-size:13px;padding:4px 11px}
.walkbar{position:sticky;bottom:0;z-index:30;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom));
  margin-top:14px;border-top:1px solid var(--line);display:flex;gap:10px}
.walkbar .btn{flex:1}
.fehlerliste{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.fehlerzeile{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%}
.fehlerzahl{font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink3);flex:none}
body.autolauf .walkbar #nextBtn{position:relative;overflow:hidden}
body.autolauf .walkbar #nextBtn::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.28);
  transform-origin:left;transform:scaleX(0);animation:autolauf var(--dauer,2s) linear forwards}
@keyframes autolauf{to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){ body.autolauf .walkbar #nextBtn::after{animation:none} }
.walktop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
@media (max-width:400px){
  .walktop{gap:7px}
  .walktop .btn{padding:10px 12px}
  .walktop .tag{display:none}
}
.walktop .btn{padding:10px 16px;font-size:15px}
.walkzahl{font-size:15px;font-weight:650;color:var(--ink3);white-space:nowrap}
.walkcard{border-left:3px solid var(--acc)}
body.walk .walkbar .btn{font-size:19px;padding:20px 24px}
.speakon{background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important}
.savewarn{background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:15px 17px;
  margin:16px 0 0;font-size:14px;line-height:1.6;color:var(--ink)}
.savewarn b{display:block;margin-bottom:4px;color:var(--bad)}
.savewarn .btn{margin-top:10px}
.pban{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:14px 18px;margin-bottom:16px}
.pban b{font-size:14.5px}

/* ---------- Textcheck ---------- */
.tctext{margin-top:12px;padding:18px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);
  font-size:15.5px;line-height:2;color:var(--ink);max-height:340px;overflow:auto}
mark.mk{padding:1px 3px;border-radius:4px;background:none}
mark.mk-hart{background:var(--bad-soft);box-shadow:inset 0 -2px 0 var(--bad);color:var(--bad)}
mark.mk-pruef{background:var(--warn-soft);box-shadow:inset 0 -2px 0 var(--warn);color:var(--warn)}
mark.mk-stil{background:var(--gold-soft);box-shadow:inset 0 -2px 0 var(--gold);color:var(--gold)}
mark.mk-form{background:var(--blue-soft);box-shadow:inset 0 -2px 0 var(--blue);color:var(--blue)}
.fnd{padding:12px 0;border-bottom:1px solid var(--line2)}
.fnd:last-child{border-bottom:0}
.fnd-h{display:flex;align-items:center;gap:8px;font-size:15px;flex-wrap:wrap}
.fnd-q{font-family:Georgia,"Iowan Old Style",serif;font-size:14.5px;color:var(--ink2);margin:5px 0}
.fnd-b{font-size:13.6px;color:var(--ink2);line-height:1.6}
.fnd-b a{color:var(--acc-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.jn.hot{background:var(--bad-soft);color:var(--bad)}
.vbadge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;
  background:var(--gold-soft);color:var(--gold);font-size:10.5px;font-weight:700;letter-spacing:.03em;
  text-transform:uppercase;white-space:nowrap;flex:0 0 auto}
.lesehinweis{background:var(--bg2);border:1px solid var(--line2);border-left:3px solid var(--blue);
  border-radius:11px;padding:16px 18px;margin-bottom:16px;font-size:14px;line-height:1.65;color:var(--ink2)}
.lesehinweis b{color:var(--ink)}
.lesehinweis ul{margin:.5em 0 0;padding-left:1.15em}
.lesehinweis li{margin:.3em 0}
/* ---------- Suche ---------- */
#srchWrap{display:none;position:fixed;inset:0;z-index:200}
#srchWrap.on{display:block}
.srch-bd{position:absolute;inset:0;background:rgba(20,23,26,.4);backdrop-filter:blur(2px)}
.srch{position:relative;max-width:600px;margin:8vh auto 0;background:var(--card);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.srch input{width:100%;padding:18px 20px;border:0;background:none;font-size:16.5px;outline:none}
.srch-out{max-height:56vh;overflow:auto;border-top:1px solid var(--line2)}
.sres{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 20px;
  border-bottom:1px solid var(--line2);font-size:14.5px}
.sres:last-child{border-bottom:0}
.sres:hover,.sres:focus{background:var(--acc-soft)}
.sres-k{flex:0 0 auto;width:96px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink3)}
.sres-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.sres-s{flex:0 0 auto;font-size:12px;color:var(--ink3);max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srch-hint{padding:22px 20px;font-size:13.5px;color:var(--ink3);text-align:center}
.srch-ft{padding:10px 20px;border-top:1px solid var(--line2);font-size:12px;color:var(--ink3);background:var(--bg2)}
/* ---------- Kompakte Tagesbausteine ---------- */
.tbox{border-top:1px solid var(--line2);padding-top:12px;margin-top:12px}
.tbox:first-of-type{border-top:0;padding-top:4px;margin-top:8px}
.tbox-h{display:flex;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap}
.tbox-h b{font-size:15.5px}
.tbox-h .tiny{margin-left:auto}
.tbox-k{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);
  background:var(--line2);padding:3px 8px;border-radius:6px}
.tbox-b{display:none;font-size:14.3px;line-height:1.65;color:var(--ink2);margin-top:10px}
.tbox.open .tbox-b{display:block}
.tbox-b .ex,.tbox-b .satz{font-size:13.6px}
.pline{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--line2);font-size:13.5px;color:var(--ink2);flex-wrap:wrap}
/* ---------- Spickzettel ---------- */
.cheat{font-size:13px;line-height:1.5;color:var(--ink)}
.ch-head{margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.ch-head h1{font-size:24px;letter-spacing:-.02em}
.ch-head p{margin:4px 0 0;font-size:13px;color:var(--ink2)}
.ch-sec{margin-bottom:20px;break-inside:avoid}
.ch-sec h2{font-size:15px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.ch-sec h3{font-size:12.5px;margin-bottom:5px;color:var(--ink2)}
table.ch-t{width:100%;border-collapse:collapse;font-size:12.4px}
table.ch-t th{text-align:left;vertical-align:top;padding:5px 10px 5px 0;width:110px;color:var(--ink3);
  font-weight:700;font-size:11.5px;white-space:nowrap}
table.ch-t td{padding:5px 0;vertical-align:top;border-bottom:1px solid var(--line2);line-height:1.5}
table.ch-t.sm th{width:auto;padding-right:14px}
table.ch-t.sm td{padding-right:14px}
.ch-2col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ch-list{font-size:12.2px;line-height:1.6;color:var(--ink2)}
.ch-n{margin-top:7px;font-size:11.8px;color:var(--ink2);line-height:1.5}
.ch-u{margin:0;padding-left:1.1em;font-size:12.2px;line-height:1.65}
.ch-u li{margin:.15em 0}
.ch-foot{margin-top:20px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--ink3);text-align:center}
.cheat table.dt{font-size:11.5px}
.cheat table.dt th,.cheat table.dt td{padding:4px 6px}
@media print{
  body.cheat-on{background:#fff}

  body.cheat-on .wrap{max-width:none;padding:0}
  body.cheat-on .card{box-shadow:none;border:0;padding:0;margin:0;background:#fff}
  .ch-break{break-before:page}
  .cheat{color:#000}
}

/* ---------- Bedienbarkeit ---------- */
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:6px}
.opt:focus-visible{outline-offset:-2px}
.tok:focus-visible,mark:focus-visible{outline-offset:1px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
.tabs{-webkit-overflow-scrolling:touch}
.tabs::after{content:"";flex:0 0 8px}

/* ============================================================
   TOUCHBEDIENUNG — gilt für alle Geräte ohne Mauszeiger
   ============================================================ */
@media(hover:none){
  button,.chip,.tab,.sub,.opt,.cp,.regbtn,.tok,.crit li,.acc>button{touch-action:manipulation}
  /* Beim Gehen wird oft ungenau getippt und dabei gewischt. Drei Ärgernisse:
     das Pull-to-Refresh mitten in der Runde, der graue Blitz auf jedem Tipp und
     die Textauswahl mit Lupe, wenn der Finger auf einer Antwort liegen bleibt. */
  html,body{overscroll-behavior-y:contain}
  button,.chip,.tab,.sub,.opt,.cp,.regbtn,.tok,.acc>button{-webkit-tap-highlight-color:transparent}
  button,.chip,.tab,.sub,.opt,.regbtn,.acc>button{-webkit-user-select:none;user-select:none}
  .chip{padding:12px 16px;font-size:14px}
  .btn.sm{padding:12px 17px;font-size:14px}
  .iconbtn{width:44px;height:44px;font-size:17px}
  .cp{padding:12px 14px;font-size:12.5px}
  .regbtn{padding:12px 16px;font-size:13px}
  /* Tastaturhinweise ergeben ohne Tastatur keinen Sinn */
  .kbd{display:none!important}
  .tab{padding:12px 14px 13px}
  .sub{padding:12px 12px}
  .crit li{padding:13px 0 13px 32px}
  .jrow-a .btn.sm{padding:9px 14px}
}

/* ============================================================
   SCHMALE BILDSCHIRME
   ============================================================ */
@media(max-width:600px){
  html{-webkit-text-size-adjust:100%}
  body{overflow-x:hidden}
  .wrap{padding:0 calc(13px + env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) calc(13px + env(safe-area-inset-left))}
  .head-in{padding:11px 13px 0;gap:9px}
  .tabs{padding:8px 13px 0}
  .brand b{font-size:17px}
  .brand span{display:none}
  .pill{padding:5px 9px;font-size:12.5px}
  .hud{gap:5px}

  /* Wischhinweis an der Reiterleiste */
  .head{position:relative}
  .head::after{content:"";position:absolute;right:0;bottom:1px;width:26px;height:42px;
    background:linear-gradient(90deg,transparent,var(--bg));pointer-events:none}

  .card{padding:16px 15px;border-radius:12px}
  .qtext{font-size:17.5px;margin:12px 0 16px}
  .opt{padding:14px 14px;font-size:16px}
  .opt .k{width:24px;height:24px}

  /* Eingabefelder mindestens 16 px, sonst zoomt iOS beim Antippen */
  input,textarea,select,.search,.fillbox input,#tcArea,.srch input{font-size:16px!important}
  .search{padding:13px 14px}

  /* Unternavigation wischbar */
  .subnav{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
  .subnav::-webkit-scrollbar{display:none}
  .sub{flex:0 0 auto;min-width:max-content;font-size:13.5px}

  /* Tabellen bekommen eine eigene Scrollfläche statt die Seite zu sprengen */
  table.dt{display:block;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;
    border:1px solid var(--line2);border-radius:9px;padding:2px 4px}
  table.dt th,table.dt td{white-space:nowrap}
  table.ch-t th{width:auto;display:block;padding-bottom:1px;color:var(--ink)}
  table.ch-t td{display:block;padding-top:2px;padding-bottom:9px}
  .satz{overflow-x:auto;font-size:14.5px;line-height:2}
  .ch-2col{grid-template-columns:1fr;gap:12px}

  /* Lange Wörter dürfen nicht überstehen */
  .crow-e,.fnd-q,.jlast,.sres-t,.kerr-h,.model,.quote,.acc .body{overflow-wrap:anywhere}

  .grid2{grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px}
  .stat{padding:12px 13px}
  .stat b{font-size:21px}

  /* Fehlersuche: größere Tippflächen für die Wörter */
  .korrtext{font-size:16.5px;line-height:2.35;padding:16px 14px}
  .tok{padding:4px 4px}

  /* Suchfenster als Vollbild */
  .srch{margin:0;border-radius:0;height:100dvh;max-width:none;display:flex;flex-direction:column}
  .srch input{padding:calc(16px + env(safe-area-inset-top)) 16px 16px}
  .srch-out{flex:1;max-height:none}
  .sres{padding:14px 16px}
  .sres-k{width:70px;font-size:10px}
  .sres-s{display:none}
  .srch-ft{padding-bottom:calc(10px + env(safe-area-inset-bottom))}

  .toast{bottom:calc(20px + env(safe-area-inset-bottom));font-size:14px;padding:11px 17px}
  .pline{font-size:13px}
  .tbox-h{gap:7px}
  .tbox-h .tiny{margin-left:0;flex-basis:100%}
  .phr{flex-direction:column;gap:9px}
  .cp{align-self:flex-start}
  .quote{font-size:15.5px;padding:14px 15px}
  .quote .cp{position:static;display:block;margin-top:10px}
  textarea.write{min-height:220px;padding:15px;font-size:16px}
  .acc>button{padding:14px 14px;font-size:15px;gap:9px;flex-wrap:wrap}
  .acc .body{padding:2px 14px 16px}
  .crow{padding:12px 14px}
  .pweek{padding:11px 11px}
}

/* Sehr schmale Geräte */
@media(max-width:360px){
  .wrap{padding-left:10px;padding-right:10px}
  .head-in,.tabs{padding-left:10px;padding-right:10px}
  .brand b{font-size:16px}
  .pill{padding:4px 8px;font-size:12px}
  .iconbtn{width:38px;height:38px}
  .card{padding:14px 12px}
  .qtext{font-size:16.5px}
  .grid2{grid-template-columns:1fr 1fr}
}

/* Querformat auf dem Handy: Kopfzeile nicht kleben lassen */
@media(max-height:480px) and (orientation:landscape){
  .head{position:static}
}

<script>
/* ============================================================
   ÜBUNGSDATENBANK — Teil A: Kommasetzung, Groß-/Kleinschreibung
   Schema: id, c=Kategorie, q=Frage, o=Optionen, a=Index richtig,
           e=Erklärung, r=Regel-ID (optional), t="fill" für Eingabe
   ============================================================ */
const EX_A = [

/* ---------- KOMMASETZUNG ---------- */
{id:"k01",c:"komma",q:"Welche Variante ist richtig?",o:[
 "Er trainiert jeden Morgen, um seine Ausdauer zu verbessern.",
 "Er trainiert jeden Morgen um seine Ausdauer zu verbessern."],a:0,
 e:"Vor Infinitivgruppen mit <b>um, ohne, statt, anstatt, außer, als</b> steht immer ein Komma. Das ist keine Kann-Regel.",r:"komma-infinitiv"},

{id:"k02",c:"komma",q:"Wo ist das Komma korrekt gesetzt?",o:[
 "Der Plan, jeden Tag zehn Kilometer zu laufen, war ambitioniert.",
 "Der Plan jeden Tag zehn Kilometer zu laufen, war ambitioniert.",
 "Der Plan, jeden Tag zehn Kilometer zu laufen war ambitioniert."],a:0,
 e:"Hängt die Infinitivgruppe von einem Substantiv ab („der Plan …“), ist das Komma Pflicht. Und weil sie eingeschoben ist, braucht sie auch <b>hinten</b> ein Komma.",r:"komma-infinitiv"},

{id:"k03",c:"komma",q:"Richtig oder falsch: „Sie ist sowohl schnell, als auch ausdauernd.“",o:[
 "Falsch — vor „als auch“ steht kein Komma.",
 "Richtig — „als auch“ verlangt ein Komma."],a:0,
 e:"<b>sowohl … als auch</b>, <b>weder … noch</b>, <b>entweder … oder</b> verbinden gleichrangige Satzteile ohne Komma. <b>Ausnahme:</b> Verbinden sie ganze Nebensätze, sind die Kommas Pflicht — „Er bemerkte sowohl, dass er zu kurz gesprungen war, als auch, dass die Katze schneller war.“",r:"komma-aufzaehlung"},

{id:"k04",c:"komma",q:"Welcher Satz ist korrekt?",o:[
 "Er lief schneller, als ich erwartet hatte.",
 "Er lief schneller als ich erwartet hatte."],a:0,
 e:"Folgt auf „als“ ein ganzer <b>Nebensatz</b> (mit eigenem Verb), steht ein Komma. Bei bloßem Satzteil nicht: „Er lief schneller als ich.“",r:"komma-vergleich"},

{id:"k05",c:"komma",q:"Komma vor „als“ beim Vergleich?",o:[
 "Die Gruppe war größer als erwartet.",
 "Die Gruppe war größer, als erwartet."],a:0,
 e:"„als erwartet“ ist kein Nebensatz, sondern eine verkürzte Wendung ohne finites Verb — kein Komma.",r:"komma-vergleich"},

{id:"k06",c:"komma",q:"Welche Setzung ist korrekt?",o:[
 "Mein Bruder, ein leidenschaftlicher Läufer, startet in Köln.",
 "Mein Bruder, ein leidenschaftlicher Läufer startet in Köln."],a:0,
 e:"Eine <b>Apposition</b> (nachgestellte Erläuterung) wird auf beiden Seiten mit Komma abgetrennt. Das schließende Komma wird am häufigsten vergessen.",r:"komma-einschub"},

{id:"k07",c:"komma",q:"Welcher Satz ist richtig?",o:[
 "Die Studie, die 2021 erschien, gilt als Standardwerk.",
 "Die Studie, die 2021 erschien gilt als Standardwerk."],a:0,
 e:"Ein eingeschobener Relativsatz wird <b>vorn und hinten</b> abgetrennt. Merke: Was du aufmachst, musst du schließen.",r:"komma-einschub"},

{id:"k08",c:"komma",q:"„Je länger er trainierte(,) desto ruhiger wurde sein Puls.“",o:[
 "Komma nötig","Kein Komma"],a:0,
 e:"Bei <b>je … desto</b> handelt es sich um Gliedsatz + Hauptsatz — dazwischen steht ein Komma.",r:"komma-nebensatz"},

{id:"k09",c:"komma",q:"Was gilt für „und“ zwischen zwei Hauptsätzen? „Er packte die Tasche(,) und sie schloss die Tür.“",o:[
 "Komma darf gesetzt werden, muss aber nicht",
 "Komma ist verboten",
 "Komma ist Pflicht"],a:0,
 e:"Seit der Reform von 1996 ist das Komma vor „und“/„oder“ zwischen Hauptsätzen <b>fakultativ</b> (Duden). Setz es, wenn es die Gliederung klarer macht.",r:"komma-hauptsatz"},

{id:"k10",c:"komma",q:"Welcher Satz braucht zwingend ein Komma vor „und“?",o:[
 "Er wartete, bis es dunkel wurde, und ging dann los.",
 "Er wartete auf den Bus und ging dann los."],a:0,
 e:"Hier schließt das Komma den eingeschobenen Nebensatz „bis es dunkel wurde“ ab — deshalb ist es Pflicht, obwohl „und“ folgt.",r:"komma-hauptsatz"},

{id:"k11",c:"komma",q:"Welche Variante stimmt?",o:[
 "Nicht die Technik war das Problem, sondern die Kondition.",
 "Nicht die Technik war das Problem sondern die Kondition."],a:0,
 e:"Vor entgegensetzenden <b>Konjunktionen</b> — aber, sondern, doch, jedoch, allein — steht ein Komma. <b>Achtung:</b> Dieselben Wörter können auch Adverb oder Partikel sein, dann steht keins: „Er kam jedoch zu spät.“ · „Das ist aber schön.“",r:"komma-aufzaehlung"},

{id:"k12",c:"komma",q:"„Wir brauchen Bälle(,) Hütchen und Leibchen.“",o:[
 "Komma nötig","Kein Komma"],a:0,
 e:"Aufzählungsglieder werden durch Komma getrennt — nur vor dem abschließenden „und“ steht keins.",r:"komma-aufzaehlung"},

{id:"k13",c:"komma",q:"Wie ist es richtig?",o:[
 "Wir treffen uns morgen, das heißt am Dienstag.",
 "Wir treffen uns morgen das heißt am Dienstag."],a:0,
 e:"Vor erläuternden Einschüben wie <b>das heißt, und zwar, nämlich, zum Beispiel, vor allem</b> steht ein Komma.",r:"komma-einschub"},

{id:"k14",c:"komma",q:"Welche Anrede ist korrekt formatiert?",o:[
 "Sehr geehrte Frau Dr. Weber, → vielen Dank für Ihre Rückmeldung.",
 "Sehr geehrte Frau Dr. Weber, → Vielen Dank für Ihre Rückmeldung."],a:0,
 e:"Nach dem Anredekomma geht es <b>klein</b> weiter — der Satz beginnt erst dort.",r:"komma-brief"},

{id:"k15",c:"komma",q:"Was folgt nach „Mit freundlichen Grüßen“?",o:[
 "Kein Satzzeichen","Ein Komma","Ein Punkt"],a:0,
 e:"Die Grußformel steht ohne Satzzeichen. Danach folgt der Name in der nächsten Zeile.",r:"komma-brief"},

{id:"k16",c:"komma",q:"Welcher Satz ist korrekt?",o:[
 "Ein langer, anstrengender Lauf lag vor ihm.",
 "Ein langer anstrengender Lauf lag vor ihm."],a:0,
 e:"Gleichrangige Adjektive bekommen ein Komma. <b>Probe:</b> Lässt sich „und“ einsetzen („lang und anstrengend“), ist ein Komma richtig.",r:"komma-adjektive"},

{id:"k17",c:"komma",q:"Komma zwischen den beiden Adjektiven?",o:[
 "Im Oktober beginnt das neue akademische Jahr.",
 "Im Oktober beginnt das neue, akademische Jahr."],a:0,
 e:"„akademisches Jahr“ ist ein fester Begriff, „neu“ bezieht sich auf diese Einheit. Die Und-Probe scheitert: „neu und akademisch“ ergibt keinen Sinn → kein Komma. Vorsicht bei lockereren Paaren wie „neue rote Jacke“ — dort sind beide Fassungen richtig, sie sagen nur Verschiedenes.",r:"komma-adjektive"},

{id:"k18",c:"komma",q:"Wie viele Kommas fehlen? „Als er ankam war die Halle schon voll und der Trainer wartete bereits.“",o:[
 "Eines — nach „ankam“","Zwei","Keines"],a:0,
 e:"Der vorangestellte Nebensatz „Als er ankam“ wird abgetrennt. Vor dem „und“ ist das Komma fakultativ.",r:"komma-nebensatz"},

{id:"k19",c:"komma",q:"Welche Variante ist richtig?",o:[
 "Sie fragte, ob er mitkomme.",
 "Sie fragte ob er mitkomme."],a:0,
 e:"Auch der indirekte Fragesatz mit „ob“ ist ein Nebensatz und wird abgetrennt. Ohne Komma ist der Satz falsch.",r:"komma-nebensatz"},

{id:"k20",c:"komma",q:"„Er hat versucht(,) pünktlich zu sein.“",o:[
 "Komma ist Pflicht",
 "Komma ist erlaubt, aber nicht zwingend",
 "Komma ist falsch"],a:0,
 e:"„pünktlich zu sein“ ist eine <b>erweiterte</b> Infinitivgruppe — zu + Infinitiv und noch ein Wort. Seit dem 1. Juli 2024 steht dort ein Komma, auch ohne Einleitewort. Früher war es freigestellt.",r:"komma-infinitiv"},

{id:"k21",c:"komma",q:"Welcher Satz ist korrekt?",o:[
 "Nein, das sehe ich anders.",
 "Nein das sehe ich anders."],a:0,
 e:"Ausrufe, Anreden und Interjektionen am Satzanfang werden durch Komma abgetrennt: „Ja, …“, „Nun, …“, „Herr Müller, …“.",r:"komma-einschub"},

{id:"k22",c:"komma",q:"Wo gehört das Komma hin? „Sport das ist mein Ausgleich.“",o:[
 "Sport, das ist mein Ausgleich.",
 "Sport das ist, mein Ausgleich.",
 "Gar keins"],a:0,
 e:"Ein herausgehobener Satzteil, der später durch ein Pronomen wieder aufgenommen wird, steht durch Komma abgetrennt.",r:"komma-einschub"},

{id:"k23",c:"komma",q:"Richtig?",o:[
 "Nicht nur die Technik, sondern auch die Taktik überzeugte.",
 "Nicht nur die Technik sondern auch die Taktik überzeugte."],a:0,
 e:"Auch in der Paarformel „nicht nur … sondern auch“ steht vor „sondern“ ein Komma.",r:"komma-aufzaehlung"},

{id:"k24",c:"komma",q:"„Sie kam am Montag(,) beziehungsweise am Dienstag.“",o:[
 "Kein Komma","Komma nötig"],a:0,
 e:"<b>beziehungsweise/bzw.</b> verhält sich wie „oder“ — bei Satzteilen kein Komma.",r:"komma-aufzaehlung"},

{id:"k25",c:"komma",q:"Welche Datumsangabe ist korrekt?",o:[
 "Köln, den 12. Mai 2026",
 "Köln den 12. Mai 2026"],a:0,
 e:"Zwischen Ort und Datum steht ein Komma. Bei mehrteiligen Angaben ist ein abschließendes Komma möglich: „Am Montag, dem 12. Mai, beginnt …“",r:"komma-brief"},

{id:"k26",c:"komma",q:"Welche Variante ist richtig?",o:[
 "Er ging, ohne sich zu verabschieden.",
 "Er ging ohne sich zu verabschieden."],a:0,
 e:"„ohne … zu“ gehört zu den Einleitewörtern, die das Komma erzwingen (wie um, statt, anstatt, außer, als).",r:"komma-infinitiv"},

{id:"k27",c:"komma",q:"Was ist korrekt?",o:[
 "Vorausgesetzt, dass alle zusagen, findet der Ausflug statt.",
 "Vorausgesetzt dass alle zusagen findet der Ausflug statt."],a:0,
 e:"„vorausgesetzt, dass“, „angenommen, dass“, „ausgenommen, wenn“ — das Komma trennt das Signalwort vom Nebensatz, und der Nebensatz wird hinten geschlossen.",r:"komma-nebensatz"},

{id:"k28",c:"komma",q:"Wie viele Kommas braucht dieser Satz? „Er sagte dass er komme wenn er Zeit habe.“",o:["Zwei","Eines","Drei"],a:0,
 e:"Jeder Nebensatz wird abgetrennt: „Er sagte, dass er komme, wenn er Zeit habe.“",r:"komma-nebensatz"},

{id:"k29",c:"komma",q:"Welche Variante ist richtig?",o:[
 "Von der Hitze erschöpft, brach sie das Training ab.",
 "Beides ist zulässig",
 "Von der Hitze erschöpft brach sie das Training ab."],a:1,
 e:"Bei Partizipgruppen ist das Komma seit der Reform von 1996 <b>fakultativ</b>. Pflicht wird es nur bei Einschüben, Nachträgen oder wenn ein hinweisendes Wort vorausgeht.",r:"komma-partizip"},

{id:"k30",c:"komma",q:"„Es war ein guter(,) wenn auch anstrengender Tag.“",o:[
 "Komma nötig","Kein Komma"],a:0,
 e:"„wenn auch“, „wenngleich“, „obschon“ leiten einen eingeschobenen Nebensatz ein — Komma davor.",r:"komma-nebensatz"},

{id:"k31",c:"komma",q:"Welcher Satz ist richtig?",o:[
 "Wir bieten verschiedene Kurse an, zum Beispiel Yoga und Pilates.",
 "Wir bieten verschiedene Kurse an zum Beispiel Yoga und Pilates."],a:0,
 e:"Vor „zum Beispiel“ als nachgestellter Erläuterung steht ein Komma — nach „zum Beispiel“ jedoch nicht.",r:"komma-einschub"},

{id:"k32",c:"komma",q:"Was stimmt?",o:[
 "Die Halle, in der wir trainieren, wird saniert.",
 "Die Halle in der wir trainieren, wird saniert."],a:0,
 e:"Auch Relativsätze mit Präposition („in der“, „mit dem“, „auf die“) werden beidseitig abgetrennt.",r:"komma-einschub"},

{id:"k33",c:"komma",q:"Richtig?",o:[
 "Bitte melde dich, sobald du angekommen bist.",
 "Bitte melde dich sobald du angekommen bist."],a:0,
 e:"„sobald“, „solange“, „nachdem“, „während“, „bevor“ leiten Nebensätze ein — Komma davor.",r:"komma-nebensatz"},

{id:"k34",c:"komma",q:"Welche Version ist korrekt?",o:[
 "Er trainiert, weil er sich verbessern will, und ruht sich danach aus.",
 "Er trainiert weil er sich verbessern will und ruht sich danach aus."],a:0,
 e:"Der eingeschobene Nebensatz „weil …“ braucht beide Kommas — auch wenn danach „und“ folgt.",r:"komma-hauptsatz"},

{id:"k35",c:"komma",q:"„Er kommt morgen(,) oder übermorgen.“",o:[
 "Kein Komma","Komma nötig"],a:0,
 e:"„oder“ verbindet hier zwei Satzteile, keine vollständigen Sätze — kein Komma.",r:"komma-aufzaehlung"},

{id:"k36",c:"komma",q:"Welcher Satz ist korrekt?",o:[
 "Das Ziel, sich stetig zu verbessern, trägt ihn.",
 "Das Ziel sich stetig zu verbessern trägt ihn."],a:0,
 e:"Infinitivgruppe, die von einem Substantiv („das Ziel“) abhängt und eingeschoben ist → beidseitig Komma.",r:"komma-infinitiv"},

{id:"k37",c:"komma",q:"„Sie war müde(,) trotzdem lief sie weiter.“",o:[
 "Komma nötig","Kein Komma"],a:0,
 e:"Zwei Hauptsätze ohne verbindende Konjunktion — dazwischen muss ein Zeichen stehen („trotzdem“ ist ein Adverb, keine Konjunktion). Das Komma ist der Normalfall; ein Semikolon oder ein Punkt wäre hier ebenfalls richtig.",r:"komma-hauptsatz"},

{id:"k38",c:"komma",q:"Was ist richtig?",o:[
 "Der Kurs findet statt, sofern genug Anmeldungen eingehen.",
 "Der Kurs findet statt sofern genug Anmeldungen eingehen."],a:0,
 e:"„sofern“, „falls“, „soweit“ sind unterordnende Konjunktionen — Komma davor.",r:"komma-nebensatz"},

{id:"k39",c:"komma",q:"Welche Variante stimmt?",o:[
 "Anstatt zu klagen, änderte er seinen Trainingsplan.",
 "Anstatt zu klagen änderte er seinen Trainingsplan."],a:0,
 e:"„anstatt … zu“ steht auf der Pflichtliste: um, ohne, statt, anstatt, außer, als.",r:"komma-infinitiv"},

{id:"k40",c:"komma",q:"„Er hat, wie erwartet, gewonnen.“ Ist das richtig?",o:[
 "Ja — der Einschub wird beidseitig abgetrennt",
 "Nein — „wie erwartet“ steht ohne Kommas"],a:0,
 e:"Als eingeschobener Zusatz mitten im Satz wird „wie erwartet“ abgetrennt. Ohne Einschub: „Er hat wie erwartet gewonnen.“ ist ebenfalls möglich.",r:"komma-einschub"},

{id:"k41",c:"komma",q:"„Er hat versucht(,) zu kommen.“",o:[
 "Komma ist erlaubt, aber nicht zwingend",
 "Komma ist Pflicht",
 "Komma ist falsch"],a:0,
 e:"„zu kommen“ ist <b>nicht erweitert</b> — bloß zu + Infinitiv, kein weiteres Wort. Dort bleibt das Komma freigestellt. Sobald ein Wort dazukommt („pünktlich zu kommen“), ist es Pflicht.",r:"komma-infinitiv"},

/* ---------- GROSS- UND KLEINSCHREIBUNG ---------- */
{id:"g01",c:"gross",q:"Was ist korrekt?",o:["des Weiteren","des weiteren"],a:0,
 e:"Substantivierungen nach Artikel oder Präposition werden großgeschrieben: <b>des Weiteren, im Allgemeinen, im Folgenden, im Übrigen, im Wesentlichen</b>.",r:"gross-subst"},

{id:"g02",c:"gross",q:"Richtig ist …",o:["im Großen und Ganzen","im großen und ganzen"],a:0,
 e:"Feste Wendung mit substantivierten Adjektiven — beide werden großgeschrieben.",r:"gross-subst"},

{id:"g03",c:"gross",q:"Wie schreibt man?",o:["Ich wünsche dir alles Gute.","Ich wünsche dir alles gute."],a:0,
 e:"Nach <b>alles, etwas, nichts, viel, wenig</b> wird das folgende Adjektiv substantiviert und großgeschrieben: etwas Neues, nichts Besonderes, viel Interessantes.",r:"gross-subst"},

{id:"g04",c:"gross",q:"Korrekt ist …",o:["Heute Morgen war es kalt.","Heute morgen war es kalt."],a:0,
 e:"Tageszeiten nach heute/gestern/morgen sind Substantive: <b>heute Morgen, gestern Abend, morgen Nachmittag</b>.",r:"gross-zeit"},

{id:"g05",c:"gross",q:"Groß oder klein?",o:["morgen früh","morgen Früh"],a:0,
 e:"„früh“ ist hier ein Adverb, kein Substantiv — deshalb klein; das ist die Duden-Empfehlung. „morgen Früh“ ist ebenfalls zulässig, geht aber auf das süddeutsch-österreichische Substantiv „die Früh“ zurück.",r:"gross-zeit"},

{id:"g06",c:"gross",q:"Was ist richtig?",o:["Er gab sein Bestes.","Er gab sein bestes."],a:0,
 e:"Mit Artikel/Possessivpronomen wird substantiviert: <b>sein Bestes</b>. Ohne: „Er lief am besten.“ (Frage „wie?“ → klein)",r:"gross-subst"},

{id:"g07",c:"gross",q:"Welche Schreibung stimmt?",o:["die meisten Teilnehmenden","die Meisten Teilnehmenden"],a:0,
 e:"„meiste“ bleibt hier ein Zahladjektiv vor einem Substantiv → klein. Auch allein stehend meist klein: „die meisten wissen das“.",r:"gross-subst"},

{id:"g08",c:"gross",q:"Korrekt ist …",o:["jeder Einzelne","jeder einzelne"],a:0,
 e:"Bezieht sich „Einzelne“ auf Personen und steht substantivisch, wird es großgeschrieben: „Jeder Einzelne zählt.“ Auch: „im Einzelnen“.",r:"gross-subst"},

{id:"g09",c:"gross",q:"Wie schreibt man?",o:["Rad fahren","radfahren","Radfahren" ],a:0,
 e:"Seit der Rechtschreibreform getrennt und groß: <b>Rad fahren</b> (wie Auto fahren). Als Substantiv: „das Radfahren“.",r:"getrennt-verb"},

{id:"g10",c:"gross",q:"Was ist richtig?",o:["Es tut mir leid.","Es tut mir Leid."],a:0,
 e:"In getrennter Stellung wird „leid“ kleingeschrieben. Zusammen: „Das wird dir noch <b>leidtun</b>.“",r:"gross-wendung"},

{id:"g11",c:"gross",q:"Korrekt ist …",o:["Beides ist zulässig","recht haben","Recht haben"],a:0,
 e:"Der Duden erlaubt <b>recht haben</b> und <b>Recht haben</b>. Gleiches gilt für recht/Recht behalten und recht/Recht bekommen.",r:"gross-wendung"},

{id:"g12",c:"gross",q:"Wie ist es richtig?",o:["Das lasse ich nicht außer Acht.","Das lasse ich nicht außer acht."],a:0,
 e:"In festen Wendungen mit Präposition bleibt das Substantiv groß: <b>außer Acht lassen, in Kauf nehmen, in Betracht ziehen, zu Rate ziehen</b>.",r:"gross-wendung"},

{id:"g13",c:"gross",q:"Was stimmt?",o:["in Bezug auf","in bezug auf"],a:0,
 e:"„Bezug“ ist ein Substantiv und bleibt groß. Alternative: „bezüglich“ (+ Genitiv).",r:"gross-wendung"},

{id:"g14",c:"gross",q:"Welche Schreibung ist korrekt?",o:["Er kann gut Deutsch.","Er kann gut deutsch."],a:0,
 e:"Die Sprache als Ganzes ist ein Substantiv: „Deutsch lernen“, „auf Deutsch“. Klein bleibt das Adjektiv: „die deutsche Sprache“.",r:"gross-sprachen"},

{id:"g15",c:"gross",q:"Richtig ist …",o:["im Nachhinein","im nachhinein"],a:0,
 e:"Präposition + Artikel signalisiert Substantivierung → groß. Ebenso: <b>im Voraus, im Wesentlichen, im Klaren</b>.",r:"gross-subst"},

{id:"g16",c:"gross",q:"Was ist korrekt?",o:["zum einen … zum anderen","zum Einen … zum Anderen"],a:0,
 e:"Diese Gliederungsformel bleibt klein — Ausnahme zur sonstigen Regel. Ebenso: „zum wiederholten Mal“ (Mal groß, weil Substantiv).",r:"gross-subst"},

{id:"g17",c:"gross",q:"Wie schreibt man?",o:["Beides ist zulässig","vor Kurzem","vor kurzem"],a:0,
 e:"Der Duden lässt beides zu, empfiehlt aber die Großschreibung: <b>vor Kurzem</b>. Gleiches gilt für „seit Langem“ und „ohne Weiteres“.",r:"gross-subst"},

{id:"g18",c:"gross",q:"Korrekt ist …",o:["Ende Mai","ende Mai"],a:0,
 e:"„Anfang, Mitte, Ende“ vor Monatsnamen sind Substantive und stehen groß.",r:"gross-zeit"},

{id:"g19",c:"gross",q:"Was ist richtig?",o:["ein bisschen Geduld","ein Bisschen Geduld"],a:0,
 e:"„ein bisschen“ = „ein wenig“, unbestimmtes Zahlwort → klein. Nur der Bissen ist groß.",r:"gross-subst"},

{id:"g20",c:"gross",q:"Wie schreibt man das Datum im Fließtext?",o:[
 "am Freitag, dem 3. Juli","am freitag, dem 3. juli"],a:0,
 e:"Wochentage und Monatsnamen sind Substantive → groß. Kleingeschrieben werden nur Adverbien wie „freitags“, „montags“.",r:"gross-zeit"},

{id:"g21",c:"gross",q:"Richtig ist …",o:["Wir treffen uns Anfang nächster Woche.","Wir treffen uns anfang nächster Woche."],a:0,
 e:"Auch hier ist „Anfang“ ein Substantiv. Klein bliebe nur das Adverb „anfangs“.",r:"gross-zeit"},

{id:"g22",c:"gross",q:"Welche Variante stimmt?",o:["Sie ist die Erste, die das schafft.","Sie ist die erste, die das schafft."],a:0,
 e:"Substantiviertes Zahlwort mit Artikel → groß: „der Erste, der Zweite“. Klein bleibt es als Attribut: „die erste Runde“.",r:"gross-subst"},

{id:"g23",c:"gross",q:"Korrekt ist …",o:["Er hat nichts Besonderes vor.","Er hat nichts besonderes vor."],a:0,
 e:"Nach „nichts“ steht das substantivierte Adjektiv groß. Merke die Reihe: alles, etwas, nichts, viel, wenig.",r:"gross-subst"},

{id:"g24",c:"gross",q:"Wie schreibt man?",o:["Angst haben","angst haben"],a:0,
 e:"„Angst“ ist ein Substantiv → groß. <b>Klein</b> wird es, wo es sich wie ein Adjektiv verhält: „mir wird angst und bange“, „jemandem angst machen“ (daneben ist auch „Angst machen“ zulässig).",r:"gross-wendung"},

{id:"g25",c:"gross",q:"Was ist richtig?",o:["Wir gehen heute Abend essen.","Wir gehen heute abend essen."],a:0,
 e:"Tageszeit-Substantiv nach „heute“ → groß. <b>Klein</b> bleibt das Adverb „früh“: heute früh, morgen früh, gestern früh.",r:"gross-zeit"},

{id:"g26",c:"gross",q:"Korrekt ist …",o:["im Folgenden erläutert","im folgenden erläutert"],a:0,
 e:"Klassiker in Hausarbeiten: „<b>Im Folgenden</b> wird gezeigt …“ — Präposition + Artikel → Substantivierung → groß.",r:"gross-subst"},

{id:"g27",c:"gross",q:"Wie schreibt man?",o:["auf dem Laufenden bleiben","auf dem laufenden bleiben"],a:0,
 e:"Substantiviertes Partizip mit Artikel → groß. Ebenso „im Klaren sein“, „im Reinen sein“.",r:"gross-subst"},

{id:"g28",c:"gross",q:"Richtig ist …",o:["Das ist das Einzige, was hilft.","Das ist das einzige, was hilft."],a:0,
 e:"Mit Artikel substantiviert → groß. Als Attribut klein: „das einzige Argument“.",r:"gross-subst"},

{id:"g29",c:"gross",q:"Was stimmt?",o:["Ich danke dir im Voraus.","Ich danke dir im voraus."],a:0,
 e:"Feste Wendung mit Substantivierung → groß. Häufiger Fehler in E-Mails.",r:"gross-subst"},

{id:"g30",c:"gross",q:"Korrekt ist …",o:["Er hat es des Öfteren erwähnt.","Er hat es des öfteren erwähnt."],a:0,
 e:"Substantiviertes Adjektiv im Genitiv → groß: <b>des Öfteren</b>.",r:"gross-subst"}

];
/* ============================================================
   ÜBUNGSDATENBANK — Teil B: Getrennt/Zusammen, Rechtschreibung,
   Grammatik, Stil
   ============================================================ */
const EX_B = [

/* ---------- GETRENNT- UND ZUSAMMENSCHREIBUNG ---------- */
{id:"t01",c:"getrennt",q:"Was ist korrekt?",o:["Beides ist zulässig","sodass","so dass"],a:0,
 e:"Der Duden führt <b>sodass</b> und <b>so dass</b> gleichberechtigt. Wähl eine Variante und bleib im Text dabei.",r:"getrennt-konj"},

{id:"t02",c:"getrennt",q:"Wie schreibt man?",o:["zurzeit (= momentan)","zur Zeit (= momentan)"],a:0,
 e:"<b>zurzeit</b> = derzeit, momentan. <b>zur Zeit</b> nur mit Genitiv: „zur Zeit Goethes“.",r:"getrennt-praep"},

{id:"t03",c:"getrennt",q:"Korrekt ist …",o:["Wie viel kostet das?","Wieviel kostet das?"],a:0,
 e:"<b>wie viel</b> wird immer getrennt geschrieben — ausnahmslos. „wieviel“ ist seit 1996 falsch.",r:"getrennt-praep"},

{id:"t04",c:"getrennt",q:"Was stimmt?",o:["Beides ist zulässig","kennenlernen","kennen lernen"],a:0,
 e:"Beide Schreibungen sind erlaubt; der Duden empfiehlt <b>kennenlernen</b>.",r:"getrennt-verb"},

{id:"t05",c:"getrennt",q:"Wie schreibt man?",o:["Beides ist zulässig","aufgrund","auf Grund"],a:0,
 e:"Beides ist korrekt, <b>aufgrund</b> ist gebräuchlicher. Es folgt der Genitiv: „aufgrund des Wetters“.",r:"getrennt-praep"},

{id:"t06",c:"getrennt",q:"Korrekt ist …",o:["Beides ist zulässig","infrage stellen","in Frage stellen"],a:0,
 e:"Der Duden lässt beides zu und empfiehlt <b>infrage stellen</b>.",r:"getrennt-praep"},

{id:"t07",c:"getrennt",q:"Welche Schreibung ist richtig?",o:["Soviel ich weiß, kommt er.","So viel ich weiß, kommt er."],a:0,
 e:"Als einleitende Konjunktion zusammen: <b>soviel ich weiß</b>. Als Mengenangabe getrennt: „so viel Arbeit“.",r:"getrennt-konj"},

{id:"t08",c:"getrennt",q:"Was ist korrekt?",o:["nichtsdestotrotz","nichts desto trotz"],a:0,
 e:"Zusammen. Der Duden führt „nichtsdestotrotz“ allerdings als <b>umgangssprachlich</b> — es ist eine scherzhafte Mischbildung aus „nichtsdestoweniger“ und „trotzdem“. In gehobenen Texten nimm <b>nichtsdestoweniger</b> oder <b>nichtsdestominder</b>; die gelten als standardsprachlich.",r:"getrennt-konj"},

{id:"t09",c:"getrennt",q:"Richtig ist …",o:["Beides ist zulässig","mithilfe","mit Hilfe"],a:0,
 e:"Beide Schreibungen sind zulässig. Es folgt der Genitiv: „mithilfe eines Trainingsplans“.",r:"getrennt-praep"},

{id:"t10",c:"getrennt",q:"Wie schreibt man „imstande sein“?",o:[
 "Beides ist zulässig",
 "Nur: Er ist imstande, das zu leisten.",
 "Nur: Er ist im Stande, das zu leisten."],a:0,
 e:"Der Duden führt <b>imstande</b> als empfohlene Schreibung und <b>im Stande</b> als zulässige Variante — dasselbe bei <b>außerstande / außer Stande</b>. Wer sich nicht entscheiden mag, nimmt die empfohlene Form.",r:"getrennt-praep"},

{id:"t11",c:"getrennt",q:"Korrekt ist …",o:["Wir arbeiten eng zusammen.","Wir arbeiten eng zu sammen."],a:0,
 e:"„zusammenarbeiten“ ist ein festes Verb. In finiter Stellung wird es getrennt: „Wir arbeiten … zusammen.“ Der Infinitiv bleibt ein Wort.",r:"getrennt-verb"},

{id:"t12",c:"getrennt",q:"Was ist richtig?",o:["Wir sehen uns morgen wieder.","Wir sehen uns morgen Wieder."],a:0,
 e:"„wiedersehen“ = erneut treffen (ein Wort im Infinitiv), getrennt in finiter Stellung. Nicht verwechseln mit „wider“ (= gegen).",r:"recht-wider"},

{id:"t13",c:"getrennt",q:"Wie schreibt man?",o:["Es bleibt noch etwas übrig.","Es bleibt noch etwas Übrig."],a:0,
 e:"„übrig bleiben“ wird getrennt geschrieben, „übrig“ bleibt klein.",r:"getrennt-verb"},

{id:"t14",c:"getrennt",q:"Korrekt ist …",o:["Beides ist zulässig","anstelle","an Stelle"],a:0,
 e:"Beide Formen sind korrekt. „anstelle“ verlangt den Genitiv: „anstelle des Trainers“.",r:"getrennt-praep"},

{id:"t15",c:"getrennt",q:"Was ist richtig?",o:["irgendetwas","irgend etwas"],a:0,
 e:"Zusammensetzungen mit „irgend“ werden zusammengeschrieben: irgendetwas, irgendjemand, irgendwann, irgendwo.",r:"getrennt-konj"},

{id:"t16",c:"getrennt",q:"Wie schreibt man?",o:["Ich fahre nach Hause.","Ich fahre nach hause."],a:0,
 e:"„Haus“ bleibt in „nach Hause“ und „zu Hause“ groß. Für „zu Hause“ ist zusätzlich die Zusammenschreibung <b>zuhause</b> zulässig; als Substantiv nur <b>das Zuhause</b>.",r:"gross-wendung"},

{id:"t17",c:"getrennt",q:"Was stimmt?",o:["Er kommt gut zurecht.","Er kommt gut zu recht."],a:0,
 e:"<b>zurechtkommen</b> wird zusammengeschrieben; in finiter Stellung steht „zurecht“ am Satzende als ein Wort.",r:"getrennt-verb"},

{id:"t18",c:"getrennt",q:"Richtig ist …",o:["Sie hat viel zu viel trainiert.","Sie hat viel zuviel trainiert."],a:0,
 e:"<b>viel zu viel</b> — drei Wörter. „zuviel“ ist seit der Reform nicht mehr korrekt.",r:"getrennt-praep"},

{id:"t19",c:"getrennt",q:"Wie schreibt man?",o:["Das kann zugrunde gehen.","Das kann zu Grunde gehen.","Beides ist zulässig"],a:2,
 e:"Der Duden führt „zugrunde“ und „zu Grunde“ nebeneinander, empfiehlt aber <b>zugrunde</b>.",r:"getrennt-praep"},

{id:"t20",c:"getrennt",q:"Korrekt ist …",o:["Er blieb sitzen.","Er blieb Sitzen."],a:0,
 e:"„sitzen bleiben“ getrennt (wörtlich). Für die Schulbedeutung ist auch „sitzenbleiben“ zulässig.",r:"getrennt-verb"},

/* ---------- RECHTSCHREIBUNG & ZWEIFELSFÄLLE ---------- */
{id:"r01",c:"recht",q:"Setze richtig ein: „Ich hoffe, ___ du kommst.“",t:"fill",a:["dass"],
 e:"Ersatzprobe: Lässt sich <b>dieses/jenes/welches</b> einsetzen, schreibt man <b>das</b>. Geht das nicht, ist es die Konjunktion <b>dass</b>.",r:"recht-dass"},

{id:"r02",c:"recht",q:"Setze richtig ein: „___ Training, ___ er gestern absolviert hat, war hart.“ (beide Wörter, durch Leerzeichen getrennt)",t:"fill",a:["das das"],
 e:"Beide Male <b>das</b>: einmal als Artikel, einmal als Relativpronomen (Ersatzprobe: „welches er absolviert hat“ — passt).",r:"recht-dass"},

{id:"r03",c:"recht",q:"Was ist richtig?",o:["Seid ihr bereit?","Seit ihr bereit?"],a:0,
 e:"<b>seid</b> = Form von „sein“ (ihr seid). <b>seit</b> = Zeitangabe („seit gestern“). Eselsbrücke: Zeit → seit.",r:"recht-seit"},

{id:"r04",c:"recht",q:"Korrekt ist …",o:["Standard","Standart"],a:0,
 e:"<b>Standard</b> mit d — von engl. standard. „Standarte“ ist eine Fahne, etwas ganz anderes.",r:"recht-klassiker"},

{id:"r05",c:"recht",q:"Was stimmt?",o:["Das ist die einzige Lösung.","Das ist die einzigste Lösung."],a:0,
 e:"„einzig“ ist ein Absolutadjektiv und lässt sich nicht steigern. Ebenso: optimal, maximal, ideal, tot.",r:"stil-absolut"},

{id:"r06",c:"recht",q:"Richtig ist …",o:["aus dem Stegreif","aus dem Stehgreif"],a:0,
 e:"Der <b>Stegreif</b> ist der Steigbügel — man sprach, ohne abzusteigen.",r:"recht-klassiker"},

{id:"r07",c:"recht",q:"Was ist korrekt?",o:["Rückgrat","Rückrad"],a:0,
 e:"Das <b>Rückgrat</b> — verwandt mit „Gräte“, nicht mit „Rad“.",r:"recht-klassiker"},

{id:"r08",c:"recht",q:"Korrekt ist …",o:["separat","seperat"],a:0,
 e:"<b>separat</b> — von lat. separare (trennen). Eselsbrücke: „par“ wie in „Paar“ trennen.",r:"recht-klassiker"},

{id:"r09",c:"recht",q:"Welche Form ist richtig?",o:["Peters Trainingsplan","Peter's Trainingsplan"],a:0,
 e:"Das Genitiv-s im Deutschen steht <b>ohne</b> Apostroph. Der „Deppenapostroph“ stammt aus dem Englischen.",r:"recht-apostroph"},

{id:"r10",c:"recht",q:"Wie bildet man den Genitiv von „Nils“?",o:["Nils' Trainingsplan","Nils's Trainingsplan","Nils Trainingsplan"],a:0,
 e:"Endet ein Name auf <b>s, ss, ß, tz, z, x, ce</b>, setzt man einen Apostroph: Andreas' Buch, Max' Rad, Nils' Plan.",r:"recht-apostroph"},

{id:"r11",c:"recht",q:"Was stimmt?",o:["Sie war anscheinend krank.","Sie war scheinbar krank."],a:0,
 e:"<b>anscheinend</b> = allem Anschein nach, vermutlich. <b>scheinbar</b> = nur dem Schein nach, in Wirklichkeit nicht: „Die Sonne bewegt sich scheinbar.“",r:"recht-verwechsel"},

{id:"r12",c:"recht",q:"Welche Schreibung ist korrekt?",o:["Tipp","Tip"],a:0,
 e:"Seit 1996 mit doppeltem p: <b>Tipp</b>, ebenso <b>Stopp</b>, <b>Ass</b>.",r:"recht-klassiker"},

{id:"r13",c:"recht",q:"Korrekt ist …",o:["nummerieren","numerieren"],a:0,
 e:"Nach der Reform mit Doppel-m: <b>nummerieren</b> (wie „Nummer“).",r:"recht-klassiker"},

{id:"r14",c:"recht",q:"ss oder ß? Schreib das Wort vollständig: „Nach dem Rennen war er au___er Atem.“",t:"fill",a:["außer"],
 e:"Nach langem Vokal oder Diphthong steht <b>ß</b>: außer, Maß, Straße, heiß. Nach kurzem Vokal steht <b>ss</b>: Fluss, muss, dass, Kuss. (In der Schweiz gilt durchgängig ss — hier ist die bundesdeutsche Schreibung gefragt.)",r:"recht-sz"},

{id:"r15",c:"recht",q:"Was ist richtig?",o:["Er ist größer als ich.","Er ist größer wie ich."],a:0,
 e:"Beim Komparativ steht <b>als</b>. „wie“ nur bei Gleichheit: „so groß wie ich“.",r:"gram-alswie"},

{id:"r16",c:"recht",q:"Korrekt ist …",o:["Rhythmus","Rythmus"],a:0,
 e:"<b>Rhythmus</b> — zwei h. Merkhilfe: RH–YTH–MUS.",r:"recht-klassiker"},

{id:"r17",c:"recht",q:"Was stimmt?",o:["wider Erwarten","wieder Erwarten"],a:0,
 e:"<b>wider</b> = gegen (widersprechen, widerlegen, widerspiegeln). <b>wieder</b> = erneut (wiederholen, wiedersehen).",r:"recht-wider"},

{id:"r18",c:"recht",q:"Welche Form ist richtig?",o:["Er hat sich sehr angestrengt.","Er hat sich sehr angestrenkt."],a:0,
 e:"Verlängerungsprobe: „anstrengen“ → deutlich hörbares g. So prüft man auch Tod/tot, Rad/Rat, seit/seid.",r:"recht-klassiker"},

{id:"r19",c:"recht",q:"Korrekt ist …",o:["Portemonnaie","Portmonnaie"],a:0,
 e:"Französische Herkunft: <b>Portemonnaie</b> (eingedeutscht auch „Portmonee“ zulässig).",r:"recht-klassiker"},

{id:"r20",c:"recht",q:"Was ist richtig?",o:["Konsens","Konsenz"],a:0,
 e:"<b>Konsens</b> mit s — von lat. consensus. Ebenso: Differenz, Kompetenz, aber Konsens.",r:"recht-klassiker"},

{id:"r21",c:"recht",q:"Vervollständige: „Es geht um das Wohl der Kinder, das ___ nicht gefährdet werden.“",t:"fill",a:["darf"],
 e:"Bezugswort ist „das Wohl“ (Singular) → „darf“. Kongruenzfehler entstehen oft, wenn ein Plural („der Kinder“) dazwischensteht.",r:"gram-kongruenz"},

{id:"r22",c:"recht",q:"Korrekt ist …",o:["Interesse","Intresse"],a:0,
 e:"<b>Interesse</b> — das e in der Mitte wird zwar oft verschluckt, gehört aber hin.",r:"recht-klassiker"},

{id:"r23",c:"recht",q:"Was stimmt?",o:["brillant","brilliant"],a:0,
 e:"Im Deutschen: <b>brillant</b> mit einem i vor dem a (aus dem Französischen). Englisch wäre „brilliant“.",r:"recht-klassiker"},

{id:"r24",c:"recht",q:"Welche Variante ist korrekt?",o:["E-Mail","Email","EMail"],a:0,
 e:"<b>E-Mail</b> mit Bindestrich. „Email“ ohne Bindestrich bezeichnet den Schmelzüberzug (das Email).",r:"recht-bindestrich"},

{id:"r25",c:"recht",q:"Korrekt ist …",o:["Know-how","Knowhow"],a:0,
 e:"Mehrteilige Fremdwörter werden mit Bindestrich gekoppelt: Know-how, Kick-off, Make-up.",r:"recht-bindestrich"},

/* ---------- GRAMMATIK ---------- */
{id:"m01",c:"gram",q:"Welcher Kasus folgt auf „wegen“?",o:["Genitiv","Dativ","Akkusativ"],a:0,
 e:"Standardsprachlich der <b>Genitiv</b>: „wegen des Wetters“. Der Dativ („wegen dem Wetter“) gilt als umgangssprachlich — außer bei artikellosen Substantiven: „wegen Umbau geschlossen“.",r:"gram-genitiv"},

{id:"m02",c:"gram",q:"Was ist korrekt?",o:["während der Vorlesung","während die Vorlesung"],a:0,
 e:"<b>während</b> verlangt den Genitiv. Merksatz für die häufigsten: <b>w</b>egen, <b>w</b>ährend, <b>t</b>rotz, <b>s</b>tatt, <b>i</b>nnerhalb, <b>a</b>ußerhalb.",r:"gram-genitiv"},

{id:"m03",c:"gram",q:"Welche Form ist richtig?",o:["trotz des schlechten Wetters","trotz dem schlechten Wetter"],a:0,
 e:"<b>trotz</b> + Genitiv. (Beim Plural ohne erkennbaren Genitiv weicht man auf den Dativ aus: „trotz Beweisen“.)",r:"gram-genitiv"},

{id:"m04",c:"gram",q:"Wie lautet die indirekte Rede? „Er sagte: ‚Ich bin müde.‘“",o:[
 "Er sagte, er sei müde.","Er sagte, er ist müde.","Er sagte, er wäre müde."],a:0,
 e:"In der indirekten Rede steht der <b>Konjunktiv I</b> („sei“). Auf den Konjunktiv II („wäre“) weicht man vor allem dann aus, wenn Konjunktiv I mit dem Indikativ zusammenfällt — daneben auch, um Zweifel am Gesagten zu markieren.",r:"gram-konjunktiv"},

{id:"m05",c:"gram",q:"Welche Form ist korrekt?",o:[
 "Sie sagten, sie hätten keine Zeit.","Sie sagten, sie haben keine Zeit."],a:0,
 e:"Konjunktiv I wäre hier „haben“ — identisch mit dem Indikativ. Deshalb weicht man auf den <b>Konjunktiv II</b> „hätten“ aus.",r:"gram-konjunktiv"},

{id:"m06",c:"gram",q:"Was ist stilistisch besser?",o:[
 "Wenn ich Zeit hätte, käme ich.","Wenn ich Zeit haben würde, würde ich kommen."],a:0,
 e:"Die einfachen Konjunktiv-II-Formen sind präziser. „würde“ dient als Ersatz nur, wenn die eigene Form ungebräuchlich klingt („würde helfen“ statt „hülfe“).",r:"gram-konjunktiv"},

{id:"m07",c:"gram",q:"Welche Form ist richtig?",o:[
 "Ich habe mit dem Praktikanten gesprochen.","Ich habe mit dem Praktikant gesprochen."],a:0,
 e:"<b>n-Deklination</b>: Der Praktikant bekommt in allen Fällen außer dem Nominativ ein -en. Ebenso: der Mensch, der Junge, der Kollege, der Experte, der Athlet, der Pädagoge.",r:"gram-ndekl"},

{id:"m08",c:"gram",q:"Korrekt ist …",o:[
 "Er half dem Jungen.","Er half dem Junge."],a:0,
 e:"Auch „der Junge“ folgt der n-Deklination: des Jungen, dem Jungen, den Jungen.",r:"gram-ndekl"},

{id:"m09",c:"gram",q:"Wie lautet der Plural von „Praktikum“?",o:["Praktika","Praktikums","Praktiken"],a:0,
 e:"Lateinische Neutra auf -um bilden den Plural auf -a: Praktikum → <b>Praktika</b>, Zentrum → Zentren (Ausnahme), Museum → Museen.",r:"gram-plural"},

{id:"m10",c:"gram",q:"Plural von „Thema“?",o:["Themen","Themas","Themata"],a:0,
 e:"<b>Themen</b>. („Themata“ ist eine sehr alte Nebenform und heute ungebräuchlich.)",r:"gram-plural"},

{id:"m11",c:"gram",q:"Welches Relativpronomen ist richtig? „Der Trainer, ___ Methoden umstritten sind, …“",t:"fill",a:["dessen"],
 e:"Maskulinum Singular Genitiv → <b>dessen</b>. Femininum und Plural → <b>deren</b>.",r:"gram-relativ"},

{id:"m12",c:"gram",q:"Was ist gemeint? „Wir nutzen dieselbe Halle.“",o:[
 "Genau die eine, identische Halle",
 "Eine Halle derselben Art"],a:0,
 e:"<b>derselbe</b> = identisch. <b>der gleiche</b> = von gleicher Art: „Wir haben die gleichen Schuhe“ (zwei Paar), „dieselben Schuhe“ (ein Paar).",r:"gram-derselbe"},

{id:"m13",c:"gram",q:"Welche Formulierung ist standardsprachlich?",o:[
 "Die Untersuchung fand 2024 statt.","Die Untersuchung fand in 2024 statt."],a:0,
 e:"„in 2024“ ist eine Übernahme aus dem Englischen. Korrekt: <b>2024</b> oder <b>im Jahr 2024</b>.",r:"stil-anglizismus"},

{id:"m14",c:"gram",q:"Welches Verb passt? „Er nimmt ___ dem Wettkampf teil.“",t:"fill",a:["an"],
 e:"Feste Verb-Präposition-Verbindungen musst du mitlernen: teilnehmen <b>an</b>, sich beteiligen <b>an</b>, sich beziehen <b>auf</b>, hinweisen <b>auf</b>, bestehen <b>aus</b> (Bestandteile) / <b>in</b> (worin es besteht).",r:"gram-praep"},

{id:"m15",c:"gram",q:"Was ist korrekt?",o:[
 "Die Arbeit bezieht sich auf eine ältere Studie.",
 "Die Arbeit bezieht sich über eine ältere Studie."],a:0,
 e:"<b>sich beziehen auf</b> + Akkusativ. Verwechslungsgefahr mit „berichten über“.",r:"gram-praep"},

{id:"m16",c:"gram",q:"Welche Form ist richtig?",o:["meinetwegen","wegen mir","meinerwegen"],a:0,
 e:"Bei Pronomen bildet man die Form auf -etwegen: <b>meinetwegen, deinetwegen, seinetwegen, unsertwegen</b>. „wegen mir“ ist umgangssprachlich.",r:"gram-genitiv"},

{id:"m17",c:"gram",q:"Was stimmt?",o:[
 "Ich erinnere mich an das Spiel.","Ich erinnere das Spiel."],a:0,
 e:"Standardsprachlich reflexiv mit Präposition: <b>sich erinnern an</b>. Die transitive Form ist norddeutsch-regional.",r:"gram-praep"},

{id:"m18",c:"gram",q:"Welche Zeitform passt? „Nachdem er sich aufgewärmt ___, begann das Training.“",t:"fill",a:["hatte"],
 e:"Vorzeitigkeit zur Vergangenheit → <b>Plusquamperfekt</b>. Faustregel: nachdem + Plusquamperfekt / Präteritum, bzw. Perfekt / Präsens.",r:"gram-zeiten"},

{id:"m19",c:"gram",q:"Was ist korrekt?",o:[
 "Eine Reihe von Studierenden hat teilgenommen.",
 "Beides ist zulässig",
 "Eine Reihe von Studierenden haben teilgenommen."],a:1,
 e:"Formal richtet sich das Verb nach „eine Reihe“ (Singular), der Plural gilt aber als „Kongruenz nach dem Sinn“ und ist ebenfalls korrekt.",r:"gram-kongruenz"},

{id:"m20",c:"gram",q:"Welcher Kasus? „Innerhalb ___ Woche muss die Abgabe erfolgen.“",t:"fill",a:["einer"],
 e:"„innerhalb“ + Genitiv: <b>innerhalb einer Woche</b>. Bei Zeitangaben ist auch „innerhalb von einer Woche“ üblich.",r:"gram-genitiv"},

{id:"m21",c:"gram",q:"Was ist richtig?",o:[
 "Sie ist mindestens 18 Jahre alt.",
 "Sie ist zumindest 18 Jahre alt."],a:0,
 e:"<b>mindestens</b> bei Zahlen und Mengen (nicht weniger als). <b>zumindest</b> bedeutet „wenigstens“ und schränkt ein: „Er hat zumindest geantwortet.“",r:"recht-verwechsel"},

{id:"m22",c:"gram",q:"Korrekt ist …",o:[
 "Er gedachte des Verstorbenen.","Er gedachte dem Verstorbenen."],a:0,
 e:"Einige Verben regieren den Genitiv: gedenken, sich bedienen, sich rühmen, sich enthalten, bedürfen, harren.",r:"gram-genitiv"},

{id:"m23",c:"gram",q:"Welche Präposition ist richtig? „Er achtet ___ seine Ernährung.“",t:"fill",a:["auf"],
 e:"<b>achten auf</b> + Akkusativ. Nicht verwechseln mit „beachten“ (ohne Präposition).",r:"gram-praep"},

{id:"m24",c:"gram",q:"Was stimmt?",o:[
 "Das ist der Bericht des Trainers.","Das ist der Bericht von dem Trainer."],a:0,
 e:"Der Genitiv ist in der Schriftsprache die richtige Wahl. Die „von“-Umschreibung nutzt man, wenn der Genitiv nicht markiert werden kann („der Preis von Öl“).",r:"gram-genalltag"},

{id:"m25",c:"gram",q:"Welche Form ist korrekt?",o:[
 "Ich half ihm.","Ich half ihn."],a:0,
 e:"„helfen“ regiert den <b>Dativ</b>. Ebenso: danken, gratulieren, folgen, gehören, begegnen, zuhören, widersprechen.",r:"gram-kasus"},

/* ---------- STIL ---------- */
{id:"s01",c:"stil",q:"Welche Fassung ist klarer?",o:[
 "Wir untersuchten die Belastung der Sportlerinnen.",
 "Die Durchführung der Untersuchung der Belastung der Sportlerinnen erfolgte durch uns."],a:0,
 e:"<b>Nominalstil auflösen:</b> Substantive auf -ung, -heit, -keit häufen sich in Uni-Texten. Ersetze sie durch das zugrunde liegende Verb.",r:"stil-nominal"},

{id:"s02",c:"stil",q:"Welcher Satz ist besser?",o:[
 "Wir wendeten das Verfahren an.",
 "Das Verfahren kam zur Anwendung."],a:0,
 e:"„zur Anwendung kommen“, „in Erwägung ziehen“, „zur Durchführung bringen“ sind <b>Streckverben</b>. Das einfache Verb ist fast immer stärker.",r:"stil-nominal"},

{id:"s03",c:"stil",q:"Welche Wörter sind hier überflüssig? „Er hat das eigentlich irgendwie schon quasi verstanden.“",o:[
 "eigentlich, irgendwie, quasi","er, das, schon","hat, das, verstanden"],a:0,
 e:"<b>Füllwörter</b> schwächen jede Aussage: eigentlich, irgendwie, quasi, sozusagen, letztendlich, halt, eben, natürlich, durchaus.",r:"stil-fuellwort"},

{id:"s04",c:"stil",q:"Was ist an „bereits schon“ falsch?",o:[
 "Doppelung",
 "Nichts, es verstärkt","Falscher Kasus"],a:0,
 e:"<b>Pleonasmen</b> sagen zweimal dasselbe: bereits schon, eventuell vielleicht, kleines Detail, runder Kreis, neu renoviert, persönlich anwesend, gemeinsames Miteinander.",r:"stil-pleonasmus"},

{id:"s05",c:"stil",q:"Welche Fassung ist präziser?",o:[
 "Die Gruppe verfehlte das Ziel.",
 "Die Gruppe hat das Ziel nicht so richtig gemacht."],a:0,
 e:"Ersetze Allerweltsverben (machen, tun, sein, haben, geben) durch <b>präzise Verben</b>. Das schärft den Satz mehr als jedes Adjektiv.",r:"stil-verben"},

{id:"s06",c:"stil",q:"Welcher Satz liest sich besser?",o:[
 "Die Teilnehmenden füllten den Fragebogen aus.",
 "Der Fragebogen wurde von den Teilnehmenden ausgefüllt."],a:0,
 e:"Das <b>Aktiv</b> nennt den Handelnden und ist kürzer. Passiv ist nur sinnvoll, wenn der Handelnde unwichtig oder unbekannt ist.",r:"stil-passiv"},

{id:"s07",c:"stil",q:"Was ist das Problem an „Es gibt viele Studien, die zeigen, dass …“?",o:[
 "„Es gibt“ ist eine Leerformel",
 "Der Satz ist grammatisch falsch","Zu wenig Kommas"],a:0,
 e:"„Es gibt“ und „Es ist so, dass“ schieben einen Leerlauf vor den eigentlichen Satz. Streich sie, und der Satz beginnt beim Thema.",r:"stil-esgibt"},

{id:"s08",c:"stil",q:"Welche Formulierung ist stilistisch sauberer?",o:[
 "Diese Regel ergibt Sinn.","Diese Regel macht Sinn."],a:0,
 e:"„Sinn machen“ ist eine Lehnübersetzung aus dem Englischen. In gehobenen Texten: <b>Sinn ergeben</b> oder <b>sinnvoll sein</b>. (Umgangssprachlich ist „Sinn machen“ längst üblich.)",r:"stil-anglizismus"},

{id:"s09",c:"stil",q:"Was ist an diesem Satz schwierig? „Die vom Trainer, der seit drei Jahren, seit er die Lizenz hat, arbeitet, geplante Einheit fiel aus.“",o:[
 "Schachtelsatz","Zu wenig Kommas","Falscher Kasus"],a:0,
 e:"Klammern und Einschübe überlasten das Arbeitsgedächtnis. Faustregel: <b>ein Gedanke pro Satz</b>, maximal eine Ebene Einschub.",r:"stil-schachtel"},

{id:"s10",c:"stil",q:"Welche Fassung ist besser?",o:[
 "Die Methode überzeugt.","Die Methode ist nicht unüberzeugend."],a:0,
 e:"<b>Doppelte Verneinung</b> wirkt zögerlich und ist schwerer zu lesen. Sag direkt, was du meinst.",r:"stil-verneinung"},

{id:"s11",c:"stil",q:"Was ist präziser?",o:[
 "Die Belastung stieg um 12 Prozent.",
 "Die Belastung stieg deutlich an."],a:0,
 e:"Konkrete Zahlen schlagen wertende Adverbien. „Deutlich“, „erheblich“, „relativ“ sind ohne Bezugsgröße bedeutungslos.",r:"stil-konkret"},

{id:"s12",c:"stil",q:"Welcher Genitiv ist zu viel? „die Auswertung der Ergebnisse der Befragung der Teilnehmenden“",o:[
 "Genitivkette","Alles korrekt","Der erste Genitiv"],a:0,
 e:"Grammatisch richtig, stilistisch zäh. Besser: „die Ergebnisse der Teilnehmerbefragung auswerten“.",r:"stil-genitivkette"},

{id:"s13",c:"stil",q:"Was ist der Unterschied zwischen „effektiv“ und „effizient“?",o:[
 "effektiv = wirksam, effizient = wirtschaftlich",
 "Sie bedeuten dasselbe",
 "effizient = wirksam, effektiv = schnell"],a:0,
 e:"<b>Effektiv</b> heißt: das richtige Ziel wird erreicht. <b>Effizient</b> heißt: mit möglichst wenig Aufwand.",r:"recht-verwechsel"},

{id:"s14",c:"stil",q:"Welche Fassung passt besser in eine Hausarbeit?",o:[
 "Die Ergebnisse deuten darauf hin, dass …",
 "Man sieht ja klar, dass …"],a:0,
 e:"Wissenschaftliche Sprache ist <b>zurückhaltend im Anspruch, präzise im Ausdruck</b>. Vermeide „man“, „ja“, „klar“, „natürlich“.",r:"stil-wissenschaft"},

{id:"s15",c:"stil",q:"Was stört hier? „In diesem Kontext möchte ich anmerken, dass die Thematik durchaus als relevant erachtet werden kann.“",o:[
 "Aufgeblähte Floskeln ohne Aussage",
 "Grammatikfehler","Zu kurz"],a:0,
 e:"Der Satz sagt: „Das Thema ist relevant.“ Streich Floskeln wie „in diesem Kontext“, „an dieser Stelle“, „es sei angemerkt“.",r:"stil-floskel"},

{id:"s16",c:"stil",q:"Welches Wort ist präziser für „gucken, ob etwas stimmt“?",o:["überprüfen","checken","machen"],a:0,
 e:"In geschriebenen Texten das deutsche Fachwort wählen: überprüfen, verifizieren, kontrollieren — je nach Nuance.",r:"stil-anglizismus"},

{id:"s17",c:"stil",q:"Was ist an „optimalste Lösung“ falsch?",o:[
 "„optimal“ ist bereits ein Superlativ",
 "Nichts","Falsche Endung"],a:0,
 e:"Absolutadjektive lassen sich nicht steigern: optimal, maximal, minimal, ideal, einzig, tot, schwanger.",r:"stil-absolut"},

{id:"s18",c:"stil",q:"Welche Version wirkt souveräner?",o:[
 "Die Daten zeigen einen Zusammenhang.",
 "Ich denke, dass die Daten vielleicht irgendwie einen Zusammenhang zeigen könnten."],a:0,
 e:"Häufung von Abschwächungen („ich denke“, „vielleicht“, „irgendwie“, „könnte“) untergräbt die eigene Aussage. Eine Absicherung reicht.",r:"stil-hedging"},

{id:"s19",c:"stil",q:"Was ist die bessere Verbwahl? „Die Studie ___ zu dem Ergebnis, dass …“",o:["kommt","macht","tut"],a:0,
 e:"Kollokationen — feste Wortpartnerschaften — musst du kennen: zu einem Ergebnis <b>kommen/gelangen</b>, eine Frage <b>aufwerfen</b>, Kritik <b>üben</b>, einen Beitrag <b>leisten</b>.",r:"stil-kollokation"},

{id:"s20",c:"stil",q:"Welcher Satz vermeidet die Wortwiederholung besser?",o:[
 "Das Training war hart. Die Einheit forderte alle.",
 "Das Training war hart. Das Training forderte alle."],a:0,
 e:"Variiere über <b>Synonyme, Oberbegriffe oder Pronomen</b> — aber nur, solange der Bezug eindeutig bleibt. In Fachtexten geht Eindeutigkeit vor Abwechslung.",r:"stil-wiederholung"}

{w:"prägnant",p:"Adj.",d:"treffend und knapp auf den Punkt gebracht",ex:"Eine prägnante Formulierung ersetzt drei Nebensätze.",s:"treffend, bündig, markant"},
{w:"stringent",p:"Adj.",d:"logisch zwingend, ohne Bruch im Gedankengang",ex:"Die Argumentation ist stringent aufgebaut.",s:"schlüssig, folgerichtig, zwingend"},

{w:"ambivalent",p:"Adj.",d:"in sich zwiespältig, zwei gegensätzliche Seiten habend",ex:"Sein Verhältnis zum Wettkampf ist ambivalent.",s:"zwiespältig, doppeldeutig",t:"Nicht „unentschlossen“ — es geht um gleichzeitige Gegensätzlichkeit."},
{w:"akribisch",p:"Adj.",d:"äußerst sorgfältig bis ins kleinste Detail",ex:"Sie protokollierte die Beobachtung akribisch.",s:"peinlich genau, minuziös"},
