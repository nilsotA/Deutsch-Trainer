{id:"komma-nebensatz",c:"komma",t:"Nebensätze werden abgetrennt",b:`
<p>Die wichtigste Kommaregel überhaupt: Zwischen Haupt- und Nebensatz steht ein Komma — egal, in welcher Reihenfolge. Ausnahmen sind selten und stehen unten.</p>
<div class="ex">Er ging nach Hause<span class="ok">,</span> weil es regnete.<br>Weil es regnete<span class="ok">,</span> ging er nach Hause.</div>
<p><b>Erkennungszeichen für Nebensätze:</b> Das gebeugte Verb steht am Ende. Eingeleitet werden sie von:</p>
<ul>
<li>Konjunktionen: <code>weil, dass, ob, wenn, als, damit, obwohl, während, bevor, nachdem, sobald, solange, sofern, falls, indem, sodass</code></li>
<li>Relativpronomen: <code>der, die, das, welcher, dessen, deren</code></li>
<li>Fragewörtern in indirekten Fragen: <code>wer, was, wie, wo, warum</code></li>
<li>der Paarformel <code>je … desto</code> — der je-Teil ist ein Gliedsatz: „<b>Je</b> länger er trainierte<span class="ok">,</span> <b>desto</b> ruhiger wurde sein Puls.“</li>
</ul>
<p>Steckt der Nebensatz mitten im Satz, braucht er <b>zwei</b> Kommas. Das schließende wird am häufigsten vergessen.</p>
<div class="ex">Die Halle<span class="ok">,</span> in der wir trainieren<span class="ok">,</span> wird saniert.</div>
<p><b>Zwei Nachträge zum Erkennungszeichen.</b> Es greift nicht bei jedem Nebensatz:</p>
<ul>
<li>Der <b>uneingeleitete</b> Nebensatz hat kein Einleitewort und das Verb an zweiter Stelle — abgetrennt wird er trotzdem:<br>
<span class="ex">Er sagte<span class="ok">,</span> er komme später.</span></li>
<li>Bei <b>formelhaft verkürzten</b> Nebensätzen darf das Komma wegfallen. Das ist die Ausnahme von der Regel oben:<br>
<span class="ex">Sag <span class="ok">(,)</span> wenn möglich <span class="ok">(,)</span> vorher Bescheid.</span><br>
Ebenso <i>wie besprochen</i>, <i>wie gesagt</i>, <i>wie üblich</i>. Wird die Wendung länger („wie heute Morgen am Telefon besprochen“), ist sie nicht mehr formelhaft und das Komma steht.</li>
</ul>
<p class="tiny muted">Belegt: Amtliches Regelwerk § 76 zu formelhaften verkürzten Nebensätzen (Duden, Sprachratgeber). Faustregel dort: ab etwa vier Wörtern Kommas setzen.</p>`},

{id:"komma-infinitiv",c:"komma",t:"Infinitivgruppen mit „zu“",b:`
<p>Hier hat sich die Regel geändert: Seit dem <b>1. Juli 2024</b> wird eine
<b>erweiterte Infinitivgruppe immer mit Komma abgetrennt</b>. Vorher war das Komma in
vielen dieser Fälle freigestellt — wer es so gelernt hat, lernt es an dieser Stelle neu.</p>
<p><b>Erweitert</b> heißt: <code>zu</code> + Infinitiv und mindestens ein weiteres Wort.</p>
<ul>
<li><b>erweitert:</b> <i>pünktlich zu sein</i> · <i>die Prüfung zu bestehen</i> · <i>ihn nicht hereinzulassen</i></li>
<li><b>nicht erweitert:</b> <i>zu sein</i> · <i>zu bestehen</i> · <i>hereinzulassen</i></li>
</ul>
<p>Bei der erweiterten Gruppe steht das Komma also auch dann, wenn kein Einleitewort davorsteht:</p>
<div class="ex">Er hat versucht<span class="ok">,</span> pünktlich zu sein.</div>
<p>Steht die Gruppe mitten im Satz, wird sie beidseitig abgetrennt:</p>
<div class="ex">Der Plan<span class="ok">,</span> täglich zu laufen<span class="ok">,</span> war ambitioniert.</div>
<p>Mit Einleitewort war das Komma schon vorher Pflicht — daran ändert sich nichts:</p>
<div class="ex">Er trainiert<span class="ok">,</span> um sich zu verbessern.</div>
<p><b>Merksatz:</b> <i>um, ohne, statt, anstatt, außer, als</i> — sechs Wörter, ein Komma.</p>
<p><b>Freigestellt</b> bleibt das Komma bei der nicht erweiterten Gruppe, also bei bloßem
<code>zu</code> + Infinitiv:</p>
<div class="ex">Er hat versucht<span class="ok">(,)</span> zu kommen.</div>
<p><b>Ausnahme:</b> Nach <code>brauchen, pflegen, scheinen</code> steht kein Komma. Der
zu-Infinitiv bildet dort mit dem Verb eine Einheit und ist kein eigener Satz.</p>
<div class="ex">Du brauchst nicht extra zu kommen.<br>Er scheint das Training zu genießen.</div>
<p class="tiny muted">Belegt: Amtliches Regelwerk in der Fassung 2024, § 73, in Kraft seit
1. Juli 2024 (Rat für deutsche Rechtschreibung); Abgrenzung erweitert/nicht erweitert nach
der Gesellschaft für deutsche Sprache.</p>`},

{id:"komma-aufzaehlung",c:"komma",t:"Aufzählungen und Konjunktionen",b:`
<p>Gleichrangige Teile werden durch Komma getrennt — außer, es steht schon eine Konjunktion dazwischen.</p>
<p><b>Komma steht vor:</b> <code>aber, sondern, doch, jedoch, allein, das heißt, und zwar, nämlich, zum Beispiel</code></p>
<div class="ex">Nicht die Technik war das Problem<span class="ok">,</span> sondern die Kondition.</div>
<p><b>Kein Komma steht vor:</b> <code>und, oder, beziehungsweise, sowie, wie, entweder … oder, weder … noch, sowohl … als auch</code></p>
<p class="tiny muted">Das gilt für <b>als</b> und <b>wie</b> nur beim bloßen Vergleich („größer als erwartet“). Folgt ein ganzer Nebensatz mit gebeugtem Verb, steht das Komma: „schneller<b>,</b> als ich erwartet hatte“.</p>
<div class="ex">Sie ist sowohl schnell<span class="nope">,</span> als auch ausdauernd. → ohne Komma</div>
<p><b>Zwei Ausnahmen:</b> Verbinden die Paarformeln ganze <b>Nebensätze</b>, sind Kommas Pflicht — „Er bemerkte sowohl<span class="ok">,</span> dass er zu kurz gesprungen war<span class="ok">,</span> als auch<span class="ok">,</span> dass die Katze schneller war.“ Zwischen zwei <b>Hauptsätzen</b> darf zur Verdeutlichung ein Komma stehen.</p>
<p>In einer reinen Aufzählung steht vor dem abschließenden „und“ kein Komma — das englische „Oxford-Komma“ gibt es im Deutschen nicht. Ein Komma kann dort trotzdem auftauchen, wenn es einen eingeschobenen Nebensatz schließt: „Er kaufte Äpfel, Birnen, die er mochte, und Bananen.“</p>`},

{id:"komma-hauptsatz",c:"komma",t:"Komma zwischen Hauptsätzen",b:`
<p>Zwei vollständige Hauptsätze ohne verbindende Konjunktion müssen getrennt werden. Das Komma ist der Normalfall, <b>Semikolon oder Punkt gehen genauso</b> — nur gar kein Zeichen geht nicht.</p>
<div class="ex">Sie war müde<span class="ok">,</span> trotzdem lief sie weiter.</div>
<p>Achtung: <code>trotzdem, deshalb, dennoch, außerdem, allerdings</code> sind <b>Adverbien</b>, keine Konjunktionen — sie ersetzen das Komma nicht.</p>
<p>Verbunden durch <code>und</code> oder <code>oder</code>: <b>Komma freigestellt</b>.</p>
<div class="ex">Er packte die Tasche<span class="ok">(,)</span> und sie schloss die Tür.</div>
<p><b>Ausnahme — hier ist es doch Pflicht:</b> wenn ein eingeschobener Nebensatz geschlossen werden muss.</p>
<div class="ex">Er wartete<span class="ok">,</span> bis es dunkel wurde<span class="ok">,</span> und ging dann los.</div>
<p class="tiny muted">Belegt: Die Reform von 1996 hat das Komma vor <i>und</i> und <i>oder</i> zwischen vollständigen Hauptsätzen freigestellt; es darf zur Verdeutlichung der Gliederung stehen (Duden, Sprachratgeber). Die Paragrafennummern des Regelwerks wurden 2024 neu vergeben — ältere Fundstellen zählen anders.</p>`},

{id:"komma-einschub",c:"komma",t:"Einschübe, Appositionen, Nachträge",b:`
<p>Alles, was den Satz unterbricht oder nachträglich erläutert, wird <b>beidseitig</b> abgetrennt. Merksatz: <i>Was du aufmachst, musst du schließen.</i></p>
<ul>
<li><b>Apposition:</b> Mein Bruder<span class="ok">,</span> ein leidenschaftlicher Läufer<span class="ok">,</span> startet in Köln.</li>
<li><b>Erläuterung:</b> Wir treffen uns morgen<span class="ok">,</span> das heißt am Dienstag.</li>
<li><b>Anrede / Ausruf:</b> Nein<span class="ok">,</span> das sehe ich anders.</li>
<li><b>Herausstellung:</b> Sport<span class="ok">,</span> das ist mein Ausgleich.</li>
<li><b>Nachtrag:</b> Er hat gewonnen<span class="ok">,</span> wie erwartet.</li>
</ul>
<p>Vor <code>zum Beispiel</code> steht ein Komma, danach nicht:</p>
<div class="ex">Wir bieten Kurse an<span class="ok">,</span> zum Beispiel<span class="nope">,</span> Yoga.</div>`},

{id:"komma-vergleich",c:"komma",t:"Vergleiche mit „als“ und „wie“",b:`
<p><b>Kein Komma</b>, wenn nur ein Satzteil folgt:</p>
<div class="ex">Er lief schneller als ich.<br>Die Gruppe war größer als erwartet.</div>
<p><b>Komma</b>, wenn ein vollständiger Nebensatz folgt (mit eigenem gebeugtem Verb):</p>
<div class="ex">Er lief schneller<span class="ok">,</span> als ich erwartet hatte.</div>
<p><b>Test:</b> Steht hinter „als“ oder „wie“ ein gebeugtes Verb? Dann Komma.</p>`},

{id:"komma-adjektive",c:"komma",t:"Komma zwischen Adjektiven",b:`
<p>Gleichrangige Adjektive bekommen ein Komma, nicht gleichrangige nicht.</p>
<p><b>Und-Probe:</b> Lässt sich zwischen den Adjektiven „und“ einsetzen, ohne dass der Satz schief klingt, gehört ein Komma hin.</p>
<div class="ex">ein langer<span class="ok">,</span> anstrengender Lauf → „lang und anstrengend“ ✓<br>
das neue<span class="nope">,</span> akademische Jahr → „neu und akademisch“ ergibt keinen Sinn, weil „akademisches Jahr“ ein fester Begriff ist</div>
<p><b>Wo die Probe nicht entscheidet.</b> Bei festen Verbindungen wie <i>akademisches Jahr</i> oder <i>französischer Rotwein</i> ist der Fall klar. Dazwischen liegt ein breiter Bereich, in dem beides geht — und das Komma ist dort keine Rechtschreibfrage, sondern deine Aussage:</p>
<div class="ex">die neue rote Trainingsjacke → die neue unter den roten<br>
die neue<span class="ok">,</span> rote Trainingsjacke → sie ist neu und sie ist rot</div>
<p>Beides ist zulässig. Wer das Komma setzt, zählt auf; wer es weglässt, behandelt <i>rote Trainingsjacke</i> als Einheit.</p>
<p class="tiny muted">Belegt: Duden, Sprachratgeber „Komma zwischen Adjektiven“ — bei gleichrangigen Adjektiven mit aufzählendem Charakter ist das Komma Pflicht; in Zweifelsfällen kann die Schreibende durch Setzen oder Weglassen verdeutlichen, was gemeint ist.</p>`},

{id:"komma-partizip",c:"komma",t:"Partizipgruppen",b:`
<p>Seit der Rechtschreibreform von 1996 ist das Komma bei Partizip- und Adjektivgruppen <b>freigestellt</b>:</p>
<div class="ex">Von der Hitze erschöpft<span class="ok">(,)</span> brach sie das Training ab.</div>
<p><b>Pflicht</b> wird es nur, wenn die Gruppe …</p>
<ul>
<li>… als Einschub mitten im Satz steht</li>
<li>… nachgetragen wird: „Sie brach ab, völlig erschöpft.“</li>
<li>… durch ein hinweisendes Wort angekündigt wird</li>
</ul>
<p>Empfehlung: setzen, wenn es die Lesbarkeit erhöht — das ist fast immer der Fall.</p>
<p class="tiny muted">Belegt: Die Reform von 1996 hat die Pflichtfälle auf Nachtrag und hinweisendes Wort zusammengezogen; sonst ist das Komma seither freigestellt. Die Fassung 2024 des Regelwerks ändert daran nichts — anders als bei den Infinitivgruppen.</p>`},

{id:"komma-brief",c:"komma",t:"Anrede, Gruß, Datum",b:`
<ul>
<li>Nach der Anrede steht ein Komma, danach geht es <b>klein</b> weiter:<br>
<span class="ex">Sehr geehrte Frau Weber<span class="ok">,</span><br>vielen Dank für Ihre Rückmeldung.</span></li>
<li>Nach der Grußformel steht <b>kein</b> Satzzeichen:<br>
<span class="ex">Mit freundlichen Grüßen<span class="nope">,</span><br>Nils Otten</span></li>
<li>Das Komma ist die empfohlene Form, nicht die einzige: Der Duden lässt nach der Anrede weiterhin ein <b>Ausrufezeichen</b> zu („Sehr geehrte Damen und Herren!“). Es wirkt heute aus der Zeit gefallen, und die DIN 5008 sieht für Geschäftsbriefe das Komma vor. In der Schweiz steht nach der Anredezeile oft <b>gar kein Zeichen</b>. Nach dem Ausrufezeichen geht es übrigens <b>groß</b> weiter.</li>
<li>Zwischen Ort und Datum steht ein Komma: <span class="ex">Köln<span class="ok">,</span> den 12. Mai 2026</span></li>
<li>Mehrteilige Datumsangabe im Satz — schließendes Komma möglich:<br>
<span class="ex">Am Montag<span class="ok">,</span> dem 12. Mai<span class="ok">,</span> beginnt der Kurs.</span></li>
</ul>`},

/* ---------- GROSS-/KLEINSCHREIBUNG ---------- */
{id:"gross-subst",c:"gross",t:"Substantivierungen erkennen",b:`
<p>Adjektive, Partizipien und andere Wortarten werden großgeschrieben, sobald sie <b>wie ein Substantiv</b> gebraucht werden. Signalwörter:</p>
<ul>
<li><b>Artikel oder Präposition + Artikel:</b> <code>das Beste, im Allgemeinen, des Weiteren, im Folgenden, im Übrigen, im Wesentlichen, im Voraus, im Nachhinein, auf dem Laufenden, im Klaren</code></li>
<li><b>alles, etwas, nichts, viel, wenig:</b> <code>alles Gute, etwas Neues, nichts Besonderes, viel Interessantes</code></li>
<li><b>Genitivformel:</b> <code>des Öfteren, des Weiteren</code></li>
</ul>
<p><b>Ausnahmen, die man einfach lernen muss:</b> <code>zum einen … zum anderen</code>, <code>ein bisschen</code>, <code>die meisten</code>, <code>am besten</code> (Frage „wie?“).</p>
<p><b>Schwankungsfälle</b> (beides zulässig, Duden empfiehlt groß): <code>vor Kurzem, seit Langem, seit Längerem, ohne Weiteres, von Weitem, bei Weitem</code>.</p>
<p><b>Der Unterschied dahinter:</b> Die Wahl gibt es nur bei <b>Präposition ohne Artikel</b>. Sobald ein Artikel mitspielt — auch versteckt in <i>im, am, zum, des</i> —, liegt eine Substantivierung vor und es wird <b>groß</b> geschrieben: <code>im Allgemeinen, im Einzelnen, im Folgenden, im Wesentlichen, des Weiteren</code>.</p>`},

{id:"gross-zeit",c:"gross",t:"Zeitangaben groß oder klein?",b:`
<ul>
<li><b>Groß</b> — Tageszeiten nach heute/gestern/morgen: <code>heute Morgen, gestern Abend, morgen Nachmittag</code></li>
<li><b>Klein</b> — das Adverb „früh“: <code>morgen früh</code> (Duden-Empfehlung; „morgen Früh“ ist zulässig, süddeutsch-österreichisch geprägt)</li>
<li><b>Groß</b> — Wochentage und Monate: <code>am Freitag, Ende Mai, Anfang nächster Woche</code></li>
<li><b>Klein</b> — Adverbien auf -s: <code>montags, abends, freitags, morgens</code></li>
<li><b>Zusammen und groß</b> bei Kombinationen: <code>Montagmorgen, Sonntagabend</code></li>
</ul>`},

{id:"gross-wendung",c:"gross",t:"Feste Wendungen mit Substantiv",b:`
<p>Steckt ein echtes Substantiv in der Wendung, bleibt es groß:</p>
<div class="ex">außer Acht lassen · in Kauf nehmen · in Betracht ziehen · zu Rate ziehen · in Bezug auf · nach Hause · zu Hause · Angst haben · Rad fahren</div>
<p><b>Klein</b> bleiben verblasste Substantive und Adjektive in Verbverbindungen:</p>
<div class="ex">Es tut mir leid. · Ihm wird angst und bange. · Er macht mir angst. · Er ist pleite.</div>
<p class="tiny muted">Bei „angst machen“ lässt der Duden daneben die Großschreibung zu; bei „Angst haben“ ist nur die Großschreibung richtig.</p>
<p><b>Beides erlaubt:</b> <code>recht haben / Recht haben</code>, <code>recht behalten / Recht behalten</code>.</p>`},

{id:"gross-sprachen",c:"gross",t:"Sprachbezeichnungen",b:`
<p><b>Groß</b> als Substantiv: <code>Deutsch lernen, auf Deutsch, mein Deutsch, ins Englische übersetzen</code></p>
<p><b>Klein</b> als Adjektiv: <code>die deutsche Sprache, deutsche Grammatik, er spricht deutsch (= auf deutsche Art, selten)</code></p>
<p>Faustregel: Frage „Was?“ → groß. Frage „Wie?“ → klein.</p>`},

/* ---------- GETRENNT / ZUSAMMEN ---------- */
{id:"getrennt-praep",c:"getrennt",t:"Präposition + Substantiv",b:`
<p><b>Nur zusammen:</b> <code>zurzeit</code> (= momentan), <code>irgendetwas</code>, <code>irgendjemand</code>, <code>nichtsdestotrotz</code></p>
<p><b>Nur getrennt:</b> <code>wie viel</code>, <code>viel zu viel</code>, <code>nach Hause</code>, <code>in Bezug auf</code></p>
<p><b>Beides zulässig</b> — die erste Form ist die vom Duden empfohlene:<br>
<code>aufgrund / auf Grund</code>, <code>mithilfe / mit Hilfe</code>, <code>anstelle / an Stelle</code>, <code>infrage / in Frage stellen</code>, <code>zugrunde / zu Grunde</code>, <code>imstande / im Stande</code>, <code>außerstande / außer Stande</code>, <code>zu Hause / zuhause</code></p>
<p class="tiny muted">Als Substantiv nur zusammen und groß: <b>ein eigenes Zuhause</b>.</p>
<p><b>Bedeutungsunterschied beachten:</b><br>
<code>zurzeit</code> = momentan · <code>zur Zeit</code> + Genitiv = in der Epoche von<br>
<code>soviel ich weiß</code> (Konjunktion) · <code>so viel Arbeit</code> (Menge)</p>
<p>Merke: Diese Präpositionen verlangen den <b>Genitiv</b> — aufgrund <i>des</i> Wetters, mithilfe <i>eines</i> Plans, anstelle <i>der</i> Trainerin.</p>
<p class="tiny muted">Mit eingeschobenem „von“ steht dagegen der Dativ, und das ist ebenfalls korrekt: <i>mithilfe von Karten</i>, <i>anstelle von Herrn Weber</i>, <i>aufgrund von Verletzungen</i>. Nötig ist diese Form immer dann, wenn der Genitiv nicht erkennbar wäre — etwa im Plural ohne Artikel.</p>`},

{id:"getrennt-verb",c:"getrennt",t:"Verbverbindungen",b:`
<p><b>Getrennt</b>, wenn beide Teile ihre eigene Bedeutung behalten:</p>
<div class="ex">Rad fahren · Auto fahren · übrig bleiben · sitzen bleiben (wörtlich) · liegen lassen</div>
<p><b>Zusammen</b>, wenn eine neue, übertragene Bedeutung entsteht:</p>
<div class="ex">zurechtkommen · zusammenarbeiten · wiedersehen · feststellen · hinterfragen · sitzenbleiben (in der Schule)</div>
<p><b>Beides erlaubt:</b> <code>kennenlernen / kennen lernen</code> (Duden empfiehlt zusammen), <code>gutgehen / gut gehen</code>.</p>
<p><b>Wichtig:</b> Im Hauptsatz wird das Verb ohnehin getrennt — „Er kommt gut <b>zurecht</b>.“ Das ist keine Getrenntschreibung, sondern die normale Verbklammer.</p>`},

{id:"getrennt-konj",c:"getrennt",t:"Konjunktionen und Adverbien",b:`
<ul>
<li><code>sodass</code> und <code>so dass</code> — beides korrekt, im Text einheitlich verwenden</li>
<li><code>soviel ich weiß</code> (Konjunktion, zusammen) vs. <code>so viel Zeit</code> (Menge, getrennt)</li>
<li><code>nichtsdestotrotz</code> — zusammen, laut Duden aber <b>umgangssprachlich</b> (scherzhafte Mischbildung aus „nichtsdestoweniger“ und „trotzdem“). Standardsprachlich sind <code>nichtsdestoweniger</code> und <code>nichtsdestominder</code>.</li>
<li><code>irgendetwas, irgendwann, irgendwo, irgendjemand</code> — zusammen</li>
<li><code>zumindest, zumal, zudem, obendrein</code> — zusammen</li>
</ul>`},

/* ---------- RECHTSCHREIBUNG ---------- */
{id:"recht-dass",c:"recht",t:"das oder dass?",b:`
<p><b>Die Ersatzprobe entscheidet.</b> Lässt sich <code>dieses</code>, <code>jenes</code> oder <code>welches</code> einsetzen, schreibt man <b>das</b> mit einem s.</p>
<div class="ex">Das Training<span class="ok">,</span> das (= welches) er absolviert hat, war hart. → <b>das</b><br>
Ich hoffe, dass du kommst. → „welches du kommst“ ergibt keinen Sinn → <b>dass</b></div>
<p><b>das</b> ist Artikel, Demonstrativpronomen oder Relativpronomen. <b>dass</b> ist eine Konjunktion und leitet immer einen Nebensatz ein.</p>`},

{id:"recht-seit",c:"recht",t:"seit oder seid?",b:`
<p><b>seit</b> = Zeit. Merke: Zei<b>t</b> → sei<b>t</b>. Präposition oder Konjunktion: „seit gestern“, „seit er trainiert“.</p>
<p><b>seid</b> = Form von „sein“, 2. Person Plural: „Ihr seid bereit.“ Probe: Lässt sich „ihr“ davorsetzen? Dann seid.</p>`},

{id:"recht-wider",c:"recht",t:"wider oder wieder?",b:`
<p><b>wider</b> = gegen: <code>widersprechen, widerlegen, widerspiegeln, widerstehen, wider Erwarten, das Widerwort</code></p>
<p><b>wieder</b> = erneut, noch einmal: <code>wiederholen, wiedersehen, wiederkommen, wiederum</code></p>
<p>Tückisch: <b>widerspiegeln</b> (= gegen etwas spiegeln) trotz „wieder“-Klang.</p>`},

{id:"recht-sz",c:"recht",t:"ss oder ß?",b:`
<p>Die Regel hängt am <b>Vokal davor</b>:</p>
<ul>
<li><b>Kurzer Vokal → ss:</b> Fluss, muss, dass, Kuss, Schloss, hässlich, wissen</li>
<li><b>Langer Vokal oder Diphthong → ß:</b> Maß, Straße, Fuß, groß, außer, heiß, weiß, fließen</li>
</ul>
<p><b>Probe:</b> Sprich das Wort langsam. Klingt der Vokal gedehnt, steht ß.</p>
<p>Klassisches Paar: <code>Masse</code> (kurz) vs. <code>Maße</code> (lang), <code>Buße</code> vs. <code>Busse</code>.</p>
<p>In der Schweiz gibt es kein ß — dort steht durchgängig ss.</p>`},

{id:"recht-apostroph",c:"recht",t:"Apostroph — die Deppen-Falle",b:`
<p><b>Kein Apostroph</b> beim normalen Genitiv-s:</p>
<div class="ex"><span class="ok">Peters Trainingsplan</span> · <span class="nope">Peter's Trainingsplan</span></div>
<p><b>Apostroph</b>, wenn der Name auf <code>s, ss, ß, tz, z, x, ce</code> endet:</p>
<div class="ex">Andreas' Buch · Max' Fahrrad · Nils' Plan · Fritz' Idee</div>
<p><b>Nie</b> beim Plural: <span class="nope">Pizza's, Foto's, DVD's</span> → <span class="ok">Pizzas, Fotos, DVDs</span></p>
<p><b>Erlaubt</b> bei Auslassungen: <code>hab's, geht's, so 'ne Sache, 'nen Moment</code></p>`},

{id:"recht-bindestrich",c:"recht",t:"Bindestrich",b:`
<ul>
<li><b>Mehrteilige Fremdwörter:</b> E-Mail, Know-how, Kick-off, Make-up, Start-up</li>
<li><b>Unübersichtliche Komposita:</b> Software-Lösung, Sport-Leistungskurs (Lesbarkeit entscheidet)</li>
<li><b>Zahl + Wort:</b> 100-Meter-Lauf, 3-jährig, 8-Stunden-Tag</li>
<li><b>Aneinanderreihungen:</b> Auf-die-lange-Bank-Schieben</li>
<li><b>Gleiche Buchstaben treffen aufeinander:</b> Kaffee-Ersatz (auch ohne zulässig)</li>
</ul>
<p>Kein Bindestrich bei normalen deutschen Komposita: <code>Trainingsplan</code>, nicht „Trainings-Plan“.</p>`},

{id:"recht-klassiker",c:"recht",t:"Die häufigsten Rechtschreibfallen",b:`
<div class="ex">
<span class="ok">Standard</span> (nicht Standart) · <span class="ok">separat</span> (nicht seperat) · <span class="ok">Rhythmus</span> · <span class="ok">Rückgrat</span> (nicht Rückrad) ·
<span class="ok">aus dem Stegreif</span> · <span class="ok">Tipp</span> · <span class="ok">Stopp</span> · <span class="ok">nummerieren</span> · <span class="ok">Interesse</span> ·
<span class="ok">brillant</span> · <span class="ok">Konsens</span> · <span class="ok">Portemonnaie</span> (eingedeutscht auch <span class="ok">Portmonee</span>) · <span class="ok">Repertoire</span> · <span class="ok">Aggression</span> ·
<span class="ok">Adresse</span> (ein d) · <span class="ok">Appell</span> · <span class="ok">Grammatik</span> (ein m) · <span class="ok">Kongress</span> · <span class="ok">Terrasse</span>
</div>
<p><b>Verlängerungsprobe</b> bei Auslauten: Tod/tot → „des Todes“ vs. „er ist tot“; Rad/Rat → „Räder“ vs. „Ratschlag“; angestrengt → „anstrengen“.</p>`},

{id:"recht-verwechsel",c:"recht",t:"Wörter, die ständig verwechselt werden",b:`
<ul>
<li><b>scheinbar</b> (nur dem Schein nach) vs. <b>anscheinend</b> (wahrscheinlich)</li>
<li><b>effektiv</b> (wirksam) vs. <b>effizient</b> (wirtschaftlich)</li>
<li><b>tendenziell</b> (der Tendenz nach) vs. <b>tendenziös</b> (parteiisch)</li>
<li><b>zumindest</b> (wenigstens) vs. <b>mindestens</b> (nicht weniger als)</li>
<li><b>dasselbe</b> (identisch) vs. <b>das gleiche</b> (gleichartig)</li>
<li><b>dezidiert</b> (entschieden) vs. <b>detailliert</b> (ausführlich)</li>
<li><b>plausibel</b> (einleuchtend) vs. <b>valide</b> (geprüft gültig)</li>
<li><b>Ursache</b> (was wirkt) vs. <b>Anlass</b> (was auslöst)</li>
</ul>`},

/* ---------- GRAMMATIK ---------- */
{id:"gram-genitiv",c:"gram",t:"Präpositionen mit Genitiv",b:`
<p>Diese Präpositionen verlangen standardsprachlich den <b>Genitiv</b>:</p>
<div class="ex">wegen · während · trotz · statt/anstatt · innerhalb · außerhalb · oberhalb · unterhalb · aufgrund · mithilfe · anstelle · hinsichtlich · bezüglich · angesichts · infolge · zugunsten · laut (auch Dativ)</div>
<div class="ex"><span class="ok">wegen des schlechten Wetters</span> · <span class="nope">wegen dem schlechten Wetter</span></div>
<p><b>Ausnahmen, in denen der Dativ richtig ist:</b></p>
<ul>
<li>Artikelloses Substantiv im Singular: „wegen Umbau geschlossen“</li>
<li>Plural ohne erkennbare Genitivform: „trotz Beweisen“</li>
<li>Pronomen: nicht „wegen mir“, sondern <b>meinetwegen</b></li>
</ul>
<p><b>Verben mit Genitiv:</b> gedenken, bedürfen, sich bedienen, sich rühmen, sich enthalten, harren.</p>`},

{id:"gram-konjunktiv",c:"gram",t:"Konjunktiv I und II",b:`
<p><b>Konjunktiv I — indirekte Rede.</b> Er signalisiert: Das sagt jemand anderes, ich mache es mir nicht zu eigen.</p>
<div class="ex">Er sagte, er <span class="ok">sei</span> müde. (nicht: er ist müde)</div>
<p><b>Ausweichregel:</b> Fällt der Konjunktiv I mit dem Indikativ zusammen, weicht man auf den Konjunktiv II aus.</p>
<div class="ex">Sie sagten, sie <span class="ok">hätten</span> keine Zeit. („haben“ wäre nicht unterscheidbar)</div>
<p><b>Konjunktiv II — Irreales und Höflichkeit.</b> Bevorzuge die einfache Form vor der „würde“-Umschreibung:</p>
<div class="ex"><span class="ok">Wenn ich Zeit hätte, käme ich.</span><br><span class="nope">Wenn ich Zeit haben würde, würde ich kommen.</span></div>
<p>„würde“ ist dann berechtigt, wenn die eigene Form altertümlich klingt („hülfe“, „stürbe“).</p>`},

{id:"gram-ndekl",c:"gram",t:"n-Deklination (schwache Maskulina)",b:`
<p>Eine Gruppe männlicher Substantive bekommt in <b>allen Fällen außer dem Nominativ</b> ein -en:</p>
<div class="ex">der Praktikant → dem Praktikant<span class="ok">en</span><br>der Mensch → des Mensch<span class="ok">en</span><br>der Junge → den Jung<span class="ok">en</span></div>
<p><b>Dazu gehören:</b> Personenbezeichnungen auf <code>-ant, -ent, -ist, -at, -oge, -graf, -soph</code> (Praktikant, Student, Journalist, Kandidat, Pädagoge) sowie <code>Mensch, Herr, Junge, Kollege, Experte, Athlet, Bauer, Nachbar, Kunde, Zeuge</code>.</p>
<p>„Ich habe mit dem Kollege gesprochen“ ist einer der häufigsten Fehler in Alltagstexten.</p>
<p><b>Ausnahme:</b> Bei <code>Nachbar</code> lässt der Duden beide Beugungen zu — „dem Nachbarn“ wie „dem Nachbar“.</p>`},

{id:"gram-plural",c:"gram",t:"Plural von Fremdwörtern",b:`
<div class="ex">
das Praktikum → die Praktik<b>a</b> · das Lexikon → die Lexik<b>a</b> · das Museum → die Muse<b>en</b> · das Zentrum → die Zentr<b>en</b> ·
das Thema → die Them<b>en</b> · der Modus → die Mod<b>i</b> · der Status → die Status (langes u) ·
das Schema → die Schemata / Schemas / Schemen · der Atlas → die Atlanten
</div>
<p>Vorsicht bei Anglizismen: <code>die Trainings</code>, <code>die Levels</code>, <code>die Partys</code> (nicht „Parties“ — im Deutschen ohne ie-Regel).</p>`},

{id:"gram-relativ",c:"gram",t:"dessen und deren",b:`
<p>Der Genitiv des Relativpronomens richtet sich nach dem <b>Bezugswort</b>, nicht nach dem folgenden Substantiv:</p>
<ul>
<li>Maskulinum / Neutrum Singular → <b>dessen</b>: „Der Trainer, dessen Methoden umstritten sind …“</li>
<li>Femininum Singular und alle Plurale → <b>deren</b>: „Die Trainerin, deren Methoden …“ / „Die Vereine, deren Konzepte …“</li>
</ul>
<p>Nach „dessen/deren“ folgt <b>kein</b> weiterer Artikel: nicht „dessen die Methoden“.</p>`},

{id:"gram-derselbe",c:"gram",t:"derselbe oder der gleiche?",b:`
<p><b>derselbe</b> = numerische Identität, ein und dasselbe Exemplar.<br>
<b>der gleiche</b> = qualitative Gleichheit, gleiche Art.</p>
<div class="ex">Wir tragen <b>die gleichen</b> Schuhe. (zwei Paar desselben Modells)<br>
Wir tragen <b>dieselben</b> Schuhe. (ein Paar, das wir uns teilen)</div>
<p>Im Alltag verschwimmt die Unterscheidung, in präzisen Texten lohnt sie sich.</p>`},

{id:"gram-praep",c:"gram",t:"Verben mit fester Präposition",b:`
<p>Diese Verbindungen sind nicht ableitbar — man muss sie lernen:</p>
<div class="ex">
teilnehmen <b>an</b> (+ Dat.) · sich beteiligen <b>an</b> · sich beziehen <b>auf</b> (+ Akk.) · hinweisen <b>auf</b> · achten <b>auf</b> ·
verzichten <b>auf</b> · warten <b>auf</b> · sich erinnern <b>an</b> · denken <b>an</b> · zweifeln <b>an</b> ·
bestehen <b>aus</b> (Bestandteile) / <b>in</b> (worin es besteht) / <b>auf</b> (beharren) ·
sich handeln <b>um</b> · bitten <b>um</b> · streben <b>nach</b> · fragen <b>nach</b> · leiden <b>an</b> / <b>unter</b> (+ Dat.)<br>
sich freuen <b>auf</b> (Zukunft) / <b>über</b> (schon da) · halten <b>von</b> (Meinung) / <b>für</b> (Einschätzung) · sich gewöhnen <b>an</b> · sich verlassen <b>auf</b> · sich interessieren <b>für</b> · sich kümmern <b>um</b> · rechnen <b>mit</b> · gehören <b>zu</b> · abhängen <b>von</b>
</div>
<p><b>Bedeutungsunterschied bei „bestehen“:</b> Die Prüfung besteht <b>aus</b> drei Teilen. Die Aufgabe besteht <b>in</b> der Auswertung. Er besteht <b>auf</b> seiner Meinung. Alle drei mit Dativ; beim beharrenden „bestehen auf“ verzeichnet das DWDS den Akkusativ als seltene Nebenform.</p>
<p><b>leiden an oder unter:</b> Als Faustregel steht <b>an</b> bei Krankheiten, <b>unter</b> bei Umständen — „an einer Grippe leiden“, „unter dem Druck leiden“. Die Grenze ist aber durchlässig: Das DWDS führt beide Präpositionen für seelisches Leiden gemeinsam und nennt „an unglücklicher Liebe leiden“. Bei festen Wendungen entscheidet die Gewohnheit, nicht die Regel.</p>`},

{id:"gram-zeiten",c:"gram",t:"Zeitenfolge",b:`
<p><b>Vorzeitigkeit</b> ausdrücken heißt: das frühere Ereignis eine Stufe weiter zurücksetzen.</p>
<ul>
<li>Präteritum-Erzählung → Vorzeitiges im <b>Plusquamperfekt</b>:<br>
„Nachdem er sich aufgewärmt <b>hatte</b>, begann das Training.“</li>
<li>Präsens-Erzählung → Vorzeitiges im <b>Perfekt</b>:<br>
„Nachdem er sich aufgewärmt <b>hat</b>, beginnt das Training.“</li>
</ul>
<p>In wissenschaftlichen Texten gilt: Das <b>Präsens</b> ist die Grundzeit für allgemeine Aussagen („Die Studie zeigt …“), das Präteritum für die Beschreibung des eigenen Vorgehens („Wir befragten …“).</p>`},

{id:"gram-kongruenz",c:"gram",t:"Kongruenz — was passt zu was?",b:`
<p>Das Verb richtet sich nach dem <b>Subjektkern</b>, nicht nach dem nächststehenden Substantiv.</p>
<div class="ex"><span class="ok">Das Wohl der Kinder darf nicht gefährdet werden.</span> (Kern: das Wohl)</div>
<p><b>Mengenangaben:</b> Bei „eine Reihe von“, „eine Gruppe von“, „die Hälfte der“ ist beides zulässig — formal der Singular, nach dem Sinn auch der Plural.</p>
<div class="ex">Eine Reihe von Studierenden <b>hat</b> / <b>haben</b> teilgenommen.</div>
<p><b>Pronomenbezug:</b> Achte darauf, dass „dies“, „er“, „sie“ eindeutig auf ein Wort zurückverweisen. Mehrdeutige Bezüge sind der häufigste Verständlichkeitsfehler in Hausarbeiten.</p>
<p class="tiny muted">Belegt: Duden, Sprachratgeber „Subjekt im Singular, Verb im Plural?“ — bei Mengenbegriffen wie <i>Reihe, Gruppe, Hälfte, Mehrzahl, Anzahl</i> steht das Verb überwiegend im Singular, weil der Subjektkern formal Singular ist. Der Plural nach dem Sinn ist daneben zulässig.</p>`},

{id:"gram-kasus",c:"gram",t:"Verben mit Dativ",b:`
<p>Diese Verben verlangen den <b>Dativ</b>, obwohl man intuitiv oft den Akkusativ setzt:</p>
<div class="ex">helfen · danken · gratulieren · folgen · gehören · begegnen · zuhören · widersprechen · vertrauen · imponieren · gefallen · schaden · nützen · zustimmen · ähneln</div>
<div class="ex"><span class="ok">Ich half ihm.</span> · <span class="nope">Ich half ihn.</span></div>
<p><b>Wechselpräpositionen</b> (an, auf, hinter, in, neben, über, unter, vor, zwischen): Frage <b>wohin?</b> → Akkusativ, Frage <b>wo?</b> → Dativ.</p>
<p>Die Probe greift nur, solange es um <b>Ort</b> geht. Steht die Präposition nicht räumlich, liegt der Fall fest und die Frage führt in die Irre: <b>über</b> beim Thema immer Akkusativ („über <b>den</b> Trainer sprechen“), <b>vor</b> bei der Zeit immer Dativ („vor <b>einem</b> Jahr“). Und Bewegung allein reicht nicht — „Ich laufe in <b>der</b> Halle“ ist Bewegung ohne Ortswechsel, also Dativ. Zuverlässiger als der Bewegungstest ist das Verbpaar: legen/liegen, stellen/stehen, setzen/sitzen, hängen/hängen.</p>`},

{id:"gram-alswie",c:"gram",t:"als oder wie?",b:`
<p><b>als</b> beim Vergleich <b>ungleicher</b> Größen (Komparativ): „schneller <b>als</b> ich“, „mehr <b>als</b> erwartet“</p>
<p><b>wie</b> beim Vergleich <b>gleicher</b> Größen: „so schnell <b>wie</b> ich“, „genauso gut <b>wie</b> gestern“</p>
<p>„größer wie“ ist regional verbreitet, gilt aber als nicht standardsprachlich.</p>
<p class="tiny muted">Belegt: Standardsprachlich steht beim Komparativ <i>als</i>. „größer wie“ und „als wie“ sind regional verbreitet — besonders bairisch und südwestdeutsch —, gelten aber nicht als standardsprachlich (grammis, IDS Mannheim; Duden).</p>`},

/* ---------- STIL ---------- */
{id:"stil-nominal",c:"stil",t:"Nominalstil auflösen",b:`
<p>Deutsche Fachtexte neigen dazu, Handlungen in Substantive zu verwandeln. Das Ergebnis ist grammatisch korrekt und schwer lesbar.</p>
<div class="ex"><span class="nope">Die Durchführung der Untersuchung der Belastung erfolgte durch uns.</span><br>
<span class="ok">Wir untersuchten die Belastung.</span></div>
<p><b>Warnsignale:</b> Substantive auf <code>-ung, -heit, -keit, -nis, -ion</code> in Ketten; Blassverben wie <i>erfolgen, durchführen, vornehmen, stattfinden</i>.</p>
<p><b>Streckverben ersetzen:</b></p>
<div class="ex">zur Anwendung kommen → angewendet werden<br>in Erwägung ziehen → erwägen<br>zur Durchführung bringen → durchführen<br>eine Prüfung vornehmen → prüfen<br>Kritik üben an → kritisieren</div>`},

{id:"stil-fuellwort",c:"stil",t:"Füllwörter streichen",b:`
<p>Diese Wörter tragen fast nie Bedeutung. Streich sie testweise — bleibt der Satz gleich, waren sie überflüssig.</p>
<div class="ex">eigentlich · irgendwie · quasi · sozusagen · letztendlich · schlussendlich · halt · eben · ja · doch · natürlich · durchaus · gewissermaßen · relativ · ziemlich · eher · wohl · praktisch · im Grunde · an dieser Stelle · in diesem Kontext</div>
<p><b>Ausnahme:</b> In der gesprochenen Sprache und in Dialogen steuern Partikeln die Beziehungsebene. Dort dürfen sie bleiben.</p>`},

{id:"stil-pleonasmus",c:"stil",t:"Doppelungen (Pleonasmen)",b:`
<p>Zweimal dasselbe sagen wirkt unbeholfen:</p>
<div class="ex">bereits schon · eventuell vielleicht · kleines Detail · runder Kreis · weißer Schimmel · neu renoviert · persönlich anwesend · gemeinsames Miteinander · alter Greis · tote Leiche · zurzeit momentan · Grundvoraussetzung · Einzelindividuum</div>
<p>Verwandt: <b>Tautologien</b> wie „nie und nimmer“ oder „ganz und gar“ — die sind als rhetorische Verstärkung erlaubt.</p>`},

{id:"stil-verben",c:"stil",t:"Präzise Verben wählen",b:`
<p>Ein starkes Verb ersetzt zwei Adjektive. Ersetze Allerweltsverben durch spezifische:</p>
<div class="ex">machen → durchführen, erstellen, verursachen, bewirken<br>
sein → gelten als, darstellen, bedeuten<br>
haben → verfügen über, aufweisen, besitzen<br>
geben → liefern, bieten, ermöglichen<br>
sagen → erläutern, einwenden, betonen, einräumen, feststellen</div>
<p><b>Kollokationen kennen:</b> zu einem Ergebnis <i>kommen/gelangen</i> · eine Frage <i>aufwerfen</i> · Kritik <i>üben</i> · einen Beitrag <i>leisten</i> · eine Rolle <i>spielen</i> · Rechnung <i>tragen</i>.</p>`},

{id:"stil-passiv",c:"stil",t:"Passiv sparsam einsetzen",b:`
<p>Das Passiv verschweigt, wer handelt. Manchmal ist das gewollt — meistens ist es nur bequem.</p>
<div class="ex"><span class="nope">Der Fragebogen wurde von den Teilnehmenden ausgefüllt.</span><br>
<span class="ok">Die Teilnehmenden füllten den Fragebogen aus.</span></div>
<p><b>Passiv ist berechtigt,</b> wenn der Handelnde unbekannt, irrelevant oder allgemein ist: „Die Halle wird saniert.“</p>
<p>In wissenschaftlichen Texten wird das Passiv oft genutzt, um das „Ich“ zu vermeiden. Prüfe, ob die Fachkultur deines Fachs die Ich-Form inzwischen erlaubt — im Lehramt ist sie in Reflexionen ausdrücklich erwünscht.</p>`},

{id:"stil-esgibt",c:"stil",t:"Leerlauf am Satzanfang",b:`
<p>Diese Konstruktionen schieben leere Wörter vor die eigentliche Aussage:</p>
<div class="ex"><span class="nope">Es gibt viele Studien, die zeigen, dass …</span> → <span class="ok">Viele Studien zeigen, dass …</span><br>
<span class="nope">Es ist so, dass die Belastung steigt.</span> → <span class="ok">Die Belastung steigt.</span><br>
<span class="nope">An dieser Stelle sei erwähnt, dass …</span> → <span class="ok">…</span></div>
<p>Faustregel: Der erste Satzteil sollte das Thema nennen — nicht ankündigen, dass gleich ein Thema kommt.</p>`},

{id:"stil-schachtel",c:"stil",t:"Schachtelsätze entwirren",b:`
<p>Deutsch erlaubt tiefe Verschachtelung. Lesbar ist sie deshalb nicht.</p>
<div class="ex"><span class="nope">Die vom Trainer, der seit drei Jahren, seit er die Lizenz hat, arbeitet, geplante Einheit fiel aus.</span><br>
<span class="ok">Die geplante Einheit fiel aus. Der Trainer arbeitet seit drei Jahren im Verein, seit er die Lizenz erworben hat.</span></div>
<p><b>Faustregeln:</b> ein Gedanke pro Satz · höchstens eine Einschubebene · Durchschnittslänge 12–18 Wörter · lange und kurze Sätze abwechseln.</p>
<p><b>Test:</b> Lies den Satz laut. Musst du zweimal Luft holen oder verlierst du den Faden, teile ihn.</p>`},

{id:"stil-verneinung",c:"stil",t:"Doppelte Verneinung",b:`
<p>„nicht un-“ wirkt zögerlich und braucht einen zusätzlichen Denkschritt.</p>
<div class="ex"><span class="nope">nicht unüberzeugend</span> → <span class="ok">überzeugend</span><br>
<span class="nope">nicht unwahrscheinlich</span> → <span class="ok">wahrscheinlich</span></div>
<p><b>Ausnahme:</b> Wenn du bewusst abstufen willst — „nicht unsympathisch“ ist schwächer als „sympathisch“. Dann ist die Litotes ein legitimes Stilmittel.</p>`},

{id:"stil-konkret",c:"stil",t:"Konkret statt vage",b:`
<p>Wertende Adverbien ohne Bezugsgröße sagen nichts:</p>
<div class="ex"><span class="nope">Die Belastung stieg deutlich an.</span> → <span class="ok">Die Belastung stieg um 12 Prozent.</span><br>
<span class="nope">relativ viele Teilnehmende</span> → <span class="ok">18 von 24 Teilnehmenden</span></div>
<p><b>Vage Verdächtige:</b> deutlich, erheblich, relativ, ziemlich, einige, mehrere, oft, häufig, in letzter Zeit.</p>`},

{id:"stil-genitivkette",c:"stil",t:"Genitivketten auflösen",b:`
<div class="ex"><span class="nope">die Auswertung der Ergebnisse der Befragung der Teilnehmenden</span><br>
<span class="ok">die Ergebnisse der Teilnehmerbefragung auswerten</span></div>
<p>Ab drei Genitiven hintereinander verliert der Satz seine Struktur. Lösungen: Kompositum bilden, in einen Nebensatz auflösen oder verbalisieren.</p>`},

{id:"stil-absolut",c:"stil",t:"Absolutadjektive nicht steigern",b:`
<p>Manche Adjektive bezeichnen bereits einen Endzustand — sie lassen sich nicht steigern:</p>
<div class="ex">optimal · maximal · minimal · ideal · einzig · total · tot · schwanger · leer · voll · rund · fertig</div>
<div class="ex"><span class="nope">die optimalste Lösung</span> → <span class="ok">die optimale Lösung</span><br>
<span class="nope">die einzigste Möglichkeit</span> → <span class="ok">die einzige Möglichkeit</span></div>`},

{id:"stil-anglizismus",c:"stil",t:"Anglizismen und Lehnübersetzungen",b:`
<p>In gehobenen Texten lohnt der deutsche Ausdruck:</p>
<div class="ex">Sinn machen → Sinn ergeben, sinnvoll sein<br>
in 2026 → 2026, im Jahr 2026<br>
realisieren (= begreifen) → erkennen, bemerken<br>
kontrollieren (= beherrschen) → steuern, beherrschen<br>
adressieren (ein Problem) → angehen, behandeln<br>
checken → überprüfen<br>
Learnings → Erkenntnisse</div>
<p>Das ist kein Purismus: Wo ein Anglizismus kürzer und etabliert ist (Feedback, Training, Team), spricht nichts dagegen.</p>`},

{id:"stil-wissenschaft",c:"stil",t:"Wissenschaftlicher Stil",b:`
<p><b>Was hineingehört:</b> präzise Begriffe, nachvollziehbare Belege, angemessene Vorsicht im Urteil, klare Gliederungssignale.</p>
<p><b>Was hinausgehört:</b></p>
<ul>
<li>Umgangssprache: „ja klar“, „ziemlich“, „kriegen“, „bisschen“</li>
<li>Unpersönliches „man“, wo ein konkreter Träger gemeint ist</li>
<li>Rhetorische Fragen und Ausrufezeichen</li>
<li>Behauptungen ohne Beleg: „bekanntlich“, „selbstverständlich“, „jeder weiß“</li>
</ul>
<p><b>Nützliche Gliederungssignale:</b> zunächst · im Folgenden · darüber hinaus · demgegenüber · gleichwohl · daraus folgt · zusammenfassend lässt sich festhalten.</p>`},

{id:"stil-floskel",c:"stil",t:"Floskeln erkennen",b:`
<p>Diese Wendungen füllen Zeilen, ohne etwas zu sagen:</p>
<div class="ex">in diesem Kontext · an dieser Stelle sei erwähnt · es sei angemerkt, dass · nicht zuletzt · es lässt sich festhalten, dass · im Rahmen von · vor dem Hintergrund, dass · in Bezug auf die Tatsache, dass</div>
<p><b>Test:</b> Streich die Wendung. Fehlt inhaltlich etwas? Wenn nein, war sie Dekoration.</p>`},

{id:"stil-hedging",c:"stil",t:"Absicherung dosieren",b:`
<p>Wissenschaftliche Vorsicht ist richtig — gestapelt wird sie zur Selbstentwertung.</p>
<div class="ex"><span class="nope">Ich denke, dass die Daten vielleicht irgendwie einen Zusammenhang zeigen könnten.</span><br>
<span class="ok">Die Daten deuten auf einen Zusammenhang hin.</span></div>

model:`<p>Die Aufwärmphase war für zehn Minuten angesetzt. Nach vier Minuten hatten drei Schülerinnen den Ball verloren, zwei standen am Rand, und die Lautstärke stieg so weit an, dass meine Ansagen nicht mehr ankamen. Ich unterbrach das Spiel, rief die Gruppe zusammen und wiederholte die Regeln. Danach lief es ruhiger, aber die geplante Intensität erreichten wir nicht mehr.</p>
<p>Rückblickend halte ich zwei Faktoren für ausschlaggebend. Erstens hatte ich die Regeln im Stehen erklärt, während die Gruppe bereits die Bälle in der Hand hielt — die Aufmerksamkeit lag beim Material, nicht bei mir. Zweitens war die Spielform für 24 Personen auf einem Drittel der Halle zu eng angelegt.</p>
<p>Beim nächsten Mal gebe ich die Bälle erst nach der Erklärung aus und lasse die Gruppe die Regel einmal in eigenen Worten wiederholen. Die Fläche vergrößere ich auf zwei Hallendrittel und reduziere die Gruppengröße auf zwölf pro Feld. Ob das reicht, werde ich an derselben Klasse überprüfen.</p>`},

{id:"w02",k:"Argumentation",t:"Position beziehen und abwägen",min:20,words:"250–320",
p:"Formuliere eine These zu einer strittigen Frage aus deinem Feld (z. B. „Noten im Sportunterricht sollten abgeschafft werden“). Baue den Text so auf: <b>These → stärkstes Gegenargument → Entkräftung → eigene Begründung → Fazit.</b> Beginne bewusst mit dem Gegenargument, nicht mit deinem eigenen.",
crit:["These steht im ersten Absatz und ist eindeutig","Gegenargument ist in seiner stärksten Form dargestellt","Mindestens ein Beleg oder Beispiel stützt die eigene Position","Keine rhetorischen Fragen","Fazit wiederholt nicht bloß die These"],
tip:"Wer das Gegenargument schwach darstellt, überzeugt niemanden. Formuliere es so, dass ein Gegner sagen würde: „Ja, genau das meine ich.“",
model:`<p>Sportnoten sollten durch eine kriteriengeleitete Rückmeldung ohne Ziffer ersetzt werden. Diese These lässt sich nicht leichthin vertreten, denn gegen sie spricht ein gewichtiges Argument.</p>
<p>Noten schaffen Vergleichbarkeit. Sie machen Leistung über Klassen und Schulen hinweg lesbar und sind für Übergangsentscheidungen unverzichtbar. Wer sie streicht, nimmt Schülerinnen und Schülern zudem eine Rückmeldung, die sie aus allen anderen Fächern kennen — das Fach verliert an Ernsthaftigkeit.</p>
<p>Dieser Einwand trifft allerdings weniger den Verzicht auf Noten als die Frage, was an ihre Stelle tritt. Eine schriftliche Rückmeldung entlang festgelegter Kriterien ist für die Empfängerin informativer als eine Ziffer, weil sie den nächsten Schritt benennt. Vergleichbarkeit entsteht dabei über die Kriterien, nicht über die Skala.</p>
<p>Für den Verzicht spricht vor allem die Konstruktion der Sportnote selbst. Sie mischt Merkmale, die kaum beeinflussbar sind — Körperbau, motorische Vorerfahrung, Vereinsanbindung — mit solchen, die es sind: Anstrengung, Kooperation, Lernzuwachs. Diese Mischung macht die Ziffer als Lernsignal unbrauchbar, weil unklar bleibt, worauf sie antwortet.</p>
<p>Der Verzicht auf die Ziffer ist deshalb kein Verzicht auf Leistungsbewertung, sondern der Versuch, sie präzise zu machen. Entscheidend ist nicht, ob bewertet wird, sondern ob die Rückmeldung dem Lernenden sagt, was er als Nächstes tun kann.</p>`},

model:`<p>Sehr geehrte Frau Dr. Weber,</p>

model:`<p><b>Vorbereitungsphase.</b> Der Anlauf erfolgt geradlinig auf das Sprungbrett zu und umfasst sechs bis acht Schritte mit steigender Frequenz. Der letzte Schritt vor dem Brett wird verkürzt; beide Beine schließen zum beidbeinigen Absprung. Der Oberkörper bleibt aufgerichtet, die Arme schwingen aus der Rücklage nach vorn oben.</p>
<p><b>Hauptphase.</b> Mit dem Abdruck vom Brett strecken sich Fuß-, Knie- und Hüftgelenk vollständig — man spricht von der Streckschlinge. Unmittelbar danach folgt das Anhocken: Die Knie werden zur Brust gezogen, der Rumpf beugt sich vor, die Hände stützen auf dem vorderen Kastenrand auf. Der Körperschwerpunkt bleibt dabei über der Stützfläche; kippt er dahinter, bricht die Bewegung ab.</p>
<p><b>Endphase.</b> Über dem Kasten öffnet sich die Hocke, die Beine strecken sich nach vorn unten. Die Landung erfolgt beidbeinig in der Schrittstellung leicht gebeugter Knie, der Blick geht nach vorn. Ein kurzes Nachfedern in Knie und Hüfte bremst den Impuls ab, ohne dass die Fersen den Boden vor den Fußballen berühren.</p>`},

model:`<p>Nach meiner ersten eigenständigen Trainingseinheit sagte der betreuende Trainer nur einen Satz: „Du hast neunzehn Minuten geredet und elf Minuten Bewegung zugelassen.“ Er hatte mitgestoppt.</p>
<p>Meine erste Reaktion war Widerstand. Ich dachte, er habe die Erklärphasen nicht verstanden — jede einzelne war doch nötig gewesen. Auf dem Heimweg rechnete ich nach und kam auf denselben Wert.</p>
<p>In der Woche darauf schrieb ich mir die Erklärungen vorher auf und kürzte sie auf jeweils zwei Sätze. Was ich nicht in zwei Sätze bekam, demonstrierte ich. Die Bewegungszeit stieg auf 21 Minuten, ohne dass mehr Unklarheiten entstanden.</p>
<p>Brauchbar war die Rückmeldung aus drei Gründen: Sie nannte eine Zahl statt eines Urteils, sie bezog sich auf etwas, das ich unmittelbar ändern konnte, und sie verzichtete auf jede Bewertung meiner Person. Ich versuche seitdem, Rückmeldungen an Schülerinnen und Schüler nach demselben Muster zu geben — beobachtbar, veränderbar, ohne Etikett.</p>`},

{id:"w09",k:"Argumentation",t:"Den Advocatus Diaboli spielen",min:18,words:"200–280",
p:"Wähle eine Position, die du <b>nicht</b> teilst, und schreib die stärkste Verteidigung dafür, die dir möglich ist. Kein ironischer Unterton, keine Distanzierung am Ende. Ziel ist ein Text, den ein Vertreter dieser Position unterschreiben würde.",

tip:"Diese Übung schärft zwei Dinge zugleich: dein Argumentieren und dein Verständnis der Gegenseite. Wer die Gegenposition nicht formulieren kann, hat die eigene noch nicht geprüft.",
model:`<p><i>Position: Handschriftliche Klausuren sollten beibehalten werden.</i></p>
<p>Die handschriftliche Klausur ist kein technischer Rückstand, sondern eine bewusste Entscheidung für ein bestimmtes Prüfungsformat.</p>
<p>Erstens verändert die Handschrift die Textproduktion. Wer schreibt, kann nicht beliebig umstellen, löschen und neu anordnen. Der Gedanke muss vor dem Satz stehen, nicht während seiner Entstehung entwickelt werden. Das prüft eine Fähigkeit, die das Tippen umgeht: gedankliche Vorstrukturierung.</p>
<p>Zweitens sichert die Handschrift die Prüfungsbedingungen. Solange Textgeneratoren frei verfügbar sind, lässt sich bei digitaler Bearbeitung nicht mehr zuverlässig feststellen, wessen Leistung vorliegt. Aufwendige Überwachungssoftware greift tiefer in Persönlichkeitsrechte ein als ein Blatt Papier.</p>
<p>Ein naheliegender Einwand lautet, die Handschrift benachteilige Menschen mit motorischen Einschränkungen. Das trifft zu — und wird durch Nachteilsausgleiche gelöst, wie bei jeder anderen Prüfungsform auch. Aus einem lösbaren Sonderfall folgt keine Abschaffung des Regelfalls.</p>
<p>Wer die Handschrift verteidigt, verteidigt daher nicht die Vergangenheit, sondern ein Prüfungsformat, für das bislang kein gleichwertiger Ersatz vorliegt.</p>`},

{id:"w13",k:"Argumentation",t:"Ein Konzept in einer Analogie erklären",min:15,words:"150–220",
p:"Erkläre einen Fachbegriff aus deinem Studium über eine <b>Analogie</b> aus einem völlig anderen Lebensbereich. Nenne am Ende explizit, wo die Analogie <b>nicht</b> mehr trägt.",
crit:["Fachbegriff zuerst knapp fachlich definiert","Analogie stammt aus einem anderen Feld","Mindestens zwei Aspekte werden übertragen","Grenze der Analogie klar benannt","Keine Fachbegriffe in der Analogie selbst"],
tip:"Die Grenze der Analogie zu benennen ist der eigentliche Denkschritt. Sie zeigt, dass du das Bild beherrschst und nicht umgekehrt.",
model:`<p><b>Superkompensation</b> bezeichnet den Vorgang, dass der Körper nach einer Belastung nicht nur das Ausgangsniveau wiederherstellt, sondern es kurzzeitig übertrifft — vorausgesetzt, die Erholung ist ausreichend lang.</p>
<p>Man kann sich das wie das Auffüllen eines Kontos vorstellen, bei dem die Bank nach jeder Abhebung etwas mehr zurückzahlt, als abgehoben wurde — allerdings nur, wenn man ihr die Zeit für die Buchung lässt. Wer sofort wieder abhebt, sammelt keinen Bonus, sondern Schulden. Wer zu lange wartet, verliert den Bonus wieder, weil er verfällt.</p>
<p>Zwei Dinge trägt das Bild: Es macht deutlich, warum Pausen kein Trainingsausfall sind, und es erklärt, warum sowohl zu häufiges als auch zu seltenes Training den Effekt verfehlt.</p>
<p>Die Analogie endet dort, wo es um Messbarkeit geht. Ein Kontostand ist eindeutig ablesbar, der Erholungszustand nicht. Es gibt keine Zahl, die den optimalen Zeitpunkt der nächsten Einheit anzeigt — deshalb bleibt Trainingssteuerung eine Abwägung und keine Rechnung.</p>`},

{id:"w14",k:"Zusammenfassung",t:"Für zwei Zielgruppen schreiben",min:18,words:"2 × 80–110",
p:"Nimm einen fachlichen Sachverhalt und erkläre ihn zweimal: <b>a)</b> für Fachkolleginnen, <b>b)</b> für Eltern ohne Fachhintergrund. Gleicher Inhalt, unterschiedliche Sprache. Keine Version darf falsch werden.",
crit:["Beide Fassungen enthalten dieselbe Kernaussage","Fassung b) verzichtet vollständig auf Fachbegriffe","Fassung b) vereinfacht, ohne zu verfälschen","Unterschiedliche Satzlängen in beiden Fassungen","Keine herablassende Formulierung in b)"],
tip:"Der Test für echtes Verständnis: Kannst du es ohne Fachvokabular sagen, ohne dass es falsch wird? Vereinfachen heißt nicht weglassen, sondern übersetzen.",
model:`<p><b>a) Für Fachkolleginnen</b><br>
Die Leistungsdifferenz innerhalb der Lerngruppe wird über eine Binnendifferenzierung nach Aufgabenkomplexität aufgefangen. Alle Schülerinnen und Schüler arbeiten an derselben Bewegungsaufgabe, wählen jedoch zwischen drei Anforderungsniveaus, die sich in Zielgröße, Distanz und Materialeinsatz unterscheiden. Die Zuordnung erfolgt selbstgesteuert und ist innerhalb der Stunde revidierbar.</p>
<p><b>b) Für Eltern</b><br>
In der Klasse sind die Kinder unterschiedlich weit — das ist normal. Deshalb üben alle dieselbe Sache, aber jedes Kind sucht sich die Schwierigkeit selbst aus: näher oder weiter weg, größeres oder kleineres Ziel. Wer merkt, dass es zu leicht oder zu schwer ist, wechselt einfach. So hat jedes Kind eine Aufgabe, an der es wachsen kann, ohne über- oder unterfordert zu sein.</p>`},

{id:"w15",k:"Reflexion",t:"Was ich noch nicht kann",min:18,words:"180–250",
p:"Benenne eine fachliche oder persönliche Fähigkeit, die dir noch fehlt. Beschreibe: <b>1.</b> Woran merkst du das konkret? <b>2.</b> Was hast du bisher versucht? <b>3.</b> Warum hat es nicht gereicht? <b>4.</b> Was ist der nächste, kleinste sinnvolle Schritt?",
crit:["Konkrete Situation statt allgemeiner Selbstbeschreibung","Bisherige Versuche benannt","Erklärung, warum sie nicht gereicht haben","Nächster Schritt ist klein und überprüfbar","Kein abwertender Ton gegen sich selbst"],
tip:"Achte darauf, nüchtern zu bleiben. Eine Lernstandsanalyse ist keine Selbstkritik — sie beschreibt eine Lücke, nicht einen Charakterzug.",
model:`<p>Ich habe Schwierigkeiten damit, in Gruppendiskussionen zu unterbrechen. Konkret: In der letzten Seminarsitzung hatte ich zu drei Punkten etwas beizutragen und habe keinen davon eingebracht, weil ich auf eine Pause gewartet habe, die nicht kam.</p>
<p>Bisher habe ich versucht, mir Beiträge vorher aufzuschreiben. Das hilft beim Formulieren, löst das Problem aber nicht — die Notiz liegt fertig vor mir, und der Moment geht trotzdem vorbei.</p>
<p>Der Grund dafür liegt vermutlich nicht in der Vorbereitung, sondern im Einstiegssignal. Ich warte auf Stille, statt selbst eines zu setzen. Andere im Seminar unterbrechen nicht lauter, sondern früher: Sie setzen mit einem kurzen Wort an, während der Vorredner noch endet.</p>
<p>Mein nächster Schritt ist bewusst klein: In der kommenden Sitzung will ich <i>einmal</i> mit „Dazu kurz —“ ansetzen, bevor der Satz des Vorredners fertig ist. Ob ich danach etwas Kluges sage, ist zweitrangig. Es geht zunächst nur darum, das Signal überhaupt einmal gesendet zu haben.</p>`}

{id:"ph05",g:"Bitten & Anfragen",f:"Um etwas bitten",ctx:["uni","beruf"],
lv:{f:["Könnten Sie mir die Folien der letzten Sitzung zusenden?","Ich wäre Ihnen sehr verbunden, wenn Sie mir dazu eine kurze Einschätzung geben könnten.","Wäre es möglich, den Termin auf kommende Woche zu verschieben?"],

{id:"ph06",g:"Bitten & Anfragen",f:"Frist oder Zeitrahmen nennen",ctx:["uni","beruf","privat"],
lv:{f:["Für die Planung wäre mir eine Rückmeldung bis Freitag, den 7. August, eine große Hilfe.","Falls es Ihnen zeitlich nicht passt, sagen Sie gern Bescheid — ich richte mich danach."],

    "„zeitnah“ — Amtsdeutsch ohne Informationsgehalt.",
    "Gar keine Frist nennen und sich dann über die späte Antwort ärgern."],

{id:"ph07",g:"Bitten & Anfragen",f:"Um einen Gefallen bitten",ctx:["beruf","privat"],
lv:{f:["Ich weiß, dass Ihre Zeit knapp ist — dennoch würde ich Sie ungern übergehen und frage deshalb direkt."],

{id:"ph08",g:"Bitten & Anfragen",f:"Um Feedback bitten",ctx:["uni","beruf"],
lv:{f:["Ich würde mich über eine Rückmeldung zu Kapitel 2 freuen, insbesondere zur Frage, ob die Fragestellung präzise genug formuliert ist.","Worauf sollte ich beim weiteren Vorgehen besonders achten?"],

{id:"ph17",g:"Entschuldigen & Fehler einräumen",f:"Einen echten Fehler einräumen",ctx:["uni","beruf","privat"],

{id:"ph19",g:"Widersprechen",f:"Anderer Meinung sein",ctx:["uni","beruf"],
lv:{f:["Ich sehe das an einem Punkt anders: …","Dem würde ich in Teilen widersprechen, und zwar aus folgendem Grund: …","Das überzeugt mich noch nicht ganz — mir fehlt der Beleg für …"],

{id:"ph21",g:"Widersprechen",f:"Eine Entscheidung hinterfragen",ctx:["uni","beruf"],
lv:{f:["Können Sie mir erläutern, welche Überlegung dahintersteht? Mir erschließt sich der Zusammenhang noch nicht.","Ich frage nicht, um die Entscheidung infrage zu stellen, sondern um sie nachvollziehen zu können."],

no:["„Warum macht ihr das so?“ mit skeptischem Unterton — die Frage klingt wie ein Vorwurf.",
    "„Das ergibt doch keinen Sinn.“ — beendet die Auskunftsbereitschaft."],
tip:"„Vielleicht übersehe ich etwas“ ist keine Selbstverkleinerung, sondern eine Einladung zur Erklärung. Sie kostet dich nichts und öffnet Türen."},

/* ---------- KRITIK ---------- */
{id:"ph22",g:"Kritik äußern",f:"Verhalten ansprechen",ctx:["beruf","privat"],
lv:{f:["Mir ist aufgefallen, dass die Protokolle in den letzten drei Wochen jeweils erst nach der Folgesitzung vorlagen. Woran liegt das?"],
    n:["Mir ist aufgefallen, dass du die letzten drei Male zu spät gekommen bist. Was ist da los?","Ich möchte etwas ansprechen, das mich stört: …"],
    l:["Kann ich dir was sagen, das mich nervt? Du kommst in letzter Zeit oft zu spät."]},
no:["„Du bist immer unpünktlich.“ — „immer“ ist fast nie wahr und provoziert Widerspruch statt Einsicht.",
    "„Alle finden, dass …“ — anonyme Verstärkung wirkt feige.",
    "„Du bist unzuverlässig.“ — Etikett statt Beobachtung."],
tip:"Trenne <b>Beobachtung</b> („dreimal zu spät“) von <b>Bewertung</b> („unzuverlässig“). Über Beobachtungen kann man reden, über Etiketten nur streiten."},

{id:"ph23",g:"Kritik äußern",f:"Wirkung beschreiben",ctx:["beruf","privat"],
lv:{f:["Das führt dazu, dass ich die Auswertung nicht rechtzeitig beginnen kann.","Für mich entsteht dadurch der Eindruck, dass der Termin keine Priorität hat — ich weiß, dass das nicht so sein muss."],
    n:["Das setzt mich unter Druck, weil ich dann alles auf den letzten Tag schiebe.","Ich habe mich in dem Moment übergangen gefühlt."],
    l:["Das macht mich fertig, ehrlich gesagt.","Ich fühl mich dann wie das fünfte Rad."]},
no:["„Du machst mich wütend.“ — schreibt dem anderen die Kontrolle über deine Gefühle zu.",
    "„Das ist respektlos.“ — Bewertung, die eine Verteidigung erzwingt."],
tip:"Die Ich-Botschaft ist kein Wohlfühl-Trick: Sie ist die einzige Aussage, die dein Gegenüber nicht bestreiten kann. Über deine Wirkung weißt nur du Bescheid."},

{id:"ph24",g:"Kritik äußern",f:"Wunsch statt Vorwurf",ctx:["beruf","privat"],
lv:{f:["Ich möchte Sie bitten, mir eine kurze Nachricht zu schicken, wenn es später wird.","Für die weitere Zusammenarbeit wäre mir wichtig, dass Absprachen schriftlich festgehalten werden."],
    n:["Mein Wunsch wäre: Wenn es später wird, schreib mir kurz.","Können wir ausmachen, dass wir Termine zwei Tage vorher bestätigen?"],
    l:["Sag mir einfach kurz Bescheid, wenn's später wird — dann passt das.","Können wir das anders machen?"]},
no:["„Du könntest ja mal …“ — als Wunsch getarnter Vorwurf.",
    "Nur beschreiben, was stört, ohne zu sagen, was du willst — der andere muss raten."],
tip:"Jede Kritik braucht einen Zielsatz. Ohne konkreten Wunsch bleibt nur Unmut im Raum, und der ändert nichts."},

{id:"ph25",g:"Kritik annehmen",f:"Auf Kritik reagieren",ctx:["uni","beruf","privat"],
lv:{f:["Vielen Dank für die offene Rückmeldung. Ich brauche einen Moment, um darüber nachzudenken — darf ich morgen darauf zurückkommen?","Das ist ein berechtigter Punkt. Ich werde das ändern."],
    n:["Danke, dass du es ansprichst. Ich schaue mir das an.","Verstehe ich richtig, dass dich vor allem X stört?"],
    l:["Okay, das sitzt. Lass mich kurz drüber nachdenken.","Fair. Da hast du recht."]},
no:["„Ja, aber du machst doch auch …“ — Gegenangriff beendet jede Rückmeldekultur.",
    "„Das habe ich nie gesagt.“ — bevor du überhaupt verstanden hast, was gemeint war.",
    "„Ist ja gut.“ — Abwehr im Gewand der Zustimmung."],
tip:"Erst verstehen, dann bewerten. Eine Nachfrage („Verstehe ich richtig, dass …?“) kauft dir Zeit und zeigt zugleich, dass du zuhörst."},

/* ---------- ZUSAGEN & DANKEN ---------- */
{id:"ph26",g:"Zusagen & Danken",f:"Zusagen",ctx:["uni","beruf","privat"],
lv:{f:["Gern übernehme ich das. Ich melde mich bis Freitag mit einem ersten Entwurf.","Vielen Dank für das Vertrauen — ich sage zu."],
    n:["Mach ich, bis Freitag hast du es.","Klar, gern. Sag mir nur, worauf ich achten soll."],
    l:["Bin dabei.","Klar, mach ich."]},
no:["„Ich versuche es.“ — klingt wie eine halbe Absage und lässt den anderen im Ungewissen.",
    "„Ich glaube, das könnte klappen.“ — dreifach abgesichert, praktisch wertlos.",
    "„Eigentlich gern, aber …“ — dann ist es keine Zusage."],
tip:"Eine Zusage enthält immer <b>was</b> und <b>bis wann</b>. Ohne Termin ist es eine Absichtserklärung."},

{id:"ph27",g:"Zusagen & Danken",f:"Danken, ohne floskelhaft zu klingen",ctx:["uni","beruf","privat"],
lv:{f:["Vielen Dank für Ihre ausführliche Rückmeldung — besonders der Hinweis zur Fragestellung hat mir weitergeholfen.","Ich weiß es sehr zu schätzen, dass Sie sich die Zeit genommen haben."],
    n:["Danke, das hat mir wirklich geholfen — vor allem der Tipp mit der Gliederung.","Danke, dass du extra dafür wiedergekommen bist."],
    l:["Danke dir, echt stark.","Du hast mir den Abend gerettet."]},
no:["„Danke für alles.“ — so allgemein, dass es nichts sagt.",
    "„Vielen Dank nochmals im Voraus für Ihre Bemühungen.“ — Bausteinsprache."],
tip:"Nenn <b>eine</b> konkrete Sache, für die du dankst. Das ist der ganze Unterschied zwischen Höflichkeit und echter Anerkennung."},

{id:"ph28",g:"Zusagen & Danken",f:"Auf Dank antworten",ctx:["uni","beruf","privat"],
lv:{f:["Sehr gern.","Das habe ich gern gemacht."],
    n:["Gern geschehen.","Freut mich, wenn es geholfen hat."],
    l:["Immer gern.","Jederzeit."]},
no:["„Kein Problem.“ — verneint, dass es Aufwand war, und entwertet damit auch den Dank.",
    "„Nicht der Rede wert.“ — dasselbe Muster.",
    "„Ist doch selbstverständlich.“ — nimmt dem anderen die Möglichkeit, sich zu bedanken."],
tip:"„Gern“ nimmt den Dank an. „Kein Problem“ weist ihn ab. Kleiner Unterschied, spürbare Wirkung."},

{id:"ph29",g:"Zusagen & Danken",f:"Anerkennung aussprechen",ctx:["beruf","privat"],
lv:{f:["Ihre Vorbereitung der Sitzung war ausgesprochen sorgfältig — das hat die Diskussion deutlich getragen.","Das haben Sie sehr souverän gelöst."],
    n:["Das war richtig gut vorbereitet — man hat gemerkt, wie viel Arbeit drinsteckt.","Wie du mit der Situation umgegangen bist, hat mich beeindruckt."],
    l:["Stark gemacht.","Das war richtig gut, ehrlich."]},
no:["„Nicht schlecht.“ — als Lob gemeint, als Einschränkung gehört.",
    "„Für deine Verhältnisse gut.“ — herablassend, auch wenn nett gemeint.",
    "Lob nur als Einleitung zur Kritik zu benutzen — das durchschaut jeder nach dem zweiten Mal."],
tip:"Konkretes Lob wirkt, allgemeines verpufft. Sag, <b>was</b> gut war und <b>warum</b> es einen Unterschied gemacht hat."},

/* ---------- GRENZEN SETZEN ---------- */
{id:"ph30",g:"Grenzen setzen",f:"Überlastung ansprechen",ctx:["uni","beruf"],
lv:{f:["Ich möchte offen sagen, dass ich mit den aktuellen Aufgaben an meiner Kapazitätsgrenze bin. Können wir gemeinsam schauen, was Vorrang hat?"],
    n:["Ich schaffe das in der Zeit nicht. Was soll zuerst fertig werden?","Wenn ich das übernehme, wird die andere Sache später fertig — ist das in Ordnung?"],
    l:["Ich pack das gerade nicht alles. Was ist am wichtigsten?"]},
no:["„Ich habe so viel zu tun!“ — Klage ohne Frage erzeugt Mitleid, aber keine Entlastung.",
    "Alles annehmen und dann Fristen reißen."],
tip:"Die wirksamste Formulierung ist keine Absage, sondern eine Priorisierungsfrage. Sie gibt die Entscheidung dorthin zurück, wo sie hingehört."},

{id:"ph31",g:"Grenzen setzen",f:"Erreichbarkeit begrenzen",ctx:["beruf","privat"],
lv:{f:["Ich lese Mails werktags bis 18 Uhr. Bei dringenden Anliegen erreichen Sie mich telefonisch.","Am Wochenende bin ich nicht erreichbar — ich melde mich am Montag."],
    n:["Ich schaue abends nicht mehr auf Nachrichten. Wenn es eilt, ruf an.","Ich antworte dir morgen früh, heute schaffe ich es nicht mehr."],
    l:["Ich bin ab jetzt raus für heute — morgen mehr.","Sonntag mach ich nichts, sorry."]},
no:["Nachts antworten und sich später über die Erwartungshaltung ärgern.",
    "Die Grenze ankündigen und dann doch sofort reagieren — das löscht die Ansage."],
tip:"Grenzen werden nicht durch Ansage etabliert, sondern durch Verhalten. Die Formulierung hilft nur, wenn sie stimmt."},

{id:"ph32",g:"Grenzen setzen",f:"Ein Gespräch beenden",ctx:["uni","beruf","privat"],
lv:{f:["Ich muss die Sitzung leider verlassen — können wir das nächste Woche fortsetzen?","Ich merke, dass wir uns im Kreis drehen. Lassen Sie uns morgen mit frischem Kopf weitermachen."],
    n:["Ich muss gleich los — lass uns das vertagen.","Ich glaube, wir kommen gerade nicht weiter. Pause?"],
    l:["Ich muss weiter — reden wir später?","Lass uns hier aufhören, wir drehen uns im Kreis."]},
no:["Sich unauffällig verabschieden und mitten im Satz gehen.",
    "„Ich habe jetzt keine Lust mehr.“ — ehrlich, aber teuer."],
tip:"Beim Beenden immer einen Anschluss nennen. Ein Gespräch, das vertagt wird, endet ohne Kränkung; eines, das abbricht, nicht."},

/* ---------- VERSTEHEN SICHERN ---------- */
{id:"ph33",g:"Verstehen sichern",f:"Nachfragen, ohne dumm zu wirken",ctx:["uni","beruf"],
lv:{f:["Habe ich richtig verstanden, dass die Abgabe auch für Zweitversuche gilt?","Können Sie den Punkt mit den Kontrollgruppen noch einmal ausführen? Da bin ich ausgestiegen."],
    n:["Ich fasse kurz zusammen, damit ich sicher bin: Du meinst also …","Wie genau ist das gemeint mit …?"],
    l:["Nochmal für mich: Du willst also …?","Erklär's mir nochmal, ich hab's nicht."]},
no:["„Ich hab's kapiert“ sagen, obwohl du es nicht hast — der Preis kommt später.",
    "„Entschuldigung, ich bin wahrscheinlich zu blöd, aber …“ — Selbstabwertung als Einleitung."],
tip:"Die Zusammenfassung in eigenen Worten ist die stärkste Nachfrage: Sie zeigt, was du verstanden hast, und macht die Lücke präzise sichtbar."},

{id:"ph34",g:"Verstehen sichern",f:"Absprachen festhalten",ctx:["uni","beruf"],
lv:{f:["Zur Sicherheit halte ich unsere Absprache fest: Ich reiche das Exposé bis zum 15. ein, Sie geben bis Monatsende Rückmeldung.","Falls ich etwas falsch notiert habe, korrigieren Sie mich gern."],
    n:["Kurz zum Mitschreiben: Du machst die Grafiken, ich den Text, Abgabe Freitag. Passt das?","Ich halte fest: …"],
    l:["Also: du Grafiken, ich Text, Freitag fertig. Richtig?"]},
no:["Sich auf mündliche Absprachen verlassen und drei Wochen später unterschiedliche Erinnerungen haben.",
    "„Wie besprochen“ schreiben, ohne dass es besprochen wurde."],
tip:"Ein Zweizeiler nach jedem wichtigen Gespräch spart im Konfliktfall Stunden. Wer schreibt, der bleibt — das gilt auch unter Freunden."},

/* ---------- SCHWIERIGE NACHRICHTEN ---------- */
{id:"ph35",g:"Schwierige Nachrichten",f:"Schlechte Nachricht überbringen",ctx:["uni","beruf"],
lv:{f:["ich muss Ihnen leider mitteilen, dass der Antrag nicht bewilligt wurde. Die Begründung liegt mir vor; gern erläutere ich sie Ihnen im Gespräch.","es gibt eine Verzögerung, über die ich Sie direkt informieren wollte: …"],
    n:["ich habe leider keine gute Nachricht: Der Termin ist geplatzt.","es ist etwas schiefgegangen — ich sage dir gleich, was ich schon unternommen habe."],
    l:["Schlechte Nachricht: Es hat nicht geklappt. Aber ich hab schon einen Plan B."]},
no:["Die schlechte Nachricht hinter drei Absätzen Vorrede verstecken.",
    "Sie so weichzeichnen, dass der Empfänger sie überliest.",
    "„Leider muss ich Ihnen mitteilen, dass es zu einer Nichtbewilligung gekommen ist.“ — Passiv und Nominalstil erhöhen die Distanz genau da, wo Klarheit gebraucht wird."],
tip:"Reihenfolge: Nachricht, Grund, nächster Schritt. Nicht umgekehrt. Menschen können mit schlechten Nachrichten umgehen — nicht aber mit Unklarheit."},

{id:"ph36",g:"Schwierige Nachrichten",f:"Kondolenz",ctx:["privat","beruf"],
lv:{f:["Vom Tod Ihres Vaters habe ich mit großer Bestürzung erfahren. Mein aufrichtiges Mitgefühl gilt Ihnen und Ihrer Familie.","Ich wünsche Ihnen die Kraft, die Sie in diesen Tagen brauchen."],
    n:["Es tut mir sehr leid zu hören, dass deine Mutter gestorben ist. Ich denke an dich.","Ich weiß nicht, was man in so einem Moment sagt. Ich bin da, wenn du etwas brauchst."],
    l:["Ich hab's gehört. Es tut mir so leid. Melde dich, wann immer du willst — auch nachts."]},
no:["„Zeit heilt alle Wunden.“ — tröstet niemanden und schiebt das Gefühl weg.",
    "„Sie hat es jetzt besser.“ — deutet den Verlust um, statt ihn stehen zu lassen.",
    "„Wenn du was brauchst, melde dich.“ — gut gemeint, aber die Bringschuld liegt beim Trauernden."],
tip:"Nicht trösten wollen, sondern da sein. Ein konkretes Angebot („Ich koche Dienstag und stelle es vor die Tür“) ist mehr wert als jede Formel."},

{id:"ph37",g:"Schwierige Nachrichten",f:"Glückwünsche, die nicht floskeln",ctx:["privat","beruf"],
lv:{f:["Zu Ihrem Abschluss gratuliere ich Ihnen sehr herzlich. Ich habe verfolgt, wie viel Arbeit darin steckt.","Herzlichen Glückwunsch — verdient und nicht selbstverständlich."],
    n:["Glückwunsch! Ich weiß, wie lange du daran gesessen hast.","Freut mich riesig für dich."],
    l:["Wahnsinn, Glückwunsch! Wann feiern wir?"]},
no:["„Alles Gute zum Geburtstag, Gesundheit und viel Erfolg.“ — Serienbrief.",
    "„Endlich!“ — als Scherz gemeint, oft als Abwertung gehört."],
tip:"Ein einziger persönlicher Halbsatz hebt den Glückwunsch aus der Masse: Nenn etwas, das nur du über den Weg dorthin weißt."},

/* ---------- UNI-SPEZIFISCH ---------- */
{id:"ph38",g:"Uni & Studium",f:"Fristverlängerung erbitten",ctx:["uni"],
lv:{f:["ich schreibe Ihnen mit der Bitte um eine Verlängerung der Abgabefrist für die Hausarbeit im Seminar „Bewegungslehre“. Grund ist eine Verzögerung bei der Datenerhebung im Verein, die erst Ende August abgeschlossen sein wird. Ich schlage als neuen Termin den 5. September vor. Die theoretischen Kapitel sind fertig und könnte ich Ihnen vorab zusenden."],
    n:["ich brauche für die Hausarbeit zwei Wochen länger. Grund: Die Erhebung hat sich verzögert. Wäre der 5. September möglich?"],
    l:["—"]},
no:["Erst am Abgabetag fragen.",
    "Den Grund breit ausmalen — zwei Sätze reichen.",
    "Keine konkrete Ersatzfrist nennen."],
tip:"Struktur: Anliegen — Grund (kurz) — konkreter Vorschlag — Nachweis, dass du gearbeitet hast. Der letzte Punkt entscheidet oft."},

{id:"ph39",g:"Uni & Studium",f:"Sprechstunde anfragen",ctx:["uni"],
lv:{f:["ich würde gern in Ihre Sprechstunde kommen, um die Fragestellung meiner Bachelorarbeit zu besprechen. Passt Ihnen ein Termin am 12. oder 14. August? Ein Exposé von zwei Seiten bringe ich mit."],
    n:["hätten Sie diese oder nächste Woche einen Termin für mich? Es geht um die Themenfindung für die Abschlussarbeit."],
    l:["—"]},
no:["„Ich hätte gern einen Termin.“ ohne Thema — die Vorbereitung wird unmöglich.",
    "Mehrere Anläufe in derselben Woche, wenn keine Antwort kommt."],
tip:"Nenn immer das Thema und bring etwas Schriftliches mit. Damit wird aus einem Termin eine Beratung."},

{id:"ph40",g:"Uni & Studium",f:"Gruppenarbeit koordinieren",ctx:["uni"],
lv:{f:["ich fasse unsere Aufgabenteilung zusammen, damit wir denselben Stand haben: …"],
    n:["kurzer Stand: Ich übernehme die Einleitung bis Freitag, Lena die Methodik. Passt das für euch?","können wir bis Mittwoch klären, wer was macht? Sonst wird es am Ende eng."],
    l:["Kurzer Plan: ich Einleitung, du Methode, Lena Diskussion. Einverstanden?","Wer macht was? Ich schreib's dann zusammen."]},
no:["„Wir sollten mal anfangen.“ — kein Name, kein Datum, keine Aufgabe.",
    "Warten, bis sich jemand anders kümmert."],
tip:"Der erste, der Aufgaben und Termine aufschreibt, führt die Gruppe — ohne dass es nach Führung aussieht."},

{id:"ph41",g:"Uni & Studium",f:"Bei einer schlechten Note nachfragen",ctx:["uni"],
lv:{f:["ich habe die Bewertung meiner Hausarbeit erhalten und würde die Rückmeldung gern besser verstehen. Ist es möglich, in Ihrer Sprechstunde die Bewertungskriterien durchzugehen? Es geht mir nicht um die Note, sondern darum, was ich beim nächsten Mal anders machen kann."],
    n:["ich möchte gern verstehen, was in meiner Arbeit nicht gepasst hat. Hätten Sie kurz Zeit dafür?"],
    l:["—"]},
no:["„Ich finde die Note nicht gerechtfertigt.“ — als Einstieg verschließt das jede Tür.",
    "Emotional geschrieben, direkt nach dem Erhalt der Note."],
tip:"Frag nach dem Lernen, nicht nach der Note. Wer Kriterien erklären soll, erklärt sie gern; wer sich verteidigen soll, mauert."},

/* ---------- BERUF & SCHULE ---------- */
{id:"ph42",g:"Beruf & Schule",f:"Elterngespräch — Problem ansprechen",ctx:["beruf"],
lv:{f:["Mir ist aufgefallen, dass Jonas in den letzten vier Wochen dreimal ohne Sportsachen erschienen ist. Ich wollte fragen, ob Ihnen dazu etwas bekannt ist — vielleicht finden wir gemeinsam eine Lösung."],
    n:["Ich möchte etwas mit Ihnen besprechen, das mir aufgefallen ist: Lena zieht sich in Gruppenphasen zurück. Beobachten Sie das zu Hause auch?"],
    l:["—"]},
no:["„Ihr Sohn ist faul.“ — Etikett statt Beobachtung, und die Eltern gehen sofort in Verteidigung.",
    "„Sie müssen zu Hause mehr …“ — Anweisung an Erwachsene.",
    "„Alle anderen Kinder schaffen das.“ — Vergleich verletzt und hilft nicht."],
tip:"Reihenfolge im Elterngespräch: Beobachtung — Frage — gemeinsames Ziel. Die Frage in der Mitte ist entscheidend: Sie macht Eltern zu Partnern statt zu Angeklagten."},

{id:"ph43",g:"Beruf & Schule",f:"Elterngespräch — Positives rückmelden",ctx:["beruf"],
lv:{f:["Ich wollte Ihnen eine Rückmeldung geben, die nichts mit einem Problem zu tun hat: Mira hat in den letzten Wochen mehrfach von sich aus Mitschülerinnen geholfen, die unsicher waren. Das ist mir aufgefallen und ich fand es bemerkenswert."],
    n:["Ich wollte Ihnen kurz sagen, dass Tim sich richtig gemacht hat — er traut sich inzwischen an Übungen, vor denen er im Herbst zurückgeschreckt ist."],
    l:["—"]},
no:["Nur anrufen, wenn etwas nicht stimmt — dann wird jeder Anruf zur Drohung."],
tip:"Eine positive Rückmeldung ohne Anlass ist die beste Investition in ein späteres schwieriges Gespräch."},

{id:"ph44",g:"Beruf & Schule",f:"Hospitation oder Praktikum anfragen",ctx:["beruf","uni"],
lv:{f:["ich studiere Sport auf Lehramt an der Deutschen Sporthochschule Köln und suche für das Wintersemester eine Hospitationsmöglichkeit im Bereich Sekundarstufe I. Mich interessiert besonders, wie heterogene Lerngruppen im Schwimmunterricht organisiert werden. Wären Sie bereit, mich für zwei bis drei Termine aufzunehmen?"],
    n:["ich würde gern bei Ihnen hospitieren. Ich studiere Sport auf Lehramt und interessiere mich für Ihren Ansatz im Schwimmunterricht. Hätten Sie im Wintersemester Kapazität?"],
    l:["—"]},
no:["„Ich muss ein Praktikum machen.“ — macht dich zum Verwaltungsvorgang.",
    "Eine Massenmail erkennbar am fehlenden Bezug zur Einrichtung."],
tip:"Nenn einen inhaltlichen Grund, warum ausgerechnet dort. Das unterscheidet dich von zwanzig gleichlautenden Anfragen."},

{id:"ph45",g:"Beruf & Schule",f:"Im Vorstellungsgespräch über sich sprechen",ctx:["beruf"],
lv:{f:["In meinem Praxissemester habe ich eine neunte Klasse im Basketball unterrichtet. Die Gruppe war leistungsmäßig weit auseinander, deshalb habe ich mit drei Anforderungsniveaus gearbeitet. Was ich daraus mitgenommen habe: Die Kinder wählen realistischer, als ich erwartet hatte — vorausgesetzt, der Wechsel ist jederzeit möglich."],
    n:["Ich arbeite gern strukturiert, merke aber, dass ich mit Improvisation noch fremdle. Daran arbeite ich gerade konkret, indem ich …"],
    l:["—"]},
no:["„Meine größte Schwäche ist, dass ich zu perfektionistisch bin.“ — durchschaut jeder.",
    "„Ich bin sehr teamfähig und belastbar.“ — Behauptung ohne Beleg.",
    "Im Konjunktiv über sich sprechen: „Ich würde sagen, dass ich eher …“"],
tip:"Erzähl eine Situation, nicht eine Eigenschaft. Situation — Handlung — Erkenntnis. Drei Sätze schlagen jedes Adjektiv."},

/* ---------- GESPRÄCH & PRIVAT ---------- */
{id:"ph46",g:"Privat & Gespräch",f:"Einen Konflikt ansprechen",ctx:["privat"],
lv:{f:["—"],
    n:["Ich möchte etwas ansprechen, das mich seit einer Weile beschäftigt. Hast du gerade Zeit dafür?","Mir liegt etwas auf dem Herzen und ich sage es lieber, als es weiter mit mir herumzutragen."],
    l:["Können wir kurz über letzten Samstag reden? Das ist mir nachgegangen.","Ich will dir was sagen und das ist mir unangenehm."]},
no:["„Wir müssen reden.“ — löst bei fast jedem Menschen sofort Alarm aus.",
    "Den Konflikt in der Tür oder per Sprachnachricht um 23 Uhr ansprechen.",
    "„Ich bin nicht sauer, aber …“ — meistens stimmt es nicht, und beide wissen es."],
tip:"Frag vorher nach dem Zeitpunkt. Ein Gespräch, für das der andere sich entschieden hat, verläuft anders als eines, in das er hineinstolpert."},

{id:"ph47",g:"Privat & Gespräch",f:"Sich für einen Streit entschuldigen",ctx:["privat"],
lv:{f:["—"],
    n:["Ich habe gestern überreagiert. Das lag nicht an dir, und es tut mir leid.","Ich hätte dir nicht so kommen dürfen. Was ich sagen wollte, war …"],
    l:["Sorry für gestern. Ich war im Unrecht.","Das gestern war blöd von mir."]},
no:["„Es tut mir leid, aber du hast angefangen.“ — hebt die Entschuldigung auf.",
    "„Tut mir leid, dass du dich aufgeregt hast.“ — verschiebt das Problem zum anderen.",
    "Eine Entschuldigung, die sofort eine Gegenleistung erwartet."],
tip:"Eine Entschuldigung ohne „aber“ ist die einzige, die ankommt. Was du erklären willst, kannst du später sagen — nicht im selben Satz."},

{id:"ph48",g:"Privat & Gespräch",f:"Smalltalk beginnen und beenden",ctx:["privat","beruf"],
lv:{f:["Waren Sie schon einmal auf dieser Tagung? — Wie sind Sie zu dem Thema gekommen?","Ich möchte Sie nicht länger aufhalten — es war schön, mit Ihnen zu sprechen."],

const PAIRS = [
{id:"pr01",ctx:"uni",bad:"Ich bräuchte bis Freitag eine Rückmeldung von Ihnen.",

 note:"Echte Frage + Grund für die Frist. Beides zusammen macht aus einer Forderung eine Bitte."},

{id:"pr02",ctx:"uni",bad:"Ich wollte mal fragen, ob Sie vielleicht eventuell Zeit hätten.",

 good:"Hätten Sie kommende Woche Zeit für ein kurzes Gespräch?",
 note:"Eine Absicherung reicht. Der Konjunktiv „hätten“ trägt die Höflichkeit allein."},

{id:"pr03",ctx:"beruf",bad:"Wie bereits mehrfach erwähnt, fehlt mir die Zuarbeit noch immer.",
