const SCENES = [
{id:"sc01",ctx:"uni",t:"Die Mail, die dreimal umformuliert wurde",
 s:"Du hast im Seminar eine Hausarbeit abgegeben und seit sechs Wochen nichts gehört. Die Note brauchst du für die Anmeldung zum nächsten Modul, deren Frist in zwei Wochen abläuft. Die Dozentin gilt als überlastet, aber freundlich.",
 ask:"Schreib die Nachfrage-Mail — Betreff und Text.",
 model:"<p><b>Betreff:</b> Nachfrage zur Bewertung — Hausarbeit Seminar „Bewegungslehre“ (Matrikelnr. 1234567)</p><p>Sehr geehrte Frau Dr. Weber,</p><p>ich möchte kurz nachfragen, ob die Bewertung meiner Hausarbeit aus dem Seminar „Bewegungslehre“ schon absehbar ist.</p><p>Hintergrund: Für die Anmeldung zum Modul B4 benötige ich den Nachweis bis zum 12. August. Falls es bis dahin nicht zu schaffen ist, sagen Sie mir das gern — dann frage ich beim Prüfungsamt nach einer Übergangslösung.</p><p>Vielen Dank für Ihre Mühe.</p><p>Mit freundlichen Grüßen<br>Nils Otten</p>",
 why:"Drei Dinge machen die Mail wirksam: Der Betreff ist eindeutig zuordenbar. Der Grund für die Nachfrage steht dabei, ist aber sachlich (Frist, nicht Ungeduld). Und der letzte Absatz nimmt den Druck heraus, indem er einen Ausweg anbietet — das erhöht die Wahrscheinlichkeit einer Antwort, statt sie zu senken.",
 alt:"Kürzer geht auch: „ich frage kurz nach, ob die Bewertung meiner Hausarbeit absehbar ist — ich brauche sie für die Modulanmeldung bis zum 12. August. Vielen Dank!“"},

{id:"sc02",ctx:"beruf",t:"Der Kollege, der die Zuarbeit schuldig bleibt",
 s:"Ihr plant gemeinsam ein Sportfest. Marek sollte bis letzten Freitag die Stationenpläne liefern. Es ist Mittwoch, nichts ist gekommen, und ihr habt euch bisher gut verstanden. Ihr duzt euch.",
 ask:"Schreib die Nachricht.",
 model:"<p>Hallo Marek,</p><p>ich hake kurz wegen der Stationenpläne nach — die waren für Freitag verabredet und ich habe noch nichts gesehen. Gut möglich, dass es bei dir gerade eng ist.</p><p>Ich brauche sie bis Freitag, um die Aufsichten einzuteilen. Wenn du es nicht schaffst, sag mir das einfach — dann mache ich einen Rohentwurf und du korrigierst.</p><p>Viele Grüße<br>Nils</p>",
 why:"Die Nachricht enthält den Vorwurf nicht, obwohl er berechtigt wäre. Stattdessen: Fakt (verabredet war Freitag), Ausstiegstür (kann eng sein), neue Frist mit Begründung, konkretes Angebot. Das Angebot ist der eigentliche Trick — es macht das Eingeständnis billig und beschleunigt fast immer die Antwort.",
 alt:"Beim zweiten Mal darf die Konsequenz dazu: „Wenn ich bis Freitag nichts habe, mache ich die Pläne selbst und wir stimmen sie Montag ab.“ Sachlich, keine Drohung."},

{id:"sc03",ctx:"privat",t:"Die Einladung, zu der du nicht willst",
 s:"Eine Freundin lädt dich zu ihrer WG-Party ein. Du magst sie, aber du bist müde, willst nicht hin und hast keinen „echten“ Grund. Sie fragt schon zum zweiten Mal.",
 ask:"Formuliere die Absage.",
 model:"<p>Hey Lisa,</p><p>ich komme diesmal nicht — ich merke, dass ich nach der Woche einfach ruhig bleiben will.</p><p>Das hat nichts mit dir zu tun, und ich freue mich, wenn du wieder fragst. Wollen wir nächste Woche mal in Ruhe frühstücken?</p><p>Liebe Grüße<br>Nils</p>",
 why:"Der Punkt ist: Müdigkeit <i>ist</i> ein echter Grund. Wer sich einen besseren ausdenkt, produziert eine Lüge, die er sich merken muss. Die Absage funktioniert, weil sie den Grund nennt (ohne ihn zu rechtfertigen), die Beziehung ausdrücklich schützt und ein Gegenangebot macht.",
 alt:"Noch kürzer: „Ich bin diese Woche durch und bleib zu Hause. Lass uns bald zu zweit was machen!“"},

{id:"sc04",ctx:"beruf",t:"Das Elterngespräch, das schieflaufen könnte",
 s:"Du hast bemerkt, dass eine Schülerin seit Wochen nicht am Schwimmunterricht teilnimmt und immer neue Entschuldigungen mitbringt. Du rufst die Mutter an. Du weißt nicht, ob dahinter Scham, ein Konflikt oder etwas Ernsteres steckt.",
 ask:"Formuliere den Gesprächseinstieg — die ersten drei bis vier Sätze.",
 model:"<p>„Guten Tag, Frau Aydin, hier ist Nils Otten, der Sportlehrer von Elif. Ich rufe an, weil mir etwas aufgefallen ist — es ist nichts Schlimmes passiert, ich möchte nur nachfragen.</p><p>Elif war in den letzten fünf Wochen nicht beim Schwimmen. Jedes Mal lag eine Entschuldigung vor, das ist also alles in Ordnung — aber ich habe den Eindruck, dass etwas dahintersteckt, das wir vielleicht lösen könnten.</p><p>Wissen Sie, ob es einen Grund gibt? Und wäre es Ihnen recht, wenn wir gemeinsam überlegen, wie Elif wieder teilnehmen kann?“</p>",
 why:"Der zweite Satz — „es ist nichts Schlimmes passiert“ — ist der wichtigste. Ein Anruf von der Schule löst bei Eltern sofort Alarm aus; wer ihn nicht entschärft, redet gegen Angst an. Danach: zählbare Beobachtung, ausdrückliche Anerkennung, dass formal alles korrekt war, offene Frage, gemeinsames Ziel. Keine Vermutung wird ausgesprochen.",
 alt:"Wichtig auch, was <i>nicht</i> gesagt wird: keine Diagnose („Vielleicht schämt sie sich?“), kein Vorwurf, keine Handlungsanweisung an die Mutter."},

{id:"sc05",ctx:"uni",t:"Die Gruppenarbeit, in der du alles machst",
 s:"Drei Wochen vor Abgabe hast du zwei von drei Kapiteln geschrieben. Die anderen beiden reagieren freundlich, aber liefern nichts. Ihr müsst euch bald wieder sehen.",
 ask:"Schreib die Nachricht an die Gruppe.",
 model:"<p>Hallo ihr zwei,</p><p>ich will kurz Klarheit schaffen, bevor es eng wird. Stand jetzt: Einleitung und Methodik sind fertig (von mir), Ergebnisse und Diskussion fehlen noch.</p><p>Mein Vorschlag: Lena übernimmt die Ergebnisse, Tim die Diskussion, beides bis zum 20. Dann habe ich eine Woche, um alles zusammenzuziehen.</p><p>Wenn das bei euch nicht geht, sagt mir das bitte bis Freitag — dann planen wir anders. Ich möchte nur nicht in der letzten Woche feststellen, dass nichts da ist.</p><p>Viele Grüße<br>Nils</p>",
 why:"Kein Vorwurf, aber auch keine Beschönigung: Der Stand wird nüchtern benannt, inklusive „von mir“. Dann kommt das, was fehlt — ein konkreter Vorschlag mit Namen und Datum. Der letzte Absatz benennt die Sorge offen, ohne jemandem etwas zu unterstellen.",
 alt:"Wenn wieder nichts kommt: „Ich habe bis heute nichts erhalten. Ich schreibe die fehlenden Teile jetzt selbst und melde das der Dozentin so, wie es gelaufen ist.“ Ankündigen, dann tun."},

{id:"sc06",ctx:"beruf",t:"Kritik von oben, die du nicht teilst",
 s:"Deine Mentorin sagt nach einer Stunde: „Sie geben den Kindern zu viel Freiheit, das führt zu Chaos.“ Du siehst das anders — die Phase war laut, aber produktiv. Sie ist erfahren und du bist auf ihre Beurteilung angewiesen.",
 ask:"Formuliere deine Antwort im Gespräch.",
 model:"<p>„Danke, dass Sie das direkt ansprechen. Ich möchte kurz nachfragen, damit ich es richtig verstehe: Meinen Sie die Phase mit den Stationen oder das Aufwärmen?</p><p>[nach der Antwort]</p><p>Bei den Stationen war meine Absicht, dass die Gruppen den Schwierigkeitsgrad selbst wählen — deshalb habe ich die Lautstärke bewusst zugelassen. Kann sein, dass ich die Grenze zu weit gesteckt habe. Woran hätten Sie gemerkt, dass es kippt?“</p>",
 why:"Drei Schritte: erst danken und präzisieren (kauft Zeit, zeigt Zuhören), dann die eigene Absicht darlegen — nicht die Kritik bestreiten, sondern erklären, was gedacht war. Zuletzt die entscheidende Frage: Sie holt Erfahrungswissen ab, statt Recht zu behalten. Du gibst nicht nach, aber du greifst auch nicht an.",
 alt:"Was du vermeiden willst: „Das sehe ich anders“ als erster Satz — und ebenso „Ja, stimmt, mache ich nicht mehr“, wenn du es nicht meinst."},

{id:"sc07",ctx:"privat",t:"Der Freund, der dich ständig versetzt",
 s:"Ein guter Freund sagt seit Monaten kurzfristig Verabredungen ab, meist per Nachricht eine Stunde vorher. Du magst ihn, aber du hast keine Lust mehr, dich darauf einzustellen.",
 ask:"Formuliere, wie du es ansprichst — persönlich, nicht schriftlich.",
 model:"<p>„Ich will dir was sagen, und das ist mir ein bisschen unangenehm.</p><p>Du hast in den letzten Monaten viermal kurzfristig abgesagt — zuletzt am Samstag, eine Stunde vorher. Ich weiß, dass bei dir gerade viel los ist.</p><p>Trotzdem geht mir das nach. Ich fange an, unsere Verabredungen nicht mehr fest einzuplanen, und das gefällt mir nicht, weil ich dich gern sehe.</p><p>Mein Wunsch wäre: Sag lieber gleich ab, wenn du merkst, dass es nicht wird — auch drei Tage vorher. Das wäre für mich viel leichter als kurz vorher.“</p>",
 why:"Der Aufbau ist der klassische Vierschritt: Beobachtung (zählbar, mit Beispiel), Anerkennung des Kontexts, eigene Wirkung („ich plane nicht mehr fest ein“), konkreter Wunsch. Entscheidend ist, dass die Wirkung ehrlich benannt wird — und dass der Wunsch machbar ist. „Sag nicht mehr ab“ wäre unerfüllbar, „sag früher ab“ nicht.",
 alt:"Das Eingangssignal „das ist mir unangenehm“ ist kein Zögern, sondern ein Rahmen: Es sagt dem anderen, dass gleich etwas Wichtiges kommt, und senkt die Abwehr."},

{id:"sc08",ctx:"uni",t:"Der Fehler, der auffliegen wird",
 s:"Du merkst zwei Tage nach der Abgabe, dass du in deiner Auswertung eine Gruppe doppelt gezählt hast. Die Ergebnisse ändern sich dadurch spürbar. Niemand hat es bisher bemerkt.",
 ask:"Schreib die Mail an die betreuende Person.",
 model:"<p>Sehr geehrte Frau Dr. Weber,</p><p>ich habe in meiner abgegebenen Hausarbeit einen Fehler gefunden und möchte Sie darüber informieren, bevor Sie mit der Korrektur beginnen.</p><p>In der Auswertung auf Seite 14 habe ich die Kontrollgruppe doppelt gezählt. Dadurch fällt der berichtete Effekt deutlich zu groß aus; korrekt gerechnet liegt er bei 4 statt bei 9 Prozent. Die Interpretation in Kapitel 5 muss ich entsprechend anpassen.</p><p>Ich habe eine korrigierte Fassung erstellt und würde sie Ihnen gern zusenden. Falls eine nachträgliche Korrektur nicht zulässig ist, verstehe ich das — mir war wichtig, dass Sie es von mir erfahren.</p><p>Mit freundlichen Grüßen<br>Nils Otten</p>",
 why:"Die Mail macht drei Dinge richtig: Sie benennt den Fehler konkret und beziffert die Folge, statt ihn abzuschwächen. Sie bietet eine Lösung an, statt um Nachsicht zu bitten. Und der letzte Satz akzeptiert im Voraus, dass die Korrektur abgelehnt werden kann — das macht die Mail glaubwürdig statt taktisch.",
 alt:"Was hier schaden würde: „Mir ist ein kleiner Fehler unterlaufen“ (Verkleinerung), „Es ist zu einem Fehler gekommen“ (Passiv) oder eine Erklärung, warum es passiert ist, vor der Sache selbst."},

{id:"sc09",ctx:"beruf",t:"Die Anfrage, die du gern annehmen würdest — aber nicht kannst",
 s:"Du wirst gefragt, ob du im kommenden Halbjahr eine AG übernimmst. Du willst es eigentlich, hast aber schon zwei Verpflichtungen und dein Examen vor der Brust.",
 ask:"Formuliere die Antwort.",
 model:"<p>Hallo Frau Braun,</p><p>vielen Dank für die Anfrage — ich hätte die AG wirklich gern übernommen.</p><p>Für dieses Halbjahr muss ich absagen: Neben zwei laufenden Verpflichtungen steht im Frühjahr mein Examen an, und ich möchte nichts zusagen, was ich dann nicht verlässlich halten kann.</p><p>Für das Schuljahr darauf würde ich mich freuen, wenn Sie mich wieder fragen. Und falls Sie jemanden suchen: Tim Reuter hat mir erzählt, dass er genau so etwas sucht — ich frage ihn gern.</p><p>Viele Grüße<br>Nils Otten</p>",
 why:"Das Muster für eine gute Absage: Dank, echtes Bedauern (nur wenn es stimmt), klare Absage, <i>ein</i> Satz Begründung — hier mit dem stärksten möglichen Argument: Verlässlichkeit. Dann zwei Türen offen halten: späterer Zeitpunkt und konkrete Alternative.",
 alt:"„Ich schaue mal, ob ich es einrichten kann“ wäre die schlechteste Antwort: Sie hält alle in der Schwebe und macht dich am Ende zum Unzuverlässigen."},

{id:"sc10",ctx:"privat",t:"Der Text, den du nicht abschicken solltest",
 s:"Du hast dich in einer WhatsApp-Gruppe geärgert und um 23:40 Uhr eine lange, scharfe Nachricht getippt. Sie ist nicht unfair, aber sie ist wütend. Der Finger schwebt über „Senden“.",
 ask:"Formuliere, was du stattdessen am nächsten Morgen schreibst.",
 model:"<p>„Ich war gestern Abend ziemlich geladen und habe mir eine Antwort verkniffen — heute geht es sachlicher.</p><p>Mich hat gestört, dass die Entscheidung ohne uns gefallen ist, obwohl wir dreimal darüber gesprochen hatten. Ich weiß nicht, ob das Absicht war oder einfach schnell gehen musste.</p><p>Mir wäre wichtig, dass wir solche Sachen vorher kurz abstimmen. Können wir das so machen?“</p>",
 why:"Der erste Satz ist der Schlüssel: Er benennt die Verzögerung als bewusste Entscheidung. Damit wirkt die späte Antwort nicht ausweichend, sondern souverän. Danach der übliche Aufbau — Beobachtung, ausdrückliche Offenheit für eine harmlose Erklärung („ich weiß nicht, ob“), konkreter Wunsch als Frage.",
 alt:"Faustregel: Alles, was nach 22 Uhr getippt wird und länger als drei Zeilen ist, wird am nächsten Morgen kürzer und besser. Der Entwurf war trotzdem nicht umsonst — er hat dir gezeigt, was dich stört."},

{id:"sc11",ctx:"uni",t:"Die Frage im vollen Hörsaal",
 s:"Du hast eine Verständnisfrage zur Vorlesung. Der Saal ist voll, alle wirken, als hätten sie es verstanden. Du willst nicht dumm dastehen — brauchst die Antwort aber wirklich.",
 ask:"Formuliere die Frage so, wie du sie stellen würdest.",
 model:"<p>„Ich komme beim Übergang von Folie 12 auf 13 nicht mit: Gilt die Formel auch, wenn die Gruppen unterschiedlich groß sind — oder setzt sie gleiche Gruppengrößen voraus?“</p>",
 why:"Zwei Merkmale machen eine gute Frage im Plenum aus. Erstens: Sie verortet die Lücke präzise („Folie 12 auf 13“) — das zeigt, dass du bis dorthin gefolgt bist. Zweitens: Sie ist geschlossen genug, um in einem Satz beantwortbar zu sein. Erfahrungsgemäß hat mindestens ein Drittel des Saals dieselbe Lücke.",
 alt:"Vermeide: „Ich hab das irgendwie nicht verstanden“ (zu vage, kostet alle Zeit) und die Selbstabwertung vorweg („Blöde Frage, aber …“) — die färbt auf die Antwort ab."},

{id:"sc12",ctx:"beruf",t:"Zu viel auf dem Tisch",
 s:"Deine Mentorin gibt dir eine weitere Aufgabe. Du hast bereits drei offene und weißt, dass etwas liegen bleiben wird. Du willst nicht als überfordert gelten, aber auch nichts reißen.",
 ask:"Formuliere deine Antwort.",
 model:"<p>„Gern — dann muss ich kurz mit Ihnen priorisieren.</p><p>Offen sind bei mir aktuell die Unterrichtsreihe für die 7b, das Protokoll der Fachkonferenz und die Vorbereitung des Elternabends. Wenn die Materialsammlung dazukommt, wird eines davon später fertig.</p><p>Was hat für Sie Vorrang? Ich richte mich danach.“</p>",
 why:"Das ist keine Absage, sondern eine Priorisierungsfrage — und deshalb schwer abzulehnen. Sie zeigt Überblick statt Überforderung, macht die Kapazitätsgrenze sichtbar, ohne sie zu beklagen, und gibt die Entscheidung dorthin zurück, wo sie hingehört. Wer so antwortet, wirkt organisiert, nicht schwach.",
 alt:"„Ich habe gerade wirklich viel zu tun“ erreicht das Gegenteil: Es klingt nach Klage und lässt offen, was passieren soll."}
];

const EX_C = [

/* ---------- REGISTER & ANREDE ---------- */
{id:"f01",c:"form",q:"Du schreibst zum ersten Mal an eine Professorin, die du nur aus der Vorlesung kennst. Welche Anrede passt?",o:[
 "Sehr geehrte Frau Weber,",
 "Sehr geehrte Frau Prof. Dr. Weber,",
 "Hallo Frau Weber,"],a:0,
 e:"Beim Erstkontakt ist „Sehr geehrte“ richtig. <b>Titelketten vermeiden:</b> Ein Titel genügt, und „Frau Professorin Weber“ oder schlicht „Frau Weber“ ist üblicher als das gestapelte „Prof. Dr.“. „Hallo“ funktioniert erst, wenn die andere Seite es vorgibt.",r:"form-anrede"},

{id:"f02",c:"form",q:"Deine Dozentin antwortet dir mit „Hallo Herr Otten, …“. Wie schreibst du zurück?",o:[
 "Hallo Frau Weber,","Sehr geehrte Frau Weber,","Liebe Frau Weber,"],a:0,
 e:"<b>Spiegeln.</b> Wer dich mit „Hallo“ anschreibt, signalisiert die Registerstufe. Beim „Sehr geehrte“ zu bleiben, wirkt distanziert oder unsicher.",r:"form-anrede"},

{id:"f03",c:"form",q:"Welche Grußformel ist der sichere Mittelweg — freundlicher als die Standardformel, aber ohne zu viel Nähe?",o:[
 "Beste Grüße","Mit freundlichen Grüßen","Liebe Grüße"],a:0,
 e:"<b>Beste Grüße</b> oder <b>Viele Grüße</b> sind heute in Uni und Beruf der Normalfall. „Mit freundlichen Grüßen“ ist korrekt, aber förmlich; „Liebe Grüße“ setzt eine persönliche Beziehung voraus.",r:"form-grussformel"},

{id:"f04",c:"form",q:"Was folgt nach der Grußformel?",o:[
 "Nichts — dann direkt der Name","Ein Komma","Ein Ausrufezeichen"],a:0,
 e:"Nach „Mit freundlichen Grüßen“ steht <b>kein Satzzeichen</b>. Der Name folgt in der nächsten Zeile.",r:"komma-brief"},

{id:"f05",c:"form",q:"Wie beginnst du den Text nach dem Anredekomma?",o:[
 "klein — „vielen Dank für Ihre Rückmeldung.“",
 "groß — „Vielen Dank für Ihre Rückmeldung.“"],a:0,
 e:"Nach dem Anredekomma geht es <b>klein</b> weiter. Der Satz beginnt erst dort und wird durch das Komma nur unterbrochen.",r:"komma-brief"},

/* ---------- BITTEN ---------- */
{id:"f06",c:"form",q:"Welche Fassung kommt bei einer vielbeschäftigten Dozentin besser an?",o:[
 "Könnten Sie mir bis Freitag antworten? Ich muss die Anmeldung bis dahin abschicken.",
 "Ich bräuchte bis Freitag eine Rückmeldung von Ihnen."],a:0,
 e:"„Ich bräuchte bis Freitag eine Rückmeldung“ ist eine als Feststellung getarnte Aufforderung. Der Konjunktiv macht sie nicht höflicher, nur indirekter. Eine <b>echte Frage</b> lässt ein Nein zu — und der Grund macht die Frist nachvollziehbar.",r:"form-bitten"},

{id:"f07",c:"form",q:"Was ist das Problem an „Ich wollte mal fragen, ob Sie vielleicht eventuell Zeit hätten“?",o:[
 "Vier Abschwächungen in einem Satz",
 "Es ist zu direkt","Grammatisch falsch"],a:0,
 e:"„wollte“, „mal“, „vielleicht“, „eventuell“ — jedes für sich in Ordnung, gestapelt entwerten sie die Bitte. <b>Eine Absicherung reicht:</b> „Hätten Sie kommende Woche Zeit?“",r:"form-hedging"},

{id:"f08",c:"form",q:"Wie formulierst du eine Frist am wirksamsten?",o:[
 "„bis Mittwoch, den 5. August",
 "„so schnell wie möglich“",
 "„zeitnah“"],a:0,
 e:"<b>Datum plus Grund.</b> „So schnell wie möglich“ und „zeitnah“ sind Dringlichkeitsgefühle, keine Informationen — jeder legt sie anders aus.",r:"form-frist"},

{id:"f09",c:"form",q:"Du bittest jemanden um einen Gefallen. Welcher Zusatz erhöht die Zusagequote?",o:[
 "„Sag ruhig ab, wenn es gerade zu viel ist.“",
 "„Du hast doch bestimmt Zeit.“",
 "„Es wäre wirklich super wichtig für mich.“"],a:0,
 e:"Eine ausdrückliche <b>Ausstiegstür</b> macht das Nein billig — und paradoxerweise das Ja wahrscheinlicher. Wer Verfügbarkeit unterstellt, erzeugt Widerstand.",r:"form-bitten"},

{id:"f10",c:"form",q:"Welche Bitte um Feedback bringt brauchbare Antworten?",o:[
 "„Ist der Aufbau logisch? Auf Rechtschreibung musst du nicht achten.“",
 "„Was hältst du davon?“",
 "„Ist das okay so?“"],a:0,
 e:"Je <b>enger</b> die Frage, desto brauchbarer die Antwort. Offene Fragen bringen höfliches Nichts, „Ist das okay?“ lädt zum Abnicken ein. Nenn den Aspekt — und den, auf den nicht geachtet werden soll.",r:"form-feedback"},

/* ---------- ABSAGEN ---------- */
{id:"f11",c:"form",q:"Aus welchen drei Teilen besteht eine gute Absage?",o:[
 "Dank — klare Absage — ein Satz Begründung",
 "Entschuldigung — lange Begründung — Hoffnung auf Verständnis",
 "Begründung — Absage — Entschuldigung"],a:0,
 e:"Alles über einen Begründungssatz hinaus wirkt wie eine <b>Bitte um Erlaubnis</b>. Optional kommt eine konkrete Alternative dazu — aber nur, wenn du sie wirklich einhalten kannst.",r:"form-absagen"},

{id:"f12",c:"form",q:"Warum ist „Ich schaue mal, ob ich es hinbekomme“ eine schlechte Antwort?",o:[
 "Ein Vielleicht, das keins ist",
 "Es ist unhöflich","Es ist zu direkt"],a:0,
 e:"Unklare Antworten erzeugen Folgekosten: Nachfragen, Doppelplanung, am Ende Enttäuschung. Ein <b>klares Nein ist respektvoller</b> als ein weiches Vielleicht.",r:"form-absagen"},

{id:"f13",c:"form",q:"Du musst einen Termin absagen. Was gehört in dieselbe Nachricht?",o:[
 "Ein konkreter Ersatzvorschlag",
 "Eine ausführliche Begründung",
 "Eine Entschuldigung über mehrere Sätze"],a:0,
 e:"Absage <b>plus Ersatztermin</b> in einer Nachricht. Sonst entstehen drei zusätzliche Mails, und die Terminfindung landet komplett beim anderen.",r:"form-absagen"},

{id:"f14",c:"form",q:"Eine Freundin lädt dich ein, du bist müde und willst nicht. Was ist die bessere Absage?",o:[
 "„Ich komme diesmal nicht — ich merke, dass ich nach der Woche ruhig bleiben will.“",
 "„Ich hab leider schon was vor.“ (obwohl das nicht stimmt)"],a:0,
 e:"Müdigkeit <b>ist</b> ein echter Grund. Wer sich einen besseren ausdenkt, produziert eine Lüge, die er sich merken muss — und trainiert sich darauf, dass die Wahrheit nicht reicht.",r:"form-absagen"},

/* ---------- NACHHAKEN ---------- */
{id:"f15",c:"form",q:"Was ist an „Wie bereits mehrfach erwähnt, fehlt mir die Zuarbeit“ problematisch?",o:[
 "„Bereits mehrfach“ ist ein Vorwurf und erzeugt Rechtfertigung statt Zuarbeit",
 "Es ist zu kurz","Der Konjunktiv fehlt"],a:0,
 e:"Auch wenn es stimmt: Der Vorwurf verschiebt das Gespräch auf die Schuldfrage. Besser: <b>Ausstiegstür anbieten</b> („vermutlich untergegangen“), Frist nennen, Grund nennen.",r:"form-nachhaken"},

{id:"f16",c:"form",q:"Du hakst zum ersten Mal nach. Welche Formulierung erhält die Beziehung und bringt schneller eine Antwort?",o:[
 "„Vermutlich ist meine Mail im Alltag untergegangen",
 "„Ich warte immer noch auf Ihre Antwort.“",
 "„Falls Sie es vergessen haben sollten …“"],a:0,
 e:"Die <b>Ausstiegstür</b> lässt dem anderen das Gesicht. „Ich warte immer noch“ macht ihn zum Schuldigen, „falls Sie vergessen haben“ ist passiv-aggressiv.",r:"form-nachhaken"},

{id:"f17",c:"form",q:"Was darf beim zweiten Nachhaken dazukommen?",o:[
 "Eine sachlich benannte Konsequenz: „Sonst plane ich ohne dich.“",
 "Ein schärferer Ton","Gar nichts — man bleibt gleich freundlich"],a:0,
 e:"Beim zweiten Mal ist die Konsequenz <b>Information, kein Druck</b>. Wer immer weiter im gleichen Ton nachfasst, ohne je eine Folge zu nennen, wird nicht ernst genommen.",r:"form-nachhaken"},

{id:"f18",c:"form",q:"Jemand hat eine Zusage nicht eingehalten. Womit steigst du ein?",o:[
 "„Wir hatten den 20. vereinbart. Wie ist der aktuelle Stand?“",
 "„Du hattest mir das versprochen.“",
 "„Immer muss ich hinterherlaufen.“"],a:0,
 e:"Frag nach dem <b>Stand</b>, nicht nach dem Versäumnis. „Wie ist der Stand?“ öffnet ein Gespräch, der Vorwurf beendet es.",r:"form-nachhaken"},

/* ---------- ENTSCHULDIGEN ---------- */
{id:"f19",c:"form",q:"Welche Fassung räumt einen Fehler glaubwürdig ein?",o:[
 "„Ich habe die Kontrollgruppe doppelt gezählt. Die korrigierte Fassung kommt bis morgen Mittag.“",
 "„Es ist zu einem Fehler bei der Auswertung gekommen.“",
 "„Mir ist da ein kleiner Fehler unterlaufen.“"],a:0,
 e:"Das <b>Passiv ohne Verursacher</b> klingt wie Ausweichen, die Verkleinerung („kleiner Fehler“) wie Beschönigung. Belastbar ist: Was war mein Anteil? Was folgt? Bis wann?",r:"form-fehler"},

{id:"f20",c:"form",q:"Was ist an „Es tut mir leid, falls sich jemand angegriffen gefühlt haben sollte“ falsch?",o:[
 "Drei Ausweichmanöver",
 "Es ist grammatisch falsch","Es ist zu kurz"],a:0,
 e:"„falls“, „jemand“, „gefühlt“ — der Satz entschuldigt nichts. Eine Entschuldigung braucht ein <b>Subjekt, ein Objekt und keinen Konjunktiv</b>: „Was ich gesagt habe, war unfair. Es tut mir leid.“",r:"form-fehler"},

{id:"f21",c:"form",q:"Warum ist „Sorry, aber du hattest ja auch …“ keine Entschuldigung?",o:[
 "Das „aber“ hebt sie im selben Satz wieder auf",
 "„Sorry“ ist zu locker","Sie ist zu kurz"],a:0,
 e:"Eine Entschuldigung <b>ohne „aber“</b> ist die einzige, die ankommt. Was du erklären willst, kannst du später sagen — nicht im selben Satz.",r:"form-fehler"},

{id:"f22",c:"form",q:"Du bist eine Woche zu spät mit der Antwort. Was ist die elegantere Variante?",o:[
 "„Danke fürs Warten — hier kommt die Rückmeldung.“",
 "„Ich bitte vielmals um Entschuldigung für die unverzeihliche Verzögerung.“"],a:0,
 e:"<b>Dank statt Entschuldigung</b> nimmt dich nicht kleiner, als du bist, und lenkt nicht vom Inhalt ab. Übertriebene Reue erzeugt Unbehagen.",r:"form-fehler"},

/* ---------- WIDERSPRECHEN & KRITIK ---------- */
{id:"f23",c:"form",q:"Welcher Widerspruch ist ein Argument statt einer Ablehnung?",o:[
 "„Da komme ich nicht mit. Woraus schließt du, dass die Gruppe größer sein müsste?“",
 "„Das ist doch völliger Unsinn.“",
 "„Mit Verlaub, aber das kann nicht stimmen.“"],a:0,
 e:"Widerspruch, der <b>zeigt, wo genau er einsetzt</b>, führt das Gespräch weiter. Pauschale Ablehnung beendet es — und „mit Verlaub“ kündigt den Angriff nur höflich an.",r:"form-widerspruch"},

{id:"f24",c:"form",q:"Du stimmst grundsätzlich zu, hast aber einen Einwand. Was wirkt besser?",o:[
 "Zustimmung in einen eigenen Satz, dann der Einwand",
 "„Ja, aber …“ in einem Satz"],a:0,
 e:"Bei „ja, aber“ hört der Zuhörer nur noch das <b>„aber“</b> und überhört die Zustimmung. Ein Punkt statt eines „aber“ ändert die Wirkung erheblich.",r:"form-widerspruch"},

{id:"f25",c:"form",q:"Was ist der Unterschied zwischen Beobachtung und Bewertung?",o:[
 "„Dreimal zu spät“ ist eine Beobachtung, „unzuverlässig“ eine Bewertung",
 "Es gibt keinen","Beobachtungen sind höflicher formuliert"],a:0,
 e:"Über <b>Beobachtungen</b> kann man reden, über <b>Etiketten</b> nur streiten. Zählbare Beobachtungen sind nicht bestreitbar — Bewertungen provozieren Widerspruch statt Einsicht.",r:"form-kritik"},

{id:"f26",c:"form",q:"Warum sind „immer“ und „nie“ die größten Konfliktverstärker?",o:[
 "Sie sind fast nie wahr",
 "Sie klingen unhöflich","Sie sind umgangssprachlich"],a:0,
 e:"„Du kommst immer zu spät“ führt zu „Letzte Woche war ich pünktlich!“ — und schon geht es nicht mehr um das Problem. Besser: <b>zählbar</b> werden.",r:"form-kritik"},

{id:"f27",c:"form",q:"Welche Aussage kann dein Gegenüber nicht bestreiten?",o:[
 "„Ich werde wütend, wenn Absprachen nicht halten.“",
 "„Du machst mich wütend.“",
 "„Das ist respektlos.“"],a:0,
 e:"Die <b>Ich-Botschaft</b> ist kein Wohlfühl-Trick, sondern inhaltlich präziser: Über deine Wirkung weißt nur du Bescheid. Du-Botschaften schreiben dem anderen die Kontrolle über deine Gefühle zu.",r:"form-kritik"},

{id:"f28",c:"form",q:"Was fehlt einer Kritik, die nur beschreibt, was stört?",o:[
 "Ein konkreter Wunsch",
 "Eine Entschuldigung","Ein Lob vorweg"],a:0,
 e:"Jede Kritik braucht einen <b>Zielsatz</b>. Und der Wunsch muss erfüllbar sein: „Sag früher ab“ funktioniert, „Sag nie wieder ab“ nicht.",r:"form-kritik"},

{id:"f29",c:"form",q:"Deine Mentorin kritisiert deine Stunde. Womit reagierst du zuerst?",o:[
 "Mit einer Verständnisfrage: „Meinen Sie die Stationen oder das Aufwärmen?“",
 "Mit deiner Begründung","Mit Zustimmung, auch wenn du sie nicht teilst"],a:0,
 e:"<b>Erst verstehen, dann bewerten.</b> Die Nachfrage kauft dir Zeit, zeigt Zuhören und stellt sicher, dass du dich nicht gegen etwas verteidigst, das gar nicht gemeint war.",r:"form-kritikannehmen"},

{id:"f30",c:"form",q:"Was ist die schlechteste Reaktion auf berechtigte Kritik?",o:[
 "„Ja, aber du machst doch auch …“",
 "„Danke, ich denke darüber nach.“",
 "„Verstehe ich richtig, dass dich vor allem X stört?“"],a:0,
 e:"Der <b>Gegenangriff</b> beendet jede Rückmeldekultur — beim nächsten Mal sagt niemand mehr etwas. Auch „Ist ja gut“ ist Abwehr im Gewand der Zustimmung.",r:"form-kritikannehmen"},

/* ---------- ZUSAGEN, DANKEN, LOBEN ---------- */
{id:"f31",c:"form",q:"Was gehört immer in eine Zusage?",o:[
 "Was und bis wann","Ein Dank","Eine Einschränkung"],a:0,
 e:"Ohne Termin ist es eine <b>Absichtserklärung</b>, keine Zusage. „Ich versuche es“ klingt wie eine halbe Absage und lässt den anderen im Ungewissen.",r:"form-zusagen"},

{id:"f32",c:"form",q:"Jemand bedankt sich bei dir. Welche Antwort nimmt den Dank an?",o:[
 "„Sehr gern.“","„Kein Problem.“","„Nicht der Rede wert.“"],a:0,
 e:"„Kein Problem“ verneint, dass es Aufwand war — und <b>entwertet damit den Dank</b>. „Gern“ nimmt ihn an. Kleiner Unterschied, spürbare Wirkung.",r:"form-danken"},

{id:"f33",c:"form",q:"Was macht einen Dank persönlich statt floskelhaft?",o:[
 "Eine konkrete Sache nennen, für die du dankst",
 "Ihn länger machen","Ihn förmlicher formulieren"],a:0,
 e:"„Vor allem der Hinweis zur Fragestellung hat mir weitergeholfen“ ist der ganze Unterschied zwischen <b>Höflichkeit und Anerkennung</b>.",r:"form-danken"},

{id:"f34",c:"form",q:"Was ist an „Nicht schlecht für den ersten Versuch“ problematisch?",o:[
 "Als Lob gemeint, als Einschränkung gehört",
 "Es ist zu direkt","Es ist grammatisch falsch"],a:0,
 e:"Relativierendes Lob wirkt auch — nur anders, als du willst. Besser: <b>konkret</b> sagen, was gut war und warum es einen Unterschied gemacht hat.",r:"form-loben"},

{id:"f35",c:"form",q:"Warum ist „Danke im Voraus“ heikel?",o:[
 "Es setzt die Zusage voraus und macht das Nein teurer",
 "Es ist grammatisch falsch","Es ist zu förmlich"],a:0,
 e:"Viele empfinden es als höflich verpackten Druck. Besser: <b>für das danken, was schon da ist</b> — „Über eine Rückmeldung würde ich mich freuen. Vielen Dank!“",r:"form-danken"},

/* ---------- GRENZEN & ÜBERLASTUNG ---------- */
{id:"f36",c:"form",q:"Du bekommst eine vierte Aufgabe, hast aber keine Kapazität. Was wirkt am stärksten?",o:[
 "Eine Priorisierungsfrage: „Was hat Vorrang? Ich richte mich danach.“",
 "„Ich habe gerade wirklich viel zu tun.“",
 "Alles annehmen und später Fristen reißen."],a:0,
 e:"Die Priorisierungsfrage ist <b>keine Absage</b> und deshalb schwer abzulehnen. Sie zeigt Überblick statt Überforderung und gibt die Entscheidung dorthin zurück, wo sie hingehört.",r:"form-grenzen"},

{id:"f37",c:"form",q:"Wie werden Grenzen tatsächlich etabliert?",o:[
 "Durch Verhalten",
 "Durch eine klare Formulierung","Durch Wiederholung der Ansage"],a:0,
 e:"Wer ankündigt, abends nicht mehr zu antworten, und dann doch sofort reagiert, <b>löscht die Ansage</b>. Formulierungen helfen — tragen aber nur, wenn das Verhalten folgt.",r:"form-grenzen"},

{id:"f38",c:"form",q:"Du musst ein Gespräch beenden. Was gehört dazu?",o:[
 "Ein Anschluss: „Lass uns morgen weitermachen.“",
 "Eine Entschuldigung","Eine Zusammenfassung"],a:0,
 e:"Ein Gespräch, das <b>vertagt</b> wird, endet ohne Kränkung; eines, das abbricht, nicht. Der Anschluss kostet einen halben Satz.",r:"form-grenzen"},

{id:"f39",c:"form",q:"Was ist der schnellste Weg, eine Mail unlesbar zu machen?",o:[
 "Drei Sätze Vorrede, bevor das Anliegen kommt",
 "Sie zu kurz halten","Zu wenige Höflichkeitsformeln"],a:0,
 e:"In einem vollen Postfach entscheidet der <b>erste Satz</b>, ob weitergelesen wird. Höflichkeit steckt in Anrede und Schluss, nicht in der Verzögerung.",r:"form-mailaufbau"},

{id:"f40",c:"form",q:"Welcher Betreff ist brauchbar?",o:[
 "Rückfrage zur Prüfungsanmeldung Modul B3 (Matrikelnr. 1234567)",
 "Frage","Wichtig!!!"],a:0,
 e:"Guter Betreff = <b>Thema + Kennzeichnung</b>. Wer 200 Mails am Tag bekommt, entscheidet daran, wann er antwortet. Dringlichkeit gehört in den Text, nicht in Großbuchstaben.",r:"form-mailaufbau"},

{id:"f41",c:"form",q:"„Man sollte da vielleicht mal drüber nachdenken.“ Was ist das Problem?",o:[
 "Niemand ist zuständig",
 "Der Satz ist zu lang","„Man“ ist grammatisch falsch"],a:0,
 e:"<b>„Man“ ist das Fluchtwort der deutschen Sprache.</b> Ersetz es durch „ich“ oder „wir“, und der Satz wird verbindlich: „Ich schlage vor, dass wir das im nächsten Treffen entscheiden.“",r:"form-verbindlich"},

{id:"f42",c:"form",q:"Wie überbringst du eine schlechte Nachricht?",o:[
 "Nachricht — Grund — nächster Schritt",
 "Vorrede — Grund — Nachricht",
 "Entschuldigung — Nachricht — Erklärung"],a:0,
 e:"Menschen kommen mit schlechten Nachrichten zurecht — <b>nicht aber mit Unklarheit</b>. Die Nachricht hinter Absätzen zu verstecken oder sie weichzuzeichnen, verlängert nur die Unsicherheit.",r:"form-schlechtenachricht"},

{id:"f43",c:"form",q:"Was ist an „Ich würde sagen, dass das eventuell ein möglicher Ansatz sein könnte“ falsch?",o:[
 "Fünffach abgesichert — der Satz behauptet nichts mehr",
 "Er ist zu direkt","Der Konjunktiv ist falsch gebildet"],a:0,
 e:"Nicht widerlegbar, aber auch nicht brauchbar. <b>Eine Absicherung pro Aussage</b>, und wähl die passende Stärke: „Das halte ich für den besseren Weg, weil …“",r:"stil-hedging"},

{id:"f44",c:"form",q:"„Bei Rückfragen stehe ich Ihnen jederzeit gerne zur Verfügung.“ — Was wäre besser?",o:[
 "Den Satz für eine Information nutzen: „Geändert habe ich vor allem Kapitel 2.“",
 "Ihn förmlicher machen","Ihn ans Ende setzen"],a:0,
 e:"Reine <b>Bausteinsprache</b> sagt nichts, was nicht ohnehin gilt. Nutz den Platz für etwas, das dem Empfänger Sucharbeit spart.",r:"form-floskel"},

{id:"f45",c:"form",q:"Warum ist „Wir müssen reden“ die schlechteste Gesprächseröffnung?",o:[
 "Sie löst Alarm aus",
 "Sie ist zu direkt","Sie ist grammatisch unvollständig"],a:0,
 e:"Besser: <b>Thema nennen und den Zeitpunkt zur Wahl stellen.</b> „Ich würde gern über Samstag sprechen — hast du heute Abend Zeit?“ Ein Gespräch, für das der andere sich entschieden hat, verläuft anders.",r:"form-konflikt"},

{id:"f46",c:"form",q:"Was ist die bessere Hilfsbereitschaft?",o:[
 "„Ich koche Dienstag und stelle es dir vor die Tür — sag nur, wenn es nicht passt.“",
 "„Wenn du was brauchst, melde dich einfach.“"],a:0,
 e:"Konkretes Angebot mit <b>Opt-out</b> statt vages Angebot mit Opt-in. Genau derjenige, der Hilfe braucht, fragt am seltensten danach.",r:"form-mitgefuehl"},

{id:"f47",c:"form",q:"Im Elterngespräch: Wie sprichst du ein Problem an?",o:[
 "Beobachtung — Frage — gemeinsames Ziel",
 "Bewertung — Anweisung — Frist",
 "Vergleich mit anderen Kindern — Appell"],a:0,
 e:"Die <b>Frage in der Mitte</b> ist entscheidend: Sie macht Eltern zu Partnern statt zu Angeklagten. „Ihr Sohn ist faul“ ist ein Etikett — Eltern verteidigen ihr Kind, das ist ihre Aufgabe.",r:"form-eltern"},

{id:"f48",c:"form",q:"Im Vorstellungsgespräch: Was überzeugt?",o:[
 "Eine Situation erzählen: Situation — Handlung — Erkenntnis",
 "„Ich bin teamfähig, belastbar und lernbereit.“",
 "„Meine größte Schwäche ist mein Perfektionismus.“"],a:0,
 e:"Drei Behauptungen ohne Beleg gewichtet niemand — jeder schreibt sie. Eine <b>Anekdote schlägt drei Adjektive</b>, im Anschreiben wie im Gespräch.",r:"form-bewerbung"},

{id:"f49",c:"form",q:"Du willst eine Verständnisfrage im vollen Hörsaal stellen. Was macht sie gut?",o:[
 "Sie verortet die Lücke präzise: „Beim Übergang von Folie 12 auf 13 …“",
 "Sie beginnt mit „Blöde Frage, aber …“",
 "Sie bleibt allgemein, damit sie mehr abdeckt"],a:0,
 e:"Eine präzise Frage zeigt, dass du <b>bis dorthin gefolgt</b> bist — das Gegenteil von dumm. Selbstabwertung vorweg färbt dagegen auf die Antwort ab.",r:"form-nachfragen"},

{id:"f50",c:"form",q:"Nach einem wichtigen mündlichen Gespräch — was lohnt sich?",o:[
 "Ein Zweizeiler, der die Absprache festhält",
 "Nichts, das wirkt misstrauisch",
 "Ein ausführliches Protokoll"],a:0,

const RULES_FORM = [

{id:"form-anrede",c:"form",t:"Anrede — die richtige Stufe treffen",b:`
<p><b>Sehr geehrte/r …</b> — Erstkontakt, Behörden, Bewerbungen, Professorinnen, alle, die du nicht kennst.</p>
<p><b>Guten Tag / Hallo …</b> — Uni-Alltag, Kolleginnen, nach dem ersten Austausch. „Guten Tag“ ist etwas formeller als „Hallo“.</p>
<p><b>Liebe/r …</b> — persönliche Bekanntschaft. In Uni und Beruf erst, wenn die andere Seite es vorgibt.</p>
<p><b>Die wichtigste Regel: spiegeln.</b> Wer dich mit „Hallo Herr Otten“ anschreibt, erwartet kein „Sehr geehrte“. Wer beim „Sehr geehrte“ bleibt, wirkt distanziert oder unsicher.</p>
<div class="ex"><span class="ok">Sehr geehrte Frau Weber,</span> · <span class="nope">Sehr geehrte Frau Prof. Dr. Weber,</span> (Titelkette)<br>
<span class="ok">Hallo Frau Weber,</span> · <span class="nope">Hallo Frau Prof. Weber,</span> (Register-Bruch)</div>
<p>Bei mehreren Personen: <code>Sehr geehrte Frau Weber, sehr geehrter Herr Lang,</code> — je eigene Zeile, ranghöchste oder direkt angesprochene Person zuerst.</p>
<p>Nach dem Anredekomma geht es <b>klein</b> weiter.</p>`},

{id:"form-grussformel",c:"form",t:"Grußformeln und ihre Wirkung",b:`
<ul>
<li><b>Mit freundlichen Grüßen</b> — korrekt, neutral, etwas förmlich. Nie falsch.</li>
<li><b>Beste Grüße / Viele Grüße</b> — heute der Normalfall in Uni und Beruf. Freundlicher, ohne aufdringlich zu sein.</li>
<li><b>Freundliche Grüße</b> — etwas kühler als „Beste Grüße“, in Norddeutschland verbreitet.</li>
<li><b>Herzliche Grüße</b> — persönliche Wärme, passt bei bestehendem Kontakt.</li>
<li><b>Liebe Grüße</b> — privat oder bei enger kollegialer Beziehung.</li>
</ul>
<p><b>Kein Satzzeichen</b> nach der Grußformel. Der Name folgt in der nächsten Zeile.</p>
<p>Vermeiden: <code>MfG</code> (wirkt lieblos), <code>Grüße</code> allein (schroff), <code>Mit den besten Grüßen aus Köln</code> in Serienmails.</p>`},

{id:"form-mailaufbau",c:"form",t:"Aufbau einer wirksamen Mail",b:`
<p><b>1. Betreff:</b> Thema + Kennzeichnung. <span class="ex">Rückfrage zur Prüfungsanmeldung Modul B3 (Matrikelnr. 1234567)</span>
Nicht: „Frage“, nicht „WICHTIG!!!“, nie leer.</p>
<p><b>2. Erster Satz:</b> das Anliegen. Nach dem ersten Satz muss klar sein, worum es geht.</p>
<div class="ex"><span class="ok">ich schreibe Ihnen wegen der Prüfungsanmeldung im Modul B3.</span><br>
<span class="nope">Ich hoffe, es geht Ihnen gut. Ich schreibe Ihnen, weil ich eine Frage hätte, und zwar geht es um Folgendes:</span></div>
<p><b>3. Kontext:</b> ein bis drei Sätze. Warum, seit wann, was hast du schon versucht.</p>
<p><b>4. Konkrete Bitte:</b> Was soll passieren, bis wann.</p>
<p><b>5. Schluss:</b> Dank oder Ausblick, Grußformel, Name.</p>
<p>Höflichkeit steckt in Anrede und Schluss — <b>nicht in der Verzögerung</b> des Anliegens.</p>`},

{id:"form-bitten",c:"form",t:"Bitten, die ankommen",b:`
<p>Der Unterschied zwischen Bitte und Forderung liegt nicht in der Höflichkeitsformel, sondern darin, <b>ob ein Nein möglich ist</b>.</p>
<div class="ex"><span class="nope">Ich bräuchte bis Freitag eine Rückmeldung.</span> → Feststellung im Konjunktiv, kein Ausweg<br>
<span class="ok">Könnten Sie mir bis Freitag antworten? Ich muss die Anmeldung bis dahin abschicken.</span></div>
<p><b>Bausteine einer guten Bitte:</b></p>
<ul>
<li>Echte Frageform („Könnten Sie …?“, „Wäre es möglich …?“)</li>
<li>Ein Satz Begründung — macht die Frist nachvollziehbar statt fordernd</li>
<li>Bei Gefallen: eine ausdrückliche Ausstiegstür („Sag ruhig ab, wenn es zu viel ist“)</li>
</ul>
<p>Die Ausstiegstür erhöht die Zusagequote, weil sie das Nein billig macht. Wer Verfügbarkeit unterstellt („Du hast doch bestimmt Zeit“), erzeugt Widerstand.</p>`},

{id:"form-frist",c:"form",t:"Fristen nennen",b:`
<p><b>Immer ein Datum, nie eine Dringlichkeitsstufe.</b></p>
<div class="ex"><span class="nope">so schnell wie möglich · zeitnah · bald · dringend</span><br>
<span class="ok">bis Mittwoch, den 5. August</span></div>
<p>Und dazu <b>warum</b>: „Danach läuft die Anmeldefrist ab.“ Das verwandelt eine Forderung in eine Information.</p>
<p>Wenn du selbst unsicher bist, nenn den Zeitpunkt, an dem du es weißt: „Ich melde mich Mittwoch mit einer verbindlichen Antwort.“</p>`},

{id:"form-hedging",c:"form",t:"Abschwächungen dosieren",b:`
<p>Höflichkeitssignale sind richtig — gestapelt entwerten sie die Aussage.</p>
<div class="ex"><span class="nope">Ich <b>wollte mal</b> fragen, ob Sie <b>vielleicht eventuell</b> Zeit hätten.</span><br>
<span class="ok">Hätten Sie kommende Woche Zeit für ein kurzes Gespräch?</span></div>
<p><b>Regel: eine Absicherung pro Satz.</b> Der Konjunktiv „hätten“ trägt die Höflichkeit allein.</p>
<p><b>Typische Stapler:</b> wollte, mal, vielleicht, eventuell, eigentlich, irgendwie, kurz, ganz kurz, nur.</p>
<p><b>Verkleinerungen</b> wirken genauso: „eine ganz kurze kleine Frage“ entwertet dein Anliegen im Voraus. Wenn die Frage so klein ist — warum sollte man sie beantworten? Falsch ist das nicht, es kostet dich nur Wirkung.</p>`},

{id:"form-absagen",c:"form",t:"Absagen ohne schlechtes Gewissen",b:`
<p><b>Drei Teile — mehr nicht:</b></p>
<ol>
<li>Dank für die Anfrage</li>
<li>Klare Absage</li>
<li>Ein Satz Begründung</li>
</ol>
<p>Optional: eine <b>konkrete Alternative</b> — aber nur, was du wirklich einhalten kannst.</p>
<div class="ex"><span class="ok">Vielen Dank für die Anfrage. Ich kann die AG nicht übernehmen, weil im Frühjahr mein Examen ansteht und ich nichts zusagen möchte, was ich dann nicht halten kann. Für das Schuljahr darauf gern wieder.</span></div>
<p><b>Was Absagen kaputtmacht:</b></p>
<ul>
<li><span class="nope">„Ich schaue mal, ob ich es hinbekomme.“</span> — Ein Vielleicht, das keins ist. Erzeugt Nachfragen und am Ende Enttäuschung.</li>
<li>Rechtfertigungsschleifen über fünf Sätze — wirken wie eine Bitte um Erlaubnis.</li>
<li>Erfundene Gründe. Müdigkeit ist ein echter Grund; wer sich einen besseren ausdenkt, muss sich die Lüge merken.</li>
</ul>
<p><b>Ein klares Nein ist respektvoller als ein weiches Vielleicht.</b></p>`},

{id:"form-nachhaken",c:"form",t:"Nachhaken ohne Vorwurf",b:`
<p><b>Erstes Nachfassen — Ausstiegstür anbieten:</b></p>
<div class="ex"><span class="ok">Ich komme noch einmal auf meine Anfrage vom 12. Juli zurück — vermutlich ist sie im Alltag untergegangen. Über eine kurze Rückmeldung würde ich mich freuen.</span></div>
<p><b>Zweites Nachfassen — Konsequenz sachlich benennen:</b></p>
<div class="ex"><span class="ok">Ich brauche bis Donnerstag eine Entscheidung, sonst kann ich nicht weiterplanen. Sollte es nicht möglich sein, sagen Sie mir das gern — dann suche ich eine andere Lösung.</span></div>
<p><b>Was den Ton vergiftet:</b></p>
<ul>
<li><span class="nope">„Wie bereits mehrfach erwähnt …“</span> — Vorwurf, auch wenn er stimmt</li>
<li><span class="nope">„Ich warte immer noch auf …“</span> — macht den anderen zum Schuldigen</li>
<li><span class="nope">„Falls Sie es vergessen haben sollten …“</span> — passiv-aggressiv</li>
</ul>
<p>Bei gebrochenen Zusagen: Frag nach dem <b>Stand</b>, nicht nach dem Versäumnis. „Wie ist der Stand?“ öffnet ein Gespräch, „Du hattest versprochen“ beendet es.</p>`},

{id:"form-fehler",c:"form",t:"Fehler einräumen",b:`
<p><b>Die belastbare Entschuldigung hat drei Teile:</b> Was war mein Anteil? Was folgt daraus? Bis wann?</p>
<div class="ex"><span class="ok">Ich habe bei der Auswertung die Kontrollgruppe doppelt gezählt. Der Effekt fällt dadurch zu groß aus. Die korrigierte Fassung schicke ich bis morgen Mittag.</span></div>
<p><b>Die vier Fluchtwege — alle erkennbar:</b></p>
<ul>
<li><span class="nope">Passiv ohne Verursacher:</span> „Es ist zu einem Fehler gekommen.“</li>
<li><span class="nope">Verkleinerung:</span> „Mir ist ein kleiner Fehler unterlaufen.“</li>
<li><span class="nope">Verschiebung:</span> „Es tut mir leid, falls sich jemand angegriffen gefühlt hat.“</li>
<li><span class="nope">Das „aber“:</span> „Sorry, aber du hattest ja auch …“ — hebt die Entschuldigung im selben Satz auf.</li>
</ul>
<p><b>Wenn du nichts falsch gemacht hast:</b> Bedauern über die <i>Wirkung</i> ist keine Schuldübernahme. „Es tut mir leid, dass es so angekommen ist“ bleibt ehrlich und deeskaliert trotzdem.</p>
<p><b>Für späte Antworten:</b> Ein Satz genügt. Noch besser Dank statt Entschuldigung — „Danke fürs Warten“ nimmt dich nicht kleiner, als du bist.</p>`},

{id:"form-widerspruch",c:"form",t:"Widersprechen",b:`
<p><b>Benenne den Punkt, an dem du aussteigst.</b> Widerspruch, der zeigt, wo genau er einsetzt, ist ein Argument. Pauschaler Widerspruch ist nur Ablehnung.</p>
<div class="ex"><span class="ok">Da komme ich nicht mit. Woraus schließt du, dass die Gruppe größer sein müsste?</span><br>
<span class="nope">Das ist doch völliger Unsinn.</span></div>
<p><b>Zustimmen und einschränken:</b> Setz die Zustimmung in einen <b>eigenen Satz</b>, bevor die Einschränkung kommt.</p>
<div class="ex"><span class="ok">Im Grundsatz stimme ich zu. Offen bleibt für mich die Frage, wie …</span><br>
<span class="nope">Ja, aber …</span> — der Zuhörer hört nur das „aber“</div>
<p><b>Vermeiden:</b> „Mit Verlaub, aber …“ kündigt den Angriff höflich an und wirkt herablassend. „Ich will ja nichts sagen, aber …“ — dann sag es einfach.</p>
<p><b>Eine Entscheidung hinterfragen:</b> „Vielleicht übersehe ich etwas“ ist keine Selbstverkleinerung, sondern eine Einladung zur Erklärung. Sie kostet nichts und öffnet Türen.</p>`},

{id:"form-kritik",c:"form",t:"Kritik äußern — der Vierschritt",b:`
<p><b>1. Beobachtung</b> — zählbar, mit Zeitraum, ohne Wertung<br>
<span class="ex">„Du bist diese Woche dreimal später gekommen als abgemacht.“</span></p>
<p><b>2. Wirkung</b> — was das bei dir auslöst<br>
<span class="ex">„Das bringt mich in Zeitdruck.“</span></p>
<p><b>3. Anerkennung des Kontexts</b> — optional, aber wirksam<br>
<span class="ex">„Ich weiß, dass bei dir gerade viel los ist.“</span></p>
<p><b>4. Konkreter Wunsch</b> — erfüllbar formuliert<br>
<span class="ex">„Sag mir kurz Bescheid, wenn es später wird.“</span></p>
<hr class="sep">
<p><b>Beobachtung ≠ Bewertung.</b> „Dreimal zu spät“ ist eine Beobachtung, „unzuverlässig“ ein Etikett. Über Beobachtungen kann man reden, über Etiketten nur streiten.</p>
<p><b>„Immer“ und „nie“</b> sind die größten Konfliktverstärker der deutschen Sprache. Sie sind fast nie wahr — der andere sucht die Ausnahme und diskutiert über sie.</p>
<p><b>Die Ich-Botschaft</b> ist kein Wohlfühl-Trick: Sie ist die einzige Aussage, die dein Gegenüber nicht bestreiten kann. „Du machst mich wütend“ schreibt ihm die Kontrolle über deine Gefühle zu — „Ich werde wütend, wenn …“ nicht.</p>
<p><b>Ohne Wunsch keine Kritik.</b> Wer nur beschreibt, was stört, lässt Unmut im Raum — und der ändert nichts.</p>`},

{id:"form-kritikannehmen",c:"form",t:"Kritik annehmen",b:`
<p><b>Erst verstehen, dann bewerten.</b> Die Nachfrage kauft dir Zeit, zeigt Zuhören und stellt sicher, dass du dich nicht gegen etwas verteidigst, das gar nicht gemeint war.</p>
<div class="ex"><span class="ok">Danke, dass Sie das ansprechen. Verstehe ich richtig, dass Sie vor allem die Stationenphase meinen?</span></div>
<p><b>Wenn du Bedenkzeit brauchst:</b> „Das muss ich sacken lassen — darf ich morgen darauf zurückkommen?“ Das ist keine Ausflucht, sondern Souveränität.</p>
<p><b>Wenn du nicht zustimmst:</b> Erklär deine <i>Absicht</i>, statt die Kritik zu bestreiten. Dann frag nach: „Woran hätten Sie gemerkt, dass es kippt?“ — das holt Erfahrungswissen ab, ohne Recht behalten zu wollen.</p>
<p><b>Was Rückmeldekultur zerstört:</b></p>
<ul>
<li><span class="nope">Gegenangriff:</span> „Ja, aber du machst doch auch …“ — beim nächsten Mal sagt niemand mehr etwas</li>
<li><span class="nope">Sofortdementi:</span> „Das habe ich nie gesagt“ — bevor du verstanden hast, was gemeint war</li>
<li><span class="nope">Scheinzustimmung:</span> „Ist ja gut.“ — Abwehr im Gewand der Zustimmung</li>
</ul>`},

{id:"form-zusagen",c:"form",t:"Zusagen",b:`
<p>Eine Zusage enthält immer <b>was</b> und <b>bis wann</b>. Ohne Termin ist es eine Absichtserklärung.</p>
<div class="ex"><span class="ok">Gern — bis Freitag hast du den ersten Entwurf.</span><br>
<span class="nope">Ich versuche es.</span> · <span class="nope">Ich glaube, das könnte klappen.</span></div>
<p>„Ich versuche es“ klingt wie eine halbe Absage. Wenn du wirklich unsicher bist, sag <b>genau das</b> — mit Datum: „Ich weiß es Mittwoch und melde mich dann.“</p>
<p><b>Bei Vorbehalten:</b> „Ich sage zu. Falls doch etwas dazwischenkommt, sage ich dir bis Donnerstag Bescheid.“ Das ist verbindlich und ehrlich zugleich.</p>`},

{id:"form-danken",c:"form",t:"Danken und auf Dank antworten",b:`
<p><b>Nenn eine konkrete Sache.</b> Das ist der ganze Unterschied zwischen Höflichkeit und Anerkennung.</p>
<div class="ex"><span class="ok">Vielen Dank — besonders der Hinweis zur Fragestellung hat mir weitergeholfen.</span><br>
<span class="nope">Danke für alles.</span> · <span class="nope">Vielen Dank nochmals im Voraus für Ihre Bemühungen.</span></div>
<p><b>„Danke im Voraus“</b> setzt die Zusage voraus und macht das Nein teurer. Viele empfinden es als höflich verpackten Druck. Besser: „Über eine Rückmeldung würde ich mich freuen. Vielen Dank!“</p>
<hr class="sep">
<p><b>Auf Dank antworten:</b></p>
<div class="ex"><span class="ok">Sehr gern. · Gern geschehen. · Das habe ich gern gemacht.</span><br>
<span class="nope">Kein Problem. · Nicht der Rede wert. · Ist doch selbstverständlich.</span></div>
<p>Die zweite Gruppe verneint, dass es Aufwand war — und entwertet damit den Dank. „Gern“ nimmt ihn an. Kleiner Unterschied, spürbare Wirkung.</p>`},

{id:"form-loben",c:"form",t:"Anerkennung aussprechen",b:`
<p><b>Konkretes Lob wirkt, allgemeines verpufft.</b> Sag, <i>was</i> gut war und <i>warum</i> es einen Unterschied gemacht hat.</p>
<div class="ex"><span class="ok">Die Struktur war klar und die Übergänge haben gesessen — das hat die Gruppe getragen.</span><br>
<span class="nope">Das hast du gut gemacht.</span></div>
<p><b>Was Lob zerstört:</b></p>
<ul>
<li><span class="nope">„Nicht schlecht.“</span> — als Lob gemeint, als Einschränkung gehört</li>
<li><span class="nope">„Für deine Verhältnisse gut.“</span> — herablassend, auch wenn nett gemeint</li>
<li><span class="nope">Lob nur als Einleitung zur Kritik</span> — das durchschaut jeder nach dem zweiten Mal</li>
</ul>
<p>Der Nebensatz nimmt zurück, was der Hauptsatz gibt. Wenn du loben willst, lob — und kritisier später separat.</p>`},

{id:"form-grenzen",c:"form",t:"Grenzen setzen",b:`
<p><b>Bei Überlastung: keine Absage, sondern eine Priorisierungsfrage.</b> Sie ist schwer abzulehnen, zeigt Überblick statt Überforderung und gibt die Entscheidung dorthin zurück, wo sie hingehört.</p>
<div class="ex"><span class="ok">Offen sind bei mir A, B und C. Wenn D dazukommt, wird eines davon später fertig. Was hat Vorrang?</span><br>
<span class="nope">Ich habe gerade wirklich viel zu tun.</span> — Klage ohne Frage</div>
<p><b>Erreichbarkeit:</b> „Ich lese Mails werktags bis 18 Uhr. Bei dringenden Anliegen erreichen Sie mich telefonisch.“</p>
<p><b>Wichtig:</b> Grenzen werden nicht durch Ansage etabliert, sondern durch <b>Verhalten</b>. Wer ankündigt, abends nicht zu antworten, und dann doch sofort reagiert, löscht die Ansage.</p>
<p><b>Gespräche beenden:</b> immer mit Anschluss. „Lass uns morgen mit frischem Kopf weitermachen.“ Ein vertagtes Gespräch endet ohne Kränkung, ein abgebrochenes nicht.</p>`},

{id:"form-verbindlich",c:"form",t:"Verbindlich formulieren",b:`
<p><b>„Man“ ist das Fluchtwort der deutschen Sprache.</b> Wo „man“ steht, ist niemand zuständig — und nichts passiert.</p>
<div class="ex"><span class="nope">Man sollte da vielleicht mal drüber nachdenken.</span><br>
<span class="ok">Ich schlage vor, dass wir das im nächsten Treffen entscheiden. Ich bereite zwei Varianten vor.</span></div>
<p><b>Verbindlichkeitsprüfung</b> für jeden Vorschlag:</p>
<ul>
<li>Steht ein <b>Name</b> drin — wer macht es?</li>
<li>Steht ein <b>Datum</b> drin — bis wann?</li>
<li>Steht ein <b>Ergebnis</b> drin — woran erkennt man, dass es erledigt ist?</li>
</ul>
<p>Fehlt eines davon, ist es eine Idee, keine Absprache.</p>`},

{id:"form-schlechtenachricht",c:"form",t:"Schlechte Nachrichten überbringen",b:`
<p><b>Reihenfolge: Nachricht — Grund — nächster Schritt.</b> Nicht umgekehrt.</p>
<div class="ex"><span class="ok">ich muss Ihnen leider mitteilen, dass der Antrag nicht bewilligt wurde. Die Begründung liegt mir vor; gern erläutere ich sie im Gespräch. Als nächsten Schritt schlage ich vor …</span></div>
<p>Menschen kommen mit schlechten Nachrichten zurecht — <b>nicht aber mit Unklarheit</b>. Zwei häufige Fehler:</p>
<ul>
<li>Die Nachricht hinter drei Absätzen Vorrede verstecken</li>
<li>Sie so weichzeichnen, dass der Empfänger sie überliest</li>
</ul>
<p>Und: Ausgerechnet hier greifen viele zu Passiv und Nominalstil („Es ist zu einer Nichtbewilligung gekommen“). Beides erhöht die Distanz genau da, wo Klarheit gebraucht wird.</p>`},

{id:"form-floskel",c:"form",t:"Bausteinsprache ersetzen",b:`
<p>Diese Sätze sagen nichts, was nicht ohnehin gilt:</p>
<div class="ex">Bei Rückfragen stehe ich Ihnen jederzeit gerne zur Verfügung. · Anbei sende ich Ihnen … · Ich hoffe, es geht Ihnen gut. · Wie bereits besprochen … · In diesem Zusammenhang möchte ich anmerken …</div>
<p><b>Nutz den Platz für Information:</b></p>
<div class="ex"><span class="nope">Anbei die Datei. Bei Rückfragen stehe ich gern zur Verfügung.</span><br>
<span class="ok">Anbei die überarbeitete Fassung. Geändert habe ich vor allem Kapitel 2 — dort ist die Fragestellung jetzt enger gefasst.</span></div>
<p><b>Test:</b> Streich den Satz. Fehlt inhaltlich etwas? Wenn nein, war er Dekoration.</p>`},

{id:"form-konflikt",c:"form",t:"Ein Konfliktgespräch eröffnen",b:`
<p><b>„Wir müssen reden“</b> löst bei fast jedem Menschen Alarm aus. Der andere kommt in Abwehrhaltung ins Gespräch, bevor es begonnen hat.</p>
<div class="ex"><span class="ok">Ich würde gern über Samstag sprechen. Hast du heute Abend Zeit dafür?</span></div>
<p><b>Zwei Elemente entschärfen jede Eröffnung:</b></p>
<ul>
<li><b>Thema nennen</b> — der andere weiß, worum es geht, und muss nicht raten</li>
<li><b>Zeitpunkt zur Wahl stellen</b> — ein Gespräch, für das man sich entschieden hat, verläuft anders als eines, in das man hineinstolpert</li>
</ul>
<p><b>Nie</b> in der Tür, im Weggehen oder per Sprachnachricht um 23 Uhr.</p>
<p><b>Ein ehrliches Eingangssignal hilft:</b> „Ich will dir was sagen, und das ist mir unangenehm.“ Das ist kein Zögern, sondern ein Rahmen — es kündigt an, dass etwas Wichtiges kommt, und senkt die Abwehr.</p>
<p><b>Faustregel für Geschriebenes:</b> Alles, was nach 22 Uhr getippt wird und länger als drei Zeilen ist, wird am nächsten Morgen kürzer und besser.</p>`},

{id:"form-mitgefuehl",c:"form",t:"Trost und Mitgefühl",b:`
<p><b>Nicht trösten wollen, sondern da sein.</b> Formeln, die den Verlust umdeuten, helfen nicht.</p>
<div class="ex"><span class="nope">Zeit heilt alle Wunden. · Sie hat es jetzt besser. · Alles hat einen Sinn.</span><br>
<span class="ok">Es tut mir sehr leid. Ich denke an dich. · Ich weiß nicht, was man in so einem Moment sagt.</span></div>
<p><b>Konkretes Angebot mit Opt-out</b> schlägt vages Angebot mit Opt-in:</p>
<div class="ex"><span class="nope">Wenn du was brauchst, melde dich einfach.</span> — die Bringschuld liegt beim Belasteten<br>
<span class="ok">Ich koche Dienstag und stelle es dir vor die Tür. Sag nur Bescheid, wenn es dir nicht recht ist.</span></div>
<p>Genau derjenige, der Hilfe braucht, fragt am seltensten danach.</p>`},

{id:"form-eltern",c:"form",t:"Elterngespräche",b:`
<p><b>Reihenfolge: Beobachtung — Frage — gemeinsames Ziel.</b> Die Frage in der Mitte ist entscheidend: Sie macht Eltern zu Partnern statt zu Angeklagten.</p>
<div class="ex"><span class="ok">Jonas hat in den letzten vier Wochen dreimal keine Sportsachen dabeigehabt. Ist Ihnen dazu etwas bekannt? Vielleicht finden wir gemeinsam eine Lösung.</span></div>
<p><b>Was Gespräche sofort verschließt:</b></p>
<ul>
<li><span class="nope">Etiketten:</span> „Ihr Sohn ist faul.“ — Eltern verteidigen ihr Kind, das ist ihre Aufgabe</li>
<li><span class="nope">Anweisungen an Erwachsene:</span> „Sie müssen zu Hause mehr …“</li>
<li><span class="nope">Vergleiche:</span> „Alle anderen Kinder schaffen das.“</li>
<li><span class="nope">Diagnosen:</span> „Vielleicht schämt sie sich?“ — Vermutungen gehören nicht ins Erstgespräch</li>
</ul>
<p><b>Beim Anruf entschärfen:</b> Ein Anruf von der Schule löst sofort Alarm aus. Der zweite Satz sollte lauten: „Es ist nichts Schlimmes passiert, ich möchte nur nachfragen.“</p>
<p><b>Die beste Investition:</b> eine positive Rückmeldung ohne Anlass. Wer nur anruft, wenn etwas nicht stimmt, macht jeden Anruf zur Drohung.</p>`},

{id:"form-bewerbung",c:"form",t:"Über sich sprechen",b:`
<p><b>Erzähl eine Situation, nicht eine Eigenschaft.</b> Situation — Handlung — Erkenntnis. Drei Sätze schlagen jedes Adjektiv.</p>
<div class="ex"><span class="nope">Ich bin sehr teamfähig, belastbar und lernbereit.</span><br>
<span class="ok">Im Praxissemester haben wir zu dritt eine Sportwoche organisiert. Als eine Kollegin kurzfristig ausfiel, habe ich ihre Stationen übernommen und die Planung angepasst. Gelernt habe ich dabei, Puffer von Anfang an einzuplanen.</span></div>
<p><b>Bei der Schwächenfrage:</b> Nenn eine echte Schwäche <b>plus</b> was du konkret dagegen tust. „Ich bin zu perfektionistisch“ durchschaut jeder.</p>
<p><b>Bei Anfragen für Praktikum oder Hospitation:</b> Nenn einen inhaltlichen Grund, warum ausgerechnet dort. Das unterscheidet dich von zwanzig gleichlautenden Anfragen. „Ich muss ein Praktikum machen“ macht dich zum Verwaltungsvorgang.</p>`},

{id:"form-feedback",c:"form",t:"Um Feedback bitten",b:`
<p><b>Je enger die Frage, desto brauchbarer die Antwort.</b></p>
<div class="ex"><span class="nope">Was hältst du davon?</span> — bringt höfliches Nichts<br>
<span class="nope">Ist das okay so?</span> — lädt zum Abnicken ein<br>
<span class="ok">Ist der Aufbau logisch? Auf Rechtschreibung musst du nicht achten.</span></div>
<p>Nenn den Aspekt, auf den geschaut werden soll — <b>und den, auf den nicht</b>. Das zweite entlastet den anderen und schärft das erste.</p>
<p><b>Noch stärker:</b> „Was würdest du an meiner Stelle anders machen?“ — die Frage verlangt eine Entscheidung, keine Bewertung.</p>`},

{id:"form-nachfragen",c:"form",t:"Nachfragen, ohne sich kleinzumachen",b:`
<p><b>Zwei Merkmale einer guten Nachfrage:</b></p>
<ul>
<li>Sie <b>verortet die Lücke präzise</b> — das zeigt, dass du bis dorthin gefolgt bist</li>
<li>Sie ist <b>geschlossen genug</b>, um in einem Satz beantwortbar zu sein</li>
</ul>
<div class="ex"><span class="ok">Beim Übergang von Folie 12 auf 13 komme ich nicht mit: Gilt die Formel auch bei unterschiedlich großen Gruppen?</span><br>
<span class="nope">Ich hab das irgendwie nicht verstanden.</span></div>
<p><b>Die stärkste Form ist die Zusammenfassung:</b> „Ich fasse kurz zusammen, damit ich sicher bin: Du meinst also …“ Sie zeigt, was angekommen ist, und macht die Lücke präzise sichtbar.</p>
<p><b>Nie vorweg entwerten:</b> „Blöde Frage, aber …“ oder „Ich bin wahrscheinlich zu blöd …“ färbt auf die Antwort ab. Erfahrungsgemäß hat mindestens ein Drittel des Raums dieselbe Lücke.</p>`},

{id:"form-absprachen",c:"form",t:"Absprachen festhalten",b:`
<p>Ein Zweizeiler nach jedem wichtigen Gespräch spart im Konfliktfall Stunden — <b>auch unter Freunden</b>.</p>
<div class="ex"><span class="ok">Zur Sicherheit halte ich fest: Ich reiche das Exposé bis zum 15. ein, Sie geben bis Monatsende Rückmeldung. Falls ich etwas falsch notiert habe, korrigieren Sie mich gern.</span></div>
<p>Der Schlusssatz ist wichtig: Er macht aus einer Festlegung ein <b>Angebot zur Korrektur</b> — damit wirkt die Notiz nicht misstrauisch, sondern sorgfältig.</p>
<p><b>In Gruppen gilt:</b> Wer zuerst Aufgaben und Termine aufschreibt, führt die Gruppe — ohne dass es nach Führung aussieht.</p>
<p><b>Nie</b> „wie besprochen“ schreiben, wenn es nicht besprochen wurde. Das fällt auf und kostet Vertrauen.</p>`}

];

{w:"kosten",t:"verb",k:"Akkusativ",ex:"Das kostet mich viel Zeit.",n:"Bei Preis und Zeit steht der Akkusativ; „kostet mir“ gilt als nicht voll anerkannt. In der Bedeutung „jemanden um etwas bringen“ ist der Dativ zulässig: „Das kostete ihm das Leben.“",fall:true,s:["Die Vorbereitung kostet ___ viel Zeit.","mich","mir"]},
{w:"lehren",t:"verb",k:"Akkusativ",ex:"Er lehrt mich das Schwimmen.",n:"Standard sind zwei Akkusative; der Dativ der Person („Er lehrt mir das“) kommt vor, gilt aber als schwächer. Gegenstück: „beibringen“ mit Dativ — „Er bringt mir das Schwimmen bei.“",fall:true},
