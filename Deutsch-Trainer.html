/* ---------- ZEICHENSETZUNG ---------- */
{id:"z-semikolon",c:"zeichen",t:"Semikolon",b:`
<p>Das Semikolon steht <b>zwischen Punkt und Komma</b>: enger verbunden als zwei Sätze, deutlicher getrennt als zwei Satzteile.</p>
<div class="ex">Die Vorbereitung war gut<span class="ok">;</span> die Umsetzung scheiterte an der Zeit.</div>
<p><b>Zwei Verwendungen:</b></p>
<ul>
<li><b>Gleichrangige Hauptsätze</b> mit engem inhaltlichem Bezug — dort, wo ein Punkt zu hart und ein Komma zu schwach wäre.</li>
<li><b>Gliederung in Aufzählungen</b>, wenn die Glieder selbst schon Kommas enthalten:<br>
<span class="ex">Mitgebracht werden: Sportschuhe, möglichst hell; ein Handtuch, kein Badetuch; eine Trinkflasche.</span></li>
</ul>
<p>Nach dem Semikolon geht es <b>klein</b> weiter.</p>
<p><b>Stilhinweis:</b> Das Semikolon ist ein Angebot, kein Muss. Wer unsicher ist, nimmt einen Punkt — der ist nie falsch.</p>`},

{id:"z-doppelpunkt",c:"zeichen",t:"Doppelpunkt",b:`
<p>Der Doppelpunkt kündigt an: Jetzt kommt das Angekündigte.</p>
<ul>
<li><b>Aufzählung:</b> Mitzubringen sind: Schuhe, Handtuch, Trinkflasche.</li>
<li><b>Wörtliche Rede:</b> Sie sagte: „Das machen wir anders.“</li>
<li><b>Erläuterung oder Zusammenfassung:</b> Das Ergebnis ist eindeutig: Die Methode funktioniert.</li>
</ul>
<p><b>Groß oder klein danach?</b></p>
<div class="ex">Folgt ein <b>vollständiger Satz</b> oder eine wörtliche Rede → <span class="ok">groß</span><br>
„Das Ergebnis ist eindeutig: <b>D</b>ie Methode funktioniert.“<br><br>
Folgt eine <b>Aufzählung oder Wortgruppe</b> → <span class="ok">klein</span><br>
„Mitzubringen sind: <b>S</b>chuhe, Handtuch …“ — hier groß, weil Substantive; sonst klein:<br>
„Die Lage ist klar: <b>k</b>eine Chance.“</div>
<p><b>Stilhinweis:</b> Nach einem Wort, das die Aufzählung schon einleitet, trägt der Doppelpunkt nichts bei — „bestehend aus: …“ oder „nämlich: …“ kommen ohne ihn aus. Eine Regel, die ihn dort verbietet, gibt es nicht; es liest sich nur glatter ohne.</p>`},

{id:"z-gedankenstrich",c:"zeichen",t:"Gedankenstrich und Bindestrich",b:`
<p>Zwei verschiedene Zeichen, die ständig verwechselt werden.</p>
<table class="dt"><thead><tr><th></th><th>Zeichen</th><th>Leerzeichen</th><th>Beispiel</th></tr></thead><tbody>
<tr><th>Bindestrich</th><td>- (kurz)</td><td>keine</td><td>E-Mail, Know-how, 100-Meter-Lauf</td></tr>
<tr><th>Gedankenstrich</th><td>– (lang)</td><td>beidseitig</td><td>Der Plan – so gut er war – scheiterte.</td></tr>
<tr><th>Bis-Strich</th><td>– (lang)</td><td class="hl">keine</td><td>1990–1995, 8–10 Uhr, Köln–Berlin</td></tr>
</tbody></table>
<p><b>Der Gedankenstrich</b> markiert einen Einschub, eine Pause oder eine Gegenüberstellung. Er ist stärker als das Komma und leichter als die Klammer.</p>
<div class="ex">Sie kam zurück – und blieb.<br>Das Training – bei Regen in der Halle – beginnt um 17 Uhr.</div>
<p><b>Der Bis-Strich</b> steht ohne Leerzeichen. <b>Wichtig:</b> Steht „von“ davor, muss „bis“ ausgeschrieben werden.</p>
<div class="ex"><span class="ok">von 1990 bis 1995</span> · <span class="ok">1990–1995</span> · <span class="nope">von 1990–1995</span></div>
<p><b>Randnotiz:</b> Die Duden-Redaktion setzt den Bis-Strich ohne Leerzeichen, die Norm DIN 5008 dagegen mit geschütztem Leerzeichen (8 – 10 Uhr). Für Fließtext ist die Duden-Variante die verbreitetere.</p>
<p><b>Eingabe:</b> Mac <code>Alt + Minus</code> · Windows <code>Strg + Minus</code> (Ziffernblock) oder <code>Alt + 0150</code>. In vielen Programmen wandelt die Autokorrektur „Wort - Wort“ automatisch um.</p>`},

{id:"z-anfuehrung",c:"zeichen",t:"Anführungszeichen",b:`
<p>Im Deutschen stehen die Anführungszeichen <b>unten und oben</b>:</p>
<div class="ex">Deutsch: <b>„Text“</b> (unten 99 · oben 66)<br>
Einfach (Zitat im Zitat): <b>‚Text‘</b><br>
Guillemets, ebenfalls korrekt: <b>»Text«</b> (Deutschland) · <b>«Text»</b> (Schweiz)<br>
<span class="nope">"Text"</span> — englische Zollzeichen, im gesetzten Text falsch</div>
<p><b>Wo steht der Punkt?</b></p>
<ul>
<li><b>Ganzer Satz zitiert</b> → Satzzeichen <b>innen</b>, danach kein weiterer Punkt:<br>
<span class="ex">Er sagte: „Ich komme später.“</span></li>
<li><b>Nur ein Teil zitiert</b> → Punkt <b>außen</b>:<br>
<span class="ex">Er nannte das eine „gute Idee“.</span></li>
<li><b>Redebegleitsatz folgt</b> → Komma statt Punkt, außerhalb der Anführung:<br>
<span class="ex">„Ich komme später“, sagte er.</span></li>
<li>Frage- und Ausrufezeichen bleiben beim Zitat, <b>wenn sie dazugehören</b>:<br>
<span class="ex">„Kommst du?“, fragte sie.</span><br>
Gehört das Fragezeichen zum Rahmensatz, steht es außen: <span class="ex">Hast du „Faust“ gelesen?</span></li>
</ul>
<p><b>Weitere Verwendung:</b> Werktitel, ironische Distanzierung, Hervorhebung eines Ausdrucks. Für Betonung nimmt man besser <i>kursiv</i> — Anführungszeichen lesen sich sonst wie Ironie.</p>`},

{id:"z-klammern",c:"zeichen",t:"Klammern",b:`
<p><b>Runde Klammern</b> für Zusätze, Erläuterungen und Quellenangaben:</p>
<div class="ex">Die Erhebung (n = 24) fand im Mai statt.</div>
<p><b>Eckige Klammern</b> vor allem für <b>eigene Eingriffe in fremden Text</b> — daneben für Klammern innerhalb von Klammern:</p>
<div class="ex">„Er [der Trainer] hat das entschieden.“ — eigene Ergänzung<br>
„Die Methode […] funktioniert.“ — Auslassung<br>
„Das ist korekt [sic]“ — Fehler im Original</div>
<p><b>Wo steht der Punkt?</b></p>
<ul>
<li>Klammer <b>innerhalb</b> eines Satzes → Punkt außen:<br>
<span class="ex">Das Training fällt aus (wegen des Wetters).</span></li>
<li><b>Ganzer Satz</b> in Klammern → Punkt innen:<br>
<span class="ex">Das Training fällt aus. (Der Platz ist gesperrt.)</span></li>
</ul>
<p><b>Stilhinweis:</b> Was in Klammern steht, wird beim Lesen übersprungen. Wichtiges gehört nicht in Klammern.</p>`},

{id:"z-auslassung",c:"zeichen",t:"Auslassungspunkte",b:`
<p>Mit <b>drei Punkten</b> zeigst du an, dass in einem Wort, Satz oder Text etwas ausgelassen ist. So steht es im Regelwerk — das Zeichen heißt deshalb <i>Auslassungspunkte</i>.</p>
<p><b>Typografisch</b> nimmst du dafür besser das eigene Zeichen … statt drei getippter Punkte. Es hält den richtigen Abstand und kann nicht am Zeilenende auseinandergerissen werden. Drei einzelne Punkte sind kein Rechtschreibfehler, nur die schlechtere Form.</p>
<ul>
<li><b>Ganzes Wort fehlt</b> → Leerzeichen davor: <span class="ex">Er wollte noch sagen, dass …</span></li>
<li><b>Wortteil fehlt</b> → direkt angeschlossen: <span class="ex">Verdammt noch m…!</span></li>
<li><b>Im Zitat</b> → in eckigen Klammern: <span class="ex">„Die Methode […] funktioniert.“</span></li>
</ul>
<p><b>Kein vierter Punkt:</b> Stehen die Auslassungspunkte am Satzende, ersetzen sie den Schlusspunkt.</p>
<div class="ex"><span class="ok">Er zögerte und sagte dann …</span> · <span class="nope">… .</span></div>
<p><b>Aber:</b> Frage- und Ausrufezeichen bleiben erhalten („Und dann …?“). Und stehen die Auslassungspunkte in einer Klammer, entfällt der Schlusspunkt des Satzes nicht.</p>
<p><b>Eingabe:</b> Mac <code>Alt + .</code> · Windows <code>Alt + 0133</code>. Die meisten Programme wandeln drei Punkte automatisch um.</p>
<p class="tiny muted">Belegt: Das amtliche Regelwerk spricht in § 99 von drei Punkten und regelt ihren Gebrauch, nicht ihre Kodierung. Dass … ein eigenes Zeichen ist, ist eine typografische Empfehlung (Duden, Typografie-Fachliteratur) — keine Rechtschreibregel.</p>`},

{id:"z-frage",c:"zeichen",t:"Frage- und Ausrufezeichen",b:`
<p><b>Nach einer indirekten Frage steht kein Fragezeichen</b> — das ist der häufigste Fehler:</p>
<div class="ex"><span class="ok">Er fragte, wann sie kommt.</span> · <span class="nope">Er fragte, wann sie kommt?</span></div>
<p>Das Fragezeichen steht nur bei der direkten Frage: <span class="ex">Wann kommst du?</span></p>
<p><b>Mehrere Fragen hintereinander</b> können einzeln oder gemeinsam abgeschlossen werden:</p>
<div class="ex">Wer kommt? Wann? Wohin?<br>Wer, wann und wohin?</div>
<p><b>Ausrufezeichen sparsam.</b> Nach der Anrede in Briefen ist es zulässig, wirkt aber aus der Zeit gefallen; die DIN 5008 sieht für Geschäftsbriefe das Komma vor. In Fachtexten und Mails wirkt es schnell schrill; eine Häufung (!!!) fällt negativ auf.</p>
<p><b>Kombinationen</b> wie <code>?!</code> sind in informellen Texten üblich, in formellen nicht.</p>`},

{id:"z-schraeg",c:"zeichen",t:"Schrägstrich, Apostroph, Sonderzeichen",b:`
<p><b>Schrägstrich</b> ohne Leerzeichen bei einzelnen Wörtern, mit Leerzeichen bei Wortgruppen:</p>
<div class="ex">Schüler/Schülerinnen · km/h · 2025/26<br>Deutsche Sporthochschule Köln / Institut für Trainingswissenschaft</div>
<p><b>Apostroph</b> — nur an drei Stellen:</p>
<ul>
<li>Auslassung: <code>hab’s, geht’s, so ’ne Sache</code></li>
<li>Namen auf s, ss, ß, tz, z, x: <code>Andreas’ Buch, Max’ Rad</code></li>
<li>Zur Verdeutlichung der Grundform: <code>Andrea’s Blumenladen</code> (nur bei Eigennamen, sonst nicht)</li>
</ul>
<p><span class="nope">Nie</span> beim normalen Genitiv (Peters Auto) und nie im Plural (Fotos, Pizzas, DVDs).</p>
<p><b>Das typografische Zeichen</b> ist <code>’</code>, nicht <code>'</code>. Die meisten Programme setzen es automatisch.</p>
<p><b>Weitere Zeichen mit Leerzeichen:</b> § 5 · 20 % · 12 °C · Nr. 7 · S. 12 — überall steht ein Leerzeichen zwischen Zahl und Zeichen. Ausnahme: Gradzeichen bei Winkeln (90°) und das Prozentzeichen in Zusammensetzungen (20-prozentig).</p>`},

/* ---------- ZAHLEN UND FORMALES ---------- */
{id:"n-ziffern",c:"zahlen",t:"Ziffern oder Wörter?",b:`
<p>Es gibt <b>keine verbindliche Regel</b> — aber eine verbreitete Konvention:</p>
<ul>
<li><b>Eins bis zwölf</b> ausschreiben, ab <b>13</b> in Ziffern. Das ist die klassische Zeitungsregel.</li>
<li><b>In aller Regel Ziffern</b> bei Maß-, Gewichts-, Geld- und Zeitangaben: 5 kg, 3 m, 12,50 €, 8 Uhr</li>
<li><b>Immer Ziffern</b> in Tabellen, Statistiken und wissenschaftlichen Texten</li>
<li><b>Immer Wörter</b> bei ungefähren Angaben: „gut hundert Teilnehmende“</li>
</ul>
<p><b>Wichtig ist die Einheitlichkeit im Text.</b> Wenn du dich einmal entschieden hast, bleib dabei — auch innerhalb eines Satzes: „12 von 24 Teilnehmenden“, nicht „zwölf von 24“.</p>
<p><b>Satzanfang:</b> Zahlen am Satzanfang werden ausgeschrieben — oder der Satz wird umgestellt.</p>
<div class="ex"><span class="ok">Vierundzwanzig Personen nahmen teil.</span><br>
<span class="ok">An der Erhebung nahmen 24 Personen teil.</span></div>`},

{id:"n-gliederung",c:"zahlen",t:"Große Zahlen gliedern",b:`
<p>Ab fünf Stellen wird gegliedert — in Dreiergruppen von rechts:</p>
<div class="ex">1000 oder 1.000 · 24 000 oder 24.000 · 1 250 000 oder 1.250.000</div>
<p><b>Zwei Konventionen stehen nebeneinander:</b> Der Duden lässt den <b>Punkt</b> zu, die Norm DIN 5008 empfiehlt ein <b>schmales Leerzeichen</b>. Beides ist korrekt — im Text einheitlich bleiben.</p>
<p><b>Nicht gegliedert werden:</b> Jahreszahlen (1995), Postleitzahlen (50933), Hausnummern, Telefonnummern.</p>
<p><b>Dezimaltrennzeichen ist das Komma:</b> 1,5 Millionen · 12,50 € · 3,7 Prozent. Der Punkt als Dezimaltrennzeichen ist englisch.</p>
<p><b>Große Zahlen mischen:</b> 1,5 Millionen ist lesbarer als 1 500 000. Mio. und Mrd. nur in Tabellen und knappen Angaben.</p>`},

{id:"n-einheiten",c:"zahlen",t:"Prozent, Grad, Maßeinheiten",b:`
<p>Zwischen Zahl und Einheit steht ein <b>Leerzeichen</b>:</p>
<div class="ex"><span class="ok">20 %</span> · <span class="ok">5 kg</span> · <span class="ok">3 m</span> · <span class="ok">12,50 €</span> · <span class="ok">80 km/h</span> · <span class="ok">§ 5</span> · <span class="ok">S. 12</span> · <span class="ok">Nr. 7</span></div>
<p><b>Temperatur:</b> Leerzeichen vor dem Gradzeichen, keins zwischen Grad und Einheit: <b>12 °C</b>.<br>
<b>Winkel und geografische Angaben:</b> ohne Leerzeichen: <b>90°</b>, <b>50° Nord</b>. Der Duden lässt daneben auch „20° C“ zu; „12 °C“ folgt der internationalen Einheitenschreibung.</p>
<p><b>In Zusammensetzungen</b> wird durchgekoppelt und das Leerzeichen entfällt:</p>
<div class="ex">eine 20-prozentige Steigerung · ein 5-kg-Gewicht · der 100-Meter-Lauf · ein 3-jähriges Kind (auch: dreijährig)</div>
<p><b>Einheitenzeichen bekommen keinen Punkt</b> und keine Pluralendung: 5 kg (nicht kg.), 3 m, 10 l.</p>`},

{id:"n-uhrzeit",c:"zahlen",t:"Uhrzeit",b:`
<p>Auch hier stehen zwei Konventionen nebeneinander:</p>
<div class="ex"><b>Duden / Fließtext:</b> um 8.30 Uhr · um 14.15 Uhr<br>
<b>DIN 5008 / Tabellen:</b> 08:30 · 14:15</div>
<p>Beides ist korrekt. Im Fließtext liest sich der Punkt natürlicher, in Listen und Formularen der Doppelpunkt.</p>
<p><b>Volle Stunden</b> ohne Nullen: <b>um 8 Uhr</b>, nicht „um 8.00 Uhr“ — außer in Tabellen, wo die Ausrichtung zählt.</p>
<p><b>Zeitspannen:</b></p>
<div class="ex"><span class="ok">von 9 bis 11 Uhr</span> · <span class="ok">9–11 Uhr</span> · <span class="nope">von 9–11 Uhr</span></div>
<p><b>Tageszeiten ausschreiben</b> statt 24-Stunden-Angaben zu mischen: „am Abend“ statt „um 20 Uhr abends“.</p>`},

{id:"n-datum",c:"zahlen",t:"Datum",b:`
<p><b>Im Fließtext</b> ausgeschrieben, mit Punkt nach der Ordnungszahl:</p>
<div class="ex">am 5. Mai 2026 · Köln, den 5. Mai 2026</div>
<p><b>In Ziffern</b> mit führender Null und Punkten: <b>05.05.2026</b>. Die Norm DIN 5008 lässt zusätzlich <b>2026-05-05</b> zu (sortierfreundlich, in Dateinamen praktisch).</p>
<p><b>Der Klassiker — dem oder den?</b></p>
<div class="ex"><span class="ok">am Montag, dem 5. Mai,</span> — Apposition im Dativ, üblicher<br>
<span class="ok">am Montag, den 5. Mai,</span> — Akkusativ der Zeitangabe, ebenfalls korrekt</div>
<p>Beide Formen sind zulässig. Bei mehrteiligen Angaben wird das schließende Komma gesetzt: „Am Montag, dem 5. Mai, beginnt der Kurs.“</p>
<p><b>Jahreszahlen</b> stehen ohne Präposition oder mit „im Jahr“:</p>
<div class="ex"><span class="ok">1995 erschien die Studie.</span> · <span class="ok">im Jahr 1995</span> · <span class="nope">in 1995</span></div>
<p><b>Zeiträume:</b> „von 1990 bis 1995“ oder „1990–1995“ — nie gemischt.</p>`},

{id:"n-abkuerzung",c:"zahlen",t:"Abkürzungen",b:`
<p><b>Mit Punkt</b> stehen Abkürzungen, die man beim Lesen als volles Wort ausspricht:</p>
<div class="ex">z. B. · d. h. · u. a. · u. Ä. · ca. · vgl. · ggf. · evtl. · inkl. · bzgl. · Nr. · Abb. · Tab. · S. · Bd. · Hrsg.</div>
<p><b>Ohne Punkt</b> stehen Kurzwörter, die als solche gesprochen werden, sowie Einheitenzeichen:</p>
<div class="ex">EU · USB · Pkw · Lkw · GmbH · kg · m · km/h · l · °C</div>
<p><b>Mehrteilige Abkürzungen bekommen ein Leerzeichen</b> — das ist der häufigste Fehler:</p>
<div class="ex"><span class="ok">z. B.</span> · <span class="nope">z.B.</span><br>
<span class="ok">d. h.</span> · <span class="nope">d.h.</span><br>
<span class="ok">u. a.</span> · <span class="ok">i. d. R.</span> · <span class="ok">z. T.</span></div>
<p>Typografisch korrekt ist ein <b>schmales</b> Leerzeichen; ein normales ist in Textverarbeitung völlig in Ordnung. Um einen Zeilenumbruch zu vermeiden, hilft ein geschütztes Leerzeichen (Mac <code>Alt + Leertaste</code>).</p>
<p><b>Am Satzende</b> steht nur ein Punkt: „… und vieles mehr, z. B. Schuhe usw.“ — kein zweiter Punkt.</p>
<p><b>In wissenschaftlichen Texten</b> gilt: im Fließtext ausschreiben, in Klammern und Fußnoten abkürzen. „zum Beispiel“ im Satz, „(z. B. Müller 2020)“ in der Klammer.</p>`},

{id:"n-quellen",c:"zahlen",t:"Seiten, Paragrafen, Verweise",b:`
<div class="ex"><b>S. 12</b> — eine Seite · <b>S. 12 f.</b> — Seite 12 und die folgende · <b>S. 12 ff.</b> — Seite 12 und mehrere folgende<br>
<b>S. 12–15</b> — genauer als „ff.“ und deshalb vorzuziehen<br>
<b>§ 5</b> — ein Paragraf · <b>§§ 5–7</b> — mehrere · <b>Abs. 2</b> · <b>Art. 3</b><br>
<b>Abb. 3</b> · <b>Tab. 1</b> · <b>Kap. 4</b> · <b>Anm. 12</b></div>
<p>Überall steht ein <b>Leerzeichen</b> zwischen Kürzel und Zahl. Bei mehreren Paragrafen wird das Zeichen verdoppelt.</p>
<p><b>vgl.</b> steht vor sinngemäßen Verweisen, nicht vor wörtlichen Zitaten. <b>ebd.</b> (ebenda) verweist auf die unmittelbar vorher genannte Quelle, <b>a. a. O.</b> (am angeführten Ort) ist heute unüblich.</p>
<p><b>Aufzählungen mit Ziffern:</b> Bei Gliederungspunkten steht der Punkt nur bei Ordnungszahlen — „1. Einleitung“, aber „(1) Einleitung“ ohne Punkt.</p>`}

  const def = {xp:0,streak:0,best:0,last:null,cards:{},days:{},cat:{},writing:{},scenes:{},
               log:[],korr:{},level:null,levelDate:null,plan:null,lastExport:null,
               session:null,speak:false,auto:true,theme:"light",seenW:{}};
  try{
    const raw = localStorage.getItem(KEY);
    return raw ? Object.assign(def, JSON.parse(raw)) : def;
  }catch(e){ return mem || (mem = def); }
}
let speicherDefekt = false;
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    if(speicherDefekt){ speicherDefekt = false; const b=$("#saveWarn"); if(b) b.remove(); }
  }catch(e){
    mem = S;
    if(!speicherDefekt){
      speicherDefekt = true;
      toast("Fortschritt kann nicht gespeichert werden");
      zeigeSpeicherwarnung();
    }
  }
}
function zeigeSpeicherwarnung(){
  if($("#saveWarn")) return;
  const b = document.createElement("div");
  b.id = "saveWarn";
  b.className = "savewarn";
  b.innerHTML = "<b>Dein Fortschritt wird gerade nicht gespeichert.</b> "+
    "Der Browser lässt es nicht zu — meist liegt das am privaten Modus oder an einem vollen Speicher. "+
    "Solange dieses Fenster offen bleibt, geht nichts verloren; beim Schließen schon. "+
    '<button class="btn sm" id="warnExp">Jetzt sichern</button>';
  const w = document.querySelector(".wrap");
  if(w) w.insertBefore(b, w.firstChild);
  const e = $("#warnExp");
  if(e) e.onclick = exportieren;
}
function exportieren(){
  try{
    const blob = new Blob([JSON.stringify(S)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "deutsch-trainer-"+today()+".json";
    a.click(); URL.revokeObjectURL(a.href);
    S.lastExport = today(); save();
    toast("Sicherung heruntergeladen");
  }catch(e){ toast("Sicherung fehlgeschlagen"); }
}
let S = load();

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function iso(d){ const x = new Date(d); x.setHours(12,0,0,0); return x.toISOString().slice(0,10); }
function today(){ return iso(new Date()); }
function addDays(isoStr,n){ const d = new Date(isoStr+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); }
function daysBetween(a,b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/864e5); }
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr,r){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor((r?r():Math.random())*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function norm(s){
  return String(s).toLowerCase().trim()
    .replace(/[„“”"'‚‘’]/g,"").replace(/[.,;:!?]+$/,"").replace(/\s+/g," ");
}
function deb(fn, ms){
  let t; return function(){ const a=arguments, c=this; clearTimeout(t); t=setTimeout(()=>fn.apply(c,a), ms||130); };
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400);
}
function tag(cat){ const c=CATS[cat]||{n:cat,cls:"t-stil"}; return '<span class="tag '+c.cls+'">'+c.n+"</span>"; }
const RULES_ALL = RULES.concat(RULES_FORM).concat(RULES_SATZ).concat(RULES_ZEICHEN);
function ruleById(id){ return RULES_ALL.find(r=>r.id===id); }

/* ---------- Kartenmodell ---------- */
function cardOf(id){ return S.cards[id] || {b:0,d:null,s:0,w:0}; }
function isDue(id){ const c=S.cards[id]; return c && c.d && c.d <= today(); }

/* Alle Karten, die es überhaupt gibt — Aufgaben, Wörter, Fälle. Eine Stelle, damit
   Fortschritt und Kartenansicht dieselbe Zahl nennen. */
function alleSchluessel(){
  return ALL.map(i=>i.id)
    .concat(WORDS.map(x=>"w:"+x.w))
    .concat(drillPool().map(e=>"c:"+e.w));
}

/* Was sitzt. Gezählt wird nach Leitner-Fach, nicht nach Trefferquote: Eine falsche
   Antwort setzt eine Karte auf Fach 1 zurück, wer in Fach 4 steht, hat also mindestens
   dreimal nacheinander richtig geantwortet. Mehr gibt der gespeicherte Stand nicht her —
   und mehr behauptet die Zahl deshalb auch nicht. Vor allem sagt sie nichts über den
   Abstand zwischen den Antworten, weil der nirgends festgehalten wird. */
const SICHER_AB = 4;
function retention(){
  const alle = alleSchluessel();
  let sicher = 0, aufbau = 0;
  alle.forEach(k=>{
    const c = S.cards[k];
    if(!c) return;
    if((c.b||0) >= SICHER_AB) sicher++; else aufbau++;
  });
  return {sicher, aufbau, neu: alle.length - sicher - aufbau, gesamt: alle.length};
}
function grade(id,ok,cat,rule){
  const c = cardOf(id);
  // Auf Anhieb richtig? Dann überspringt die Karte das erste Fach.
  if(ok){ c.b = Math.min((c.s ? c.b+1 : 2), BOXES.length); }
  else  { c.b = 1; c.w = (c.w||0)+1; if(typeof logError==="function") logError(id, cat, rule); }
  c.s = (c.s||0)+1;
  c.d = addDays(today(), BOXES[c.b-1]);
  S.cards[id] = c;
  if(cat){ const k = S.cat[cat] || {c:0,w:0}; ok ? k.c++ : k.w++; S.cat[cat]=k; }
  S.xp += ok ? 10 : 3;
  tagesZiel(ok);
  save();
}

/* Das Tagesziel zählt jede beantwortete Karte — gleich in welcher Ansicht.
   So zählt auch eine Runde beim Spazieren für die Serie. */
function tagesZiel(ok){
  const t = today();
  const d = S.days[t] || {a:0, c:0, t:0, done:false};
  d.a = (d.a||0) + 1;
  d.t = (d.t||0) + 1;
  if(ok) d.c = (d.c||0) + 1;
  if(!d.done && d.a >= TAGESZIEL){
    d.done = true;
    const y = addDays(t,-1);
    if(S.last === y) S.streak++;
    else if(S.last !== t) S.streak = 1;
    S.best = Math.max(S.best||0, S.streak);
    S.last = t;
    S.xp += 25;
    setTimeout(()=>toast("Tagesziel erreicht — Serie: "+S.streak+(S.streak===1?" Tag":" Tage")), 400);
  }
  S.days[t] = d;
}

/* ---------- Fragen bauen ---------- */
function exQuestion(it){
  if(it.t === "fill")
    return {key:it.id, cat:it.c, type:"fill", q:it.q, accept:it.a, exp:it.e, rule:it.r};
  // Optionen mischen, damit die richtige Antwort nicht immer an derselben Stelle steht.
  // Der Seed haengt an Aufgabe und Tag: innerhalb eines Tages stabil, danach neu.
  const r = rng(hash(it.id + "|" + today()));
  const order = shuffle(it.o.map((_,i)=>i), r);
  return {key:it.id, cat:it.c, type:"mc", q:it.q,
          opts:order.map(i=>it.o[i]), ans:order.indexOf(it.a), exp:it.e, rule:it.r};
}
function wordQuestion(w, r){
  const others = shuffle(WORDS.filter(x=>x.w!==w.w), r).slice(0,3).map(x=>x.d);
  const opts = shuffle([w.d].concat(others), r);
  const exp = "<b>"+esc(w.w)+"</b> ("+esc(w.p)+") — "+esc(w.d)+
    '<br><span style="opacity:.8">Beispiel: '+esc(w.ex)+"</span>"+
    (w.s && w.s!=="—" ? '<br><span style="opacity:.8">Sinnverwandt: '+esc(w.s)+"</span>" : "")+
    (w.t ? '<br><span style="opacity:.8">⚠ '+esc(w.t)+"</span>" : "");
  return {key:"w:"+w.w, cat:"wort", type:"mc",
          q:"Was bedeutet <em>"+esc(w.w)+"</em>?", opts:opts.map(esc),
          ans:opts.indexOf(w.d), exp:exp};
}

/* ---------- Tagesauswahl ----------
   Wiederholungen haben Vorrang vor neuem Stoff. Wie viel Neues dazukommt,
   hängt vom Rückstand ab — sonst wächst der Stapel schneller, als man ihn abbaut. */
function neuProTag(rueckstand){
  if(rueckstand > 60) return 0;
  if(rueckstand > 35) return 2;
  if(rueckstand > 18) return 4;
  return DAILY_EX - 4;
}

function buildDaily(){
  const r = rng(hash("d"+today()));
  const SLOTS = DAILY_EX + DAILY_WORDS;

  const dueEx = ALL.filter(i=>isDue(i.id))
    .sort((a,b)=>cardOf(a.id).d.localeCompare(cardOf(b.id).d));
  const dueW  = WORDS.filter(w=>isDue("w:"+w.w))
    .sort((a,b)=>cardOf("w:"+a.w).d.localeCompare(cardOf("w:"+b.w).d));
  const dueD  = drillDue().sort((a,b)=>cardOf("c:"+a.w).d.localeCompare(cardOf("c:"+b.w).d));
  const rueckstand = dueEx.length + dueW.length + dueD.length;
  const neuMax = neuProTag(rueckstand);

  const qs = [], used = new Set();

  // 1. Fällige zuerst — Wortkarten anteilig, damit der Wortschatz nicht liegen bleibt
  const wAnteil = Math.min(dueW.length, Math.max(1, Math.round(DAILY_WORDS)));
  dueW.slice(0, wAnteil).forEach(w=>{ qs.push(wordQuestion(w, r)); used.add("w:"+w.w); });
  dueD.forEach(e=>{
    if(qs.length >= SLOTS - neuMax) return;
    qs.push(caseQuestion(e)); used.add("c:"+e.w);
  });
  dueEx.forEach(i=>{
    if(qs.length >= SLOTS - neuMax) return;
    qs.push(exQuestion(i)); used.add(i.id);
  });
  // Wenn der Rückstand die Plätze nicht füllt, weitere fällige Wortkarten nachziehen
  dueW.slice(wAnteil).forEach(w=>{
    if(qs.length >= SLOTS - neuMax || used.has("w:"+w.w)) return;
    qs.push(wordQuestion(w, r)); used.add("w:"+w.w);
  });

  // 2. Neues auffüllen — Schwerpunkt der Planwoche zuerst
  const neuEx = [];
  const foc = (typeof planFocus === "function") ? planFocus() : null;
  if(foc){
    shuffle(ALL.filter(i=>i.c===foc && !used.has(i.id) && !S.cards[i.id]), r)
      .forEach(i=>neuEx.push(i));
  }
  const rest = shuffle(ALL.filter(i=>!used.has(i.id) && !S.cards[i.id]), r);
  const byCat = {};
  rest.forEach(i => (byCat[i.c] = byCat[i.c] || []).push(i));
  const order = shuffle(Object.keys(byCat), r);
  let idx = 0;
  while(neuEx.length < SLOTS && order.some(c=>byCat[c].length)){
    const c = order[idx++ % order.length];
    if(byCat[c].length) neuEx.push(byCat[c].shift());
  }
  neuEx.forEach(i=>{
    if(qs.length >= SLOTS || used.has(i.id)) return;
    qs.push(exQuestion(i)); used.add(i.id);
  });
  // Neue Wortkarten, solange Platz ist
  shuffle(WORDS.filter(w=>!S.cards["w:"+w.w] && !used.has("w:"+w.w)), r).forEach(w=>{
    if(qs.length >= SLOTS) return;
    qs.push(wordQuestion(w, r)); used.add("w:"+w.w);
  });
  // Letzter Ausweg: bereits gesehene, aber noch nicht fällige Karten
  if(qs.length < SLOTS){
    shuffle(ALL.filter(i=>!used.has(i.id)), r)
      .sort((a,b)=>cardOf(a.id).d.localeCompare(cardOf(b.id).d))
      .forEach(i=>{ if(qs.length < SLOTS && !used.has(i.id)){ qs.push(exQuestion(i)); used.add(i.id); } });
  }
  return shuffle(qs, r);
}

/* ---------- Unterwegs: Vorlesen, Wachhalten, Fortsetzen ---------- */
let wakeSperre = null;
function bildschirmWachhalten(an){
  try{
    if(an && navigator.wakeLock && !wakeSperre){
      navigator.wakeLock.request("screen").then(x=>{ wakeSperre = x; }).catch(()=>{});
    } else if(!an && wakeSperre){ wakeSperre.release().catch(()=>{}); wakeSperre = null; }
  }catch(e){}
}
function kannVorlesen(){
  return typeof speechSynthesis !== "undefined" && typeof SpeechSynthesisUtterance !== "undefined";
}
function sprechbar(t){
  return String(t)
    .replace(/<[^>]*>/g," ")
    .replace(/[„“”‚‘’"]/g,"")        // Anführungszeichen nicht mitlesen
    .replace(/\s[–—-]\s/g,", ")      // Gedankenstrich als kurze Pause
    .replace(/[·•]/g,", ")
    .replace(/\.\.\.|…/g," und so weiter ")
    .replace(/[→⇒]/g,", ")           // Pfeil als Pause
    .replace(/[\[\]()]/g," ")
    .replace(/_{2,}/g," Lücke ")
    .replace(/(\d)\s*%/g,"$1 Prozent")
    .replace(/(\d)\s*°/g,"$1 Grad")
    .replace(/§/g,"Paragraf ")
    .replace(/(\p{L})\s*\/\s*(\p{L})/gu,"$1 oder $2")
    .replace(/(,\s*){2,}/g,", ")     // doppelte Pausen zusammenfassen
    .replace(/\s+/g," ").trim();
}

/* Zwei Antworten können gleich klingen, obwohl sie sich in der Schreibung
   unterscheiden („des Weiteren“ / „des weiteren“). Beim Hören braucht es dann
   einen Hinweis darauf, worin der Unterschied besteht. */
const ZEICHENNAME = {",":"Komma", ".":"Punkt", "!":"Ausrufezeichen", "?":"Fragezeichen",
                     ";":"Semikolon", ":":"Doppelpunkt", "'":"Apostroph", "’":"Apostroph",
                     "-":"Bindestrich", "–":"Gedankenstrich", "…":"Auslassungspunkte",
                     "„":"Anführungszeichen auf", "“":"Anführungszeichen zu"};
const SYMBOLWORT = {"%":"Prozentzeichen", "°":"Gradzeichen", "§":"Paragrafzeichen", "€":"Eurozeichen"};
function nurZeichen(t){ return String(t).replace(/[^\p{L}\p{N}]/gu,""); }
function wortAnStelle(satz, pos){
  let n = 0;
  for(const w of satz.split(" ")){
    const kern = nurZeichen(w);
    if(pos < n + kern.length) return {wort: w.replace(/[^\p{L}\p{N}-]/gu,""), stelle: pos - n};
    n += kern.length;
  }
  return null;
}
/* Stellung der Satzzeichen, an Buchstaben gemessen — „,15“ heißt Komma nach 15 Zeichen */
function zeichenBild(s, welche){
  let n = 0; const out = [];
  for(const ch of s){
    if(/[\p{L}\p{N}]/u.test(ch)) n++;
    else if(!welche || welche.includes(ch)) { if(ZEICHENNAME[ch]) out.push(ch + n); }
  }
  return out.join(" ");
}
function kommaHinweis(satz){
  const vor = satz.split(" ").filter(w=>w.replace(/[.!?“”]+$/,"").endsWith(",")).map(w=>nurZeichen(w)).filter(Boolean);
  return vor.length ? "Komma nach " + vor.slice(0,3).join(" und nach ") : "ohne Komma";
}
function zeichenHinweis(satz){
  const teile = []; let wort = "";
  for(const ch of satz){
    if(/[\p{L}\p{N}]/u.test(ch)) { wort += ch; continue; }
    if(ch === " ") { wort = ""; continue; }
    if(ZEICHENNAME[ch] && wort) teile.push(ZEICHENNAME[ch] + " nach " + wort);
  }
  return teile.length ? teile.slice(0,3).join(", ") : "";
}
const TRENNZAHL = /(\d)([.,   ])(\d)/g;
function zahlBild(t){ return (String(t).match(/\d[.,   ]\d/g) || []).join(""); }
function zahlHinweis(t){
  const g = t.replace(TRENNZAHL, (m,x,z,y)=> x + (z==="." ? " Punkt " : z==="," ? " Komma " : " Leerzeichen ") + y);
  return g === t ? "" : "geschrieben " + g;
}
function hoerHinweis(opt, alle){
  const roh   = t => strip(t).replace(/\s+/g," ").trim();
  const flach = t => nurZeichen(roh(t)).toLowerCase();
  const mein  = roh(opt);
  const gleich = alle.map(roh).filter(x => x !== mein && flach(x) === flach(mein));
  if(!gleich.length) return "";
  const hin = [];
  const zu = x => { if(x && !hin.includes(x)) hin.push(x); };
  const ende = t => { const m = t.trim().match(/[.!?…]$/); return m ? m[0] : ""; };
  const zahl = (t,z) => (t.split(z).length - 1);
  gleich.forEach(a=>{
    let zahlSache = false, symbolSache = false, getroffen = false;
    const merk = x => { if(x){ getroffen = true; zu(x); } };
    // Zahlen: Tausender- und Dezimaltrennung ausbuchstabieren
    if(zahlBild(mein) !== zahlBild(a)){ merk(zahlHinweis(mein) || "ohne Trennzeichen"); zahlSache = true; }
    if(ende(mein) !== ende(a) && ZEICHENNAME[ende(mein)]) merk("am Ende " + ZEICHENNAME[ende(mein)]);
    if(/\s[.,;:!?]/.test(mein) !== /\s[.,;:!?]/.test(a))
      merk(/\s[.,;:!?]/.test(mein) ? "mit Leerzeichen vor dem Satzzeichen" : "ohne Leerzeichen davor");
    if(zahl(mein,"'") + zahl(mein,"’") !== zahl(a,"'") + zahl(a,"’"))
      merk(zahl(mein,"'") + zahl(mein,"’") ? "mit Apostroph" : "ohne Apostroph");
    if(mein.includes("-") !== a.includes("-"))
      merk(mein.includes("-") ? "mit Bindestrich" : "ohne Bindestrich");
    // Zeichen wie % und ° — vorhanden oder nicht, mit oder ohne Abstand
    Object.keys(SYMBOLWORT).forEach(z=>{
      if(mein.includes(z) !== a.includes(z)){
        merk(mein.includes(z) ? "mit " + SYMBOLWORT[z] : SYMBOLWORT[z] + " ausgeschrieben");
        symbolSache = true; return;
      }
      if(!mein.includes(z)) return;
      const luecke = t => (t.includes(" "+z) ? "v" : "") + (t.includes(z+" ") ? "n" : "");
      if(luecke(mein) === luecke(a)) return;
      const l = luecke(mein);
      merk(l === "vn" ? "Leerzeichen vor und nach dem " + SYMBOLWORT[z]
        : l === "v" ? "Leerzeichen vor dem " + SYMBOLWORT[z]
        : l === "n" ? "Leerzeichen nach dem " + SYMBOLWORT[z]
        : "ohne Leerzeichen beim " + SYMBOLWORT[z]);
      symbolSache = true;
    });
    if(!zahlSache && zeichenBild(mein,",") !== zeichenBild(a,",")) merk(kommaHinweis(mein));
    const wz = t => t.split(" ").filter(x=>nurZeichen(x)).length;
    if(!symbolSache && !zahlSache && wz(mein) !== wz(a))
      merk(wz(mein) < wz(a) ? "zusammengeschrieben" : "getrennt geschrieben");
    const bm = nurZeichen(mein), ba = nurZeichen(a);
    if(bm.length === ba.length){
      let gefunden = 0;
      for(let i = 0; i < bm.length && gefunden < 2; i++){
        if(bm[i] === ba[i]) continue;
        const w = wortAnStelle(mein, i); if(!w) continue;
        const gross = bm[i] === bm[i].toUpperCase();
        merk(w.stelle === 0 ? w.wort + (gross ? " groß" : " klein")
                            : w.wort + (gross ? " mit großem " : " mit kleinem ") + bm[i]);
        gefunden++;
      }
    }
    if(!getroffen) zu(zeichenHinweis(mein));   // Notnagel: alle Zeichen nennen
  });
  return hin.length ? " " + hin.join(", ") + "." : "";
}

/* Frage samt Antworten in einem Stück, wie sie unterwegs gehört wird */
function sprechFrage(q){
  const o = q.opts || [];
  return strip(q.q) + ". " +
    o.map((x,k)=>String.fromCharCode(65+k) + ": " + strip(x) + hoerHinweis(x, o)).join(". ");
}
function vorlesen(text, danach){
  if(!kannVorlesen() || !S.speak) return false;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(sprechbar(text));
    u.lang = "de-DE"; u.rate = 0.95;
    if(danach){ let fertig = false; const einmal = ()=>{ if(!fertig){ fertig = true; danach(); } };
                u.onend = einmal; u.onerror = einmal; }
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}

/* Unterwegs zählt jeder Tipp. Nach einer richtigen Antwort geht es von selbst
   weiter — abbrechen lässt sich das mit einem Tipp auf den Bildschirm. */
let autoUhr = null;
function autoAus(){
  if(autoUhr){ clearTimeout(autoUhr); autoUhr = null; }
  document.body.classList.remove("autolauf");
}
function autoAn(ms){
  autoAus();
  if(!S.auto || !Q || !Q.walk) return;
  document.body.classList.add("autolauf");
  const b = $("#nextBtn"); if(b) b.style.setProperty("--dauer", ms + "ms");
  autoUhr = setTimeout(()=>{ autoUhr = null; document.body.classList.remove("autolauf"); next(); }, ms);
}
function vorlesenStoppen(){ try{ if(kannVorlesen()) speechSynthesis.cancel(); }catch(e){} }

function sitzungSichern(){
  if(!Q || Q.done){ S.session = null; save(); return; }
  S.session = {list:Q.list, i:Q.i, correct:Q.correct, base:Q.base, title:Q.title, walk:!!Q.walk, ts:Date.now()};
  save();
}
function sitzungOffen(){
  const x = S.session;
  if(!x || !Array.isArray(x.list) || x.i >= x.list.length) return null;
  if(Date.now() - (x.ts||0) > 36*3600*1000) return null;
  return x;
}

/* ============================================================
   QUIZ-ENGINE
   ============================================================ */
let Q = null;   // {list, i, correct, host, onDone, title, countsForDay}

function startQuiz(list, host, opts){
  opts = opts || {};
  if(opts.walk) list = list.filter(q=>q.type !== "fill");   // Tippen geht unterwegs nicht
  if(!list.length){ host.innerHTML = '<div class="card center"><p class="muted">Nichts zu tun — komm später wieder.</p></div>'; return; }
  Q = {list, i:0, correct:0, base:list.length, host, onDone:opts.onDone, title:opts.title||"Übung", daily:!!opts.daily, walk:!!opts.walk};
  document.body.classList.toggle("walk", !!opts.walk);
  bildschirmWachhalten(!!opts.walk);
  sitzungSichern();
  renderQ();

function sitzungFortsetzen(host){
  const x = sitzungOffen();
  if(!x) return false;
  Q = {list:x.list, i:x.i, correct:x.correct||0, base:x.base||x.list.length, host, title:x.title||"Übung", walk:!!x.walk};
  document.body.classList.toggle("walk", !!x.walk);
  bildschirmWachhalten(!!x.walk);
  renderQ();
  return true;
}

  let body = "";
  if(q.type === "mc"){
    body = '<div class="opts">' + q.opts.map((o,i)=>
      '<button class="opt" data-i="'+i+'"><span class="k">'+String.fromCharCode(65+i)+'</span><span>'+o+"</span></button>"
    ).join("") + "</div>";
  } else {
    body = '<div class="fillbox"><input id="fillIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Antwort eintippen …">'+
           '<button class="btn" id="fillGo">Prüfen</button></div>';
  }
  const kopf = Q.walk
    ? '<div class="walktop">'+
        '<button class="btn ghost" id="walkOut">‹ Beenden</button>'+
        (kannVorlesen() ? '<button class="btn ghost'+(S.speak?" speakon":"")+'" id="walkSpeak" title="Vorlesen">🔊</button>' : "")+
        '<button class="btn ghost'+(S.auto?" speakon":"")+'" id="walkAuto" title="Nach richtiger Antwort automatisch weiter">⏩</button>'+
        '<span class="walkzahl">'+(Q.i+1)+" / "+Q.list.length+"</span>"+

      "</div>"
    : '<div class="spread" style="margin-bottom:12px">'+
        '<span class="tiny muted">'+Q.title+" · Frage "+(Q.i+1)+" von "+Q.list.length+"</span>"+ tag(q.cat)+
      "</div>";
  Q.host.innerHTML =
    '<div class="card">'+ kopf +
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      (q._nochmal ? '<p class="tiny muted" style="margin:6px 0 0">Noch einmal — die hattest du eben nicht.</p>' : "")+
      '<div class="qtext">'+q.q+"</div>"+
      body+
      '<div id="fbHost"></div>'+
    "</div>";
  if(Q.walk){
    const out = $("#walkOut");
    if(out) out.onclick = ()=>{ vorlesenStoppen(); bildschirmWachhalten(false);
      document.body.classList.remove("walk"); sitzungSichern();
      const zurueck = Q.host && Q.host.id === "walkHost" ? "heute" : "karten";
      Q=null; go(zurueck);
      toast("Runde gemerkt — du kannst später weitermachen"); };
    const au = $("#walkAuto");
    if(au) au.onclick = ()=>{ S.auto = !S.auto; save();
      au.classList.toggle("speakon", S.auto);
      if(!S.auto) autoAus();
      toast(S.auto ? "Weiter geht es von selbst" : "Weiter nur noch auf Tipp"); };
    const sp = $("#walkSpeak");
    if(sp) sp.onclick = ()=>{ S.speak = !S.speak; save();
      sp.classList.toggle("speakon", S.speak);
      if(S.speak) vorlesen(sprechFrage(q));
      else vorlesenStoppen(); };
    if(S.speak) vorlesen(sprechFrage(q));
  }
  if(q.type === "fill"){
    const inp = $("#fillIn");
    inp.focus();
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") check(inp.value); });
    $("#fillGo").onclick = ()=>check(inp.value);
  } else {
    $$(".opt").forEach(b => b.onclick = ()=>check(parseInt(b.dataset.i,10)));
  }
}

function check(input){
  const q = Q.list[Q.i];
  let ok, chosen = -1;
  if(q.type === "mc"){
    chosen = input; ok = (chosen === q.ans);
    $$(".opt").forEach((b,i)=>{
      b.disabled = true;
      if(i === q.ans) b.classList.add("right");
      else if(i === chosen) b.classList.add("wrong");
      else b.classList.add("dim");
    });
  } else {
    ok = q.accept.some(a => norm(a) === norm(input));
    const inp = $("#fillIn"); inp.disabled = true; $("#fillGo").disabled = true;
    inp.style.borderColor = ok ? "var(--acc)" : "var(--bad)";
  }
  if(!q._nochmal){
    grade(q.key, ok, q.cat, q.rule);
    if(ok) Q.correct++;
    else { Q.fehler = Q.fehler || []; Q.fehler.push({rule:q.rule, cat:q.cat}); }
    // Unterwegs: was danebenging, kommt am Rundenende noch einmal — zum Festigen,
    // ohne den Wiederholungsplan zu verändern
    if(!ok && Q.walk){
      const w = Object.assign({}, q); w._nochmal = true;
      Q.list.push(w);
    }
  }

  const rl = q.rule ? ruleById(q.rule) : null;
  const solution = q.type === "fill" ? "<b>Richtig wäre:</b> " + esc(q.accept[0]) + "<br>" : "";
  $("#fbHost").innerHTML =
    '<div class="fb'+(ok?"":" no")+'">'+
      '<b class="hd">'+(ok?"Richtig":"Nicht ganz")+"</b>"+
      (ok ? "" : solution) + q.exp +
      (rl ? '<a class="lnk" href="#" data-rule="'+rl.id+'">→ Regel nachlesen: '+esc(rl.t)+"</a>" : "")+
    "</div>"+
    '<div class="row" style="margin-top:16px"><button class="btn" id="nextBtn">'+
      (Q.i+1 < Q.list.length ? "Weiter" : "Abschließen")+"</button>"+
      '<span class="tiny muted kbd">Enter</span></div>';
  if(Q.walk){
    try{ if(navigator.vibrate) navigator.vibrate(ok ? 25 : [25,70,25]); }catch(e){}
    const b = $("#nextBtn");
    if(b){ const leiste = document.createElement("div"); leiste.className = "walkbar";
      b.parentElement.replaceWith(leiste); leiste.appendChild(b); }
    const spricht = vorlesen((ok?"Richtig. ":"Nicht ganz. ")+strip(q.exp),
                             ok ? ()=>autoAn(600) : null);
    if(ok && !spricht) autoAn(2200);
  }
  sitzungSichern();
  $("#nextBtn").onclick = next;
  if(Q.walk && S.auto){
    const stopp = e => { if(!e.target.closest || !e.target.closest("#nextBtn")) autoAus(); };
    document.addEventListener("pointerdown", stopp, {once:true});
  }
  const lnk = $("#fbHost [data-rule]");
  if(lnk) lnk.onclick = e => { e.preventDefault(); openRule(lnk.dataset.rule); };
  updHud();
}

function next(){
  autoAus();
  vorlesenStoppen();
  Q.i++;
  sitzungSichern();
  if(Q.i < Q.list.length) renderQ();
  else finish();
}

  else msg = "Heute war zäh. Genau deswegen wiederholt der Trainer.";

  Q.host.innerHTML =
    '<div class="card center">'+
      '<div style="font-size:44px;line-height:1;margin-bottom:6px">'+(pct>=80?"◆":pct>=50?"◈":"◇")+"</div>"+
      "<h2>"+c+" von "+total+" richtig</h2>"+
      '<p class="muted" style="margin-top:6px">'+msg+"</p>"+
      (Q.daily ? '<div class="row" style="justify-content:center;margin:14px 0 4px">'+
        '<span class="pill flame">🔥 '+S.streak+" Tage</span>"+
        '<span class="pill xp">+'+(c*10+(total-c)*3+25)+" XP</span></div>" : "")+
      '<hr class="sep">'+
      '<div class="eyebrow">Schreibimpuls des Tages</div>'+
      "<h4>"+esc(wp.t)+"</h4>"+
      '<p class="small muted" style="margin-top:4px">'+esc(wp.k)+" · "+esc(wp.words)+" Wörter · ca. "+wp.min+" Minuten</p>"+
      '<div class="row" style="justify-content:center;margin-top:14px">'+

  if(Q.onDone) Q.onDone();
  updHud();
  renderHeute(true);

/* Eine Unterwegs-Runde zusammenstellen und starten */
/* Zieht n Karten aus mehreren sortierten Listen im vorgegebenen Verhältnis.
   Immer dran ist die Liste mit dem größten Rückstand auf ihre Quote; ist eine
   Liste leer, übernehmen die anderen automatisch. */
function quotenMix(pools, n){
  const idx = pools.map(()=>0), out = [];
  while(out.length < n){
    let best = -1, bestRueck = -Infinity;
    for(let i=0;i<pools.length;i++){
      if(idx[i] >= pools[i].list.length) continue;
      const rueck = pools[i].quote * (out.length+1) - idx[i];
      if(rueck > bestRueck){ bestRueck = rueck; best = i; }
    }
    if(best < 0) break;
    out.push(pools[best].list[idx[best]++]);
  }
  return out;
}

/* Unterwegs-Runde: erst Fälliges, dann Neues, zuletzt das am längsten
   Ungeübte — auf jeder Stufe gemischt aus Aufgaben, Wörtern und Fällen. */
function unterwegsRunde(host){
  const r = rng(Date.now());
  const drin = new Set();
  let list = [];
  const A = i => ({k:i.id,       q:()=>exQuestion(i)});
  const W = w => ({k:"w:"+w.w,   q:()=>wordQuestion(w,r)});
  const F = e => ({k:"c:"+e.w,   q:()=>caseQuestion(e)});
  const nachTermin = (x,y)=>String(cardOf(x.k).d||"").localeCompare(String(cardOf(y.k).d||""));
  const nachGesehen = (x,y)=>(cardOf(x.k).s||0)-(cardOf(y.k).s||0);
  function nimm(aufg, wort, fall){
    const rest = SRS_RUNDE - list.length;
    if(rest <= 0) return;
    const frei = l => l.filter(x=>!drin.has(x.k));
    quotenMix([{list:frei(aufg), quote:0.45},
               {list:frei(wort), quote:0.25},
               {list:frei(fall), quote:0.30}], rest)
      .forEach(x=>{ drin.add(x.k); list.push(x.q()); });
  }
  // 1. Fällige Wiederholungen, ältester Termin zuerst
  nimm(ALL.filter(i=>i.t!=="fill" && isDue(i.id)).map(A).sort(nachTermin),
       WORDS.filter(w=>isDue("w:"+w.w)).map(W).sort(nachTermin),
       drillDue().map(F).sort(nachTermin));
  // 2. Neues Material — läuft ein Lernplan, kommt es bevorzugt aus dem Schwerpunkt
  const fokus = (typeof planFocus === "function") ? planFocus() : null;
  const neuA = shuffle(ALL.filter(i=>i.t!=="fill" && !S.cards[i.id]), r);
  if(fokus) neuA.sort((a,b)=>(b.c===fokus) - (a.c===fokus));
  nimm(neuA.map(A),
       shuffle(WORDS.filter(w=>!S.cards["w:"+w.w]), r).map(W),
       shuffle(drillPool().filter(e=>!S.cards["c:"+e.w]), r).map(F));
  // 3. Alles gelernt und nichts fällig? Dann das Am-längsten-nicht-Geübte
  nimm(ALL.filter(i=>i.t!=="fill").map(A).sort(nachGesehen),
       WORDS.map(W).sort(nachGesehen),
       drillPool().map(F).sort(nachGesehen));
  list = shuffle(list, r);
  startQuiz(list, host, {title:"Unterwegs", walk:true});
  window.scrollTo({top:0,behavior:"smooth"});
}

/* Karten, die schon einmal danebengingen — die häufigsten Fehler zuerst */
function schwacheSchluessel(){
  return Object.keys(S.cards)
    .filter(k => (S.cards[k].w || 0) > 0)
    .sort((a,b) => (S.cards[b].w||0) - (S.cards[a].w||0)
                || (S.cards[a].b||0) - (S.cards[b].b||0));
}
function schwacheKarten(r){
  const out = [];
  schwacheSchluessel().forEach(k => {
    if(out.length >= SRS_RUNDE) return;
    const q = frageZuSchluessel(k, r);
    if(q && q.type !== "fill") out.push(q);
  });
  return out;
}
function schwachRunde(host){
  const r = rng(Date.now());
  const list = schwacheKarten(r);
  if(!list.length){ toast("Noch keine Fehler gesammelt — üb erst eine normale Runde."); return; }
  startQuiz(shuffle(list, r), host, {title:"Schwächen", walk:true});
  window.scrollTo({top:0, behavior:"smooth"});
}

/* Abschluss einer Unterwegs-Runde — groß, mit direktem Anschluss */
function finishWalk(){
  const total = Q.base || Q.list.length, c = Q.correct;
  const pct = Math.round(c/total*100);
  const n = countDue();
  if(S.speak) vorlesen(c+" von "+total+" richtig.");
  // Woran lag es? Fehler nach Regel bündeln — höchstens vier Zeilen
  const zaehl = {};
  (Q.fehler||[]).forEach(f=>{ if(f.rule) zaehl[f.rule] = (zaehl[f.rule]||0) + 1; });
  const liste = Object.entries(zaehl).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const rueckblick = liste.length
    ? '<hr class="sep"><div class="eyebrow">Daran hakte es</div>'+
      '<div class="fehlerliste">'+ liste.map(([rid,z])=>{
          const rl = ruleById(rid);
          return rl ? '<button class="btn ghost fehlerzeile" data-rule="'+rid+'">'+
                        "<span>"+esc(rl.t)+"</span>"+
                        '<span class="fehlerzahl">'+z+"×</span></button>" : "";
        }).join("") + "</div>"+
      '<p class="tiny muted" style="margin-top:8px">Antippen öffnet die Regel. Die Karten kommen ohnehin wieder.</p>'
    : "";
  Q.host.innerHTML =
    '<div class="card center">'+
      '<div style="font-size:52px;line-height:1;margin-bottom:8px">'+(pct>=80?"◆":pct>=50?"◈":"◇")+"</div>"+
      '<h2 style="font-size:28px">'+c+" von "+total+" richtig</h2>"+
      '<p class="muted" style="margin-top:8px;font-size:17px">'+
        (n ? n+" Karten stehen noch an." : "Alles wiederholt — die nächste Runde nimmt neuen Stoff.")+"</p>"+
      rueckblick +
      '<div class="walkbar" style="margin-top:20px">'+
        '<button class="btn" id="wkAgain">Nächste Runde</button>'+
        '<button class="btn ghost" id="wkStop">Fertig</button>'+
      "</div>"+
    "</div>";
  $$("#" + Q.host.id + " .fehlerzeile").forEach(b => b.onclick = ()=>{
    const zurueckAuf = Q.host;
    bildschirmWachhalten(false);
    document.body.classList.remove("walk");
    Q = null;
    openRule(b.dataset.rule);
  });
  $("#wkAgain").onclick = ()=>unterwegsRunde(Q.host);
  const zurueck = Q.host && Q.host.id === "walkHost" ? "heute" : "karten";
  $("#wkStop").onclick = ()=>{
    bildschirmWachhalten(false);
    document.body.classList.remove("walk");
    Q = null; go(zurueck);
  };
  updHud();
}

      ? shuffle(WORDS, r).slice(0,12).map(w=>wordQuestion(w,r))

function countDue(){
  let n = 0;
  ALL.forEach(i=>{ if(isDue(i.id)) n++; });
  WORDS.forEach(w=>{ if(isDue("w:"+w.w)) n++; });
  if(typeof drillDue === "function") n += drillDue().length;
  return n;
}

   ============================================================ */
function renderCards(){
  const host = $("#cardHost");
  const dueEx = ALL.filter(i=>isDue(i.id));
  const dueW  = WORDS.filter(w=>isDue("w:"+w.w));
  const n = dueEx.length + dueW.length + drillDue().length;
  const boxes = [0,0,0,0,0];
  Object.values(S.cards).forEach(c=>{ if(c.b>=1&&c.b<=5) boxes[c.b-1]++; });
  const known = Object.values(S.cards).filter(c=>c.b>=4).length;

  host.innerHTML =
    '<div class="card">'+
      '<div class="eyebrow">Wiederholung</div>'+
      "<h2>"+(n ? n+" Karten sind heute fällig" : "Alles wiederholt")+"</h2>"+
      '<p class="muted" style="margin-top:8px">'+
        (n ? "Nach dem Leitner-System: Was du kannst, kommt seltener. Was du verwechselst, kommt morgen wieder."+
             (n>SRS_RUNDE ? " Eine Runde umfasst "+SRS_RUNDE+" Karten — die am längsten überfälligen zuerst." : "")
           : "Es steht nichts an. Du kannst trotzdem eine freie Runde ziehen.")+"</p>"+
      (n>45 ? '<div class="fb no" style="margin-top:12px"><b class="hd">Rückstand</b>'+
        "Es haben sich "+n+" Karten angesammelt. Die Tagesaufgabe drosselt neuen Stoff automatisch, bis der Stapel kleiner wird — "+
        "zwei, drei Extrarunden hier bringen dich schneller wieder in den Takt.</div>" : "")+
      (function(){ const o = sitzungOffen();

      '<div class="row" style="margin-top:16px">'+
        '<button class="btn" id="startWalk">Unterwegs üben</button>'+
        '<button class="btn ghost" id="startSrs">'+(n ? "Wiederholung ("+Math.min(n,SRS_RUNDE)+")" : "Freie Runde (15)")+"</button>"+
        '<button class="btn ghost" id="startW">Nur Wortschatz</button>'+
      "</div>"+
      '<p class="tiny muted" style="margin-top:9px">„Unterwegs“ blendet alles aus, was ablenkt: große Schrift, Antworten in Daumenreichweite, keine Tippaufgaben'+

      "</div>"+

    "</div>"+
    '<div class="card">'+
      '<div class="eyebrow">Wortschatz nachschlagen</div>'+
      '<input class="search" id="wSearch" placeholder="Wort suchen — z. B. stringent, effizient, Prämisse …" style="margin-top:10px">'+
      '<div id="wList"></div>'+
    "</div>";

  const go1 = $("#goOn");
  if(go1) go1.onclick = ()=>{ sitzungFortsetzen(host); window.scrollTo({top:0,behavior:"smooth"}); };
  const dr = $("#dropOn");
  if(dr) dr.onclick = ()=>{ S.session=null; save(); renderCards(); };
  $("#startWalk").onclick = ()=>unterwegsRunde(host);
  $("#startSrs").onclick = ()=>{
    const r = rng(Date.now());
    let list;
    if(n){
      // Die am längsten überfälligen zuerst, aber höchstens 20 pro Runde
      const alle = dueEx.map(i=>({k:i.id, q:()=>exQuestion(i)}))
        .concat(dueW.map(w=>({k:"w:"+w.w, q:()=>wordQuestion(w,r)})))
        .concat(drillDue().map(e=>({k:"c:"+e.w, q:()=>caseQuestion(e)})))
        .sort((a,b)=>cardOf(a.k).d.localeCompare(cardOf(b.k).d));
      list = alle.slice(0, SRS_RUNDE).map(x=>x.q());
    } else {
      list = shuffle(ALL.map(exQuestion).concat(WORDS.map(w=>wordQuestion(w,r))), r).slice(0,15);
    }
    startQuiz(list, host, {title:"Wiederholung", onDone:()=>{}});
    window.scrollTo({top:0,behavior:"smooth"});
  };
  $("#startW").onclick = ()=>{
    const r = rng(Date.now());
    startQuiz(shuffle(WORDS,r).slice(0,15).map(w=>wordQuestion(w,r)), host, {title:"Wortschatz"});
    window.scrollTo({top:0,behavior:"smooth"});
  };
  const si = $("#wSearch");
  si.addEventListener("input", deb(()=>listWords(si.value)));
  listWords("");
}

function listWords(f){
  const q = norm(f);
  const hits = WORDS.filter(w => !q || norm(w.w).includes(q) || norm(w.d).includes(q) || norm(w.s||"").includes(q));
  $("#wList").innerHTML = hits.slice(0,60).map(w=>{
    const c = S.cards["w:"+w.w];
    return '<div class="acc"><button><span>'+esc(w.w)+'</span>'+
      '<span class="tiny muted" style="font-weight:500">'+esc(w.p)+"</span>"+
      (c ? '<span class="tiny" style="color:var(--acc)">Fach '+c.b+"</span>" : "")+
      '<span class="ar">›</span></button>'+
      '<div class="body"><p><b>'+esc(w.d)+"</b></p>"+
      "<p><i>"+esc(w.ex)+"</i></p>"+
      (w.s && w.s!=="—" ? "<p>Sinnverwandt: "+esc(w.s)+"</p>" : "")+
      (w.t ? '<p class="nope">⚠ '+esc(w.t)+"</p>" : "")+
      "</div></div>";
  }).join("") + (hits.length>60 ? '<p class="tiny muted center">… '+(hits.length-60)+" weitere. Such gezielter.</p>" : "")
    + (hits.length===0 ? '<p class="tiny muted center" style="padding:14px">Kein Treffer.</p>' : "");
  bindAcc("#wList");
}

   ANSICHT: REGELN
   ============================================================ */
let ruleFilter = "";
let ruleVar = false;
let rulesReady = false;
// Nennt die Regel selbst mehr als eine gültige Form?
const VARIANTE=/beides ist zulässig|beides zulässig|auch zulässig|Duden lässt|Duden führt|Duden empfiehlt|schwank|regional|umgangssprachlich|fakultativ|freigestellt|DIN 5008|daneben auch|seltener|beide Formen|beide Schreibungen|beide Beugungen|kann gesetzt werden|darf gesetzt werden|ebenfalls zulässig|Randnotiz/i;
function hatVarianten(r){ return VARIANTE.test(String(r.b).replace(/<[^>]*>/g," ")); }
function ensureRules(){ if(!rulesReady){ rulesReady = true; renderRules(); } }
function renderRules(){
  const chips = $("#ruleChips");
  chips.innerHTML = '<button class="chip on" data-c="">Alle</button>' +
    ["komma","zeichen","gross","getrennt","recht","gram","satz","zahlen","stil","form"].map(c=>
      '<button class="chip" data-c="'+c+'">'+CATS[c].n+"</button>").join("");
  const anzVar = RULES_ALL.filter(hatVarianten).length;
  chips.insertAdjacentHTML("beforeend",
    '<button class="chip'+(ruleVar?" on":"")+'" id="varChip" title="Regeln, bei denen mehr als eine Form gilt">◆ Varianten ('+anzVar+")</button>");
  $$("#ruleChips .chip[data-c]").forEach(b => b.onclick = ()=>{
    $$("#ruleChips .chip[data-c]").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); ruleFilter = b.dataset.c; drawRules();
  });
  $("#varChip").onclick = ()=>{ ruleVar = !ruleVar; $("#varChip").classList.toggle("on", ruleVar); drawRules(); };
  $("#ruleSearch").addEventListener("input", deb(drawRules));
  drawRules();
}
function drawRules(){
  const q = norm($("#ruleSearch").value);
  const hits = RULES_ALL.filter(r =>
    (!ruleFilter || r.c === ruleFilter) &&
    (!ruleVar || hatVarianten(r)) &&
    (!q || norm(r.t).includes(q) || norm(r.b.replace(/<[^>]+>/g," ")).includes(q)));
  const hinweis =
    '<div class="lesehinweis"><b>Wie diese Regeln zu lesen sind</b>'+
    "<ul>"+
      '<li>Bezug ist der <b>Duden</b>. Wo die amtliche Regelung mehrere Schreibungen erlaubt, stehen beide da — solche Regeln tragen die Markierung <span class="vbadge">◆ Varianten</span>.</li>'+
      "<li>Wo <b>Duden und DIN 5008</b> auseinandergehen — Tausendertrennung, Uhrzeit, Bis-Strich —, sind beide Konventionen genannt statt einer erfundenen Eindeutigkeit.</li>"+
      "<li><b>Stil ist keine Regel.</b> Hinweise zu Füllwörtern, Nominalstil oder Tonfall sind Empfehlungen; sie stehen in den Bereichen Stil und Formulierung, nicht in der Rechtschreibung.</li>"+
      "<li>Was <b>umgangssprachlich verbreitet, aber nicht standardsprachlich</b> ist, wird ausdrücklich so benannt — etwa „wegen dem Wetter“ oder „weil ich hab keine Zeit“.</li>"+
      '<li><b>Die Farben in den Beispielen</b> haben drei Stufen: <span class="ok">grün</span> ist die standardsprachliche Form, <span class="ugs">orange</span> ist umgangssprachlich oder regional — verbreitet, aber nicht für geschriebene Texte —, und <span class="nope">rot</span> ist tatsächlich falsch. Orange ist kein Fehler.</li>'+
      "<li><b>Stand der Prüfung:</b> Rund 70 Einzelaussagen sind gegen Duden, DWDS und DIN 5008 gegengeprüft — vor allem dort, wo etwas als ausnahmslos richtig oder falsch dasteht. Zuletzt die Zeichensetzung: Das amtliche Regelwerk gilt seit dem 1. Juli 2024 in neuer Fassung, und bei den Infinitivgruppen hat sich die Kommaregel geändert — eine erweiterte Infinitivgruppe wird jetzt immer abgetrennt. Diese Regel und die dazugehörige Übung standen bis dahin auf dem alten Stand und sind berichtigt. Davor die festen Verbpräpositionen: „bestehen auf“ steht mit Dativ, der Akkusativ ist laut DWDS seltene Nebenform; die Aufteilung „leiden an“ für Krankheiten und „leiden unter“ für Umstände ist eine Faustregel, keine feste Grenze; „ich erinnere das Spiel“ ohne „mich an“ ist landschaftlich, besonders norddeutsch. Die übrigen Regeln beruhen auf allgemeinem Sprachwissen und haben strukturelle Prüfungen bestanden, sind aber nicht einzeln belegt. Wenn dir etwas seltsam vorkommt: nachschlagen lohnt sich.</li>"+
      "<li><b>Zusätzlich maschinell geprüft:</b> alle zehn Tabellen gegen die Standardparadigmen der Deklination und des Konjunktivs II, alle Fallkarten daraufhin, ob das Beispiel den angegebenen Fall auch zeigt, und der Textcheck gegen fehlerfreien Fließtext — dort ohne Fehlalarm. In der Zeichensetzung muss außerdem jede absolute Aussage, jede Kann-Regel und jede Jahreszahl einzeln eingetragen und belegt sein; ein eigener Prüflauf hält das nach und vergleicht die Regeln mit dem Spickzettel. Jede Regel, die hier ein ◆ Varianten trägt, muss eine Quelle nennen; das gilt inzwischen für alle 25. Außerdem wird geprüft, dass keine rot markierte Form zugleich als umgangssprachlich bezeichnet wird — die drei Farbstufen dürfen sich nicht widersprechen.</li>"+
      "<li><b>Widersprüche:</b> Eine laufende Prüfung meldet, wenn dasselbe Beispiel an einer Stelle als Fehler und an anderer als regionale Variante geführt wird. Wo Duden und amtliches Regelwerk mehrere Formen zulassen, steht das ausdrücklich da — auch dann, wenn eine Form empfohlen ist.</li>"+
    "</ul></div>";
  $("#ruleHost").innerHTML = (q||ruleFilter||ruleVar ? "" : hinweis) + (hits.length
    ? hits.map(r=>'<div class="acc" id="rule-'+r.id+'"><button>'+tag(r.c)+
        "<span>"+esc(r.t)+"</span>"+
        (hatVarianten(r) ? '<span class="vbadge" title="Hier gilt mehr als eine Form">◆ Varianten</span>' : "")+
        '<span class="ar">›</span></button><div class="body">'+r.b+"</div></div>").join("")
    : '<p class="muted center" style="padding:28px">Keine Regel gefunden. Versuch ein anderes Stichwort.</p>');
  bindAcc("#ruleHost");
}
function bindAcc(sel){
  $$(sel+" .acc > button").forEach(b => b.onclick = ()=> b.parentElement.classList.toggle("open"));
}
function openRule(id){
  RT.tab = "regeln"; go("regeln"); renderRegelnNav(); ensureRules();
  $("#ruleSearch").value = ""; ruleFilter = ""; ruleVar = false;
  $$("#ruleChips .chip").forEach((x,i)=>x.classList.toggle("on", i===0));
  drawRules();
  const el = $("#rule-"+id);
  if(el){ el.classList.add("open"); el.scrollIntoView({behavior:"smooth",block:"center"}); }
}

function renderStats(sel){
  let c=0, w=0;
  Object.values(S.cat).forEach(k=>{ c+=k.c; w+=k.w; });
  const total = c+w;
  const acc = total ? Math.round(c/total*100) : 0;
  const seen = Object.keys(S.cards).length;
  const drafts = Object.values(S.writing).filter(x=>x.text && x.text.trim()).length;

  // 28-Tage-Streifen
  const strip = [];
  for(let i=27;i>=0;i--){
    const d = addDays(today(),-i);
    const rec = S.days[d];
    const lvl = rec && rec.done ? (rec.t ? Math.min(5, Math.max(1, Math.ceil(rec.c/rec.t*5))) : 3) : 0;
    strip.push('<span class="dot'+(lvl?" f"+lvl:"")+'" title="'+d+(rec?": "+rec.c+"/"+rec.t:": nichts")+'"></span>');
  }

  const catRows = Object.keys(CATS).map(k=>{
    const s = S.cat[k] || {c:0,w:0};
    const t = s.c+s.w;
    const p = t ? Math.round(s.c/t*100) : 0;
    return '<div class="catrow"><div class="spread"><span>'+CATS[k].n+"</span>"+
      '<span class="tiny muted">'+(t ? p+" % · "+t+" Antworten" : "noch nichts")+"</span></div>"+
      '<div class="bar"><i style="width:'+p+'%;background:'+(t? (p>=80?"var(--acc)":p>=60?"var(--gold)":"var(--warn)") :"var(--line2)")+'"></i></div></div>';
  }).join("");

  // schwächste Kategorie
  const ranked = Object.keys(CATS).map(k=>{
    const s = S.cat[k]||{c:0,w:0}; const t=s.c+s.w;
    return {k, t, p: t? s.c/t : 1};
  }).filter(x=>x.t>=5).sort((a,b)=>a.p-b.p);
  const weak = ranked[0];

  const ret = retention();
  const anteil = n => ret.gesamt ? (n / ret.gesamt * 100).toFixed(1) + "%" : "0%";

  $(sel || "#statHost").innerHTML =
    '<div class="card">'+
      '<div class="eyebrow">Was sitzt</div>'+
      '<div class="grid2" style="margin-top:10px">'+
        '<div class="stat"><b>'+ret.sicher+'</b><span>sitzt sicher</span></div>'+
        '<div class="stat"><b>'+ret.aufbau+'</b><span>im Aufbau</span></div>'+
        '<div class="stat"><b>'+ret.neu+'</b><span>noch nicht dran</span></div>'+
      "</div>"+
      '<div class="bar stapel" style="margin-top:13px">'+
        '<i style="width:'+anteil(ret.sicher)+';background:var(--acc)"></i>'+
        '<i style="width:'+anteil(ret.aufbau)+';background:var(--gold)"></i>'+
        '<i style="width:'+anteil(ret.neu)+';background:var(--line2)"></i>'+
      "</div>"+
      '<p class="tiny muted" style="margin-top:9px">Sicher heißt Fach '+SICHER_AB+' oder '+BOXES.length+
        ": mindestens "+(SICHER_AB-1)+" richtige Antworten nacheinander, nächste Wiederholung in "+
        BOXES[SICHER_AB-1]+" oder "+BOXES[BOXES.length-1]+" Tagen. Eine falsche Antwort setzt eine Karte "+
        "auf Fach 1 zurück — die Zahl fällt also wieder, wenn etwas nicht mehr sitzt.</p>"+
    "</div>"+
    '<div class="card">'+
      '<div class="eyebrow">Überblick</div>'+
      '<div class="grid2" style="margin-top:10px">'+
        '<div class="stat"><b>'+S.streak+'</b><span>Tage in Serie</span></div>'+
        '<div class="stat"><b>'+(S.best||S.streak)+'</b><span>Bestwert</span></div>'+
        '<div class="stat"><b>'+acc+' %</b><span>Trefferquote</span></div>'+
        '<div class="stat"><b>'+total+'</b><span>Antworten gesamt</span></div>'+
        '<div class="stat"><b>'+seen+'</b><span>Karten im Umlauf</span></div>'+
        '<div class="stat"><b>'+S.xp+'</b><span>XP</span></div>'+
      "</div>"+
      '<hr class="sep">'+
      '<div class="eyebrow">Die letzten vier Wochen</div>'+
      '<div class="dots" style="margin-top:8px">'+strip.join("")+"</div>"+
      '<p class="tiny muted" style="margin-top:8px">Je dunkler, desto besser die Tagesquote. Graue Felder sind Tage ohne Tagesaufgabe.</p>'+
    "</div>"+
    '<div class="card">'+
      '<div class="eyebrow">Nach Bereich</div>'+
      '<div style="margin-top:10px">'+catRows+"</div>"+
      (weak ? '<div class="fb no" style="margin-top:16px"><b class="hd">Dein schwächster Bereich</b>'+
        CATS[weak.k].n+" liegt bei "+Math.round(weak.p*100)+" %. "+
        '<a class="lnk" href="#" id="drill">→ 12 Fragen dazu üben</a></div>' : "")+
    "</div>"+
    '<div class="card">'+
      '<div class="eyebrow">Schreibwerkstatt</div>'+
      "<p style=\"margin-top:8px\">"+drafts+" von "+PROMPTS.length+" Schreibimpulsen und "+
        Object.values(S.scenes||{}).filter(x=>x.text&&x.text.trim()).length+" von "+SCENES.length+
        " Situationen bearbeitet.</p>"+
      '<hr class="sep">'+
      '<div class="eyebrow">Daten</div>'+
      '<p class="tiny muted" style="margin:8px 0 12px">Alles liegt nur in diesem Browser. Sicher dir den Fortschritt, bevor du den Verlauf löschst oder das Gerät wechselst.</p>'+
      (function(){
        const tage = Object.keys(S.days||{}).length;
        if(tage < 14) return "";
        const seit = S.lastExport ? daysBetween(S.lastExport, today()) : null;
        if(seit !== null && seit < 30) return "";
        return '<div class="fb no" style="margin-bottom:12px"><b class="hd">Sicherung empfohlen</b>'+
          "Du übst seit "+tage+" Tagen"+(seit===null?" und hast noch nie gesichert."
            :" und hast zuletzt vor "+seit+" Tagen gesichert.")+
          " Ein gelöschter Browserverlauf würde alles davon mitnehmen.</div>";
      })()+
      '<div class="row"><button class="btn ghost sm" id="exp">Fortschritt sichern</button>'+
      '<button class="btn ghost sm" id="imp">Sicherung laden</button>'+
      '<button class="btn ghost sm" id="rst">Alles zurücksetzen</button></div>'+
      '<input type="file" id="impFile" accept="application/json" style="display:none">'+
    "</div>";

  const dr = $("#drill");
  if(dr) dr.onclick = e=>{
    e.preventDefault();
    const r = rng(Date.now());
    go("heute");
    const list = weak.k === "wort"
      ? shuffle(WORDS,r).slice(0,12).map(x=>wordQuestion(x,r))

function copyText(t, btn){
  const done = ()=>{ const o=btn.textContent; btn.textContent="✓ kopiert"; btn.classList.add("done");
    setTimeout(()=>{btn.textContent=o; btn.classList.remove("done");},1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement("textarea");
    ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("Kopieren hat nicht geklappt"); }
    document.body.removeChild(ta);
  }
}

/* ============================================================
   ANSICHT: SÄTZE
   ============================================================ */
const TYPN = {praep:"Präposition", wechsel:"Wechselpräposition", verb:"Verb",
              verb2:"Verb mit zwei Objekten", verbpraep:"Verb + Präposition"};
let ST = {tab:"faelle", typ:"", kas:"", nurFallen:false};

/* ---------- Fall aus dem Eintrag ableiten (für den Drill) ---------- */
function drillCase(e){
  if(e.t === "verb2") return null;
  const k = e.k;
  const hasA = /Akkusativ|Akk\b/.test(k), hasD = /Dativ|Dat\b/.test(k), hasG = /Genitiv|Gen\b/.test(k);
  const eindeutig = !/oder/.test(k) && [hasA,hasD,hasG].filter(Boolean).length === 1;
  const name = () => hasA ? "Akkusativ" : hasD ? "Dativ" : "Genitiv";
  /* Wechselpräpositionen lassen beide Fälle zu — „an“, „auf“, „in“ tragen k = „Akk / Dat“.
     „in (Richtung)“ und „auf (Richtung)“ stehen dagegen fest im Akkusativ, und ihr k sagt
     das auch. Vorher gewann für alle t="wechsel" pauschal „Akkusativ oder Dativ“; auf
     diesen beiden Karten widersprach die richtige Antwort damit der Erklärung darunter. */
  if(e.t === "wechsel") return eindeutig ? name() : "Akkusativ oder Dativ";
  return eindeutig ? name() : null;
}
const DRILLOPTS = ["Akkusativ","Dativ","Genitiv","Akkusativ oder Dativ"];

function caseQuestion(e){
  const ans = drillCase(e);
  const leise = t => "<br><span style='opacity:.85'>"+esc(t)+"</span>";
  const kopf = "<b>"+esc(e.w)+"</b> → "+esc(e.k);
  const notiz = e.n ? leise(e.n) : "";
  const nachweis = kopf + leise(e.ex) + notiz;
  /* Satzform statt Etikett: Die Karte fragt nach der Form im Satz — „Ich helfe ___ beim Aufbau“ —
     statt nach dem Namen des Falls. Das ist näher am Sprechen und inzwischen der Regelfall.
     e.s = [Satz mit genau einer Lücke, richtige Form, falsche Form …]; die erste Option ist die
     richtige. Gemischt wird wie bei den Übungen mit Tagesseed, damit sie nicht immer vorn steht.
     Karten ohne e.s bleiben bei der Etikettfrage: Wechselpräpositionen, deren Antwort
     „Akkusativ oder Dativ“ lautet, und Zweifelsfälle, bei denen kein Ablenker sicher falsch wäre. */
  const fassungen = Array.isArray(e.s) && e.s.length
    ? (Array.isArray(e.s[0]) ? e.s : [e.s]).filter(f => Array.isArray(f) && f.length > 2)
    : [];
  if(fassungen.length){
    const r = rng(hash("c:"+e.w+"|"+today()));
    /* Wechselpräpositionen tragen zwei Fassungen: wohin (Akkusativ) und wo (Dativ).
       Welche drankommt, entscheidet der Tagesseed — über die Wochen kommen beide dran.
       Eine Karte kann nur eine Richtung auf einmal abfragen, beide gehören aber geübt. */
    const f = fassungen[Math.floor(r() * fassungen.length)];
    const roh = f.slice(1);
    const order = shuffle(roh.map((_,i)=>i), r);
    const luecke = t => esc(f[0]).replace("___", () => t);
    return {key:"c:"+e.w, cat:"gram", type:"mc", q:luecke("<b>___</b>"),
      opts:order.map(i=>roh[i]), ans:order.indexOf(0), rule:"gram-kasusfinden",
      exp:luecke("<b>"+esc(roh[0])+"</b>")+"<br>"+kopf+notiz};
  }
  const frage = e.t === "verb" || e.t === "verbpraep"
    ? "Welchen Fall verlangt <em>" + esc(e.w) + "</em>?"
    : "Welcher Fall folgt auf <em>" + esc(e.w) + "</em>?";
  return {key:"c:"+e.w, cat:"gram", type:"mc", q:frage, opts:DRILLOPTS.slice(),
    ans:DRILLOPTS.indexOf(ans), rule:"gram-kasusfinden", exp:nachweis};
}
/* Alle Fall-Einträge, die sich abfragen lassen */
function drillPool(){ return CASEREF.filter(e=>drillCase(e)); }
/* Fällige Fall-Karten — sie waren bisher nach der ersten Runde verschwunden */
function drillDue(){ return drillPool().filter(e=>isDue("c:"+e.w)); }
function caseDrillQuestions(n){
  const r = rng(Date.now());
  const faellig = drillDue().sort((a,b)=>cardOf("c:"+a.w).d.localeCompare(cardOf("c:"+b.w).d));
  const rest = shuffle(drillPool().filter(e=>!isDue("c:"+e.w)), r);
  return faellig.concat(rest).slice(0, n).map(caseQuestion);
}

function drawCases(f){
  const q = norm(f);
  const hits = CASEREF.filter(e=>{
    if(ST.typ && e.t !== ST.typ) return false;
    if(ST.kas && !e.k.includes(ST.kas.slice(0,3))) return false;
    if(ST.nurFallen && !e.fall) return false;
    if(!q) return true;
    return norm(e.w+" "+e.k+" "+e.ex+" "+(e.n||"")).includes(q);
  });
  const badge = k =>
    /Gen/.test(k) && !/Akk|Dat/.test(k) ? "kb-gen" :
    /Akk/.test(k) && /Dat/.test(k) ? "kb-mix" :
    /Akk/.test(k) ? "kb-akk" : "kb-dat";
  $("#crHost").innerHTML = hits.length ?
    '<div class="card flat" style="padding:6px 0">'+ hits.map(e=>

let WT = {tab:"impulse"};   // Unterreiter „Schreiben“
let PT = {tab:"ueber"};     // Unterreiter „Fortschritt“
